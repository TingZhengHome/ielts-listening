ier of neuromorphic architecture is a non-linear two-terminal circuit element called the memristor. First conceptualized theoretically by Leon Chua in 1971 and physically demonstrated by Hewlett-Packard in 2008, the memristor exhibits electrical resistance that depends directly on the history of electric charge that has passed through it. In other words, it remembers its past electrical state. When organized into dense two-dimensional crossbar arrays, memristors perform matrix-vector multiplication directly in the analog domain according to Ohm's and Kirchhoff's laws. Rather than transferring digital data to an external processor, the computation occurs directly within the memory matrix itself. This analog in-memory computing approach slashes latency and yields energy efficiency gains exceeding three orders of magnitude.", "The Silicon Synapse: Systems Engineering in Neuromorphic Architecture and Memristive Networks (Continued)", "▶ Section 4  ‧  Spike-Timing-Dependent Plasticity (STDP) in Hardware", "Section 4  Beyond static inference, neuromorphic engineering seeks to replicate real-time online learning. In biological synapses, synaptic strength is modulated by Spike-Timing-Dependent Plasticity, or STDP. If a pre-synaptic neuron fires milliseconds before a post-synaptic neuron, the connecting synapse strengthens—a phenomenon known as long-term potentiation. Conversely, if the sequence is reversed, the synapse weakens through long-term depression. By tailoring the dielectric oxide switching dynamics of memristive devices, systems engineers have successfully emulated STDP at the nanoscale. This capability empowers neuromorphic chips to learn continuously from unstructured sensory data streams without requiring resource-heavy offline backpropagation algorithms.", "▶ Section 5  ‧  Edge AI Applications and Future Scalability Challenges", "Section 5  Looking toward deployment trajectories, neuromorphic processors are transforming edge computing. In autonomous vehicular navigation, robotic prosthetics, and distributed aerospace sensors, devices must process millisecond sensory inputs under strict battery constraints. Neuromorphic vision sensors, which mimic the human retina by transmitting data only when pixels detect changes in light intensity, operate with microsecond latency while consuming milliwatts of power. However, substantial systems engineering bottlenecks remain, particularly regarding device yield variability, analog-to-digital conversion overhead, and the absence of standardized programming toolchains. Bridging these engineering hurdles is the central mission for the next generation of computer systems architects."], "trans": ["Section 1  各位工程師早安。在今天的高階硬體系統課程中，我們將探討當代最嚴峻的運算危機之一：在現代人工智慧龐大工作負載下，經典矽基計算架構面臨的崩潰臨界點。七十多年來，數位計算始終由馮·諾伊曼架構（von Neumann architecture）所主導。在此範式中，中央處理器與記憶體在物理空間上嚴格分離，必須透過狹窄的通訊匯流排進行資料傳輸。然而，現代深度神經網絡需要在記憶體與運算單元之間頻繁轉移數以 PB 計的模型參數。這造成了嚴重的頻寬瓶頸，即著名的「馮·諾伊曼瓶頸（von Neumann bottleneck）」。現代 GPU 叢集中超過百分之九十的總能耗，僅僅是浪費在實體互連通道上來回搬運位元資料（shuffling bits），進而產生無法承受的熱耗散，嚴重威脅了技術進步的持續推進。", "Section 2  為了解決這項物理極限，電腦架構師正轉向「神經形態工程（neuromorphic engineering）」——即設計能夠直接複製人類大腦生物形態與電生理特性的矽基晶片。試想人類的生物大腦：它以僅僅約二十瓦特（20W）的極低能耗，執行每秒高達十的十六次方次（10^16）的運算。大腦之所以能達到如此驚人的能源效率，是因為生物神經元絕不存在馮·諾伊曼式的分離架構；相反地，運算與記憶儲存共同座落於突觸（synapse）結構之中。此外，生物神經迴路採用非同步、事件驅動的動作電位（即脈衝 spikes）進行通訊，這意味著神經元唯有在主動傳遞全新的非冗餘資訊時才會消耗能量。", "Section 3  在神經形態架構的硬體最前沿，是一種名為「憶阻器（memristor）」的非線性雙端電路元件。憶阻器最早於 1971 年由蔡少棠（Leon Chua）教授在理論上提出，並於 2008 年由惠普實驗室成功物理實現。它的電阻狀態直接取決於歷史上流經該元件的電荷量總和；換言之，它能「記住」過去的電氣狀態。當憶阻器被組織成高密度的二維交叉開關陣列（crossbar arrays）時，能夠依據歐姆定律與克希荷夫定律直接在類比域中完成矩陣-向量乘法。運算不再需要將數位資料搬移到外部處理器，而是在記憶體矩陣內部原地直接發生。這種「類比存內計算（analog in-memory computing）」大幅消除了傳輸延遲，並帶來超過三個數量級（1000倍以上）的能源效率飛躍。", "Section 4  除了靜態模型推理，神經形態工程更致力於重現即時的在線學習能力。在生物突觸中，突觸強度的調節由「脈衝時間依賴可塑性（STDP）」所控制。若突觸前神經元比突觸後神經元提前數毫秒激發脈衝，兩者之間的突觸連結便會強化——這被稱為長時程增強（LTP）；反之，若先後順序顛倒，突觸則會透過長時程抑制（LTD）而減弱。透過微調憶阻元件中介電氧化層的電氣開關動態特性，系統工程師已成功在奈米尺度重現了 STDP 機制。這項能力賦予神經形態晶片直接從非結構化感測數據流中進行連續學習的潛力，而不再需要依賴極度耗能的離線反向傳播演算法。", "Section 5  展望實際應用部署，神經形態處理器正引領邊緣運算（edge computing）的革命。在自動駕駛車輛導航、機器人仿生義肢以及分散式航太感測系統中，設備必須在極為嚴苛的電池能耗限制下處理毫秒級的感測輸入。神經形態仿生視覺感測器透過模仿人類視網膜，唯有在感光像素檢測到光強變化時才傳輸數據，能夠以微秒級的極低延遲運作，且功耗僅為毫瓦級別。然而，實體系統工程仍面臨諸多巨大瓶頸，特別是奈米元件製造的良率波動（device yield variability）、類比-數位轉換的巨大開銷，以及缺乏標準化的程式設計工具鏈。跨越這些工程阻礙，是下一代電腦系統架構師的核心使命。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. von Neumann bottleneck  【原聲定位】Section 1: 'This creates a severe bandwidth constraint known as the von Neumann bottleneck.' 【解析】聽取電腦架構瓶頸術語，填入 von Neumann bottleneck。"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. shuffling bits  【原聲定位】Section 1: 'Over ninety percent of total energy dissipation... is expended simply on shuffling bits across physical interconnects...' 【解析】題幹 'wasted on (32) ____________ across interconnects'，填動名詞片語 shuffling bits。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. synapse  【原聲定位】Section 2: 'computation and memory storage are co-located at the synapse.' 【解析】考查神經生物學與存算一體名詞，填入單數 synapse。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. crossbar  【原聲定位】Section 3: 'When organized into dense two-dimensional crossbar arrays, memristors perform matrix-vector multiplication...' 【解析】題幹提示 '2D (34) ____________ arrays'，填入形容詞修飾詞 crossbar。"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. STDP / Spike-Timing-Dependent Plasticity  【原聲定位】Section 4: 'synaptic strength is modulated by Spike-Timing-Dependent Plasticity, or STDP... systems engineers have successfully emulated STDP at the nanoscale.' 【解析】生物突觸學習法則，填 STDP 或全稱均給分。"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. light intensity  【原聲定位】Section 5: 'mimic the human retina by transmitting data only when pixels detect changes in light intensity...' 【解析】考查物理光學變數，填入名詞片語 light intensity。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. A  【原聲定位】Section 2: 'neurons consume energy only when actively conveying new, non-redundant information.' 【解析】非同步脈衝通訊唯有在傳遞新資訊時耗能，精準對應選項 A。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. B  【原聲定位】Section 3: 'the memristor exhibits electrical resistance that depends directly on the history of electric charge that has passed through it.' 【解析】電阻取決於歷史電荷流通總量，對應選項 B。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. B  【原聲定位】Section 4: 'without requiring resource-heavy offline backpropagation algorithms.' 【解析】離線反向傳播演算法耗費巨大算力且難以支援即時邊緣在線學習，對應選項 B。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. B  【原聲定位】Section 5: 'bottlenecks remain, particularly regarding device yield variability, analog-to-digital conversion overhead, and the absence of standardized programming toolchains.' 【解析】良率變異與軟體工具鏈缺乏是當前商用化瓶頸，對應選項 B。"}]}}}, {"num": 4, "tag": "unit04", "folder": "天文物理與深空探索", "chapter": "第一篇章 ‧ 自然科學與尖端科技", "title": "The Atmospheric Fingerprint: Exoplanet Spectroscopy & Biosignatures", "titleZh": "系外行星凌日大氣透射光譜、大氣逃逸與生物標誌特徵檢測", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (Sec 1–4)", "src": "./audio/Unit04_Full_Section1_to_4.mp3", "qr": "./qr/unit04.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "高山天文台深空觀測與星空露營預約登記 (Starlight Observatory Dark-Sky Booking)", "src": "./audio/Unit04_Section1.mp3", "qr": "./qr/unit04-s1.png", "script": ["Fiona: High-Altitude Starlight Observatory Booking Office, Fiona speaking. How may I help you?", "Lucas: Hello! I'd like to book an overnight dark-sky observation session for exoplanet research next month.", "Fiona: Wonderful! Let's get you registered in our astronomical visitors log. May I have your full name?", "Lucas: Yes, it's Lucas Montgomery. Spelled M-O-N-T-G-O-M-E-R-Y.", "Fiona: Thank you, Lucas. And a contact number?", "Lucas: It's 07411... and then 932604.", "Fiona: 932604. And you are affiliated with an academic institution?", "Lucas: Yes, I'm a postgraduate researcher in astrophysics at Edinburgh.", "Fiona: Excellent! That qualifies you for our specialized Research Grade Observer Pass, which grants dome access until dawn.", "Lucas: That's precisely what I need. Which telescope can I reserve?", "Fiona: We originally allocate our standard 300-millimeter telescopes to visiting students, but given your transit photometry project, I've reserved our premier 400-millimeter computerized reflector dome.", "Lucas: A 400-millimeter aperture is perfect for resolving shallow exoplanet transit dips.", "Fiona: Glad to hear it. And which date would you prefer?", "Lucas: The predicted transit ingress is on Saturday the 28th of November.", "Fiona: November 28th has optimal new-moon darkness. Now, a few crucial high-altitude regulations: at 2,400 meters, temperatures drop below freezing, so a warm insulated jacket is mandatory.", "Lucas: I'll bring polar thermal wear. What about lighting?", "Fiona: Absolutely no white flashlights or phone screens are permitted on the observation catwalks. You must only use red filters over your torches to protect dark-adaptation.", "Lucas: Red filters, noted. How do we reach the summit?", "Fiona: Our mountain shuttle bus departs promptly at 6:00 PM from outside the Central Library in town.", "Lucas: Central Library, got it. And what is the fee?", "Fiona: Standard public passes are 60 pounds, but with your student researcher ID, the discounted rate is 35 pounds.", "Lucas: That's fantastic. Thank you so much, Fiona!"], "trans": ["菲奧娜：高山星光天文台預約處，我是菲奧娜。請問有什麼我可以協助您的？", "盧卡斯：您好！我想預約下個月的一場通宵暗夜觀測時段，用於系外行星研究。", "菲奧娜：太好了！讓我為您在天文訪客日誌中登記。請問您的全名是？", "盧卡斯：我是盧卡斯・蒙哥馬利（Lucas Montgomery），拼寫是 M-O-N-T-G-O-M-E-R-Y。", "菲奧娜：謝謝盧卡斯。您的聯絡電話是？", "盧卡斯：是 07411……後面是 932604。", "菲奧娜：932604。您有學術機構身分嗎？", "盧卡斯：有的，我是愛丁堡大學的天體物理學碩士研究生。", "菲奧娜：太棒了！這讓您有資格申請我們的專業研究級觀測員（Observer）通行證，該通行證允許您在圓頂內觀測直至黎明。", "盧卡斯：這正是我需要的。我可以預約哪一台望遠鏡？", "菲奧娜：我們通常為參訪學生分配標準的 300 毫米望遠鏡，但考慮到您的凌日測光專案，我已為您保留了頂級的 400（four hundred）毫米電腦化反射望遠鏡圓頂。", "盧卡斯：400 毫米口徑非常適合解析淺層系外行星凌日（transit）的光變微降。", "菲奧娜：很高興聽您這麼說。您希望預約哪一個日期？", "盧卡斯：預測的凌日開始時間是在 11 月（November）28 日週六。", "菲奧娜：11 月 28 日有絕佳的新月暗夜環境。現在有幾項關鍵的高海拔守則：在 2,400 公尺高度氣溫會降至冰點以下，因此必須穿著保暖防寒外套（jacket）。", "盧卡斯：我會帶極地防寒裝備。夜間照明規定呢？", "菲奧娜：觀測棧道上絕對嚴禁使用白光手電筒或手機螢幕。您的手電筒必須加裝紅色濾光片（filters）以保護暗適應視覺。", "盧卡斯：紅色濾鏡，記下了。我們如何到達山頂？", "菲奧娜：我們的高山接駁專車會在下午 6:00 準時從市中心的中央圖書館（Central Library）門口出發。", "盧卡斯：中央圖書館，明白。費用是多少？", "菲奧娜：標準公眾通行證為 60 英鎊，但憑您的學生研究員證，折扣優惠價為 35 英鎊。", "盧卡斯：太棒了。非常感謝您，菲奧娜！"], "answers": [{"q_num": "Q1", "answer": "Montgomery", "clue_analysis": "【原聲定位】'Lucas Montgomery. Spelled M-O-N-T-G-O-M-E-R-Y.' 考核經典英式長姓氏清晰逐字拼寫。"}, {"q_num": "Q2", "answer": "932604", "clue_analysis": "【原聲定位】'07411... and then 932604.' 數字串無干擾聽記。"}, {"q_num": "Q3", "answer": "Observer", "clue_analysis": "【原聲定位】'Research Grade Observer Pass' 題幹已有 Research Grade 與 Pass，填 Observer。"}, {"q_num": "Q4", "answer": "400", "clue_analysis": "【原聲定位】'our premier 400-millimeter computerized reflector' 排除 300 毫米干擾，填 400。"}, {"q_num": "Q5", "answer": "transit", "clue_analysis": "【原聲定位】'exoplanet transit light-curve tracking' 填寫天文光變術語 transit。"}, {"q_num": "Q6", "answer": "November", "clue_analysis": "【原聲定位】'Saturday the 28th of November' 題幹已有 28th，填 November。"}, {"q_num": "Q7", "answer": "jacket", "clue_analysis": "【原聲定位】'warm insulated jacket is mandatory' 填寫核心單數服飾名詞 jacket。"}, {"q_num": "Q8", "answer": "filters", "clue_analysis": "【原聲定位】'only use red filters over your torches' 題幹已有 red，填寫複數名詞 filters。"}, {"q_num": "Q9", "answer": "Library", "clue_analysis": "【原聲定位】'outside the Central Library in town' 題幹已有 Central，填寫 Library。"}, {"q_num": "Q10", "answer": "35", "clue_analysis": "【原聲定位】'discounted rate is 35 pounds' 排除公眾全價 60 鎊，填 35。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "系外行星透射光譜館與韋伯太空望遠鏡展區導覽 (Exoplanet Spectroscopy Pavilion Audio Guide)", "src": "./audio/Unit04_Section2.mp3", "qr": "./qr/unit04-s2.png", "script": ["Dr. Neil Larson: Welcome, stargazers and science enthusiasts, to the Exoplanet Transmission Spectroscopy Pavilion. I'm Dr. Neil Larson, Lead Astronomer.", "Today we invite you to explore humanity's greatest astronomical adventure: identifying chemical fingerprints of distant habitable worlds. Let me explain the core technique behind our exhibits.", "When an exoplanet crosses directly between its host star and our space telescopes—an event called a transit—most starlight is blocked by the planet's solid disc. However, a tiny fraction of that starlight filters through the planet's thin atmospheric halo. Atmospheric gases absorb specific colors, or wavelengths, leaving telltale dark absorption lines in the starlight spectrum. By analyzing these subtle dips with transmission spectroscopy, we can identify chemical signatures of water vapor, carbon dioxide, and potential biosignatures from trillions of kilometers away.", "In our central atrium, you will gaze up at our full-scale replica of the James Webb Space Telescope. The centerpiece of this display is an automated motorized choreography that demonstrates the intricate origami-like deployment sequence of its eighteen gold-coated beryllium primary mirror segments as they unfurled in deep space.", "In our Red Dwarf zone, we tackle one of exoplanet science's fiercest debates: can planets orbiting cool M-dwarfs keep their atmospheres? Because red dwarfs erupt with ferocious coronal mass ejections and extreme ultraviolet flares, their immense stellar winds relentlessly strip away light volatile molecules like water and hydrogen, driving catastrophic atmospheric escape.", "In our Atmospheric Chemistry Chamber, you will see holographic representations of actual spectroscopic absorption fingerprints, comparing the unmistakable spectral troughs of carbon dioxide, water vapor, and photochemical sulfur dioxide.", "Before entering the Laser Cryogenic Calibrator Wing, please note our strict laser safety protocol: all guests must put on certified infrared-blocking eye goggles supplied at the entrance door, as invisible alignment lasers are continuously active.", "Now, let me guide you through our seven specialized interactive domes.", "In Dome 2, you'll enter the Coronagraph and Direct Imaging Suite. Here, an optical demonstration shows how a giant flower-shaped starshade blocks glaring starlight with extreme diffraction suppression, allowing faint orbiting planets to appear.", "Next door, in Dome 3, is our Exoplanet Biosignature Gallery. An interactive touchscreen wall lets you explore the transmission spectral fingerprints of over 5,000 confirmed alien worlds discovered by Kepler, TESS, and Webb.", "Across the breezeway in Dome 5 is the Cryogenic Spectrograph Workshop. Here, behind glass, cleanroom technicians perform sub-micron laser alignment on diffraction gratings cooled to forty Kelvin to eliminate thermal infrared glow.", "Down in Dome 4, you'll experience the Stellar Flare and Atmospheric Escape Lab. A high-voltage plasma cannon fires magnetic arcs into a simulated planetary gas envelope, visually demonstrating how stellar winds strip hydrogen envelopes into space.", "Finally, in Dome 6, you will visit the Planetary Transit Micro-Observatory. Here, visitors can adjust miniature motorized exoplanets orbiting incandescent light bulbs, while high-speed photometers plot live transit dips onto your smartphones.", "Let's put on our laser goggles and enter Dome 2!"], "trans": ["尼爾・拉森博士：歡迎各位追星族與科學愛好者來到系外行星透射光譜館。我是首席天文學家尼爾・拉森博士。", "今天我們邀請大家探索人類最偉大的天文冒險：辨識遙遠宜居世界的化學指紋。讓我先為各位解說展覽背後的核心觀測技術。", "當一顆系外行星剛好從其宿主恆星與我們的太空望遠鏡之間穿過時——這項天文事件被稱為「凌日（transit）」——大部分星光會被行星的實體盤面遮擋。然而，一小部分星光會穿透行星稀薄的大氣環層。大氣氣體會吸收特定波長的光線，在星光光譜中留下明顯的暗色吸收線（absorption lines）。透過透射光譜學分析這些微弱的光變凹槽，我們能從數萬億公里外辨識水蒸氣、二氧化碳乃至潛在生物標誌（biosignatures）的化學特徵。", "在中央中庭，您將仰望我們 1:1 等比例的韋伯太空望遠鏡模型。這座展品的核心亮點是一套自動化動力演示，展示其 18 面鍍金鈹主鏡片在深空中如摺紙般精巧展開（origami-like unfolding sequence）的過程。", "在紅矮星展區，我們直面系外行星科學中最激烈的爭論之一：圍繞冷 M 矮星運行的行星能否保住它們的大氣層？由於紅矮星頻繁爆發劇烈的日冕物質拋射與極紫外閃焰，其猛烈的恆星風會無情地剝蝕（strip away）水和氫等輕揮發性分子，引發災難性的大氣逃逸（atmospheric escape）。", "在我們的大氣化學艙中，您將看到真實光譜吸收指紋的全息投影，直觀比對二氧化碳、水蒸氣與光化學二氧化硫無可辨駁的光譜特徵吸收峰。", "在進入低溫雷射校準翼樓前，請遵守嚴格的雷射安全守則：所有訪客必須戴上入口處提供的經認證防紅外線護目鏡（infrared-blocking eye goggles），因為肉眼不可見的校準雷射處於持續開啟狀態。", "現在，讓我為各位導覽七個專業互動穹頂。", "在 2 號穹頂，您將進入日冕儀與直接造影套間（Coronagraph & Direct Imaging Suite）。這裡的光學演示展示了巨大的花瓣狀星遮罩（starshade）如何透過極限繞射抑制消除耀眼的星光，使微弱的軌道行星得以現形。", "隔壁的 3 號穹頂是系外行星生物標誌展覽廳（Exoplanet Biosignature Gallery）。互動觸控螢幕牆讓您探索克卜勒、TESS 與韋伯望遠鏡發現的超過 5,000 顆已確認系外行星的透射光譜指紋庫。", "穿過走廊的 5 號穹頂是低溫分光儀車間（Cryogenic Spectrograph Workshop）。在玻璃後方，無塵室技術人員對冷卻至 40 開爾文（40 Kelvin）以消除熱紅外雜訊的繞射光柵進行亞微米級雷射校準。", "下方的 4 號穹頂是恆星閃焰與大氣逃逸實驗室（Stellar Flare & Atmospheric Escape Lab）。高壓電漿砲向模擬行星氣體包層發射磁電弧，直觀展示恆星風如何將大氣氫氣包層剝離至太空。", "最後在 6 號穹頂，您將參觀微縮行星凌日觀測台（Planetary Transit Micro-Observatory）。訪客可以在此調整圍繞白熾燈泡運行的微型電動系外行星模型，而高速測光計會將即時凌日曲線繪製到您的手機上。", "讓我們戴上雷射護目鏡，進入 2 號穹頂！"], "answers": [{"q_num": "Q11", "answer": "B", "clue_analysis": "【原聲定位】'measuring which wavelengths of starlight are filtered and absorbed by atmospheric gases during transit' 考查透射光譜原理，選 B。"}, {"q_num": "Q12", "answer": "A", "clue_analysis": "【原聲定位】'demonstrates the intricate origami-like deployment sequence of its eighteen gold beryllium mirror segments' 韋伯鏡面摺紙展開，選 A。"}, {"q_num": "Q13", "answer": "B", "clue_analysis": "【原聲定位】'coronal mass ejections and extreme ultraviolet flares... relentlessly strip away light molecules' 恆星閃焰剝蝕大氣，選 B。"}, {"q_num": "Q14", "answer": "B", "clue_analysis": "【原聲定位】'spectral fingerprints, comparing the unmistakable spectral troughs of carbon dioxide, water vapor, and sulfur dioxide' 二氧化碳與水蒸氣光譜吸收特徵，選 B。"}, {"q_num": "Q15", "answer": "A", "clue_analysis": "【原聲定位】'put on certified infrared-blocking eye goggles supplied at the entrance door' 戴上防紅外護目鏡，選 A。"}, {"q_num": "Q16", "answer": "B", "clue_analysis": "【原聲定位】'Dome 2... starshade blocks glaring starlight with extreme diffraction suppression' 日冕儀星遮罩抑制繞射對應 2 號穹頂（B）。"}, {"q_num": "Q17", "answer": "C", "clue_analysis": "【原聲定位】'Dome 3... Biosignature Gallery... database of transmission spectral fingerprints for 5,000 exoplanets' 光譜資料庫對應 3 號穹頂（C）。"}, {"q_num": "Q18", "answer": "E", "clue_analysis": "【原聲定位】'Dome 5... Cryogenic Spectrograph... diffraction gratings cooled to forty Kelvin' 40K 低溫分光儀對應 5 號穹頂（E）。"}, {"q_num": "Q19", "answer": "D", "clue_analysis": "【原聲定位】'Dome 4... high-voltage plasma cannon... stellar winds strip hydrogen envelopes' 電漿砲大氣逃逸對應 4 號穹頂（D）。"}, {"q_num": "Q20", "answer": "F", "clue_analysis": "【原聲定位】'Dome 6... Transit Micro-Observatory... planets orbiting incandescent light bulbs photometers' 微縮凌日測光對應 6 號穹頂（F）。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "TRAPPIST-1e 透射光譜與恆星黑子污染修正研討 (Tutorial on Exoplanet Spectroscopy & Stellar Contamination)", "src": "./audio/Unit04_Section3.mp3", "qr": "./qr/unit04-s3.png", "script": ["Prof. Thorne: Good afternoon, Oliver, Rachel. Please come in. I've reviewed your preliminary spectroscopic analysis of the TRAPPIST-1e transit observations from Cycle 2. You claim a 3-sigma detection of atmospheric water vapor at 1.4 microns.", "Oliver: Yes, Professor Thorne! The transmission spectrum shows a distinct absorption trough exactly where molecular water bands should peak.", "Prof. Thorne: It's an exciting feature, but I must urge extreme skepticism. Have you accounted for stellar contamination? TRAPPIST-1 is a late M-dwarf with persistent magnetic activity. Its photosphere is covered in cool starspots, where temperatures drop low enough for water molecules to condense in the stellar atmosphere itself.", "Rachel: You mean the Transit Light Source Effect? If unocculted starspots sit outside the transit chord, they imprint their own water vapor absorption lines directly onto the transit spectrum.", "Prof. Thorne: Exactly. What looks like an alien planetary atmosphere could simply be the spectral signature of the star's spotted surface. It's a notorious false positive.", "Oliver: To break that degeneracy, Rachel and I plan to conduct chromatic transit modeling across multiple wavelengths. Starspots produce a steep chromatic slope into the optical, whereas a real atmosphere shows discrete, band-limited molecular features.", "Prof. Thorne: Very sound approach. Furthermore, if you confirm a true atmosphere, you must run a photochemical equilibrium model examining the ratio of methane to carbon monoxide. A co-existence of methane and oxygen out of thermodynamic equilibrium is our holy grail biosignature.", "Rachel: We will incorporate the disequilibrium chemical kinetics code.", "Prof. Thorne: Now, regarding your Cycle 4 telescope observing proposal to NASA: competition for JWST time is brutal. To convince the review panel, you cannot ask for marginal data. You must demonstrate using the Exposure Time Calculator that observing at least eight consecutive transits is essential to beat down instrumental noise and achieve five-sigma statistical significance.", "Oliver: Eight transits. We will calculate the cumulative integration hours tonight.", "Prof. Thorne: Excellent. Let's divide the remaining workload before next Monday's submission.", "Oliver: I will take primary responsibility for coding the Markov Chain Monte Carlo—or MCMC—Bayesian atmospheric retrieval pipeline in Python.", "Rachel: And I'll simulate the unocculted starspot temperature distributions using our PHOENIX stellar photosphere model grids.", "Dr. Thorne: Who is reducing the raw JWST NIRSpec pixel data?", "Oliver: I can help with the pipeline...", "Rachel: Actually, Oliver, since you're handling the MCMC inversion, leave the raw NIRSpec data reduction to me. I've already tested the background subtraction and 1D spectral extraction scripts.", "Oliver: Perfect, thanks Rachel. What about the atmospheric chemistry calculations?", "Oliver: I'll calculate the photochemical lifetime of abiotic ozone under extreme ultraviolet stellar flux.", "Rachel: That leaves the proposal text. For the scientific rationale and Exposure Time Calculator runs, we should definitely write those collaboratively to ensure our observational methodology is airtight.", "Oliver: Agreed, we'll co-author the telescope proposal on Friday afternoon.", "Prof. Thorne: Excellent division of labor. I look forward to reading your revised proposal on Monday."], "trans": ["索恩教授：下午好，奧利佛、瑞秋。請進。我審閱了你們關於 TRAPPIST-1e 第二週期凌日觀測的初步光譜分析。你們聲稱在 1.4 微米處發現了 3-sigma 置信度的水蒸氣大氣信號。", "奧利佛：是的，索恩教授！透射光譜在水分子特徵吸收峰處呈現出清晰的吸收凹槽。", "索恩教授：這確實是一個令人興奮的特徵，但我必須提醒你們保持極度懷疑。你們考慮過恆星污染（stellar contamination）嗎？TRAPPIST-1 是一顆具有持續磁活動的晚型 M 矮星。其光球層遍布低溫星黑子，其溫度低到足以讓水分子在恆星自身的大氣中形成。", "瑞秋：您指的是「凌日光源效應（Transit Light Source Effect）」？如果未被凌日遮擋的星黑子存在於凌日弦之外，它們會將自身的水分子吸收線直接烙印在凌日透射光譜上。", "索恩教授：一點沒錯。看起來像外星行星大氣層的信號，很可能只不過是恆星黑子表面的光譜特徵。這是一個臭名昭著的假陽性（false positive）。", "奧利佛：為了打破這種簡併性，瑞秋和我計劃在多個波長上進行色散凌日深度建模。星黑子會在光學波段產生陡峭的連續色散斜率，而真正的行星大氣則表現為離散的、受限於特定能帶的分子吸收特徵。", "索恩教授：非常合理的方案。此外，如果你們確認了真實的大氣層，你們必須運行一個光化學平衡模型，檢驗甲烷與一氧化碳的比率。處於熱力學非平衡狀態的甲烷與氧氣共存是我們尋找生命標誌特徵（biosignature）的聖杯。", "瑞秋：我們將納入非平衡化學動力學代碼。", "索恩教授：現在關於你們向 NASA 提交的第四週期望遠鏡觀測申請：JWST 機時的競爭極為慘烈。要說服評審委員會，你們不能申請邊緣性數據。你們必須利用曝光時間計算器（ETC）證明，至少需要觀測八次連續凌日（eight consecutive transits），才能有效壓低儀器雜訊並達到 5-sigma 的統計顯著性。", "奧利佛：八次凌日。我們今晚就計算累積積分時間。", "索恩教授：很好。讓我們在下週一提交前分配剩餘工作量。", "奧利佛：我主要負責在 Python 中編寫馬可夫鏈蒙地卡羅（MCMC）貝葉斯大氣反演管線。", "瑞秋：而我將利用 PHOENIX 恆星光球模型網格，模擬未被遮擋的星黑子溫度分佈。", "索恩教授：誰來處理原始的 JWST NIRSpec 像素數據？", "奧利佛：我可以協助處理數據管線……", "瑞秋：奧利佛，既然你負責 MCMC 反演，原始 NIRSpec 數據提取就交給我吧。我已經測試了背景扣除與一維光譜提取腳本。", "奧利佛：太好了，謝謝瑞秋。那大氣化學計算呢？", "奧利佛：我來計算極紫外恆星通量下非生物大氣臭氧的光化學壽命。", "瑞秋：那剩下申請書正文。關於科學依據與曝光時間計算器（ETC）運算，我們絕對應該共同撰寫，以確保觀測方法無懈可擊。", "奧利佛：同意，我們週五下午共同撰寫望遠鏡申請書。", "索恩教授：出色的分工。我期待週一閱讀你們修改後的申請書。"], "answers": [{"q_num": "Q21", "answer": "B", "clue_analysis": "【原聲定位】'cool starspots on the M-dwarf host star can mimic atmospheric water absorption' 恆星黑子水分子偽信號干擾，選 B。"}, {"q_num": "Q22", "answer": "A", "clue_analysis": "【原聲定位】'unocculted starspots sit outside the transit chord, they imprint their own water absorption' 未被遮擋星斑污染光譜，選 A。"}, {"q_num": "Q23", "answer": "A", "clue_analysis": "【原聲定位】'conduct chromatic transit modeling across multiple wavelengths' 多波長色散凌日建模破除簡併性，選 A。"}, {"q_num": "Q24", "answer": "A", "clue_analysis": "【原聲定位】'photochemical equilibrium model examining the ratio of methane to carbon monoxide' 甲烷與一氧化碳化學非平衡比率，選 A。"}, {"q_num": "Q25", "answer": "B", "clue_analysis": "【原聲定位】'observing at least eight consecutive transits is essential to achieve five-sigma confidence' 申請至少 8 次連續凌日觀測，選 B。"}, {"q_num": "Q26", "answer": "A", "clue_analysis": "【原聲定位】Oliver: 'I will take primary responsibility for coding the MCMC Bayesian atmospheric retrieval' 奧利佛負責 MCMC 反演管線，選 A。"}, {"q_num": "Q27", "answer": "B", "clue_analysis": "【原聲定位】Rachel: 'I'll simulate the unocculted starspot temperature distributions' 瑞秋負責恆星黑子溫度網格，選 B。"}, {"q_num": "Q28", "answer": "B", "clue_analysis": "【原聲定位】Rachel: 'leave the raw NIRSpec data reduction to me. I've already tested the extraction scripts' 瑞秋負責韋伯原始數據提取，選 B。"}, {"q_num": "Q29", "answer": "A", "clue_analysis": "【原聲定位】Oliver: 'I'll calculate the photochemical lifetime of abiotic ozone' 奧利佛負責臭氧光化學壽命，選 A。"}, {"q_num": "Q30", "answer": "C", "clue_analysis": "【原聲定位】Rachel: 'we should definitely write those collaboratively' / Oliver: 'Agreed, we'll co-author' 兩人共同撰寫申請書，選 C。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Atmospheric Fingerprint: Exoplanet Spectroscopy, Atmospheric Transmission, and Biosignature Detection", "src": "./audio/Unit04_Section4.mp3", "qr": "./qr/unit04-s4.png", "script": ["▶ Section 1  ‧  Beyond Geometric Detection: The Spectroscopy Revolution", "Section 1  Good morning, class. In today's astrophysics lecture, we are moving beyond the mere detection of extrasolar planets to what constitutes the ultimate holy grail of modern observational astronomy: characterizing their atmospheric compositions. Over the past three decades, astronomers have discovered over five thousand exoplanets, primarily through transit photometry—measuring the tiny dip in stellar brightness as a planet crosses in front of its host star—and the radial velocity method, which detects the subtle gravitational wobble of the star. However, merely establishing a planet's orbital radius and physical bulk density tells us very little about its actual surface conditions. To ascertain whether a distant rocky world harbors liquid water or atmospheric chemistry hospitable to biology, we must analyze the faint spectral fingerprints imprinted onto starlight.", "▶ Section 2  ‧  Mechanics of Transmission and Emission Spectroscopy", "Section 2  The preeminent analytical technique utilized today is transmission spectroscopy. During a primary transit, as an exoplanet passes directly along our line of sight across the stellar disk, a minuscule fraction of starlight filters through the gaseous annulus of the planet's upper atmosphere. Gas molecules within that atmosphere absorb specific wavelengths of light corresponding to their quantized quantum transitions. Shorter blue wavelengths may undergo Rayleigh scattering by tiny atmospheric particles, while longer infrared wavelengths are selectively filtered by molecular vibrational bonds. By subtracting the star's baseline emission spectrum from the filtered transit spectrum, astrophysicists construct a transmission spectrum. This reveals distinct absorption dips that serve as a direct chemical inventory of the exoplanet's atmosphere.", "▶ Section 3  ‧  Atmospheric Greenhouse Gases and Disequilibrium Markers", "Section 3  What specific chemical species are astrophysicists searching for? The foundational atmospheric components include water vapor, carbon dioxide, and methane. In an abiotic, inert planetary atmosphere, chemical compounds tend toward thermodynamic equilibrium. However, the presence of biological life forcefully drives an atmosphere into profound chemical disequilibrium. The quintessential biosignature on Earth is the simultaneous coexistence of abundant methane alongside high concentrations of molecular oxygen or ozone. Under normal chemical kinetics, methane reacts vigorously with oxygen to form water and carbon dioxide; therefore, for both gases to persist indefinitely in significant quantities, there must be a continuous, high-flux biogenic replenishing source.", "The Atmospheric Fingerprint: Exoplanet Spectroscopy, Atmospheric Transmission, and Biosignature Detection (Continued)", "▶ Section 4  ‧  The Perils of False Positives and Abiotic Mimics", "Section 4  Nevertheless, astrobiologists must navigate formidable interpretative minefields: namely, the risk of false positives. It was long assumed that substantial atmospheric oxygen was a definitive indicator of biological photosynthesis. However, photochemical modeling has revealed multiple abiotic pathways capable of generating oxygen without biological intervention. For example, intense ultraviolet radiation from active red dwarf M-stars can cause runaway photolysis of atmospheric water molecules. The light hydrogen atoms rapidly escape into space through hydrodynamic outflow, leaving dense, abiotic molecular oxygen behind. Similarly, abiotic methane can be synthesized through serpentinization reactions occurring in deep hydrothermal vents. Distinguishing a genuine metabolic biosignature from an abiotic geological mimic requires comprehensive context across the entire planetary system.", "▶ Section 5  ‧  Next-Generation Observatories and the Search for Biospheres", "Section 5  The frontier of this observational discipline has been dramatically accelerated by space-based infrared observatories, particularly the James Webb Space Telescope. JWST's high-resolution spectrometers are currently scrutinizing the atmospheres of the TRAPPIST-1 system—a compact family of seven Earth-sized worlds orbiting an ultracool red dwarf forty light-years away. Looking further ahead, mission concepts like the Habitable Worlds Observatory plan to deploy advanced optical coronagraphs capable of directly suppressing stellar glare by a factor of ten billion. This will enable direct spectroscopy of Earth analogs in the habitable zones of Sun-like stars. We stand on the technological threshold of answering humanity's most profound existential inquiry: whether our living biosphere is a cosmic singularity or a common planetary outcome."], "trans": ["Section 1  大家早安。在今天的天體物理學講座中，我們將跨越單純搜尋太陽系外行星的初級階段，邁向現代觀測天文學的終極聖杯：解析系外行星的大氣化學成分。在過去三十年間，天文學家已經發現了超過五千顆系外行星，這主要是透過「凌日測光法」（測量行星掠過母恆星表面時引起的微小亮度下降）以及「徑向速度法」（檢測行星引力導致恆星產生的微弱週期性擺動）。然而，單純確定一顆行星的軌道半徑與整體體積密度（bulk density），幾乎無法告訴我們其表面真實環境的任何資訊。要確證遙遠的岩石世界是否擁有液態水或適宜生物孕育的大氣化學條件，我們必須深入分析烙印在恆星光芒中的微弱光譜指紋。", "Section 2  目前最頂尖的分析工具是「透射光譜學（transmission spectroscopy）」。當系外行星沿著我們的視線方向直接穿越母恆星盤面時，一小部分星光會穿透行星高層大氣的氣體環（annulus）。大氣中的氣體分子會吸收特定波長的光子，對應於其量子化的能量躍遷。較短的藍色波長容易受到大氣微粒引發的瑞利散射（Rayleigh scattering），而較長的紅外波長則會被分子的化學振動鍵所選擇性吸收。天體物理學家透過從過濾後的凌日志光譜中扣除恆星的基準發射光譜，建構出精準的透射光譜圖。這揭示了一系列獨特的吸收峰谷，成為評估系外行星大氣成分的直接化學清單。", "Section 3  天體物理學家究竟在尋找哪些特定的化學分子？基礎的大氣組成包括水蒸氣、二氧化碳與甲烷。在一個沒有生命存在的惰性行星大氣中，化學化合物往往趨向於熱力學平衡狀態。然而，生物圈的存在會強力迫使大氣脫離平衡，進入深刻的「化學非平衡態（chemical disequilibrium）」。地球上最經典的生命印記，是大量甲烷與高濃度分子氧（或臭氧）的同時共存。在常規的化學動力學下，甲烷會迅速與氧氣反應轉化為水與二氧化碳；因此，若兩種氣體能以可觀的濃度長期共存，背後必然存在源源不絕、高通量的生物成因補充來源。", "Section 4  儘管如此，天體生物學家必須在險象環生的科學雷區中謹慎求證：即「假陽性（false positives）」的致命風險。長期以來，人們普遍認為大氣中存在豐沛氧氣即為生物光合作用的決定性證據。然而，大氣光化學建模揭示了多條無需生物介入即可生成氧氣的「非生物途徑」。例如，活躍的 M 型紅矮星所釋放的強烈紫外線輻射，會引發大氣水分子失控的光解作用（photolysis）。較輕的氫原子透過流體動力學逃逸（hydrodynamic escape）迅速逸散至太空深處，留下了高濃度的非生物成因分子氧。同樣地，深海熱泉中的蛇紋石化反應亦能在無生命環境下合成甲烷。要將真實的代謝生命印記與非生物的地質偽裝區分開來，需要縱觀整個行星系統的全域環境脈絡。", "Section 5  以太空為基地的紅外天文台——特別是詹姆斯·韋伯太空望遠鏡（JWST）——極大地推進了這門觀測學科的前沿。JWST 的高解析度光譜儀目前正密切審視 TRAPPIST-1 行星系統——這是一個距離地球四十光年、由七顆地球大小的岩石行星環繞一顆超低溫紅矮星運行的緊湊家族。展望更長遠的未來，諸如「宜居世界天文台（Habitable Worlds Observatory）」等任務概念，計劃部署先進的光學日冕儀（coronagraphs），能夠將刺眼的恆星眩光直接壓制一百億倍。這將使天文學家能夠對類太陽恆星宜居帶中的類地行星進行直接光譜成像。我們正站在歷史性的技術門檻上，即將回答人類最深刻的存在提問：我們所在的繁茂生物圈究竟是宇宙中的孤例，抑或是行星演化的普遍必然。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. bulk density  【原聲定位】Section 1: 'merely establishing a planet's orbital radius and physical bulk density tells us very little...' 【解析】考查物理測量參數，填入 bulk density 或 density。"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. annulus  【原聲定位】Section 2: 'a minuscule fraction of starlight filters through the gaseous annulus of the planet's upper atmosphere.' 【解析】聽取幾何氣層名詞，填入 annulus。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. Rayleigh  【原聲定位】Section 2: 'Shorter blue wavelengths may undergo Rayleigh scattering by tiny atmospheric particles...' 【解析】專有名詞光學散射術語，首字母需大寫 Rayleigh。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. disequilibrium  【原聲定位】Section 3: 'the presence of biological life forcefully drives an atmosphere into profound chemical disequilibrium.' 【解析】生命印記核心特徵，注意否定字首 dis-，填入 disequilibrium。"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. photolysis  【原聲定位】Section 4: 'intense ultraviolet radiation... can cause runaway photolysis of atmospheric water molecules.' 【解析】化學光解作用名詞，填入 photolysis。"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. coronagraphs  【原聲定位】Section 5: 'deploy advanced optical coronagraphs capable of directly suppressing stellar glare...' 【解析】遮擋恆星強光之天文光學儀器，填入複數 coronagraphs。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 2: 'By subtracting the star's baseline emission spectrum from the filtered transit spectrum... reveals distinct absorption dips that serve as a direct chemical inventory...' 【解析】扣除恆星基準光以突顯行星大氣專屬的吸收峰谷，對應選項 B。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. A  【原聲定位】Section 3: 'In an abiotic, inert planetary atmosphere, chemical compounds tend toward thermodynamic equilibrium.' 【解析】無生命惰性行星始終趨向熱力學靜態平衡，對應選項 A。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. B  【原聲定位】Section 4: 'The light hydrogen atoms rapidly escape into space through hydrodynamic outflow, leaving dense, abiotic molecular oxygen behind.' 【解析】光解後輕質氫原子流體逃逸導致殘存非生物氧氣，對應選項 B。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. A  【原聲定位】Section 5: 'the TRAPPIST-1 system—a compact family of seven Earth-sized worlds orbiting an ultracool red dwarf forty light-years away.' 【解析】由七顆緊湊圍繞紅矮星運行的地球尺寸行星組成，對應選項 A。"}]}}}, {"num": 5, "tag": "unit05", "folder": "語言學與教育", "chapter": "第二篇章 ‧ 人文、心智與社會科學", "title": "The Linguistic Relativity Paradigm: Cognition & Bilingualism", "titleZh": "語言相對論假說、雙語認知架構與語言教學演進", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (Sec 1–4)", "src": "./audio/Unit05_Full_Section1_to_4.mp3", "qr": "./qr/unit05.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "兒童雙語認知沉浸學苑入學諮詢與登記 (Bilingual Immersion Academy Enrollment)", "src": "./audio/Unit05_Section1.mp3", "qr": "./qr/unit05-s1.png", "script": ["Mr. Davies: Good morning, Cambridge Bilingual Cognitive Early Learning Academy. Mr. Davies speaking.", "Mrs. Jenkins: Good morning! I'm calling to inquire about enrolling my son Toby in your autumn bilingual immersion intake.", "Mr. Davies: Wonderful! Our immersion program is grounded in modern cognitive linguistics. Let's record Toby's initial profile. May I have his surname?", "Mrs. Jenkins: It's Kensington. Spelled K-E-N-S-I-N-G-T-O-N.", "Mr. Davies: Thank you. And how old is Toby?", "Mrs. Jenkins: Well, people often think he's turning five soon because he's tall, but actually he's exactly four years and four months.", "Mr. Davies: Four years and four months, ideal developmental age for phonemic mapping. And a contact number for you, Mrs. Kensington?", "Mrs. Jenkins: It's 07733... and then 819402.", "Mr. Davies: 819402. Now, which pedagogical stream are you interested in?", "Mrs. Jenkins: We're keen on your dual-language Montessori programme, combining tactile materials with naturalistic language exposure.", "Mr. Davies: Excellent. Our primary curriculum objective is strengthening executive function—specifically inhibitory control and attentional task switching.", "Mrs. Jenkins: That's precisely what we hope for. When is the intake assessment?", "Mr. Davies: Our language playgroup assessment is scheduled for Tuesday the 9th of September.", "Mrs. Jenkins: September 9th is fine. Regarding schedule, I wondered about enrolling him for five full days?", "Mr. Davies: For a four-year-old entering dual immersion, five days can cause cognitive overload. We strongly recommend three full days initially, transitioning later if needed.", "Mrs. Jenkins: That makes total sense. We will start with three days.", "Mr. Davies: Does Toby have any medical or dietary considerations?", "Mrs. Jenkins: Yes, very important: he has a severe allergy to peanuts. He carries an auto-injector.", "Mr. Davies: Peanuts, noted on his medical alert file. And if you're unreachable, an emergency contact?", "Mrs. Jenkins: His maternal grandmother, Mrs. Sinclair. That's S-I-N-C-L-A-I-R.", "Mr. Davies: Thank you. And regarding fees, while full term tuition is 600 pounds, to secure Toby's desk today you only need to pay a term deposit of 150 pounds.", "Mrs. Jenkins: That sounds wonderful. Thank you, Mr. Davies!"], "trans": ["戴維斯先生：早安，劍橋雙語認知早期學習學苑。我是戴維斯先生。", "詹金斯太太：早安！我打電話是想諮詢讓我兒子托比（Toby）報名參加你們秋季雙語沉浸班的事宜。", "戴維斯先生：太好了！我們的沉浸式課程立足於現代認知語言學。讓我們登記托比的初步檔案。請問他的姓氏是？", "詹金斯太太：肯辛頓（Kensington），拼寫是 K-E-N-S-I-N-G-T-O-N。", "戴維斯先生：謝謝您。請問托比幾歲了？", "詹金斯太太：嗯，大家看他個子高常以為他快五歲了，但實際上他剛好四（four）歲四個月大。", "戴維斯先生：四歲四個月，正是語音映射的理想發展年齡。請問您的聯絡電話是，肯辛頓太太？", "詹金斯太太：是 07733……後面是 819402。", "戴維斯先生：819402。那麼，您對哪一種教學流派感興趣？", "詹金斯太太：我們很中意你們的雙語蒙特梭利（Montessori）課程，結合觸覺教具與自然語言接觸。", "戴維斯先生：太好了。我們主要的課程目標是強化執行功能（executive function）——特別是抑制控制與注意力任務切換。", "詹金斯太太：這正是我們所期望的。入學評估是什麼時候？", "戴維斯先生：我們的語言遊戲組入學評估定於 9 月（September）9 日週二。", "詹金斯太太：9 月 9 日沒問題。關於日程安排，我原本考慮讓他每週上五天全天？", "戴維斯先生：對於剛進入雙語沉浸的四歲幼童來說，五天全天可能會造成認知過載。我們強烈建議初期每週三天（three）全天，後續視情況再做調整。", "詹金斯太太：這非常有道理。那我們先從每週三天開始。", "戴維斯先生：托比有任何醫療或飲食方面的顧慮嗎？", "詹金斯太太：有的，非常重要：他對花生（peanuts）嚴重過敏。他隨身攜帶自動注射器。", "戴維斯先生：花生，已在醫療警示檔案中備註。如果您無法接通電話，緊急聯絡人是？", "詹金斯太太：他的外祖母辛克萊太太（Mrs. Sinclair），拼寫是 S-I-N-C-L-A-I-R。", "戴維斯先生：謝謝您。關於費用，雖然整學期學費是 600 英鎊，但今天保留托比的名額只需先付 150 英鎊的學期定金。", "詹金斯太太：聽起來太棒了。謝謝您，戴維斯先生！"], "answers": [{"q_num": "Q1", "answer": "Kensington", "clue_analysis": "【原聲定位】'Kensington. Spelled K-E-N-S-I-N-G-T-O-N.' 考查英文字母逐字拼寫。"}, {"q_num": "Q2", "answer": "4 / four", "clue_analysis": "【原聲定位】'actually he's exactly four years and four months' 排除快五歲干擾，填 4 / four。"}, {"q_num": "Q3", "answer": "819402", "clue_analysis": "【原聲定位】'07733... and then 819402.' 連續數字聽記。"}, {"q_num": "Q4", "answer": "Montessori", "clue_analysis": "【原聲定位】'dual-language Montessori programme' 填寫教育體系名詞 Montessori。"}, {"q_num": "Q5", "answer": "function", "clue_analysis": "【原聲定位】'strengthening executive function' 題幹已有 Executive，填寫 function。"}, {"q_num": "Q6", "answer": "September", "clue_analysis": "【原聲定位】'Tuesday the 9th of September' 題幹已有 9th，填寫 September。"}, {"q_num": "Q7", "answer": "3 / three", "clue_analysis": "【原聲定位】'recommend three full days initially... start with three days' 排除五天干擾，填 3 / three。"}, {"q_num": "Q8", "answer": "peanuts", "clue_analysis": "【原聲定位】'severe allergy to peanuts' 填寫過敏原食物名詞 peanuts，注意複數。"}, {"q_num": "Q9", "answer": "Sinclair", "clue_analysis": "【原聲定位】'Mrs. Sinclair. That's S-I-N-C-L-A-I-R.' 考查姓氏拼寫。"}, {"q_num": "Q10", "answer": "150", "clue_analysis": "【原聲定位】'term deposit of 150 pounds' 排除全額 600 英鎊，填定金 150。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "心理語言學與眼動追蹤研究實驗室助理研習導覽 (Psycholinguistics Lab Orientation)", "src": "./audio/Unit05_Section2.mp3", "qr": "./qr/unit05-s2.png", "script": ["Dr. Miriam Cole: Good afternoon, student research assistants. I'm Dr. Miriam Cole, Director of the Center for Psycholinguistics and Cognitive Architecture.", "This semester, you will be assisting on our landmark investigation testing the Sapir-Whorf hypothesis: how linguistic diversity reshapes spatial categorization and visual attention. Let me brief you on our experimental hardware and laboratory protocols.", "Our primary workhorse is the tower-mounted infrared eye-tracker. Before testing each subject, you must administer a standardized 9-point calibration routine. This maps the corneal reflection of infrared light against the subject's unique pupil curvature, ensuring gaze-tracking accuracy down to 0.1 degrees.", "In our cross-linguistic color discrimination project, we are evaluating how language alters perceptual reaction times. We are replicating the classic Russian blues paradigm: investigating whether native Russian speakers—who possess obligatory separate lexical labels for light blue, 'goluboy', and dark blue, 'siniy'—categorize color shades faster across lexical boundaries than native English speakers who use a single superordinate term.", "Next, regarding our Sound-Attenuated Anechoic Chamber: to maintain pure acoustic isolation, all mobile phones, smartwatches, and wireless transceivers must be powered down and stowed in the Faraday vestibule outside before entering the chamber.", "Ethics in linguistic data management is strictly enforced. When handling field recordings of young bilingual children, all raw audio must be digitally pitch-modulated and stripped of identifiable metadata before being uploaded to our public repository.", "Lastly, for routine maintenance: if you need replacement optical infrared sensors or chin-rest cushions, they are stored in the locked drawers beneath Workbench 4 in Room B.", "Now, let's review our seven specialized research suites on the floor plan.", "In Suite 3, we have the Visual World Paradigm Room. Here, high-speed cameras track millisecond gaze fixations on objects on a display screen as subjects hear continuous spoken sentences, revealing predictive lexical access in real time.", "Across the hall in Suite 2 is our Acoustic Phonetics Booth. Equipped with studio-grade condenser microphones, researchers measure voice onset time, or VOT, down to single milliseconds to analyze bilingual phonetic drift in stop consonants.", "Down the corridor in Suite 4, we operate the Electro-Encephalography Neuro-Linguistics Suite. Researchers fit subjects with 64-channel geodesic sensor nets to measure the N400 event-related potential—an electrophysiological brainwave spike that indexes semantic expectancy violations.", "Further along in Suite 5 is the Infant Language Habituation Pod. This specialized suite utilizes automated pacifiers equipped with pressure transducers to monitor high-amplitude sucking rates, testing how multilingual infants discriminate non-native phonemic contrasts.", "Finally, in Suite 7, you will work in the Corpus Transcription and Annotation Pod. This is where research assistants perform precision phonetic time-alignment and syntactic part-of-speech tagging on our spontaneous dialect audio archives.", "Let's enter Suite 1 to calibrate our first eye-tracker!"], "trans": ["米莉安・科爾博士：各位學生研究助理，大家下午好。我是心理語言學與認知架構中心主任米莉安・科爾博士。", "這學期，各位將參與我們檢驗薩丕爾-沃夫假說（Sapir-Whorf hypothesis）的重大研究課題：語言多樣性如何重塑空間分類與視覺注意力。讓我為各位說明實驗硬體與實驗室規範。", "我們的主力設備是塔式安裝紅外眼動儀。在測試每位受試者之前，您必須執行標準化的九點校準程序（9-point calibration）。這能將紅外光的角膜反射與受試者獨特的瞳孔曲率進行精準映射（corneal reflection against pupil curvature），確保視線追蹤精度達到 0.1 度。", "在我們的跨語言顏色知覺專案中，我們正在評估語言如何改變知覺反應時間。我們正在複現經典的俄語藍色範式：探討母語為俄語的受試者——因其語言中強制區分淺藍（goluboy）與深藍（siniy）兩個詞彙標籤——在跨越詞彙邊界時，是否比使用單一上位名詞（blue）的英語母語者更快分類顏色色調（Russian speakers distinguish shades of blue faster due to lexical distinctions）。", "接下來關於消音吸音室：為了保持純粹的聲學隔離，所有手機、智慧手錶與無線收發裝置在進入艙室前，必須在外部的法拉第門廳關機並收納好。", "語言學數據管理的倫理規範執行非常嚴格。在處理雙語兒童的野外語音錄音時，所有原始音檔在存檔或上傳公共庫前，必須進行數位音高調製（digitally modulated and anonymized）並去除可辨識的個人元數據。", "最後是日常維護：如果您需要更換的光學紅外感測器或下巴托墊，它們存放在 B 室 4 號工作台下方的上鎖抽屜內（locked drawers under Workbench 4 in Room B）。", "現在，讓我們在平面圖上瀏覽七個專業研究套間。", "在 3 號套間是視覺世界範式室（Visual World Paradigm Room）。當受試者聆聽連續語音句子時，高速相機在此追蹤受試者在螢幕物體上的毫秒級注視點（millisecond fixations during sentence comprehension），即時揭示預測性詞彙檢索過程。", "走廊對面的 2 號套間是聲學語音學錄音室（Acoustic Phonetics Booth）。配備錄音室級電容式麥克風，研究人員測量語音起聲時間（voice onset time, VOT）至毫秒級，以分析雙語者塞音中的語音漂移現象。", "沿著走廊前進的 4 號套間是腦電神經語言學室（EEG Neuro-Linguistics Suite）。研究人員為受試者佩戴 64 導聯感測網，測量 N400 事件相關電位（ERP）——這是一種代表語意期待違背（semantic expectancy violations）的大腦電生理腦波峰值。", "再往前走的 5 號套間是嬰兒語言適應試驗艙（Infant Language Habituation Pod）。該專用套間利用裝有壓力傳感器的自動化奶嘴監測高振幅吮吸率（high-amplitude sucking rates），測試多語幼兒如何辨別非母語的音位對立。", "最後在 7 號套間是語料庫轉錄與標註室（Corpus Transcription & Annotation Pod）。研究助理在此對我們的自發性對話方言語音檔案進行精確的語音時間對齊（phonetic alignment）與詞性標註。", "讓我們進入 1 號套間校準第一台眼動儀！"], "answers": [{"q_num": "Q11", "answer": "A", "clue_analysis": "【原聲定位】'maps corneal reflection of infrared light against the subject's unique pupil curvature' 考查角膜反射與瞳孔曲率校準，選 A。"}, {"q_num": "Q12", "answer": "A", "clue_analysis": "【原聲定位】'Russian speakers... categorize color shades faster across lexical boundaries due to distinct lexical labels' 俄語詞彙區分加快知覺分類，選 A。"}, {"q_num": "Q13", "answer": "B", "clue_analysis": "【原聲定位】'mobile phones, smartwatches... powered down and stowed in the Faraday vestibule outside' 法拉第門廳關機存放，選 B。"}, {"q_num": "Q14", "answer": "B", "clue_analysis": "【原聲定位】'raw audio must be digitally pitch-modulated and stripped of identifiable metadata' 語音調頻去識別化，選 B。"}, {"q_num": "Q15", "answer": "B", "clue_analysis": "【原聲定位】'locked drawers beneath Workbench 4 in Room B' B 室 4 號工作台抽屜，選 B。"}, {"q_num": "Q16", "answer": "C", "clue_analysis": "【原聲定位】'Suite 3... Visual World Paradigm... track millisecond gaze fixations on objects as subjects hear sentences' 視覺世界範式對應 3 號套間（C）。"}, {"q_num": "Q17", "answer": "B", "clue_analysis": "【原聲定位】'Suite 2... Acoustic Phonetics... measure voice onset time (VOT) to analyze bilingual phonetic drift' 語音起聲時間對應 2 號套間（B）。"}, {"q_num": "Q18", "answer": "D", "clue_analysis": "【原聲定位】'Suite 4... EEG... measure the N400 event-related potential indexing semantic expectancy violations' N400 語意違背對應 4 號套間（D）。"}, {"q_num": "Q19", "answer": "E", "clue_analysis": "【原聲定位】'Suite 5... Infant Language Habituation... monitor high-amplitude sucking rates' 嬰兒吮吸率對應 5 號套間（E）。"}, {"q_num": "Q20", "answer": "G", "clue_analysis": "【原聲定位】'Suite 7... Corpus Transcription... perform precision phonetic time-alignment on dialect archives' 方言語料時間對齊對應 7 號套間（G）。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "跨語言空間認知與語法體態論文專題研討 (Tutorial on Spatial Cognition & Linguistic Typology)", "src": "./audio/Unit05_Section3.mp3", "qr": "./qr/unit05-s3.png", "script": ["Dr. Bennett: Good afternoon, Chloe, David. Come in. I've read your experimental proposal on spatial frames of reference and motion event cognition. You're tackling the very heart of the neo-Whorfian debate.", "Chloe: Thank you, Dr. Bennett! We're investigating whether speakers of languages that rely exclusively on absolute geographic coordinates—like Guugu Yimithirr—encode spatial memory differently from English speakers who use egocentric relative terms like 'left' and 'right'.", "Dr. Bennett: It's a classic empirical paradigm. However, your indoor laboratory setup concerns me. In your pilot design, you placed subjects in a windowless room with small toy farm animals on a table. If participants have no perceptual access to the sun or distant terrain, their internal biological compass can drift, compromising the validity of an absolute orientation test.", "David: We see that limitation. That's why in our updated methodology, we will conduct the spatial rotation trials outdoors on an elevated sports pavilion with clear geographic sightlines.", "Dr. Bennett: Excellent adjustment. Now, remind me: how are you defining the theoretical dichotomy between absolute and relative frames?", "Chloe: An absolute frame of reference anchors spatial coordinates to fixed landscape features—such as cardinal directions north, south, east, and west—irrespective of which way the observer is facing. In contrast, a relative frame rotates with the viewer's personal body axis, defining space in terms of left, right, front, and back.", "Dr. Bennett: Exactly. And how will you prove that these spatial choices aren't just verbal strategies? What about non-verbal cognitive interference?", "David: We've introduced a verbal shadowing protocol. While performing the 180-degree table rotation task, participants must continuously repeat a random sequence of spoken numbers played through headphones. This prevents internal subvocal verbal rehearsal, demonstrating that spatial concepts operate non-verbally.", "Dr. Bennett: Brilliant control. And for your second chapter on grammatical aspect and motion events?", "Chloe: We're comparing English speakers with Spanish and German speakers watching video clips of people walking toward a building. In aspect-marking languages where you say 'is walking', speakers pay less attention to the endpoint goal. In languages without progressive aspect, viewers fixate significantly earlier on the endpoint, anticipating completion.", "Dr. Bennett: Outstanding hypothesis. Finally, for your upcoming paper at the Cognitive Science Society: avoid claiming language 'prisons' the human mind. The modern consensus is that linguistic relativity is a matter of 'thinking for speaking'—language gently guides habitual attention rather than permanently restricting sensory capacity.", "David: We will frame our conclusion in terms of attentional tuning rather than cognitive determinism.", "Dr. Bennett: Splendid. Now, let's distribute the tasks for your upcoming pilot trials.", "Chloe: For the field testing hardware, I'll take charge of calibrating the magnetic digital compasses and setting up the outdoor turntable apparatus.", "David: Thanks, Chloe. And since you're setting up the hardware, I'll synthesize the theoretical literature review on neo-Whorfian typology.", "Chloe: What about the R programming for the gaze fixation latency data?", "David: I'll handle writing the linear mixed-effects scripts in R—I've already structured the data matrices.", "Chloe: Perfect. And for the participant elicitation interviews, I'll conduct the bilingual Spanish and English video playback sessions.", "David: That leaves the ethics documentation and participant information sheets. Since we need Spanish and English versions, let's draft those collaboratively on Thursday morning.", "Chloe: Agreed, we'll co-author the ethics submission together.", "Dr. Bennett: Outstanding division of responsibilities. I look forward to seeing your preliminary pilot data next week."], "trans": ["班奈特博士：下午好，克洛伊、大衛。請進。我讀了你們關於空間參考框架與運動事件認知的實驗方案。你們直面了新沃夫主義辯論的最核心領域。", "克洛伊：謝謝班奈特博士！我們正在探討：完全依賴絕對地理座標的語言使用者（如澳洲原住民語言 Guugu Yimithirr）在空間記憶編碼上，是否與使用自我中心相對術語（如「左」和「右」）的英語使用者存在根本差異。", "班奈特博士：這是一個經典的實證範式。然而，你們的室內實驗室佈置讓我有些擔憂。在你們的預備設計中，你們把受試者安置在一個沒有窗戶的房間裡，桌上放著小農場動物玩具。如果受試者無法感知太陽或遠處的地貌特徵，他們的內在生物羅盤就可能發生漂移，從而危及絕對定向測試的有效性（testing room lacked landmarks）。", "大衛：我們意識到了這一局限。這就是為什麼在我們更新的方法論中，我們將在視野開闊的高架戶外體育看台上進行空間旋轉測試。", "班奈特博士：極佳的調整。現在請提醒我：你們如何定義絕對參考框架與相對參考框架之間的理論二元對立？", "克洛伊：絕對參考框架將空間座標錨定在固定的景觀特徵上——例如東、西、南、北等基本方向（cardinal directions north/south anchored to planetary landscape）——無論觀察者面朝哪個方向。相比之下，相對框架隨觀察者個人身體軸線旋轉，以左、右、前、後來定義空間。", "班奈特博士：一點沒錯。那麼你們將如何證明這些空間選擇不僅僅是語言層面的應對策略？如何排除非語言認知干擾？", "大衛：我們引入了言語遮蔽（verbal shadowing）協議。在執行 180 度桌面旋轉任務時，受試者必須透過耳機持續複誦隨機播出的數字序列（continuously recite random numeric sequences）。這阻斷了內在的言語默誦，從而證明空間概念是非語言性運作的。", "班奈特博士：極為精妙的對照實驗。那關於你們探討語法體態與運動事件的第二章呢？", "克洛伊：我們正在對比英語使用者與西語、德語使用者觀看人們朝建築物走去的影片片段。在標記進行體的語言中（如 is walking），使用者較少關注動作的終點目標（endpoints）。而在缺乏進行體的語言中，觀察者的視線會顯著更早注視終點，預期動作的完成。", "班奈特博士：非常出色的假說。最後，關於你們即將在認知科學學會發表的論文：切忌宣稱語言是人類心智的「牢籠」。現代學術共識認為，語言相對論本質上是「為說話而思考（thinking for speaking）」——語言溫和地引導習慣性注意力，而非永久性限制感官能力（linguistic relativity modulates attention rather than blinding perception）。", "大衛：我們將圍繞注意力微調而非認知決定論來構建結論。", "班奈特博士：太好了。現在讓我們分配即將進行的預試驗任務。", "克洛伊：關於戶外測試硬體，我負責校準數位磁羅盤並搭建戶外旋轉台設備。", "大衛：謝謝克洛伊。既然你負責硬體，我來整合新沃夫主義類型學的理論文獻綜述。", "克洛伊：那注視潛伏期數據的 R 語言統計分析呢？", "大衛：我來負責編寫 R 語言線性混合效應模型腳本——我已經構建好了數據矩陣。", "克洛伊：太好了。至於受試者引出訪談，我來負責雙語西語和英語的影片播放誘導測試。", "大衛：那剩下倫理文件與受試者資訊說明表。既然需要西語和英語雙語版本，我們週四上午共同撰寫吧。", "克洛伊：同意，我們一起完成倫理申請撰寫。", "班奈特博士：出色的職責劃分。我期待下週看到你們的初步預試驗數據。"], "answers": [{"q_num": "Q21", "answer": "A", "clue_analysis": "【原聲定位】'placed subjects in a windowless room... no access to sun or distant terrain, internal biological compass can drift' 缺乏地標導致羅盤漂移，選 A。"}, {"q_num": "Q22", "answer": "A", "clue_analysis": "【原聲定位】'absolute frame anchors spatial coordinates to fixed landscape features—such as cardinal directions north, south' 絕對座標基於固定東南西北，選 A。"}, {"q_num": "Q23", "answer": "A", "clue_analysis": "【原聲定位】'continuously repeat a random sequence of spoken numbers played through headphones' 口頭複誦數字阻斷語言默誦，選 A。"}, {"q_num": "Q24", "answer": "A", "clue_analysis": "【原聲定位】'aspect-marking languages... pay less attention to the endpoint goal / without aspect fixate earlier on endpoints' 體態語法引導對終點目標的注意，選 A。"}, {"q_num": "Q25", "answer": "A", "clue_analysis": "【原聲定位】'linguistic relativity is a matter of thinking for speaking... gently guides habitual attention rather than permanently restricting perception' 語言引導注意力而非禁錮思維，選 A。"}, {"q_num": "Q26", "answer": "A", "clue_analysis": "【原聲定位】Chloe: 'I'll take charge of calibrating the magnetic digital compasses and setting up the outdoor turntable' 克洛伊負責校準磁羅盤，選 A。"}, {"q_num": "Q27", "answer": "B", "clue_analysis": "【原聲定位】David: 'I'll synthesize the theoretical literature review on neo-Whorfian typology' 大衛負責理論文獻回顧，選 B。"}, {"q_num": "Q28", "answer": "B", "clue_analysis": "【原聲定位】David: 'I'll handle writing the linear mixed-effects scripts in R' 大衛負責 R 語言統計模型，選 B。"}, {"q_num": "Q29", "answer": "A", "clue_analysis": "【原聲定位】Chloe: 'I'll conduct the bilingual Spanish and English video playback sessions' 克洛伊負責雙語訪談，選 A。"}, {"q_num": "Q30", "answer": "C", "clue_analysis": "【原聲定位】David: 'let's draft those collaboratively' / Chloe: 'Agreed, we'll co-author' 兩人共同完成倫理申請，選 C。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Linguistic Relativity Paradigm: Cognitive Architecture, Cross-Linguistic Perception, and Pedagogical Evolution", "src": "./audio/Unit05_Section4.mp3", "qr": "./qr/unit05-s4.png", "script": ["▶ Section 1  ‧  The Sapir-Whorf Hypothesis: From Determinism to Relativity", "Section 1  Good morning, everyone. In today's sociolinguistics and cognitive science lecture, we are re-examining one of the most vigorously debated intellectual questions of the modern era: does the language we speak actively shape the way we perceive reality? This inquiry crystallized in the early twentieth century through the pioneering work of Edward Sapir and his student Benjamin Lee Whorf, giving rise to what is formally known as the Sapir-Whorf hypothesis. In its original, radical formulation—linguistic determinism—language was theorized to be an inescapable mental prison: if a language lacked a word for a concept, its speakers were physically incapable of conceptualizing it. By the late twentieth century, universalist linguists led by Noam Chomsky largely discredited this strict deterministic view, demonstrating that underlying cognitive structures are universally shared across human biology. However, contemporary cognitive linguistics has resurrected a refined, empirically supported version: linguistic relativity.", "▶ Section 2  ‧  Spatial Reckoning and Directional Cognition", "Section 2  The most striking empirical demonstrations of linguistic relativity emerge from cross-linguistic studies of spatial reckoning. Consider the Australian indigenous language Guugu Yimithirr, spoken in northern Queensland. Unlike Indo-European languages, which rely on egocentric spatial coordinates—such as 'to my left', 'behind you', or 'in front of the table'—Guugu Yimithirr utilizes an absolute cardinal direction system. Speakers define spatial relationships exclusively using absolute geocentric vectors: north, south, east, and west. A speaker would not say 'move to your left'; they would say 'shift slightly to the southwest'. Field experiments conducted by cognitive psychologists demonstrated that speakers of Guugu Yimithirr possess an extraordinary, continuous internal compass. Even when blindfolded and spun in dark, windowless rooms, their ability to orient themselves with geographic precision surpasses that of compass-equipped Western navigators. Their linguistic grammar literally enforces constant cognitive tracking of planetary space.", "▶ Section 3  ‧  Chromatic Categorization and Temporal Metaphors", "Section 3  A second fascinating frontier involves the linguistic categorization of color boundaries and temporal progression. In English, we use the single basic color term 'blue' to encompass everything from baby blue to deep navy. In contrast, the Russian language morphologically enforces two distinct, non-overlapping basic color categories: 'goluboy' for light blue and 'siniy' for dark blue. Neuro-linguistic event-related potential (ERP) experiments show that Russian speakers' brains register an automatic pre-attentive brainwave spike—the mismatch negativity signal—when an optical shade shifts across the goluboy-siniy linguistic boundary, a neural reaction completely absent in native English speakers. Similarly, while Western cultures metaphorically conceptualize time horizontally, with the future lying ahead and the past behind, Mandarin speakers frequently employ vertical temporal metaphors, conceptualizing the past as up ('shàng') and the future as down ('xià'). These habitual metaphors subtly orient temporal reasoning tasks.", "The Linguistic Relativity Paradigm: Cognitive Architecture, Cross-Linguistic Perception, and Pedagogical Evolution (Continued)", "▶ Section 4  ‧  Bilingualism and Executive Cognitive Control", "Section 4  When an individual acquires and actively switches between multiple linguistic systems, how does this affect core cognitive architecture? Research in developmental psychology demonstrates that bilingualism confers profound structural enhancements to executive function. The brain's executive control network—centered in the prefrontal cortex—is responsible for inhibitory control, task switching, and working memory allocation. Because both language systems remain simultaneously active in a bilingual speaker's brain, the executive network must constantly suppress interference from the non-target language. This lifelong neural gymnastics acts as cognitive weightlifting, significantly expanding cognitive reserve. Longitudinal epidemiological studies reveal that lifelong bilinguals exhibit clinical manifestations of neurodegenerative dementia on average four to five years later than monolinguals of comparable socioeconomic status.", "▶ Section 5  ‧  Pedagogical Evolution in Second Language Acquisition", "Section 5  These cognitive revelations have catalyzed a sweeping paradigm shift within applied linguistics and language pedagogy. Historically, language education was dominated by the grammar-translation method and rote behavioral drilling, treating language as an abstract set of computational algebraic rules. Modern communicative and task-based pedagogical frameworks, however, view language as an embodied, culture-bearing cognitive ecosystem. Effective second language acquisition is no longer measured solely by syntactic accuracy or lexical memorization, but by the learner's capacity to internalize new cognitive frames, navigate subtle sociolinguistic nuances, and develop intercultural empathy. Ultimately, learning a new language does not merely furnish a novel set of vocal sounds for familiar thoughts; it endows the human mind with an alternative conceptual architecture through which to experience the world."], "trans": ["Section 1  大家早安。在今天的社會語言學與認知科學講座中，我們將重新審視現代最具激烈爭論的學術提問之一：我們所使用的語言，是否會主動塑造我們感知現實的方式？這項探索在二十世紀初因愛德華·薩丕爾（Edward Sapir）與其學生班傑明·李·沃夫（Benjamin Lee Whorf）的開創性研究而具象化，並正式發展為「薩丕爾-沃夫假說（Sapir-Whorf hypothesis）」。在其最初激進的表述——即「語言決定論（linguistic determinism）」——中，語言被理論化為一座無法逃脫的心智牢籠：若一種語言缺乏某個概念的詞彙，其使用者在生理上就無法構想該概念。到了二十世紀末，以諾姆·杭士基（Noam Chomsky）為首的普遍主義語言學家在很大程度上反駁了這種嚴格決定論觀點，證明底層認知架構在全人類生物層面上是共通的。然而，當代認知語言學復興了一個精緻化且具備實證支持的版本：語言相對論（linguistic relativity）。", "Section 2  語言相對論最震撼的實證展示，來自於跨語言的空間定位研究。以澳洲昆士蘭北部原住民語言顧古伊米西爾語（Guugu Yimithirr）為例。不同於印歐語系普遍依賴「自我中心空間座標」——例如「在我左邊」、「在你身後」或「在桌子前方」——顧古伊米西爾語採用了一套絕對基點方位系統（absolute cardinal direction system）。講者完全使用絕對地心座標向量來定義空間關係：東、南、西、北。講者絕不會說「請往你的左邊挪一點」；他們會說「請往西南方微移」。認知心理學家的現場實驗證實，顧古伊米西爾語的使用者具備非凡且持續運作的「內部指南針（internal compass）」。即使被蒙上雙眼並在黑暗無窗的密閉房間中旋轉，他們精準辨別地理方位的能力仍超越配備指南針的西方航海家。他們的語言語法，從根本上強制大腦必須持續追蹤行星級的地理空間。", "Section 3  第二個引人入勝的前沿領域，涉及色彩邊界的語言範疇化與時間隱喻。在英語中，我們使用單一的基本顏色詞「blue」來概括從嬰兒藍到深海藍的所有色調。相反地，俄語在詞法上強制區分兩種互不重疊的基本顏色範疇：淺藍「goluboy」與深藍「siniy」。神經語言學的事件相關電位（ERP）腦波實驗顯示，當光學色調跨越 goluboy 與 siniy 的語言分界線時，俄語使用者的腦波會自動爆發出無意識的失配負向波（MMN）峰值信號，而這項神經反應在英語母語者的大腦中完全不存在。同樣地，西方文化習慣以水平座標隱喻時間（未來在前方，過去在後方），而中文使用者則頻繁使用垂直時間隱喻（將過去視為「上」，未來視為「下」）。這些習慣性隱喻在潛移默化中形塑了時間推理任務的思維走向。", "Section 4  當一個人習得並在多種語言體系之間頻繁切換時，這會如何重塑大腦的核心認知架構？發展心理學研究證實，雙語經驗能對「執行功能（executive function）」帶來深刻的結構性強化。大腦的執行控制網絡——以大腦前額葉皮質為核心——負責抑制控制、任務切換以及工作記憶分配。由於雙語者大腦中兩種語言系統始終保持同時活化狀態，執行網絡必須持續抑制非目標語言的干擾。這種終生不輟的神經體操宛如心智重訓，大幅擴充了「認知儲備（cognitive reserve）」。長期流行病學追蹤顯示，終生使用雙語的長者，其神經退化性失智症的臨床症狀發作時間，比社會經濟背景相當的單語者平均延遲了四到五年。", "Section 5  這些認知科學的重大發現，在應用語言學與外語教學法領域引發了廣泛的範式轉移。歷史上，語言教育長年受到文法翻譯法與機械式行為主義句型操練的支配，將語言視為一套抽象的代數運算規則。然而，現代溝通式與任務型教學架構（communicative and task-based frameworks），已將語言視為一個具身化、乘載深厚文化的認知生態系統。高成效的第二語言習得不再單純由句法正確性或字彙死記硬背來衡量，而是看學習者能否內化全新的認知架構、駕馭微妙的社會語言學語境，並培養跨文化的同理心。歸根結底，學習一門新語言絕非僅僅替熟悉的舊思想換上一套新發音；它賦予了人類心智一套全新的概念體系，讓我們能以另一種視角深邃體驗世界。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. determinism  【原聲定位】Section 1: 'In its original, radical formulation—linguistic determinism—language was theorized to be an inescapable mental prison...' 【解析】考查語言學極端理論名稱，填入不可數名詞 determinism。"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. cardinal  【原聲定位】Section 2: 'Guugu Yimithirr utilizes an absolute cardinal direction system.' 【解析】題幹 'an absolute (32) ____________ direction framework'，填入修飾詞 cardinal。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. compass  【原聲定位】Section 2: 'speakers of Guugu Yimithirr possess an extraordinary, continuous internal compass.' 【解析】比喻性名詞，原聲以 internal compass 呼應，填入單數 compass。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. basic color categories / color categories  【原聲定位】Section 3: 'the Russian language morphologically enforces two distinct, non-overlapping basic color categories...' 【解析】考查色彩範疇術語，填入 color categories 或 categories。"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. interference  【原聲定位】Section 4: 'the executive network must constantly suppress interference from the non-target language.' 【解析】題幹 'suppressing (35) ____________ from the inactive language'，原聲以 interference 精準對應。"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. communicative  【原聲定位】Section 5: 'Modern communicative and task-based pedagogical frameworks, however, view language as an embodied... ecosystem.' 【解析】教學法修飾詞，填入 communicative。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 1: 'universalist linguists led by Noam Chomsky largely discredited this strict deterministic view, demonstrating that underlying cognitive structures are universally shared...' 【解析】杭士基證明底層認知與語法架構具有人類普遍共通性，對應選項 B。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. B  【原聲定位】Section 3: 'Russian speakers' brains register an automatic pre-attentive brainwave spike... when an optical shade shifts across the goluboy-siniy linguistic boundary...' 【解析】色調跨越語言界線觸發自動腦波負向峰值反應，對應選項 B。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. B  【原聲定位】Section 4: 'lifelong bilinguals exhibit clinical manifestations of neurodegenerative dementia on average four to five years later...' 【解析】雙語者失智症臨床發病時間平均延遲四至五年，對應選項 B。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. B  【原聲定位】Section 5: 'learning a new language does not merely furnish a novel set of vocal sounds... it endows the human mind with an alternative conceptual architecture...' 【解析】總結句表明習得語言賦予大腦全新概念架構與認知擴充，對應選項 B。"}]}}}, {"num": 6, "tag": "unit06", "folder": "社會科學與心理學領域", "chapter": "第二篇章 ‧ 人文、心智與社會科學", "title": "The Architecture of Choice: Nudge Theory & Heuristics", "titleZh": "行為助推理論、預設架構與認知啟發式決策", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (Sec 1–4)", "src": "./audio/Unit06_Full_Section1_to_4.mp3", "qr": "./qr/unit06.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "行為經濟學永續消費與食物浪費實地研究登記 (Behavioral Economics Panel Intake)", "src": "./audio/Unit06_Section1.mp3", "qr": "./qr/unit06-s1.png", "script": ["Hannah: Behavioral Insights and Decision Research Center, Hannah speaking. How can I help you?", "Zoe: Hello! I'm calling to register for the university household study on nudge interventions and food waste reduction.", "Hannah: Splendid! We're actively signing up participants across London. Let's start with your contact details. What is your surname, Zoe?", "Zoe: It's Campbell. Spelled C-A-M-P-B-E-L-L.", "Hannah: Thank you, Zoe. And your mobile number?", "Zoe: It's 07554... and then 628319.", "Hannah: 628319. And how many adults live in your household?", "Zoe: Well, until last month my brother was staying with us, so that was three, but he moved to Manchester, so it's just two adults now.", "Hannah: Two adults, noted. Now, what does participation entail? First, we track purchasing habits via weekly grocery receipt scanning on our mobile app.", "Zoe: Scanning receipts, that's straightforward. What about cooking waste?", "Hannah: To measure organic prep scrap and uneaten food accurately, our couriers deliver a smart digital scale. You simply place your kitchen scrap bin on it each night.", "Zoe: A smart scale, perfect. When does the introductory survey take place?", "Hannah: The baseline behavioral survey is on Thursday the 17th of October.", "Zoe: October 17th is marked on my calendar. Do we need to log meals daily?", "Hannah: Yes, we ask that you upload a quick dinner plate photo via the app right before each evening meal.", "Zoe: Photo of dinner plates, got it. What about privacy?", "Hannah: All data is encrypted and strictly anonymized. You simply sign our standard electronic consent waiver online.", "Zoe: Consent waiver, understood. And the honorarium?", "Hannah: We pay participants via a direct monthly bank transfer. While weekly submissions earn small credits of 25 pounds, completing the full four-week trial awards a total completion bonus of 150 pounds.", "Zoe: That is very generous. Thank you so much, Hannah!"], "trans": ["漢娜：行為洞察與決策研究中心，我是漢娜。請問有什麼我可以協助您的？", "柔伊：您好！我打電話是想報名參加大學關於助推干預與減少食物浪費的家庭實地研究。", "漢娜：太好了！我們目前正在全倫敦招募受試家庭。讓我們先從您的聯絡資料開始。請問您的姓氏是，柔伊？", "柔伊：坎貝爾（Campbell），拼寫是 C-A-M-P-B-E-L-L。", "漢娜：謝謝您，柔伊。您的手機號碼是？", "柔伊：是 07554……後面是 628319。", "漢娜：628319。請問您家裡住著幾位成年人？", "柔伊：嗯，直到上個月我弟弟還跟我們住在一起，所以那時是三位，但他剛搬去曼徹斯特了，所以現在只有兩（two）位大人。", "漢娜：兩位大人，記下了。那麼，參與這項研究包含哪些事項？首先，我們透過手機應用程式每週掃描（scanning）雜貨採購收據來追蹤購買習慣。", "柔伊：掃描收據，很簡單。那烹飪廚餘呢？", "漢娜：為了精確測量食材處理廢料與未吃完的食物，我們的快遞員會送達一台智慧型電子磅秤（scale）。您每晚只需把廚餘桶放在上面即可。", "柔伊：智慧磅秤，沒問題。初步問卷調查什麼時候進行？", "漢娜：基線行為問卷調查安排在 10 月（October）17 日週四。", "柔伊：10 月 17 日，已標註在我的日曆上了。我們每天都需要記錄三餐嗎？", "漢娜：是的，我們請您在每晚用餐前，透過應用程式快速上傳一張晚餐餐盤的照片（photo / photos）。", "柔伊：晚餐餐盤照片，明白。那隱私保護如何？", "漢娜：所有數據皆經過加密並嚴格匿名化。您只需在線上簽署我們標準的電子知情同意（consent）確認書。", "柔伊：知情同意書，明白。那受試津貼呢？", "漢娜：我們透過每月的銀行直接轉帳（transfer）向受試者發放報酬。雖然每週提交會有 25 英鎊的微額積分，但在完成全部四週試驗後，將發放總計 150 英鎊的結案榮譽金。", "柔伊：這非常優渥。非常感謝您，漢娜！"], "answers": [{"q_num": "Q1", "answer": "Campbell", "clue_analysis": "【原聲定位】'Campbell. Spelled C-A-M-P-B-E-L-L.' 考查英文字母清晰逐字拼寫。"}, {"q_num": "Q2", "answer": "628319", "clue_analysis": "【原聲定位】'07554... and then 628319.' 連續電話號碼聽記。"}, {"q_num": "Q3", "answer": "2 / two", "clue_analysis": "【原聲定位】'brother was staying... that was three, but he moved... just two adults now' 排除三人干擾，填 2 / two。"}, {"q_num": "Q4", "answer": "scanning", "clue_analysis": "【原聲定位】'weekly grocery receipt scanning on our mobile app' 填寫動名詞 scanning。"}, {"q_num": "Q5", "answer": "scale", "clue_analysis": "【原聲定位】'couriers deliver a smart digital scale' 題幹已有 Smart digital，填寫單數名詞 scale。"}, {"q_num": "Q6", "answer": "October", "clue_analysis": "【原聲定位】'Thursday the 17th of October' 題幹已有 17th，填寫 October。"}, {"q_num": "Q7", "answer": "photo / photos", "clue_analysis": "【原聲定位】'upload a quick dinner plate photo' 填寫名詞 photo 或 photos。"}, {"q_num": "Q8", "answer": "consent", "clue_analysis": "【原聲定位】'sign our standard electronic consent waiver online' 填寫核心名詞 consent。"}, {"q_num": "Q9", "answer": "transfer", "clue_analysis": "【原聲定位】'via a direct monthly bank transfer' 題幹已有 monthly bank，填寫 transfer。"}, {"q_num": "Q10", "answer": "150", "clue_analysis": "【原聲定位】'total completion bonus of 150 pounds' 排除每週 25 鎊，填總額 150。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "「城市中的助推」行為公共政策互動展覽導覽 (Nudge in the City Exhibition Tour)", "src": "./audio/Unit06_Section2.mp3", "qr": "./qr/unit06-s2.png", "script": ["Dr. Simon Reed: Welcome, visitors, to 'Nudge in the City: The Architecture of Everyday Choice'. I'm Dr. Simon Reed, Senior Curator of Behavioral Public Policy.", "Every day, humans make over thirty-five thousand decisions, from what coffee to buy to how much to save for pension retirement. Yet classical economics assumes we are cold, rational calculating machines. In this exhibition, we demonstrate behavioral economics: how subtle environmental cues and default architectures shape our decisions without restricting our fundamental freedom of choice.", "In Zone 1, you will encounter the profound power of defaults. Nowhere is this more striking than in national organ donation policies. In Germany, citizens must actively check a box to opt into organ donation, resulting in a meager twelve percent consent rate. Just across the border in Austria, the policy uses an 'opt-out' presumed consent default—everyone is automatically registered unless they specify otherwise—catapulting Austrian donor consent to over ninety-nine percent.", "Next, in our Cafeteria Green Nudge display, we showcase how spatial ergonomics alters nutrition. Rather than banning desserts or lecturing patrons, researchers simply placed fresh fruit at eye-level right beside the payment registers, while placing heavy sugary pastries behind semi-translucent frosted glass doors. This subtle friction cut dessert caloric intake by twenty-eight percent without removing a single cake from the menu.", "However, choice architecture is a double-edged sword. In our Dark Nudges interactive kiosk, we examine digital exploitation: how predatory e-commerce sites employ confusing pre-checked boxes, hidden cancellation buttons, and artificial countdown timers to trap consumers into recurring monthly subscriptions.", "If you would like to join our guided curator walkthroughs, we lead interactive tours daily at 11:30 AM and 2:30 PM, convening by the bronze fountain in the central atrium.", "Now, let me orient you to our specialized exhibition pavilions.", "In Pavilion 2, you'll enter the Social Norms and Peer Pressure Pod. Here, an interactive utility bill display shows how informing homeowners that their neighbors consume thirty percent less energy slashes municipal electricity consumption far more effectively than monetary fines.", "Across the corridor in Pavilion 4 is the Loss Aversion and Framing Theater. Visitors play computerized betting games illustrating Kahneman and Tversky's prospect theory: experiencing the intense psychological pain of losing a hundred pounds, which hurts twice as sharply as the joy of winning that same sum.", "Down the hall in Pavilion 6 is the famous Fly-in-the-Urinal Cleanliness Lab. You'll see the original Schiphol Airport experiment where etching a small image of a housefly into porcelain urinals gave men an instinctive target, slashing bathroom cleaning costs and spillage by eighty percent.", "In Pavilion 5, step into the Temporal Discounting Simulator. Using advanced biometric facial morphing, you can engage in real-time conversation with an avatar of your seventy-year-old self, overcoming the present bias that causes people to underfund their retirement accounts.", "Finally, in Pavilion 3, you'll see the Salience and Visual Priming Alcove. Vibrant green footsteps projected onto the corridor floor subtly guide pedestrians directly toward waste recycling bins, boosting aluminum can recycling by forty-five percent.", "Let's step into Pavilion 1 and experience the default challenge!"], "trans": ["賽蒙・里德博士：各位參觀者，歡迎來到「城市中的助推：日常選擇的架構」展覽。我是行為公共政策資深策展人賽蒙・里德博士。", "每天，人類要做超過 35,000 個決策，從買什麼咖啡到存多少退休金。然而古典經濟學假設我們是冷酷、理性的計算機器。在本次展覽中，我們展示行為經濟學：細微的環境線索與預設架構如何在不限制我們基本選擇自由的前提下，塑造我們的決定（subtly guide behavior without restricting choice）。", "在第 1 展區，您將見證預設選項（defaults）的深遠力量。這一點在各國器官捐贈政策中表現得最為驚人。在德國，公民必須主動勾選同意加入（opt-in）器官捐贈，導致登記率只有微不足道的 12%。而在鄰國奧地利，政策採用了預設同意的「退出制（opt-out）」——除非特別聲明退出，否則所有人都自動註冊為捐贈者——這讓奧地利的器官捐贈同意率一舉躍升至 99% 以上（opt-out presumed consent default）。", "接下來在我們的綠色食堂助推展區，我們展示空間人體工學如何改變營養攝取。研究人員並未禁止甜點，也沒有對顧客說教，而是巧妙地將新鮮水果擺在收銀台旁邊的視線高度（fruit at eye-level near cashier），同時將高糖糕點放在半透明霧面玻璃門後（pastries behind frosted glass）。這一微小的阻力使甜點卡路里攝取量減少了 28%，而菜單上沒有撤下一塊蛋糕。", "然而，選擇架構是一把雙面刃。在我們的「黑暗助推（Dark Nudges）」互動機台，我們探討數位剝削：掠奪性電子商務網站如何利用令人困惑的預勾選框、隱藏的取消按鈕以及虛假的倒數計時器，誘騙消費者訂閱每月自動續費服務（hidden opt-outs and pre-selected checkboxes）。", "如果您想參加策展人實體導覽，我們每天在上午 11:30 與下午 2:30 帶隊導覽，在中庭中央的青銅噴泉處集合。", "現在，讓我為各位指引各個專業展館。", "在 2 號館，您將進入社會規範與同儕壓力展間（Social Norms Pod）。互動電費單展示證明，向住戶展示其鄰居的用電量少 30%（neighbors' electricity usage），其降低全市用電量的效果遠比罰款更加顯著。", "走廊對面的 4 號館是損失厭惡與框架效應劇場（Loss Aversion & Framing Theater）。訪客可體驗電腦化博弈遊戲，直觀感受康納曼與特沃斯基的前景理論：損失 100 英鎊帶來的心理痛苦，其強烈程度是贏得 100 英鎊喜悅感的兩倍（grieve £100 loss twice as intensely as gain）。", "沿著走廊下去的 6 號館是著名的小便斗蒼蠅清潔實驗室（Fly-in-the-Urinal Lab）。您將看到史基浦機場的原始實驗：在陶瓷小便斗中蝕刻一隻小蒼蠅圖案，為男性提供了本能的瞄準目標，使洗手間清潔成本與外溢減少了 80%（painted targets reducing spillage by 80%）。", "在 5 號館，走進跨期折扣模擬器（Temporal Discounting Simulator）。利用先進的面部年齡生成技術，您可以與自己 70 歲時的數位虛擬化身對話（digitally aged future self），克服導致人們退休儲蓄不足的「當下偏誤」。", "最後在 3 號館是顯著性與視覺啟動展間（Salience & Visual Priming Alcove）。投射在走廊地面上的鮮綠色腳印（green footsteps guiding to bins）巧妙地引導行人走向回收桶，使鋁罐回收率提高了 45%。", "讓我們走進 1 號館，體驗預設選項挑戰吧！"], "answers": [{"q_num": "Q11", "answer": "B", "clue_analysis": "【原聲定位】'environmental cues and default architectures shape our decisions without restricting our fundamental freedom of choice' 選擇架構核心定義，選 B。"}, {"q_num": "Q12", "answer": "B", "clue_analysis": "【原聲定位】'Austria utilizes an opt-out presumed consent default, whereas Germany requires an active opt-in' 奧地利默認退出 vs 德國主動加入，選 B。"}, {"q_num": "Q13", "answer": "B", "clue_analysis": "【原聲定位】'fruit at eye-level near cashier, while placing pastries behind frosted glass' 水果放視線高度、甜點放霧面玻璃後，選 B。"}, {"q_num": "Q14", "answer": "A", "clue_analysis": "【原聲定位】'employ confusing pre-checked boxes... to trap consumers into recurring subscriptions' 黑暗助推誘導訂閱，選 A。"}, {"q_num": "Q15", "answer": "B", "clue_analysis": "【原聲定位】'conduct interactive tours daily at 11:30 AM and 2:30 PM, convening by the bronze fountain' 每日兩場導覽，選 B。"}, {"q_num": "Q16", "answer": "B", "clue_analysis": "【原聲定位】'Pavilion 2... Social Norms... neighbors consume thirty percent less energy' 鄰居用電社會規範對應 2 號館（B）。"}, {"q_num": "Q17", "answer": "D", "clue_analysis": "【原聲定位】'Pavilion 4... Loss Aversion... losing a hundred pounds hurts twice as sharply as winning' 損失厭惡對應 4 號館（D）。"}, {"q_num": "Q18", "answer": "F", "clue_analysis": "【原聲定位】'Pavilion 6... Fly-in-the-Urinal... etching housefly reduced spillage by eighty percent' 小便斗蒼蠅對應 6 號館（F）。"}, {"q_num": "Q19", "answer": "E", "clue_analysis": "【原聲定位】'Pavilion 5... Temporal Discounting... conversation with an avatar of your seventy-year-old self' 未來自我跨期折扣對應 5 號館（E）。"}, {"q_num": "Q20", "answer": "C", "clue_analysis": "【原聲定位】'Pavilion 3... Salience & Visual Priming... green footsteps projected onto floor guide to bins' 綠色腳印引導回收對應 3 號館（C）。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "大學餐廳預設助推與食物浪費實地干預研討 (Tutorial on Cafeteria Default Nudges)", "src": "./audio/Unit06_Section3.mp3", "qr": "./qr/unit06-s3.png", "script": ["Prof. Kowalski: Good morning, Sam, Jessica. Please take a seat. I've reviewed your preliminary report on the campus cafeteria nudge experiment. You report a thirty-five percent drop in post-consumer plate waste.", "Sam: Yes, Professor Kowalski! By switching to smaller plates and placing vegetables first on the buffet line, food waste dropped precipitously.", "Prof. Kowalski: It sounds impressive, but your methodology has a devastating confound. Did you cross-reference the university academic calendar? You conducted your baseline during regular semester weeks, but your intervention coincided with exam revision week, when dining hall footfall plummeted by forty percent. Your waste reduction is largely an attendance artifact.", "Jessica: That's a serious oversight on our part. We will repeat the trial across two standard academic weeks next month.", "Prof. Kowalski: Good. Now, let's discuss your plate size intervention. You exploited the Delboeuf Illusion, correct?", "Sam: Exactly. By reducing plate diameter from twenty-eight centimeters down to twenty-two centimeters, a standard portion appears to overflow the plate. Diners perceive they are receiving a generous serving, so they don't heap excess food that gets thrown away.", "Prof. Kowalski: An elegant perceptual heuristic. But did you monitor compensatory behavior?", "Jessica: We did, and it revealed a fascinating spillover effect. When we made fries an opt-in side dish rather than the default starch, students didn't eat more fruit; instead, vending machine sales of sugary carbonated sodas outside the dining hall surged by twenty percent.", "Prof. Kowalski: A classic hydraulic compensatory response! Human appetites find a way. That must be discussed in your thesis.", "Prof. Kowalski: Furthermore, in Chapter 4, you must address the ethics of libertarian paternalism. Critics argue that covert nudges bypass conscious rational deliberation, manipulating human agency without explicit democratic mandate.", "Sam: We will engage directly with Thaler and Sunstein's ethical frameworks.", "Prof. Kowalski: Excellent. Finally, for empirical robustness, I mandate that you conduct a randomized exit survey. You must test whether diners were consciously aware of the plate downsizing or whether the effect operated entirely beneath conscious perception.", "Jessica: We will add an exit survey tablet station by the dish return belt.", "Prof. Kowalski: Now, let's distribute the remaining responsibilities before your second trial phase begins.", "Sam: For the physical heavy lifting, I'll take charge of conducting the daily post-consumer food scrap bin weigh-ins back in the dishwashing scullery every evening.", "Jessica: Thanks, Sam. And while you handle the scullery bins, I'll design the photographic exit survey questionnaire on Qualtrics.", "Prof. Kowalski: Who is conducting the econometrics?", "Jessica: I'll run the difference-in-differences regression model in Stata to control for daily menu variations and weather.", "Sam: And I will meet with the director of university catering services on Tuesday to finalize the logistics of our trayless dining trial.", "Prof. Kowalski: What about Chapter 4 on the philosophical ethics of paternalism?", "Sam: Jessica, do you want to tackle that, or...", "Jessica: I think the philosophical debate is too central to divide. Let's co-author the libertarian paternalism chapter together over the weekend.", "Sam: Agreed, we'll write the ethics section jointly.", "Prof. Kowalski: Splendid. I look forward to reviewing your clean, unconfounded data in three weeks."], "trans": ["科瓦斯基教授：早安，山姆、潔西卡。請坐。我審閱了你們關於校園餐廳助推實驗的初步報告。你們彙報消費者餐盤浪費減少了 35%。", "山姆：是的，科瓦斯基教授！透過換用較小的餐盤並在自助餐線上將蔬菜放在最前面，廚餘浪費急劇下降。", "科瓦斯基教授：聽起來令人印象深刻，但你們的方法論存在一個致命的混淆變量（confound）。你們對照過大學校曆嗎？你們是在正常學期週進行的基線測量，但你們的助推干預剛好碰上了期末考試複習週，當時食堂客流量暴跌了 40%（attendance plummeted by 40%）。你們的廚餘減少很大程度上只是出勤率驟降的人為假象！", "潔西卡：這是我們嚴重的疏忽。我們下個月將在兩個標準學期週內重做這項試驗。", "科瓦斯基教授：很好。現在讓我們討論餐盤尺寸的干預。你們利用了德爾伯夫錯覺（Delboeuf Illusion），對吧？", "山姆：一點沒錯。透過將餐盤直徑從 28 公分縮小到 22 公分（switching from 28-cm to 22-cm plates），標準分量的食物看起來顯得滿滿當當。就餐者感覺自己得到了豐盛的一餐，因此不會堆積過多最終被扔掉的食物。", "科瓦斯基教授：優雅的知覺啟發式方案。但你們監控了代償行為嗎？", "潔西卡：我們監控了，結果揭示了引人入勝的外溢效應。當我們把炸薯條從預設配菜改為主動選擇時，學生並沒有吃更多水果；相反地，食堂外面自動販賣機的高糖碳酸飲料銷量激增了 20%（sugary sodas at vending machines surged）。", "科瓦斯基教授：經典的「水壓式代償反應」！人類的食慾總會找到出口。這必須在你們的論文中探討。", "科瓦斯基教授：此外，在第 4 章中，你們必須討論自由意志家長制（libertarian paternalism）的倫理爭議。批評者認為隱蔽助推繞過了清醒的理性審思，在缺乏明確民主授權的情況下操縱了人類的自主能動性（violates autonomous agency）。", "山姆：我們將直接與塞勒（Thaler）和桑斯坦（Sunstein）的倫理框架進行辯證。", "科瓦斯基教授：太好了。最後，為了實證的穩健性，我要求你們進行隨機離場問卷調查。你們必須檢驗就餐者是否自覺意識到了餐盤尺寸的縮小，或者該效應完全是在意識知覺之下運作的（exit survey to evaluate conscious awareness）。", "潔西卡：我們會在餐盤回收傳送帶旁設置一個離場調查平板電腦工作站。", "科瓦斯基教授：現在，在第二階段試驗開始前，讓我們分配剩餘職責。", "山姆：關於實體重活，我負責每天傍晚在洗碗後勤間對就餐後的固體廚餘桶進行秤重記錄（daily weigh-ins of food scrap bins）。", "潔西卡：謝謝山姆。在你處理後勤間廚餘時，我來負責在 Qualtrics 上設計附帶照片的離場調查問卷。", "科瓦斯基教授：誰來做計量經濟學分析？", "潔西卡：我負責在 Stata 中運行雙重差分（DID）迴歸模型，以控制每日菜單變化與天氣影響。", "山姆：而我週二將會見大學餐飲服務主任，敲定無托盤就餐試驗的後勤細節。", "科瓦斯基教授：那第 4 章關於家長制的哲學倫理呢？", "山姆：潔西卡，你想負責那一章，還是……", "潔西卡：我認為哲學辯論太核心了，不能分開寫。讓我們週末一起共同撰寫自由意志家長制這一章吧。",
