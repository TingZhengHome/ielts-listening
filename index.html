<script>
const UNITS_DATA = [{"num": 1, "tag": "unit01", "folder": "環境科學與地球物理", "chapter": "第一篇章 ‧ 自然科學與尖端科技", "title": "The Atlantic Conveyor: Ocean Circulation & Climate Tipping Points", "titleZh": "大西洋巨型傳送帶與海洋氣候動力學", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (Sec 1–4)", "src": "./audio/Unit01_Full_Section1_to_4.mp3", "qr": "./qr/unit01.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "北大西洋海洋氣候野外調查志願者註冊登記 (Marine Climate Volunteer Registration)", "src": "./audio/Unit01_Section1.mp3", "qr": "./qr/unit01-s1.png", "script": ["Coordinator: Good morning, North Atlantic Marine Climate Volunteer Network. Brenda speaking, how can I help you?", "Mark: Hello! I'm calling to enquire about the summer research fieldwork in the subpolar Atlantic. My professor recommended I apply.", "Coordinator: Splendid! Let me take down your details first. Could I have your full name, please?", "Mark: Yes, it's Mark Holloway. That's H-O-L-L-O-W-A-Y.", "Coordinator: Thank you, Mark. And a contact telephone number?", "Mark: It's 07892... and then 541890.", "Coordinator: 541890, got it. And you're currently studying?", "Mark: Yes, I'm a postgraduate student in marine geography at Leeds.", "Coordinator: Wonderful. Now, for the upcoming Arctic voyage, we have several roles open. Given your background, the most suitable opening is as a coastal water sampling assistant, working directly with our ocean hydrographers.", "Mark: That sounds ideal! Which vessel would I be deployed on?", "Coordinator: You'll be assigned to our primary polar research vessel, the RV Arctica—spelled A-R-C-T-I-C-A.", "Mark: Brilliant. Regarding the time commitment, I was hoping to do a four-week stretch if possible.", "Coordinator: Well, unfortunately our mid-summer transects are tightly scheduled. The Greenland transect is strictly set at three weeks. Would that suit your schedule?", "Mark: Yes, three weeks works perfectly. When is the departure date?", "Coordinator: The ship departs from Reykjavik harbour on the 14th of July. You'd need to arrive at least two days prior for orientation.", "Mark: Understood. Are there specific certifications I need before embarking?", "Coordinator: Yes, very strictly enforced. You must hold a valid offshore safety certificate. Without proof of basic sea survival, maritime law prohibits boarding.", "Mark: I completed that training last November, so that's covered. What personal gear should I pack?", "Coordinator: While we supply heavy weather immersion suits and insulated thermal gloves, you are required to bring your own heavy-duty thermal boots. They must be steel-toed and waterproof.", "Mark: Thermal boots, noted. And for emergencies?", "Coordinator: We equip each field researcher with an immersion suit and a compact satellite tracker that clips onto your harness.", "Mark: That's reassuring. Lastly, what are the living costs aboard?", "Coordinator: Our standard commercial rate is 250 pounds per week, but registered fieldwork volunteers pay a subsidized rate of just 180 pounds per week, covering full mess meals and a shared berth.", "Mark: That is very reasonable. Thank you so much, Brenda!"], "trans": ["協調員：早安，這裡是北大西洋海洋氣候志願者網絡。我是布蘭達，請問有什麼我可以協助您的？", "馬克：您好！我想諮詢關於亞極地大西洋夏季野外研究的志願者項目。我的指導教授推薦我申請。", "協調員：太好了！讓我先登記您的個人資料。請問您的全名是？", "馬克：是的，我是馬克・霍洛威（Mark Holloway），拼寫是 H-O-L-L-O-W-A-Y。", "協調員：謝謝馬克。請問您的聯絡電話是？", "馬克：是 07892……後面是 541890。", "協調員：541890，記下了。您目前是在學學生嗎？", "馬克：是的，我是里茲大學海洋地理學碩士研究生。", "協調員：太棒了。對於即將開展的北極航次，我們有幾個空缺。考慮到您的背景，最合適的職位是沿海水質採樣（sampling）助理，直接與我們的海洋水文專家共事。", "馬克：聽起來太理想了！請問我會被分配到哪一艘船？", "協調員：您將被分配到我們的主力極地研究船「阿克提卡號（RV Arctica）」——拼寫是 A-R-C-T-I-C-A。", "馬克：太好了。關於時間長度，如果可能的話，我原本希望能參加四週。", "協調員：嗯，很遺憾我們盛夏的斷面航程排程非常緊湊。格陵蘭斷面航次嚴格限制為三（three）週。這符合您的日程嗎？", "馬克：可以，三週完全沒問題。啟航日期是什麼時候？", "協調員：研究船將於 7 月（July）14 日從雷克雅維克港啟航。您需要至少提前兩天抵達參加行前講習。", "馬克：明白。登船前我需要具備特定的資格證照嗎？", "協調員：是的，這一點執行非常嚴格。您必須持有有效的離岸安全（safety）證書。若無基本海上求生證明，海事法規嚴禁登船。", "馬克：我去年十一月剛完成了該項培訓，所以這沒問題。我個人需要攜帶哪些裝備？", "協調員：雖然我們提供重型防寒防浸服與保暖手套，但您必須自備重型保暖靴（boots）。必須具備鋼頭防護且完全防水。", "馬克：保暖靴，記下來了。緊急安全裝置呢？", "協調員：我們會為每位野外研究員配備一套防浸服以及夾在安全繩帶上的小型衛星追蹤器（tracker）。", "馬克：這令人放心多了。最後，船上的生活費用是多少？", "協調員：我們的標準商業訪客收費是每週 250 英鎊，但註冊的野外調查志願者享有補貼，每週僅需負擔 180 英鎊，包含所有伙食與共用艙位。", "馬克：這非常合理。非常感謝您，布蘭達！"], "answers": [{"q_num": "Q1", "answer": "Holloway", "clue_analysis": "【原聲定位】'Mark Holloway. That's H-O-L-L-O-W-A-Y.' 考查英文字母清晰逐字拼寫，注意雙寫字母 L 與結尾 ay。"}, {"q_num": "Q2", "answer": "541890", "clue_analysis": "【原聲定位】'07892... and then 541890.' 考核六位數電話號碼聽記，連讀無干擾，答案精確。"}, {"q_num": "Q3", "answer": "sampling", "clue_analysis": "【原聲定位】'coastal water sampling assistant' 題幹已有 Coastal water，空格填動名詞 sampling。"}, {"q_num": "Q4", "answer": "Arctica", "clue_analysis": "【原聲定位】'RV Arctica—spelled A-R-C-T-I-C-A.' 考查專有名詞拼寫，首字母大寫。"}, {"q_num": "Q5", "answer": "3 / three", "clue_analysis": "【原聲定位】'strictly set at three weeks' 講者先提出 4 weeks，隨後被協調員否定糾正為 3 weeks。"}, {"q_num": "Q6", "answer": "July", "clue_analysis": "【原聲定位】'on the 14th of July' 題幹已有 14th，空格填寫月份名詞 July。"}, {"q_num": "Q7", "answer": "safety", "clue_analysis": "【原聲定位】'valid offshore safety certificate' 題幹有 offshore 與 certificate，鎖定核心名詞 safety。"}, {"q_num": "Q8", "answer": "boots", "clue_analysis": "【原聲定位】'bring your own heavy-duty thermal boots' 題幹已有 Heavy-duty thermal，答案填 boots，注意複數 s。"}, {"q_num": "Q9", "answer": "tracker", "clue_analysis": "【原聲定位】'a compact satellite tracker' 題幹有 a satellite，答案填單數名詞 tracker。"}, {"q_num": "Q10", "answer": "180", "clue_analysis": "【原聲定位】'subsidized rate of just 180 pounds' 考官以 standard rate 250 作為干擾，志願者實付 180。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "格陵蘭海洋與冰川研究站訪客導覽 (Greenland Marine Station Visitor Orientation)", "src": "./audio/Unit01_Section2.mp3", "qr": "./qr/unit01-s2.png", "script": ["Dr. Thorne: Welcome, everyone, to the Greenland Marine and Cryospheric Observatory. I'm Dr. Aris Thorne, Director of Public Science here at Cape Farewell.", "Today you'll get an inside look at the frontier instruments we use to track the Atlantic Meridional Overturning Circulation, or AMOC. Before we start our walking tour, let me give you a quick briefing on our latest tech developments.", "Earlier this year, our engineering unit completed a major milestone with our oceanographic sensor buoys moored in the Irminger Sea. Previously, these deep-sea moorings had to be physically retrieved by ship every two years to extract flash memory logs. Now, thanks to custom acoustic relays coupled to satellite surface buoys, they transmit vital temperature and salinity data in real time directly to our consoles.", "However, the real-time data arriving this week is cause for considerable concern. Our sensors have detected an unprecedented anomaly: a sharp drop in sub-surface salinity across the northern gyre. The sheer volume of freshwater cascading from Greenland's melting ice sheet is diluting seawater faster than any of our five-year predictive models anticipated.", "During today's tour, you will visit our cutting-edge public engagement facilities. In the Paleoclimate Simulator Chamber, we have recreated the brutal atmospheric shock of the Younger Dryas. Stepping inside, you will experience the biting temperatures—minus twenty-five degrees Celsius—that gripped northern Europe 12,000 years ago when the conveyor abruptly stalled.", "Next, we will pass the Deep-Sea Salinity Laboratory. While you can observe the researchers through the viewing gallery, strictly no photography is allowed inside, as proprietary laser spectroscopic sensors are currently undergoing confidential industry trials.", "Finally, for those staying on station overnight, our rooftop observation deck is opened for auroral watching every clear night between 8:00 PM and midnight, provided wind speeds remain below forty knots.", "Now, if you look at your facility maps, let me direct you to our primary research zones.", "First, down in the basement annex, Room G is our High-Pressure Sensor Workshop. Here, technicians calibrate deep-sea pressure transducers that must survive over 4,000 meters of oceanic depth.", "Directly adjacent to the courtyard, in Wing A, is the Cryosphere Core Archive. Kept at minus thirty-five degrees, this vault houses kilometers of pristine ice cores, where our paleochemists extract and analyze ancient atmospheric methane trapped in prehistoric air bubbles.", "If you look across to Building B, you'll see the Hydrodynamic Flume Tank. This massive ninety-meter recirculating water channel is used by our fluid dynamicists to test sub-surface current turbulence and thermohaline stratification in a controlled miniature ocean.", "Just across the breezeway is Wing C, our Autonomous Glider Hangar. This is the staging ground where unmanned underwater robotic gliders undergo rapid battery turnaround, hydrodynamic hull checks, and instrument recalibration before being deployed across the subpolar gyre.", "Lastly, up on the top floor of the command tower is Wing E, the Satellite Telemetry Hub. Here, supercomputing arrays process direct radar altimetry downlinks from European Space Agency satellites to measure millimeter-scale changes in ocean surface height.", "Let's put on our safety vests and proceed into Wing G!"], "trans": ["索恩博士：大家早安，歡迎來到格陵蘭海洋與冰凍圈觀測站。我是費爾韋爾角公共科學主任阿里斯・索恩博士。", "今天各位將深入了解我們用於追蹤大西洋經向翻轉環流（AMOC）的最前沿儀器。在我們開始步行導覽之前，請允許我簡要彙報我們最新的技術研發進展。", "今年稍早，我們的工程團隊在伊爾明厄海部署的海洋感測浮標上達成了一項重大里程碑。以往，這些深海錨碇浮標必須每兩年由科考船打撈一次以讀取快閃記憶體紀錄；如今，透過與海面衛星浮標相連的定制水下聲學中繼器（acoustic relays），它們能將關鍵的溫度與鹽度數據即時傳輸（transmit in real time）至我們的主控台。", "然而，本週接收到的即時數據引發了相當大的擔憂。我們的感測器檢測到一項前所未有的異常：北部副極地環流的次表層鹽度出現急劇下降（sharp drop in salinity）。從格陵蘭融冰湧出的淡水量正在以遠超我們五年預測模型預估的速度稀釋海水。", "在今天的參觀中，您將參觀我們最尖端的公眾體驗設施。在古氣候模擬艙中，我們重現了新仙女木時期的殘酷氣候衝擊。走進艙內，您將親身體驗 12,000 年前大西洋傳送帶驟然停擺時籠罩北歐的極寒低溫（攝氏零下 25 度）。", "接下來我們將經過深海鹽度實驗室。雖然您可以透過參觀走廊進行觀摩，但內部嚴禁拍照（photography is prohibited），因為專利雷射光譜感測器目前正在進行保密行業測試。", "最後，對於在站內過夜的訪客，只要風速低於 40 節，我們的頂樓觀景台會在每個晴朗夜晚的 8:00 PM 至午夜開放觀賞極光。", "現在，請大家看手中的設施地圖，讓我為各位指引核心研究區域。", "首先在地下附屬建築的 G 室是我們的高壓感測器車間（High-Pressure Sensor Workshop）。技術人員在此校準深海壓力傳感器（pressure transducers），它們必須能承受超過 4,000 公尺深海的極限水壓。", "緊鄰中庭的 A 棟是冰凍圈冰芯檔案庫（Cryosphere Core Archive）。這座維持在零下 35 度的庫房收藏了數公里長的原生冰芯，古化學家在此提取並分析封裝在史前氣泡中的古代大氣甲烷（methane）。", "如果您看向 B 棟建築，會看到流體動力水槽（Hydrodynamic Flume Tank）。這座長達 90 公尺的巨大循環水槽供流體力學家在受控的微縮海洋環境中模擬測試次表層水流湍流（current turbulence simulations）與溫鹽分層。", "穿過走廊就是 C 棟，即無人水下滑翔機庫（Autonomous Glider Hangar）。這是水下自主無人潛航無人機（underwater drones）在部署到副極地環流前進行快速電池更換、流線型外殼檢修與儀器重校的基地。", "最後，在指揮塔頂樓是 E 棟衛星遙測中心（Satellite Telemetry Hub）。超級電腦集群在此直接接收歐洲太空總署衛星的雷達測高儀下行鏈路數據，以毫米級精度測量海表面高度。", "現在請大家穿上安全背心，我們前往 G 棟！"], "answers": [{"q_num": "Q11", "answer": "A", "clue_analysis": "【原聲定位】'transmit vital temperature and salinity data in real time thanks to custom acoustic relays' 考查同義替換，鎖定 A。選項 B（solar）與 C（twice as deep）音檔未提及。"}, {"q_num": "Q12", "answer": "A", "clue_analysis": "【原聲定位】'sharp drop in sub-surface salinity across the northern gyre... diluting seawater' 講者明確指出海水鹽度劇降，對應 A。"}, {"q_num": "Q13", "answer": "B", "clue_analysis": "【原聲定位】'experience the biting temperatures—minus twenty-five degrees Celsius—that gripped northern Europe during Younger Dryas' 對應極度低溫體驗，選 B。"}, {"q_num": "Q14", "answer": "B", "clue_analysis": "【原聲定位】'strictly no photography is allowed inside, as proprietary laser sensors are undergoing confidential trials' 考查拍照禁令，對應 B。"}, {"q_num": "Q15", "answer": "A", "clue_analysis": "【原聲定位】'opened for auroral watching every clear night between 8:00 PM and midnight' 對應 A，無預約徽章（B）或僅限週末（C）之限制。"}, {"q_num": "Q16", "answer": "G", "clue_analysis": "【原聲定位】'Room G is our High-Pressure Sensor Workshop... calibrate deep-sea pressure transducers' 壓力傳感器校準對應 G。"}, {"q_num": "Q17", "answer": "A", "clue_analysis": "【原聲定位】'Wing A, the Cryosphere Core Archive... analyze ancient atmospheric methane in bubbles' 古大氣甲烷分析對應冰芯館 A。"}, {"q_num": "Q18", "answer": "B", "clue_analysis": "【原聲定位】'Building B, the Hydrodynamic Flume Tank... test sub-surface current turbulence' 洋流水流湍流測試對應水槽 B。"}, {"q_num": "Q19", "answer": "C", "clue_analysis": "【原聲定位】'Wing C, Autonomous Glider Hangar... maintenance of unmanned underwater robotic gliders' 水下自主無人潛航器維護對應 C。"}, {"q_num": "Q20", "answer": "E", "clue_analysis": "【原聲定位】'Wing E, Satellite Telemetry Hub... process direct radar altimetry downlinks' 衛星測高下行數據處理對應 E。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "洋流淡水注入模擬專題學術導師討論 (Academic Tutorial on AMOC Freshwater Forcing Simulation)", "src": "./audio/Unit01_Section3.mp3", "qr": "./qr/unit01-s3.png", "script": ["Dr. Vance: Come in, Emma, Jack. Please take a seat. I've had a chance to review your initial draft on modeling the Atlantic Conveyor slowdown. It's an ambitious piece of research.", "Emma: Thank you, Dr. Vance. We've spent weeks compiling the freshwater flux data.", "Dr. Vance: Your data compilation is commendable. However, I have a fundamental concern regarding your simulation architecture. In Section 2, your model treats the AMOC response to meltwater forcing as a continuous, linear decline.", "Jack: We did that to keep the computational load manageable in the first iteration.", "Dr. Vance: I understand, but the North Atlantic physical circulation is notoriously non-linear. By smoothing over the tipping point dynamics, you completely obscure the critical threshold where sinking abruptly shuts down. It's a bistable system.", "Emma: That makes complete sense. We should incorporate a hysteresis curve showing both the vigorous on-state and the stagnant off-state.", "Jack: That will also help explain the discrepancy I noticed in the Irminger Basin field data. While the surface layers have received record freshwater dilution, the deep salinity measurements have remained strangely resilient.", "Dr. Vance: Exactly. And that brings me to your discussion of feedbacks. If you want this paper published, you cannot ignore the salt-advection feedback.", "Emma: You mean the mechanism where a weaker conveyor transports less equatorial saline water northward, which further reduces density and accelerates the shutdown?", "Dr. Vance: Precisely. It's a self-reinforcing vicious cycle. Make sure that mechanism is mathematically formalized in Section 3.", "Jack: We will revise that tonight. What about our departmental presentation next Wednesday?", "Dr. Vance: Your slides are thorough, but remember that the physical oceanography panel will scrutinize your paleoclimate proxy comparisons. Ice-core and sediment records are inherently noisy. Be prepared for rigorous questions on your chronological calibration.", "Emma: We will prepare dedicated backup slides addressing sediment dating uncertainties.", "Dr. Vance: Excellent. Now, let's divide the remaining workload before the final draft submission on Friday.", "Jack: For the coding, I'll take charge of recalibrating the numerical freshwater forcing parameters in Python. I already have the GitHub scripts set up.", "Emma: Perfect. And since Jack is buried in code, leave the literature review on the Younger Dryas meltwater discharge to me. I've already indexed forty key papers.", "Jack: Thanks, Emma. What about the figures? We need high-resolution vector diagrams of the thermohaline cross-section for publication.", "Emma: I think we should do that together—it requires both my conceptual layout and your data plotting skills.", "Jack: Agreed, we'll format the vector graphics jointly on Thursday afternoon.", "Dr. Vance: And the sensitivity analysis on Greenland runoff? That's the core empirical test.", "Emma: Jack and I already agreed that I would run the sensitivity batch runs, since my lab workstation has the dedicated GPU allocation.", "Jack: Yes, Emma owns that task. That leaves the bibliography and formatting citations.", "Jack: I'll handle compiling the final bibliography and verifying all institutional citations in EndNote.", "Dr. Vance: Excellent division of labor. I look forward to seeing your revised draft on Friday morning."], "trans": ["凡斯博士：請進，艾瑪、傑克。請坐。我已經審閱了你們關於大西洋傳送帶減速模擬的初稿。這是一項非常雄心勃勃的研究。", "艾瑪：謝謝凡斯博士。我們花了數週時間整理淡水通量數據。", "凡斯博士：你們的數據整理值得讚賞。然而，我對你們的模擬架構有一個根本性的擔憂。在第二節中，你們的模型將 AMOC 對融水強制的響應處理為連續的線性下降（linear decline）。", "傑克：我們這樣做是為了在第一次迭代中控制計算負擔。", "凡斯博士：我理解，但北大西洋的物理環流是眾所周知的非線性系統。透過抹平臨界點動力學，你們完全掩蓋了下沉流驟然停擺的關鍵臨界值。這是一個雙穩態系統（bistable system）。", "艾瑪：這非常有道理。我們應該納入一條滯後曲線（hysteresis loop），展示強盛的開啟狀態與停滯的關閉狀態兩個不同平衡態。", "傑克：這也能解釋我在伊爾明厄海盆實測數據中發現的異常。儘管表層海水遭遇了前所未有的淡水稀釋，深層鹽度數據卻出奇地保持穩定。", "凡斯博士：正是如此。這引出了你們對反饋機制的討論。如果你們想讓這篇論文發表，絕不能忽略鹽度平流反饋（salt-advection feedback）。", "艾瑪：您的意思是：較弱的傳送帶向北輸送的赤道高鹽海水減少，進一步降低了海水密度並加速了環流停擺的那個機制？", "凡斯博士：一點沒錯。這是一個自我強化的惡性循環。請務必在第三節中對該機制進行嚴格的數學形式化構建。", "傑克：我們今晚就修改。那關於下週三的系所專題報告呢？", "凡斯博士：你們的投影片很詳盡，但請記住，物理海洋學專家評審小組會極為嚴格地審視你們的古氣候代用指標對比。冰芯與沉積物紀錄本質上存在雜訊。請為定年校準方面的嚴苛提問做好準備（anticipate skepticism）。", "艾瑪：我們會準備專門的備用投影片，說明沉積物定年的不確定性。", "凡斯博士：太好了。現在讓我們在週五提交終稿之前分配剩餘工作量。", "傑克：關於程式設計，我負責在 Python 中重新校準數值淡水強制參數（recalibrating numerical parameters）。我已經在 GitHub 上建好了腳本。", "艾瑪：太好了。既然傑克埋頭寫代碼，新仙女木時期融水潰決的文獻回顧（literature review）就交給我吧。我已經歸納了 40 篇核心文獻。", "傑克：謝謝艾瑪。那圖表呢？我們需要出版級的高解析度溫鹽環流剖面向量圖。", "艾瑪：我想這項任務我們兩個共同完成——這需要我的概念架構排版和你的數據繪圖技能。", "傑克：同意，我們週四下午一起完成向量圖排版。", "凡斯博士：那關於格陵蘭融水體積的敏感性分析（sensitivity analysis）呢？這是核心的實證檢驗。", "艾瑪：傑克和我已經達成一致由我來執行敏感度批次運算，因為我的實驗室工作站有專用 GPU 資源。", "傑克：是的，艾瑪負責該項。那剩下參考文獻與引文格式。", "傑克：我來負責編纂最終的參考文獻清單，並在 EndNote 中核驗所有學術機構引文。", "凡斯博士：非常出色的分工。我期待週五早上看到你們的修訂稿。"], "answers": [{"q_num": "Q21", "answer": "B", "clue_analysis": "【原聲定位】'your model treats the AMOC response as a continuous, linear decline... completely obscure the critical threshold... It's a bistable system' 導師指出不應假定線性響應，對應 B。"}, {"q_num": "Q22", "answer": "B", "clue_analysis": "【原聲定位】'While surface layers have received record freshwater dilution, the deep salinity measurements have remained strangely resilient' 表面淡水稀釋但深層鹽度反常穩定，對應 B。"}, {"q_num": "Q23", "answer": "A", "clue_analysis": "【原聲定位】'incorporate a hysteresis curve showing both the vigorous on-state and the stagnant off-state' 滯後曲線雙平衡態對應 A。"}, {"q_num": "Q24", "answer": "A", "clue_analysis": "【原聲定位】'cannot ignore the salt-advection feedback... self-reinforcing vicious cycle' 鹽度平流正反饋，對應 A。"}, {"q_num": "Q25", "answer": "B", "clue_analysis": "【原聲定位】'physical oceanography panel will scrutinize your paleoclimate proxy comparisons... be prepared for rigorous questions' 對古氣候指標質疑做準備，對應 B。"}, {"q_num": "Q26", "answer": "B", "clue_analysis": "【原聲定位】Jack: 'I'll take charge of recalibrating the numerical freshwater forcing parameters in Python.' 傑克獨立負責代碼校準，選 B。"}, {"q_num": "Q27", "answer": "A", "clue_analysis": "【原聲定位】Emma: 'leave the literature review on the Younger Dryas meltwater discharge to me.' 艾瑪承擔文獻回顧，選 A。"}, {"q_num": "Q28", "answer": "C", "clue_analysis": "【原聲定位】Emma: 'we should do that together' / Jack: 'Agreed, we'll format the vector graphics jointly' 兩人共同完成向量圖，選 C。"}, {"q_num": "Q29", "answer": "A", "clue_analysis": "【原聲定位】Emma: 'I would run the sensitivity batch runs... dedicated GPU' / Jack: 'Emma owns that task' 艾瑪負責敏感度分析，選 A。"}, {"q_num": "Q30", "answer": "B", "clue_analysis": "【原聲定位】Jack: 'I'll handle compiling the final bibliography and verifying all institutional citations' 傑克負責參考文獻，選 B。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Atlantic Conveyor: Ocean Circulation, Marine Geophysical Dynamics, and Climate Tipping Points", "src": "./audio/Unit01_Section4.mp3", "qr": "./qr/unit01-s4.png", "script": ["▶ Section 1  ‧  Introduction to the Global Thermohaline Circulation", "Section 1  Good morning, everyone. In today's lecture on physical oceanography and climate dynamics, we are going to examine one of the most fundamental planetary regulatory mechanisms on Earth: the global thermohaline circulation, widely known in popular science as the great ocean conveyor belt. Now, when most people think of oceanic currents, they envision surface phenomena driven primarily by atmospheric wind patterns, such as the trade winds, combined with the Coriolis force. However, what truly governs deep-sea transport is not the surface breeze, but profound differences in water density. As the etymology suggests, 'thermo' refers to temperature, while 'haline' denotes salinity. Together, these two geophysical variables determine seawater buoyancy. The engine of this planetary conveyor in the Northern Hemisphere is the Atlantic Meridional Overturning Circulation, or AMOC. Without the constant northward heat flux delivered by this system, the climatic equilibrium of Western Europe would resemble the sub-Arctic conditions of Labrador.", "▶ Section 2  ‧  Physical Mechanics of Deep-Water Formation", "Section 2  Let us trace the physical trajectory of this water mass. Warm, highly saline surface water originates in equatorial regions and travels northward via the Gulf Stream. As it reaches subpolar latitudes in the Nordic and Labrador Seas, two critical transformations occur simultaneously. First, the water loses vast quantities of sensible heat to the freezing atmosphere—an exchange equivalent to roughly one petawatt of power. Second, sea-ice formation expels salt back into the surrounding liquid through a process known as brine rejection, significantly elevating localized salinity. The resulting frigid, salt-dense water becomes exceptionally heavy and plunges downward through chimney-like vertical columns to the ocean floor. This localized phenomenon is termed 'deep-water formation'. Once at the abyssal depths, this newly formed North Atlantic Deep Water flows southward, creating a powerful hydrodynamic suction that draws more tropical surface water northward. It is, in essence, a giant thermal siphon.", "▶ Section 3  ‧  Freshwater Forcing and the Dilution Threat", "Section 3  Now, what happens when this delicate density balance is disturbed? Contemporary climate observations reveal an alarming influx of freshwater into the subpolar North Atlantic. Due to anthropogenic warming, the Greenland ice sheet is losing mass at an accelerating rate—shedding over two hundred and eighty billion tons of ice annually. Crucially, glacial meltwater contains virtually zero salt. When this massive volume of buoyant freshwater discharges into the convective zones, it acts as a low-density lid, floating atop the denser marine layers and diluting overall salinity. Consequently, the surface water cannot achieve the critical density threshold required to sink. As oceanographers have documented, this freshwater forcing functions as an invisible brake on deep-water formation, weakening the circulation velocity of the AMOC by approximately fifteen percent since the mid-twentieth century.", "The Atlantic Conveyor: Ocean Circulation, Marine Geophysical Dynamics, and Climate Tipping Points (Continued)", "▶ Section 4  ‧  Paleoclimatic Precedents and Non-Linear Tipping Points", "Section 4  To understand the existential stakes of this deceleration, paleoclimatologists examine geological ice core archives from the Pleistocene and Holocene epochs. These historical proxy records reveal that the AMOC is inherently non-linear; it possesses a bistable regime. In other words, ocean circulation does not slow down smoothly in direct proportion to warming; rather, it can abruptly cross a critical tipping point and collapse entirely. Roughly twelve thousand eight hundred years ago, during the Younger Dryas event, the catastrophic release of catastrophic volumes of glacial meltwater from prehistoric Lake Agassiz shut down the conveyor in a matter of decades. The consequences were staggering: average temperatures across the North Atlantic basin plunged by up to ten degrees Celsius within a single generation, triggering severe megadroughts across the Sahel and destabilizing equatorial monsoon systems worldwide.", "▶ Section 5  ‧  Cascading Feedbacks and Future Projections", "Section 5  Looking toward future projections, a total or partial cessation of the AMOC would set off cascading feedback loops throughout the Earth system. Firstly, the cessation of northward thermal redistribution would cause dramatic regional cooling across the United Kingdom and Scandinavia, severely depressing agricultural growing seasons. Paradoxically, the thermal energy trapped in the southern hemisphere would accelerate the warming of the Southern Ocean, triggering runaway melting of the Antarctic ice shelves. Furthermore, ocean stagnation would drastically reduce the marine uptake of atmospheric carbon dioxide. Currently, cold sinking waters sequester gigatons of anthropogenic carbon into deep benthic reservoirs. If deep-water formation ceases, this biological and chemical carbon pump will fail, leaving excess carbon in the atmosphere and intensifying global planetary warming. Ultimately, monitoring the AMOC is not merely an academic exercise; it is an urgent geophysical imperative for human civilizational resilience."], "trans": ["Section 1  大家早安。在今天的物理海洋學與氣候動力學演講中，我們將深入探討地球上最核心的行星調控機制之一：全球溫鹽環流（thermohaline circulation），在科普領域中常被稱為「大洋輸送帶」。大多數人想到洋流時，往往只聯想到由大氣風場（如信風）與科氏力驅動的表層現象。然而，真正主宰深海物質輸送的並非表層微風，而是深層海水的密度差異。正如詞源所示，「thermo」代表溫度，「haline」代表鹽度；這兩個地球物理變數共同決定了海水的浮力。北半球這個行星傳送帶的核心引擎是大西洋經向翻轉環流（AMOC）。如果沒有這個系統持續向北輸送龐大熱量，西歐的氣候平衡將會劇降至類似拉布拉多地區的亞北極酷寒。", "Section 2  讓我們追蹤這股水團的物理運動軌跡。溫暖且高鹽度的表層海水發源於赤道海域，透過墨西哥灣暖流向北奔流。當它抵達北歐海與拉布拉多海等次極地緯度時，會同時發生兩大關鍵轉變。首先，海水向冰冷的極地大氣釋放大量顯熱，其能量交換相當於約一拍瓦（petawatt）的功率。其次，海冰凍結過程中透過「鹽析排鹽（brine rejection）」機制將鹽分排回周圍水體中，大幅提升局部的海水鹽度。劇烈冷卻與高鹽度的結合，使表層水團變得極度緻密沉重，並透過如煙囪般的垂直對流通道沉降至數千公尺的大洋底部。這一局部物理過程被稱為「深水形成（deep-water formation）」。沉入深淵的北大西洋深層水開始向南流動，形成強大的流體力學抽吸作用，進一步牽引熱帶暖水北上，本質上宛如一個行星級的巨大熱虹吸管。", "Section 3  然而，當這種微妙的密度平衡遭受破壞時會發生什麼？當代氣候觀測揭示了次極地北大西洋令人擔憂的淡水大量湧入現象。由於人為暖化，格陵蘭冰蓋正以加速度消融——每年流失超過兩千八百億噸的冰體。關鍵在於，冰川融水幾乎不含任何鹽分。當這股龐大體積的高浮力淡水注入對流海域時，它宛如一層低密度封蓋漂浮在濃稠的海水上方，急遽稀釋了周圍鹽度。這導致表層海水無法達到下沉所需的臨界密度門檻。正如海洋學家所證實，這種淡水強迫機制對深水形成起到了無形的制動減速作用，自二十世紀中葉以來，已使 AMOC 的環流流速減緩了約百分之十五。", "Section 4  為了理解這場環流減速背後的生存危機，古氣候學家深入分析了更新世與全新世的地質冰芯檔案。這些歷史代用指標紀錄揭示：AMOC 本質上具有非線性特徵，具備「雙穩態機制（bistable regime）」。換句話說，海洋環流並非隨著全球暖化而平滑且等比例地減速；相反地，它可能在達到臨界點後突發性地跨越臨界值並全面崩潰。約在一萬兩千八百年前的「新仙女木事件（Younger Dryas）」期間，史前阿加西茲湖（Lake Agassiz）冰川融水的毀滅性潰決，在短短數十年間就迫使大西洋輸送帶徹底停擺。其後果令人震驚：北大西洋盆地平均氣溫在短短一個世代內驟降高達攝氏十度，引發撒哈拉南緣薩赫爾地區的世紀大旱，並嚴重擾亂了全球赤道季風系統。", "Section 5  展望未來的氣候預測模型，AMOC 的局部或全面停擺將在整個地球系統中引發連鎖級聯的反饋效應。首先，北方熱量再分配的中斷將使英國與斯堪地那維亞半島遭遇極端嚴寒，嚴重摧毀農業生長季。矛盾的是，滯留在南半球的大量熱能將加速南大洋暖化，引發南極冰架失控融化。此外，海洋深層循環停滯將急遽削弱海洋吸收大氣二氧化碳的能力。目前，冰冷下沉的深層海水將數十億噸的人為碳排放封存至深海底層沉積中；若深水形成中斷，這個生物與化學碳泵將面臨停擺，使過量溫室氣體滯留於大氣中，進一步加劇全球劇烈暖化。因此，監測 AMOC 絕非單純的學術探索，而是攸關人類文明永續生存的緊急地球物理防線。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. density  【原聲定位】Section 1: 'what truly governs deep-sea transport is not the surface breeze, but profound differences in water density.' 【解析】題幹 'governed by differences in water...' 準確同義替換原聲句型，空格需填不可數名詞 density。"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. salt  【原聲定位】Section 2: 'sea-ice formation expels salt back into the surrounding liquid through a process known as brine rejection...' 【解析】題幹 'expelling (32) ____________ into the surrounding ocean'，原聲以 expels salt 直接呼應，答案為 salt。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. deep-water formation  【原聲定位】Section 2: 'This localized phenomenon is termed deep-water formation.' 【解析】題目引號提示為專有名詞術語，原聲講者使用 'is termed' 作為定義路標詞，精準定位 deep-water formation。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. lid  【原聲定位】Section 3: 'it acts as a low-density lid, floating atop the denser marine layers...' 【解析】演講者以明喻修辭 'acts as a low-density lid' 形容浮在海面的淡水層，符合題幹 'acting like a low-density (34) ____________'。"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. 15 / fifteen  【原聲定位】Section 3: 'weakening the circulation velocity of the AMOC by approximately fifteen percent since the mid-twentieth century.' 【解析】考查數字聽取，注意 'by approximately 15 percent' 對應題幹 'diminished by approximately (35) ____________ percent'。"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. bistable  【原聲定位】Section 4: 'the AMOC is inherently non-linear; it possesses a bistable regime.' 【解析】考查學術形容詞修飾，講者強調洋流具有雙穩態特性，填入 bistable。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 4: 'the catastrophic release of catastrophic volumes of glacial meltwater from prehistoric Lake Agassiz shut down the conveyor...' 【解析】演講明確指出新仙女木事件的直接誘因是阿加西茲湖的大量融水潰決，對應選項 B。A 與 C 原文未提及或屬於干擾項。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. C  【原聲定位】Section 5: 'Paradoxically, the thermal energy trapped in the southern hemisphere would accelerate the warming of the Southern Ocean...' 【解析】原聲以路標詞 'Paradoxically' 引導熱能蓄積在南半球引發異常暖化，精準對應選項 C。A 的巴塔哥尼亞沙漠化及 B 的冰架穩定均與原文事實相反。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. A  【原聲定位】Section 5: 'cold sinking waters sequester gigatons of anthropogenic carbon into deep benthic reservoirs.' 【解析】下沉洋流將數十億噸人為碳封存至深海沉積物中，對應選項 A 中的 'sequester gigatons of anthropogenic carbon dioxide'。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. B  【原聲定位】Section 5: 'Ultimately, monitoring the AMOC is not merely an academic exercise; it is an urgent geophysical imperative for human civilizational resilience.' 【解析】總結句以 'not merely... but an urgent imperative' 表明監測大洋環流是維繫人類文明穩定的緊急科學任務，對應選項 B。"}]}}}, {"num": 2, "tag": "unit02", "folder": "生命科學與神經科學領域", "chapter": "第一篇章 ‧ 自然科學與尖端科技", "title": "The Metabolic Engine of Neuroplasticity: NAD+ & Cognitive Longevity", "titleZh": "神經可塑性的代謝引擎與細胞呼吸調控", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (Sec 1–4)", "src": "./audio/Unit02_Full_Section1_to_4.mp3", "qr": "./qr/unit02.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "神經認知衰老與 Sirtuin 生物標誌物臨床試驗報名 (Clinical Trial Screening & Enrollment)", "src": "./audio/Unit02_Section1.mp3", "qr": "./qr/unit02-s1.png", "script": ["Nurse Henderson: Clinical Neuroscience Research Unit, Nurse Henderson speaking. How can I assist you?", "Liam: Hello, I'm calling regarding the volunteer registry for the trial on cognitive resilience and metabolic precursors.", "Nurse Henderson: Ah, the Sirtuin Neuro-Metabolic Trial! We are currently enrolling our autumn cohort. Let me take down your intake information. What is your full name?", "Liam: It's Liam Kavanagh. That's spelled K-A-V-A-N-A-G-H.", "Nurse Henderson: Thank you, Liam. Your system reference code will be NL408-T. That's N-L, four-zero-eight, dash T.", "Liam: Got it. NL408-T.", "Nurse Henderson: And your date of birth?", "Liam: The 22nd of August, 1988.", "Nurse Henderson: Perfect. Now, as part of our initial screening, do you have any chronic medical conditions or history of concussions?", "Liam: None at all. I run marathons and eat clean.", "Nurse Henderson: Excellent. Before being accepted, you must attend an in-person baseline assessment. You'll complete a 45-minute computerized memory test measuring hippocampal retrieval speeds.", "Liam: Memory test, that sounds fine. When would that take place?", "Nurse Henderson: We originally planned sessions for October, but our clinical slots opened early. Can you make Friday the 18th of September?", "Liam: Yes, September 18th is completely open for me.", "Nurse Henderson: Excellent. For the blood draw, please note the fasting protocol. While standard clinical tests ask for an eight-hour fast, our metabolomic mass spectrometry strictly requires twelve hours without food or sugary drinks beforehand. Water is fine.", "Liam: Twelve hours, understood. What does the trial intervention involve?", "Nurse Henderson: Half the cohort receives an active oral capsule containing vitamin precursors known to elevate cellular NAD+, while the other half receives a cellulose placebo.", "Liam: Understood. And the monitoring gear?", "Nurse Henderson: We provide every participant with a wearable smart ring. It tracks nocturnal heart rate variability and deep sleep architecture.", "Liam: A smart ring, brilliant. Do I need to record my meals?", "Nurse Henderson: Yes, you will be prompted to log a brief dietary entry on our mobile app every evening before bed.", "Liam: Understood. Is there compensation for our time?", "Nurse Henderson: We reimburse travel at fifty pounds per hospital visit, and upon successful completion of the eight-week protocol, you will receive a lump-sum honorarium of 450 pounds.", "Liam: That is wonderful. Thank you very much, Nurse Henderson!"], "trans": ["亨德森護理師：臨床神經科學研究部，我是亨德森護理師。請問有什麼我可以協助您的？", "連恩：您好，我打電話是想諮詢關於認知韌性與代謝前驅物臨床試驗的志願者登記事宜。", "亨德森護理師：啊，去乙醯化酶（Sirtuin）神經代謝試驗！我們目前正在招募秋季受試組。讓我為您記錄登記資訊。請問您的全名是？", "連恩：我是連恩・卡瓦納（Liam Kavanagh），拼寫是 K-A-V-A-N-A-G-H。", "亨德森護理師：謝謝連恩。您的系統登錄編號將是 NL408-T。也就是 N-L-4-0-8，破折號 T。", "連恩：記下了，NL408-T。", "亨德森護理師：您的出生年月日是？", "連恩：1988 年 8 月（August）22 日。", "亨德森護理師：太好了。作為初步篩查的一部分，您是否有任何慢性疾病或腦震盪病史？", "連恩：完全沒有。我有跑馬拉松的習慣，飲食也很健康。", "亨德森護理師：太棒了。在正式錄取前，您必須參加一次實體基線評估。您將完成一項 45 分鐘的電腦化記憶（memory）測試，測量海馬迴檢索速度。", "連恩：記憶測試，聽起來沒問題。什麼時候進行呢？", "亨德森護理師：我們原本排在十月，但臨床時段提前開放了。您 9 月（September）18 日週五方便嗎？", "連恩：可以，9 月 18 日我完全有空。", "亨德森護理師：很好。關於抽血，請特別注意禁食規定。雖然一般常規檢查僅要求禁食 8 小時，但我們的代謝組性質譜分析嚴格要求事先禁食整整 12（twelve）小時，不可進食或飲用含糖飲料，白開水除外。", "連恩：12 小時，明白。那試驗干預具體包含什麼？", "亨德森護理師：一半的受試者會服用含有已知能提升細胞 NAD+ 的維生素（vitamin）前驅物口服膠囊，另一半則服用纖維素安慰劑。", "連恩：明白。監測設備呢？", "亨德森護理師：我們會為每位受試者配備一枚穿戴式智慧戒指（ring）。它能追蹤夜間心率變異度與深層睡眠架構。", "連恩：智慧戒指，太棒了。我需要記錄日常飲食嗎？", "亨德森護理師：是的，每天睡前系統會提示您在手機應用程式上填寫一份簡短的飲食（dietary / diet）日誌。", "連恩：明白。參與這項研究有報酬補貼嗎？", "亨德森護理師：我們每次到院回診補貼車馬費 50 英鎊，在順利完成全部 8 週流程後，您將獲得總計 450 英鎊的受試榮譽金。", "連恩：太好了。非常感謝您，亨德森護理師！"], "answers": [{"q_num": "Q1", "answer": "Kavanagh", "clue_analysis": "【原聲定位】'Liam Kavanagh. That's spelled K-A-V-A-N-A-G-H.' 考核標準愛爾蘭/英式姓氏清晰逐字拼寫。"}, {"q_num": "Q2", "answer": "NL408", "clue_analysis": "【原聲定位】'reference code will be NL408-T' 題幹已有 -T，填寫 NL408。"}, {"q_num": "Q3", "answer": "August", "clue_analysis": "【原聲定位】'The 22nd of August, 1988' 題幹已有 22nd 與 1988，填寫 August。"}, {"q_num": "Q4", "answer": "memory", "clue_analysis": "【原聲定位】'computerized memory test measuring hippocampal retrieval' 填寫測試類別 memory。"}, {"q_num": "Q5", "answer": "September", "clue_analysis": "【原聲定位】'Friday the 18th of September' 講者先提及 October，後修正為 18th of September。"}, {"q_num": "Q6", "answer": "12 / twelve", "clue_analysis": "【原聲定位】'strictly requires twelve hours without food' 排除常規 8 小時干擾，填 12 / twelve。"}, {"q_num": "Q7", "answer": "vitamin", "clue_analysis": "【原聲定位】'active oral capsule containing vitamin precursors' 填寫核心成分 vitamin。"}, {"q_num": "Q8", "answer": "ring", "clue_analysis": "【原聲定位】'wearable smart ring' 題幹已有 Wearable smart，填寫 ring。"}, {"q_num": "Q9", "answer": "dietary / diet", "clue_analysis": "【原聲定位】'log a brief dietary entry on our mobile app' 填寫名詞/形容詞修飾語 dietary 或 diet。"}, {"q_num": "Q10", "answer": "450", "clue_analysis": "【原聲定位】'lump-sum honorarium of 450 pounds' 排除單次回診 50 英鎊車馬費，填總額 450。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "突觸影像與神經技術研發中心導覽 (Synaptic Imaging Center Orientation)", "src": "./audio/Unit02_Section2.mp3", "qr": "./qr/unit02-s2.png", "script": ["Clara Hughes: Good afternoon and welcome to the Center for Synaptic Imaging and Neurotechnology. I'm Clara Hughes, Facility Operations Manager.", "Our facility unites biophysicists, neurobiologists, and computer scientists to unravel the metabolic mysteries of brain plasticity. Before we step onto the active floors, let me highlight our flagship neuroimaging instruments.", "In our basement imaging wing, we recently installed a cutting-edge 7-Tesla ultra-high-field MRI scanner. Unlike conventional clinical 3-Tesla scanners, this system provides extraordinary spatial resolution down to half a millimeter. This breakthrough allows our cognitive neuroscientists to resolve individual cortical micro-columns and visualize capillary blood perfusion across distinct layers of the human cortex in real time.", "However, with such magnetic potency comes supreme safety responsibility. The scanner operates in Zone 4, where the fringe field never turns off. Any ferromagnetic item—from a smartwatch to an ordinary steel belt buckle—can be violently pulled into the bore, creating a lethal projectile hazard. That is why everyone must pass through our ferromagnetic detector gates before crossing the threshold.", "Up on the second floor, we house the Transcranial Magnetic Stimulation suite. Here, researchers apply focal magnetic pulses to depolarize targeted neural circuits non-invasively. They investigate how targeted magnetic stimulation can modulate neuroplastic excitability and facilitate motor recovery in stroke survivors.", "Later, we will visit the Cell Metabolism Microscopy Suite. Because we work with sensitive fluorophores and sterile cell lines, all visitors must put on anti-static shoe covers and sanitize hands at the entrance airlock barrier before entering the observation corridor.", "In the unlikely event of an emergency evacuation alarm, please follow the green floor guide-lights. Do not attempt to use the basement exits; instead, proceed directly through the main foyer into the central landscaped courtyard behind the building, where our roll-call coordinator will meet us.", "Now, let's explore our specialized analytical suites on the interactive floor plan.", "First, in Room 108, we have our Mitochondrial Respirometry Suite. Here, automated oxygraph chambers measure the oxygen consumption rates of living neuronal cultures in real time, determining their exact bioenergetic capacity under metabolic stress.", "Next door, in Room 101, is the High-Density EEG Shielded Room. Completely isolated inside a Faraday cage, this lab uses 128 active scalp electrodes to record microsecond electrical wave propagation and gamma-band oscillations across the cerebral cortex.", "Down the hallway in Room 104 is the Multiphoton Laser Laboratory. Using ultrafast near-infrared pulsed lasers, our researchers achieve deep in-vivo optical imaging of individual dendritic spines and synaptic remodeling in living tissue without causing photo-bleaching.", "Further along, in Room 112, we house the Cryo-Electron Microscopy Facility. Operating at liquid nitrogen temperatures, this multi-million-pound instrument captures frozen macromolecular complexes to perform atomic-scale 3D structural reconstruction of mitochondrial respiratory enzymes.", "Finally, in Room 116, you will see the Behavioral Kinematics Arena. This specialized suite utilizes sixteen high-speed infrared motion-capture cameras to track the precise millimeter-scale movements of rodents navigating cognitive spatial memory mazes.", "Please follow me through the security turnstile!"], "trans": ["克拉拉・休斯：大家下午好，歡迎來到突觸影像與神經技術研發中心。我是設施營運經理克拉拉・休斯。", "我們的研發中心匯聚了生物物理學家、神經生物學家與電腦科學家，致力於解開大腦可塑性的代謝之謎。在我們走進運作樓層前，請允許我介紹我們的旗艦神經造影設備。", "在地下造影翼樓，我們近期安裝了一台最尖端的 7 特斯拉超高場 MRI 掃描儀。不同於常規臨床 3 特斯拉系統，該設備提供了小至半毫米的非凡空間解析度。這項突破使我們的認知神經科學家能夠即時解析單個大腦皮層微柱（cortical micro-columns）並直觀觀察人類大腦皮層各層之間的微血管血流灌注。", "然而，如此強大的磁場伴隨著極高的安全責任。該掃描儀在第四管制區（Zone 4）運行，其靜態磁場永不關閉。任何鐵磁性物品——從智慧手錶到普通的鋼製皮帶扣——都可能被劇烈吸入磁體孔徑中，形成致命的拋射物危險（lethal projectile hazard）。這就是為什麼每個人在跨過門檻前都必須通過我們的鐵磁探測門。", "在二樓，我們設有經顱磁刺激（TMS）室。研究人員在此施加聚焦磁脈衝以無創去極化目標神經迴路。他們探討標靶磁刺激如何調控神經可塑性興奮性，並促進中風患者的運動功能恢復。", "稍後我們將參觀細胞代謝顯微鏡室。由於我們處理敏感螢光染劑與無菌細胞株，所有訪客在進入參觀走廊前，必須在入口氣閘處穿上防靜電鞋套並完成雙手消毒（shoe covers and sanitize hands）。", "萬一發生緊急疏散警報，請跟隨地面的綠色指引燈。請勿嘗試使用地下室出口；相反地，請直接穿過主門廳前往建築後方的中央景觀中庭（central landscaped courtyard），我們的點名協調員將在那裡與我們會合。", "現在，讓我們在互動平面圖上探索專業分析實驗室。", "首先在 108 室是線粒體呼吸測定室（Mitochondrial Respirometry Suite）。自動化測氧艙在此即時測量活體神經元培養物的耗氧率（oxygen consumption rates），確定其在代謝壓力下的精確生物能量容量。", "隔壁的 101 室是高導聯 EEG 屏蔽室。這間完全隔離在法拉第籠中的實驗室使用 128 個主動頭皮電極記錄大腦皮層的微秒級電波傳播與伽馬波震盪。", "沿走廊往下的 104 室是多光子雷射實驗室（Multiphoton Laser Laboratory）。研究人員利用超快近紅外脈衝雷射，對活體組織中的單個樹突棘（dendritic spines）與突觸重塑進行深層活體光學造影，且不會造成光漂白。", "再往前走，112 室是冷凍電子顯微鏡設施（Cryo-Electron Microscopy Facility）。這台價值數百萬英鎊的儀器在液氮溫度下運行，捕獲凍結的生物大分子複合物，以對線粒體呼吸鏈酶進行原子級 3D 結構重建（atomic-scale 3D structural reconstruction）。", "最後，在 116 室您將看到行為運動學競技場（Behavioral Kinematics Arena）。該套間利用 16 台高速紅外運動捕捉相機，精確追蹤齧齒動物在空間記憶迷宮中導航的毫米級運動軌跡。", "請隨我通過安全旋轉閘門！"], "answers": [{"q_num": "Q11", "answer": "B", "clue_analysis": "【原聲定位】'resolve individual cortical micro-columns and visualize capillary blood perfusion... in real time' 考查 7-Tesla 空間解析度突破，選 B。"}, {"q_num": "Q12", "answer": "A", "clue_analysis": "【原聲定位】'violently pulled into the bore, creating a lethal projectile hazard' 強磁場吸附金屬形成拋射物危險，選 A。"}, {"q_num": "Q13", "answer": "A", "clue_analysis": "【原聲定位】'modulate neuroplastic excitability and facilitate motor recovery' 經顱磁刺激調控神經可塑性，選 A。"}, {"q_num": "Q14", "answer": "B", "clue_analysis": "【原聲定位】'put on anti-static shoe covers and sanitize hands at the entrance airlock' 進氣閘穿鞋套洗手，選 B。"}, {"q_num": "Q15", "answer": "B", "clue_analysis": "【原聲定位】'proceed directly through the main foyer into the central landscaped courtyard' 疏散集結於主大廳後方中庭，選 B。"}, {"q_num": "Q16", "answer": "C", "clue_analysis": "【原聲定位】'Room 108... Mitochondrial Respirometry Suite... measure the oxygen consumption rates' 耗氧率測定對應 108 室（C）。"}, {"q_num": "Q17", "answer": "A", "clue_analysis": "【原聲定位】'Room 101... High-Density EEG... 128 active scalp electrodes record microsecond electrical wave' 高導聯腦電對應 101 室（A）。"}, {"q_num": "Q18", "answer": "B", "clue_analysis": "【原聲定位】'Room 104... Multiphoton Laser... deep in-vivo optical imaging of individual dendritic spines' 樹突棘雷射造影對應 104 室（B）。"}, {"q_num": "Q19", "answer": "D", "clue_analysis": "【原聲定位】'Room 112... Cryo-EM... atomic-scale 3D structural reconstruction of mitochondrial respiratory enzymes' 原子級結構對應冷凍電鏡 112 室（D）。"}, {"q_num": "Q20", "answer": "E", "clue_analysis": "【原聲定位】'Room 116... Behavioral Kinematics Arena... track movements in cognitive spatial memory mazes' 行為迷宮追蹤對應 116 室（E）。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "海馬迴突觸可塑性與線粒體生物能量學導師研討 (Tutorial on Synaptic Plasticity & Bioenergetics)", "src": "./audio/Unit02_Section3.mp3", "qr": "./qr/unit02-s3.png", "script": ["Prof. Harrison: Good morning, Sophie, Daniel. Come in. I've examined your experimental protocol for probing Sirtuin-1 activation and hippocampal synaptic plasticity. You've outlined a rigorous line of inquiry.", "Sophie: Thank you, Professor. We're eager to demonstrate that elevating intracellular NAD+ directly preserves long-term potentiation.", "Prof. Harrison: It's an attractive hypothesis. However, I must urge caution. The central physiological roadblock you've overlooked is the blood-brain barrier. Oral NAD+ precursors are large polar molecules; without specific active peptide transporters, very little intact compound crosses the vascular endothelium into cerebral parenchyma.", "Daniel: We considered that. That's why in our updated animal cohort, we propose utilizing specialized lipid nanoparticle carriers.", "Prof. Harrison: Good. That addresses the delivery hurdle. Now, Daniel, what about your electrophysiological measurements?", "Daniel: I encountered an unexpected anomaly during pilot patch-clamp recordings. High-frequency electrical stimulation trains intended to induce LTP caused localized tissue hypoxia within the core of our acute hippocampal slices.", "Prof. Harrison: That's a classic artifact when slice perfusion rates are inadequate. You must increase the carbogen bubble flow in the bath reservoir to maintain 95% oxygen saturation.", "Sophie: We will adjust the perfusion manifold immediately. Professor, regarding mitochondrial structural dynamics, should we quantify fission and fusion via Western blotting?", "Prof. Harrison: Western blots only give static protein abundance. I strongly recommend transfecting your neuronal cultures with dual-color fluorescent mitochondrial markers. That will allow you to track morphological transitions under live confocal microscopy.", "Sophie: That will provide much richer spatial data.", "Daniel: And regarding our ATP bioluminescence data, we were astonished to observe that synaptic terminals sustained ATP output significantly longer than soma cell bodies during simulated glucose deprivation.", "Prof. Harrison: Fascinating! That suggests synaptic mitochondria possess localized bioenergetic autonomy, possibly mediated by local Sirtuin-3 deacetylation.", "Sophie: That finding will be the centerpiece of our symposium grant proposal.", "Prof. Harrison: If you want that grant funded, make sure you emphasize its translational relevance to early-stage Alzheimer's and cognitive decline. Reviewers want to see clear clinical implications.", "Daniel: We will frame the entire introduction around neurodegenerative intervention.", "Prof. Harrison: Excellent. Now, let's distribute the laboratory duties for the upcoming fortnight.", "Sophie: For the tissue preparation, I'll take charge of harvesting the acute hippocampal slices and calibrating the vibroslice microtome. I have the surgical protocol perfected.", "Daniel: Thanks, Sophie. While you're sectioning, I'll run the Western blot electrophoretic assays to quantify PGC-1alpha expression levels.", "Prof. Harrison: And the live-cell confocal imaging? The deconvolution algorithms can be tricky.", "Sophie: Daniel and I agreed to handle the confocal deconvolution collaboratively on Friday evenings.", "Daniel: Yes, we'll process the fluorescence image stacks together. That leaves the electrophysiology data.", "Daniel: I'll write the Python scripts to automate spike train sorting and synaptic latency calculations from the raw electrophysiological traces.", "Sophie: And I'll take care of submitting the institutional biohazard safety compliance and animal ethics renewal form before the end of the week.", "Prof. Harrison: Outstanding plan. Let's reconvene once the first batch of slices has been recorded."], "trans": ["哈里森教授：早安，蘇菲、丹尼爾。請進。我審閱了你們探討 Sirtuin-1 活化與海馬迴突觸可塑性的實驗方案。你們構思了一條非常嚴謹的研究路徑。", "蘇菲：謝謝教授。我們迫不及待想證明提升細胞內 NAD+ 能直接維持長時程增益（LTP）。", "哈里森教授：這是一個吸引人的假說。然而，我必須提醒你們保持謹慎。你們忽略的核心生理障礙是血腦屏障（blood-brain barrier）。口服 NAD+ 前驅物屬於極性大分子；如果沒有特定的主動肽轉運載體，很少有完整的化合物能穿透血管內皮進入大腦實質。", "丹尼爾：我們考慮過這一點。這就是為什麼在我們更新的動物隊列中，我們提議使用專門的脂質奈米顆粒載體。", "哈里森教授：很好。這解決了遞送障礙。那麼丹尼爾，你的電生理測量進展如何？", "丹尼爾：我在預試驗膜片鉗（patch-clamp）記錄中遇到了一個意外異常。旨在誘導 LTP 的高頻電刺激序列在我們離體海馬迴腦片的核心區域引發了局部組織缺氧（localized tissue hypoxia）。", "哈里森教授：當腦片灌流速度不足時，這是典型的實驗人為誤差。你們必須加大浴槽儲液罐中的碳氧混合氣鼓泡流量，以維持 95% 的氧飽和度。", "蘇菲：我們立即調整灌流管道。教授，關於線粒體結構動態，我們應該透過蛋白質印跡（Western blot）來量化分裂與融合嗎？", "哈里森教授：Western blot 只能提供靜態的蛋白質豐度。我強烈建議用雙色螢光線粒體標記物轉染神經元培養物（transfecting with dual-color fluorescent markers）。這將允許你們在活體共軛焦顯微鏡下追蹤形態轉變。", "蘇菲：這將提供豐富得多的空間數據。", "丹尼爾：關於我們的 ATP 生物發光數據，我們驚訝地觀察到，在模擬葡萄糖剝奪期間，突觸終末維持 ATP 輸出的時間顯著長於神經元胞體（synaptic terminals maintained ATP output longer than soma）。", "哈里森教授：太引人入勝了！這表明突觸線粒體具備局部生物能量自主性，可能由局部的 Sirtuin-3 去乙醯化所介導。", "蘇菲：這一發現將成為我們研討會研究基金申請書的核心亮點。", "哈里森教授：如果你們想讓那筆資助過審，請務必強調其對阿茲海默症早期干預的轉化醫學價值（translational relevance to early-stage Alzheimer's）。評審專家希望看到明確的臨床意義。", "丹尼爾：我們將圍繞神經退化性疾病干預來構建整個引言。", "哈里森教授：太好了。現在讓我們分配未來兩週的實驗室工作。", "蘇菲：關於組織製備，我負責獲取離體海馬迴腦片並校準微型切片機的震動頻率。我已經把手術流程完善了。", "丹尼爾：謝謝蘇菲。在你切片時，我負責執行 Western blot 電泳分析，以量化 PGC-1alpha 的轉錄表達水平。", "哈里森教授：那活體共軛焦顯微造影呢？反褶積（deconvolution）演算法可能相當棘手。", "蘇菲：丹尼爾和我商定在週五晚上協同處理（handle collaboratively）共軛焦反褶積。", "丹尼爾：是的，我們一起處理螢光影像堆疊。那剩下電生理數據。", "丹尼爾：我來撰寫 Python 腳本，從原始電生理信號中自動化進行突觸發放序列分選（spike train sorting）與突觸潛伏期計算。", "蘇菲：而我負責在週末前提交機構生物危害安全合規與動物倫理展延申請表。", "哈里森教授：非常出色的計劃。等第一批腦片記錄完成後我們再開會討論。"], "answers": [{"q_num": "Q21", "answer": "A", "clue_analysis": "【原聲定位】'central physiological roadblock... is the blood-brain barrier... very little intact compound crosses' 導師提醒血腦屏障穿透困難，選 A。"}, {"q_num": "Q22", "answer": "B", "clue_analysis": "【原聲定位】'high-frequency stimulation trains... caused localized tissue hypoxia within the core of acute slices' 高頻電刺激導致腦片局部缺氧，選 B。"}, {"q_num": "Q23", "answer": "A", "clue_analysis": "【原聲定位】'transfecting your neuronal cultures with dual-color fluorescent mitochondrial markers' 雙色螢光標記動態追蹤，選 A。"}, {"q_num": "Q24", "answer": "B", "clue_analysis": "【原聲定位】'synaptic terminals sustained ATP output significantly longer than soma cell bodies' 突觸終末在缺糖時維持能量時間長於胞體，選 B。"}, {"q_num": "Q25", "answer": "A", "clue_analysis": "【原聲定位】'emphasize its translational relevance to early-stage Alzheimer's and cognitive decline' 強調早期阿茲海默症臨床轉化價值，選 A。"}, {"q_num": "Q26", "answer": "A", "clue_analysis": "【原聲定位】Sophie: 'I'll take charge of harvesting the acute hippocampal slices and calibrating the vibroslice' 蘇菲負責腦片製備切片，選 A。"}, {"q_num": "Q27", "answer": "B", "clue_analysis": "【原聲定位】Daniel: 'I'll run the Western blot electrophoretic assays to quantify PGC-1alpha' 丹尼爾負責蛋白印跡電泳，選 B。"}, {"q_num": "Q28", "answer": "C", "clue_analysis": "【原聲定位】Sophie: 'Daniel and I agreed to handle the confocal deconvolution collaboratively' 兩人共同處理共軛焦反褶積，選 C。"}, {"q_num": "Q29", "answer": "B", "clue_analysis": "【原聲定位】Daniel: 'I'll write the Python scripts to automate spike train sorting' 丹尼爾編寫神經放電分選腳本，選 B。"}, {"q_num": "Q30", "answer": "A", "clue_analysis": "【原聲定位】Sophie: 'I'll take care of submitting the institutional biohazard safety compliance and animal ethics' 蘇菲負責安全倫理表單，選 A。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Metabolic Engine of Neuroplasticity: Cellular Respiration, Sirtuin Activation, and Cognitive Longevity", "src": "./audio/Unit02_Section4.mp3", "qr": "./qr/unit02-s4.png", "script": ["▶ Section 1  ‧  Dismantling Neurological Determinism", "Section 1  Good morning. In today's seminar on molecular neuroscience and cellular bioenergetics, we will explore one of the most transformative paradigms in modern brain physiology: the metabolic foundation of neuroplasticity. Throughout much of the twentieth century, clinical neurology operated under a rigid dogma known as neurological determinism. This model held that the adult mammalian brain was a fixed, post-mitotic structure, incapable of structural remodeling or generating new neurons after early development. Over the past three decades, however, neuroimaging and electrophysiological breakthroughs have definitively dismantled this assumption. The adult brain possesses enduring structural and functional plasticity—the capacity to forge new synaptic connections, prune inefficient pathways, and even generate nascent neurons in the dentate gyrus. Yet, what recent research reveals is that neuroplasticity is not an autonomous electrical phenomenon; rather, it is strictly bounded by the metabolic capacity of neural cells.", "▶ Section 2  ‧  Mitochondrial Energetics and the NAD+ Coenzyme", "Section 2  The central processing unit of cellular bioenergetics is the mitochondrion. Within our neurons, which consume roughly twenty percent of systemic resting metabolic energy, mitochondria continuously generate adenosine triphosphate, or ATP, through oxidative phosphorylation. Crucial to this electron transport chain is a vital coenzyme: Nicotinamide Adenine Dinucleotide, universally abbreviated as NAD+. In its oxidized form, NAD+ acts as an indispensable electron acceptor, facilitating the enzymatic breakdown of glucose into usable biological energy. However, NAD+ is far more than a passive metabolic fuel carrier; it also functions as an acute biosensor of cellular stress. When energetic supplies plummet or cellular damage accumulates, intracellular NAD+ ratios fluctuate dramatically, sending rapid biochemical signals to the nucleus.", "▶ Section 3  ‧  The Sirtuin-BDNF Axis and Epigenetic Repair", "Section 3  The primary enzymatic sensors of NAD+ availability are a family of evolutionary conserved proteins known as sirtuins, particularly SIRT1 and SIRT3. Sirtuins function as NAD+-dependent deacetylases. When cellular NAD+ concentrations are robust, sirtuins activate to remove acetyl groups from target histones, effectively orchestrating epigenetic gene expression. Among their vital downstream targets is Brain-Derived Neurotrophic Factor, or BDNF. BDNF is often described as molecular fertilizer for the brain; it promotes synaptogenesis, reinforces dendritic branching, and bolsters axonal myelination. Without sufficient intracellular NAD+, sirtuins remain biochemically dormant, halting BDNF transcription and causing synaptic connectivity to atrophy.", "The Metabolic Engine of Neuroplasticity: Cellular Respiration, Sirtuin Activation, and Cognitive Longevity (Continued)", "▶ Section 4  ‧  Hormetic Stressors and Endogenous Upregulation", "Section 4  This brings us to a compelling clinical question: can we endogenously upregulate this metabolic repair pathway? The answer lies in the biological principle of hormesis. Hormesis describes a physiological response where brief, sub-lethal environmental stressors provoke an adaptive overcompensation that strengthens cellular resilience. For instance, protocol-driven intermittent fasting temporarily depletes glycogen stores and stresses cellular energy balances, which paradoxically triggers a sharp compensatory surge in NAD+ biosynthesis and autophagy. Similarly, intense aerobic exercise and deliberate cold thermogenesis activate metabolic pathways like AMPK and PGC-1alpha, stimulating mitochondrial biogenesis. These intermittent biological challenges train neural networks to withstand future ischemic and oxidative insults.", "▶ Section 5  ‧  Clinical Implications and Cognitive Longevity", "Section 5  The translational ramifications of this metabolic paradigm for human healthspan are profound. Age-related neurodegenerative pathologies, such as Alzheimer's and Parkinson's disease, are increasingly understood not merely as protein misfolding anomalies, but as profound mitochondrial energy crises. When neural bioenergetics falter, neurons can no longer sustain synaptic repair or clear toxic aggregates, leading to progressive cognitive decline. By contrast, maintaining cellular metabolic reserve through targeted nutritional, behavioral, and pharmacological interventions reinforces cognitive reserve. In summary, neuroplasticity is fundamentally an energetic enterprise. If we support the underlying mitochondrial engine, the brain retains an astonishing capacity for structural rejuvenation across the human lifespan."], "trans": ["Section 1  大家早安。在今天的分子神經科學與細胞生物能量學研討會中，我們將探討現代大腦生理學中最具變革性的範式之一：神經可塑性的代謝基礎。在整個二十世紀的大部分時間裡，臨床神經學都受到一種名為「神經決定論」的僵化教條支配。該模型認為，成年哺乳動物的大腦是一個固定不變、有絲分裂後停止分裂的結構，在早期發育完成後便無法重塑結構或生成新的神經元。然而在過去三十年間，神經影像學與電生理學的突破徹底瓦解了這項假設。成年大腦具有持久的結構與功能可塑性——具備建立新突觸連結、修剪無效路徑，甚至在海馬迴齒狀回中生成新生神經元的能力。然而最新研究揭示，神經可塑性並非純粹自主的電訊號現象；相反地，它嚴格受到神經細胞代謝能力的約束。", "Section 2  細胞生物能量學的核心處理單元是線粒體（粒線體）。在大腦神經元中——它消耗了人體大約百分之二十的全身靜息代謝能量——線粒體透過氧化磷酸化持續產生三磷酸腺苷（ATP）。在這一電子傳遞鏈中，關鍵在於一種不可或缺的輔酶：菸鹼醯胺腺嘌呤二核苷酸（NAD+）。在其氧化型態下，NAD+ 作為不可替代的電子受體，促進葡萄糖分解為可用的生物能量。然而，NAD+ 遠非僅僅是被動的代謝燃料載體；它還兼具細胞壓力的敏銳生物傳感器功能。當能量供應驟降或細胞損傷累積時，細胞內 NAD+ 比率會劇烈波動，向細胞核發出快速的生化信號。", "Section 3  NAD+ 可用性的主要酵素感測器是一組在演化上高度保守的蛋白質家族，稱為去乙醯化酶（sirtuins），特別是 SIRT1 和 SIRT3。Sirtuins 作為 NAD+ 依賴型的去乙醯化酶運作。當細胞內 NAD+ 濃度充沛時，去乙醯化酶被活化，從目標組織蛋白中移除乙醯基，從而精準協調表觀遺傳基因表現。在它們的重要下游目標中，包括了腦源性神經營養因子（BDNF）。BDNF 常被形容為大腦的分子肥料；它能促進突觸生成、增強樹突分支，並強化神經軸突髓鞘的完整性。若缺乏足夠的細胞內 NAD+，去乙醯化酶將維持生化休眠狀態，導致 BDNF 轉錄停滯，最終造成突觸連結萎縮。", "Section 4  這引出了一個引人深思的臨床問題：我們能否經由人體內源性途徑上調這條代謝修復網絡？答案在於「毒物興奮效應（hormesis）」這一生物學原理。Hormesis 描述了一種生理適應反應：短暫、亞致死劑量的環境壓力源會激發超額補償機制，進而強化細胞韌性。例如，規律執行的間歇性斷食會暫時耗盡肝醣儲備並挑戰細胞能量平衡，這反而出人意料地引發 NAD+ 生物合成與細胞自噬作用的代償性暴增。同樣地，高強度有氧運動與刻意的冷水暴露會活化 AMPK 和 PGC-1alpha 等代謝通路，促進線粒體新生。這些間歇性的生物挑戰訓練了神經網絡，使其能抵禦未來的缺血與氧化損傷。", "Section 5  這種代謝範式對於延長人類健康壽命具有深遠的轉化醫學意義。阿茲海默症與帕金森氏症等年齡相關的神經退化性疾病，越來越常被理解為不僅僅是蛋白質錯誤摺疊的異常，而是深刻的線粒體能量危機。當神經生物能量崩潰時，神經元便無法維持突觸修復或清除毒性蛋白聚集體，導致漸進式的認知衰退。相反地，透過精準的營養、行為與藥理介入來維持細胞代謝儲備，能直接強化認知儲備。總結而言，神經可塑性本質上是一項高耗能的生物工程。如果我們全力支撐其底層的線粒體引擎，大腦在整個人類生命週期中都將保留驚人的結構重塑與復原潛力。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. synaptic plasticity  【原聲定位】Section 1: 'The adult brain possesses enduring structural and functional plasticity—the capacity to forge new synaptic connections...' 【解析】考查神經生物學核心概念，填入 synaptic plasticity 或 plasticity。"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. ATP / adenosine triphosphate  【原聲定位】Section 2: 'mitochondria continuously generate adenosine triphosphate, or ATP, through oxidative phosphorylation.' 【解析】聽取能量分子名詞，填寫 ATP 或全稱均可。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. sirtuins  【原聲定位】Section 3: 'The primary enzymatic sensors of NAD+ availability are a family of evolutionary conserved proteins known as sirtuins...' 【解析】由路標詞 'known as' 精準鎖定專有名詞複數 sirtuins。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. BDNF  【原聲定位】Section 3: 'Among their vital downstream targets is Brain-Derived Neurotrophic Factor, or BDNF. BDNF is often described as molecular fertilizer...' 【解析】題幹 'acts like fertilizer' 對應原聲明喻，答案為縮寫 BDNF。"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. intermittent fasting  【原聲定位】Section 4: 'For instance, protocol-driven intermittent fasting temporarily depletes glycogen stores...' 【解析】考查健康生活型態術語，填入名詞片語 intermittent fasting。"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. cognitive reserve  【原聲定位】Section 5: 'reinforces cognitive reserve. In summary, neuroplasticity is fundamentally an energetic enterprise.' 【解析】題幹 'directly enhances a person's (36) ____________' 精準對應 原文 'reinforces cognitive reserve'。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 2: 'it also functions as an acute biosensor of cellular stress. When energetic supplies plummet... sending rapid biochemical signals...' 【解析】原聲明確提及 NAD+ 作為 biosensor 反應壓力，對應選項 B。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. A  【原聲定位】Section 4: 'Hormesis describes a physiological response where brief, sub-lethal environmental stressors provoke an adaptive overcompensation that strengthens cellular resilience.' 【解析】良性微壓力刺激適應性防禦，精準對應選項 A。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. A  【原聲定位】Section 3: 'Without sufficient intracellular NAD+, sirtuins remain biochemically dormant, halting BDNF transcription...' 【解析】NAD+ 不足導致去乙醯化酶休眠與 BDNF 轉錄停擺，對應選項 A。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. B  【原聲定位】Section 5: 'Age-related neurodegenerative pathologies... are increasingly understood not merely as protein misfolding anomalies, but as profound mitochondrial energy crises.' 【解析】總結指出神經退化疾病根源於生物能量與線粒體缺失，對應選項 B。"}]}}}, {"num": 3, "tag": "unit03", "folder": "硬核科技與系統工程領域", "chapter": "第一篇章 ‧ 自然科學與尖端科技", "title": "The Silicon Synapse: Neuromorphic Computing & Memristive Networks", "titleZh": "神經形態運算、憶阻器交叉陣列與異步事件驅動架構", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (Sec 1–4)", "src": "./audio/Unit03_Full_Section1_to_4.mp3", "qr": "./qr/unit03.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "全國神經形態機器人與邊緣 AI 黑客松報名登記 (Neuromorphic Hackathon Registration)", "src": "./audio/Unit03_Section1.mp3", "qr": "./qr/unit03-s1.png", "script": ["Sandra: Edge AI Innovation Secretariat, Sandra speaking. How can I assist you?", "Ethan: Hello! I'm calling to register our university engineering squad for the National Neuromorphic Robotics Hackathon.", "Sandra: Wonderful! The neuromorphic challenge is our premier hardware event. Let's complete your team profile. What is your surname, Ethan?", "Ethan: It's Vanderbilt. That's V-A-N-D-E-R-B-I-L-T.", "Sandra: Thank you. And your primary contact email address?", "Ethan: It's e dot vander92 at ic dot ac dot uk. That's V-A-N-D-E-R 9 2.", "Sandra: Perfect. How many students are on your team roster?", "Ethan: Well, we initially had five members signed up, but our mechanical engineer had a thesis conflict, so our active roster is down to four students.", "Sandra: Four students is actually the ideal team size. Now, which specialized hardware track are you entering?", "Ethan: We are selecting the neuromorphic vision processor kit, using asynchronous dynamic event sensors.", "Sandra: Excellent choice. And what is your intended challenge application?", "Ethan: We're designing an ultra-low-latency system for high-speed gesture recognition in assistive surgical robotics.", "Sandra: Gesture recognition, fascinating. Please remember the edge challenge rules: while generic embedded systems allow up to 500 milliwatts, the neuromorphic track strictly caps total board dissipation at 250 milliwatts.", "Ethan: We are targeting under 180, so 250 gives us sufficient headroom. When do we collect our physical development board?", "Sandra: Dev kits will be distributed on Thursday the 15th of October at our hardware desk.", "Ethan: October 15th, noted. Is there an in-person briefing?", "Sandra: Yes, the mandatory orientation workshop takes place in Lab Building C, Room 302, starting at 10:00 AM.", "Ethan: Lab Building C. And how should our final codebase be delivered?", "Sandra: You must submit your model weights and source files via a public GitHub repository by midnight on Sunday.", "Ethan: GitHub, understood. What is the entry fee?", "Sandra: Standard corporate teams pay 300 pounds, but accredited university student teams pay the subsidized student rate of 120 pounds.", "Ethan: Brilliant! Thank you so much, Sandra."], "trans": ["珊卓：邊緣 AI 創新秘書處，我是珊卓。請問有什麼我可以協助您的？", "伊森：您好！我打電話是想為我們大學工程隊報名參加全國神經形態機器人黑客松。", "珊卓：太好了！神經形態競賽是我們的旗艦硬體賽事。讓我們來完成您的團隊檔案。請問您的姓氏是，伊森？", "伊森：范德比爾特（Vanderbilt），拼寫是 V-A-N-D-E-R-B-I-L-T。", "珊卓：謝謝您。請問您的主要聯絡電子信箱是？", "伊森：是 e.vander92@ic.ac.uk，也就是 V-A-N-D-E-R 92。", "珊卓：很好。請問您的團隊名冊上有幾名成員？", "伊森：嗯，我們最初有五個人報名，但我們的機械工程師因論文時程衝突退出，所以目前正式名單確定為四（four）名學生。", "珊卓：四名成員實際上是最理想的規模。那麼，你們要報名哪一個專案硬體賽道？", "伊森：我們選擇神經形態視覺（vision）處理器套件，使用異步動態事件感測器。", "珊卓：極佳的選擇。你們預計開發的競賽應用是什麼？", "伊森：我們正在為輔助外科手術機器人設計一套超低延遲的高速手勢辨識（recognition）系統。", "珊卓：手勢辨識，聽起來很前沿。請特別注意邊緣挑戰賽的規則：一般嵌入式系統允許高達 500 毫瓦，但神經形態賽道嚴格將整板總耗電量限制在 250 毫瓦以下。", "伊森：我們的目標是壓在 180 毫瓦以內，所以 250 毫瓦給了我們充分的餘量。我們什麼時候可以領取實體開發板？", "珊卓：開發套件將於 10 月（October）15 日週四在我們的硬體服務台發放。", "伊森：10 月 15 日，記下了。有實體說明會嗎？", "珊卓：有的，強制參加的培訓工作坊將在實驗大樓 C（Building C）的 302 室舉行，上午 10:00 開始。", "伊森：實驗大樓 C。那我們的最終程式碼應該如何提交？", "珊卓：您必須在週日午夜前透過一個公開的 GitHub 倉庫提交您的模型權重與原始碼檔案。", "伊森：GitHub，明白。報名費用是多少？", "珊卓：一般企業團隊為 300 英鎊，但經認證的大學學生團隊享有補貼優惠，只需 120 英鎊。", "伊森：太棒了！非常感謝您，珊卓。"], "answers": [{"q_num": "Q1", "answer": "Vanderbilt", "clue_analysis": "【原聲定位】'Vanderbilt. That's V-A-N-D-E-R-B-I-L-T.' 考查英文字母清晰逐字拼寫。"}, {"q_num": "Q2", "answer": "vander92", "clue_analysis": "【原聲定位】'e dot vander92 at ic dot ac dot uk' 題幹已有 e. 與 @ic.ac.uk，填 vander92。"}, {"q_num": "Q3", "answer": "4 / four", "clue_analysis": "【原聲定位】'initially had five... active roster is down to four' 排除五人干擾，填 4 / four。"}, {"q_num": "Q4", "answer": "vision", "clue_analysis": "【原聲定位】'neuromorphic vision processor kit' 題幹已有 Neuromorphic 與 processor kit，填 vision。"}, {"q_num": "Q5", "answer": "recognition", "clue_analysis": "【原聲定位】'gesture recognition in assistive surgical robotics' 填寫核心名詞 recognition。"}, {"q_num": "Q6", "answer": "250", "clue_analysis": "【原聲定位】'strictly caps total board dissipation at 250 milliwatts' 排除 500 與 180，填 250。"}, {"q_num": "Q7", "answer": "October", "clue_analysis": "【原聲定位】'15th of October at our hardware desk' 題幹已有 15th，填寫 October。"}, {"q_num": "Q8", "answer": "C", "clue_analysis": "【原聲定位】'takes place in Lab Building C, Room 302' 題幹已有 Lab Building，填寫 C。"}, {"q_num": "Q9", "answer": "GitHub", "clue_analysis": "【原聲定位】'via a public GitHub repository' 填寫專有名詞 GitHub。"}, {"q_num": "Q10", "answer": "120", "clue_analysis": "【原聲定位】'subsidized student rate of 120 pounds' 排除企業組 300 鎊，填 120。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "憶阻器奈米無塵室與微系統無塵實驗室導覽 (Memristor Cleanroom Facility Tour)", "src": "./audio/Unit03_Section2.mp3", "qr": "./qr/unit03-s2.png", "script": ["Robert Evans: Good morning, engineering interns. I'm Robert Evans, Senior Fab Manager here at the Advanced Neuromorphic Cleanroom Facility.", "Before we gown up to enter our ISO Class 4 environment, let me review the fundamental operational rules and cleanroom physics. You might notice the hum of our air handlers. Our entire facility maintains positive static air pressure relative to the external corridors. This ensures that whenever an airlock opens, clean air rushes outwards, actively preventing airborne dust particles and lint from contaminating our silicon wafers.", "Inside Bay 3, you will witness the fabrication of our flagship analog memristive crossbar arrays. What makes these nanoscale arrays revolutionary is in-memory computing. Unlike traditional von Neumann processors that constantly shuttle bits between memory chips and arithmetic logic units, our memristor crossbars execute multiply-accumulate matrix algebra directly inside the non-volatile memory cells themselves, slashing energy consumption by ninety-nine percent.", "Maintaining pristine cleanroom air requires strict personal discipline. While wire-rimmed prescription glasses are permitted, cosmetics, face powder, and aerosol deodorants are strictly barred from the facility, as shed particulate minerals destroy sub-micron gate oxides.", "Safety in our chemical handling zones is paramount. In the Chemical Etch Bay, we maintain automated sensors for hydrofluoric acid vapor. If a toxic vapor leak occurs, an automated yellow strobe activates, accompanied by high-velocity exhaust extraction.", "In the event of a major facility fire alarm or structural emergency, please remember our cardinal life-safety rule: do not waste precious seconds un-gowning or stripping off your bunny suits in the airlock. Evacuate immediately through the emergency break-glass crash doors straight to the tarmac muster point.", "Now, let's trace the wafer manufacturing pathway across our seven specialized bays.", "In Bay 2, you'll see our Atomic Layer Deposition systems, or ALD. Here, pulsed precursor gases deposit hafnium oxide dielectric switching films with monolayer, atomic-level precision.", "Directly opposite, in Bay 1, we conduct Deep Ultraviolet Photolithography. Using 193-nanometer immersion optics, our steppers achieve sub-twenty-nanometer circuit patterning on photoresist-coated wafers.", "Next, we move into Bay 4 for High-Vacuum Metallization. Using argon magnetron sputtering targets, our technicians deposit inert platinum top electrodes and titanium adhesion layers across the etched oxide vias.", "Further down, in Bay 6, we house our Cryogenic Probe Station and Metrology Suite. Using sub-micron tungsten probes, our electrical engineers measure current-voltage analog hysteresis loops and conductance tuning states across thousands of nanoscale memristors simultaneously.", "Finally, in Bay 5, completed wafers undergo Automated Wafer Dicing and Wire Bonding, where high-speed diamond saws isolate individual silicon chips before robotic gold wire-bonders package them into ceramic carrier sockets.", "Let's enter the gowning airlock and put on our suits!"], "trans": ["羅伯特・埃文斯：大家早安，工程實習生們。我是羅伯特・埃文斯，先進神經形態無塵室設施的高級晶圓廠經理。", "在我們穿上無塵服進入 ISO 4 級環境之前，請允許我複習基本運作規則與無塵室物理原理。你們可能會注意到空氣處理機組的嗡鳴聲。我們的整座設施相對於外部走廊保持靜態正壓（positive static air pressure）。這確保了每當氣閘門開啟時，潔淨空氣總是向外湧出，主動防止空氣中的粉塵顆粒和纖維進入並污染我們的矽晶圓。", "在 3 號隔間，你們將親眼見證我們旗艦類比憶阻器交叉陣列（memristive crossbar arrays）的製造。這些奈米級陣列之所以具有革命性，在於其記憶體內運算（in-memory computing）能力。傳統馮紐曼處理器在記憶體晶片與算術邏輯單元之間頻繁搬運數據，而我們的憶阻器交叉陣列直接在非揮發性記憶體單元內部執行乘加矩陣運算（multiply-accumulate matrix algebra directly inside memory cells），將能耗降低了 99%。", "維持無塵室的原始潔淨度需要嚴格的個人自律。雖然允許佩戴金屬邊框處方眼鏡，但化妝品、蜜粉和噴霧止汗劑嚴禁攜入設施（cosmetics, face powder strictly barred），因為脫落的礦物微粒會徹底破壞亞微米閘極氧化層。", "化學品處理區的安全至關重要。在化學蝕刻隔間，我們設有氫氟酸蒸氣自動感測器。如果發生有毒蒸氣外洩，黃色警告頻閃燈會自動啟動，並配合高速排風系統全力排氣。", "萬一發生重大設施火警或結構緊急狀況，請記住我們的首要生命安全法則：切勿在氣閘更衣室浪費寶貴時間脫掉無塵服（do not waste seconds un-gowning）。請立即穿過防碎玻璃緊急推拉門直奔停機坪集合點。", "現在，讓我們在七個專業隔間中追蹤晶圓製造路徑。", "在 2 號隔間，你們將看到原子層沉積（ALD）系統。在此，脈衝前驅氣體以單分子層、原子級精度沉積氧化鉿（hafnium oxide）介電開關薄膜。", "正對面的 1 號隔間是深紫外光刻（DUV Photolithography）。我們的步進光刻機採用 193 奈米浸潤式光學元件，在塗有光阻的晶圓上實現 20 奈米以下的電路圖形轉印（193-nm immersion optics patterning）。", "接下來，我們進入 4 號隔間的高真空金屬化區。技術人員利用氬氣磁控濺鍍靶材，在蝕刻後的氧化物通孔上沉積惰性鉑頂部電極（platinum top electrodes）與鈦附著層。", "再往下走，6 號隔間是低溫探針台與計量室（Cryogenic Probe Station & Metrology）。電氣工程師利用亞微米鎢探針，同時測量數千個奈米憶阻器的電流-電壓類比遲滯回線（current-voltage analog hysteresis）與電導調節狀態。", "最後，在 5 號隔間，完成的晶圓進行自動晶圓切割與打線封裝（Automated Wafer Dicing & Wire Bonding），高速鑽石鋸在此分離單個矽晶片（diamond saw isolation），隨後由自動化金線打線機將其封裝至陶瓷插座中。", "讓我們進入更衣氣閘並穿上無塵服吧！"], "answers": [{"q_num": "Q11", "answer": "A", "clue_analysis": "【原聲定位】'maintains positive static air pressure... preventing airborne dust particles from contaminating wafers' 考查正壓防塵原理，選 A。"}, {"q_num": "Q12", "answer": "B", "clue_analysis": "【原聲定位】'execute multiply-accumulate matrix algebra directly inside the non-volatile memory cells' 記憶體內運算，選 B。"}, {"q_num": "Q13", "answer": "B", "clue_analysis": "【原聲定位】'cosmetics, face powder, and aerosol deodorants are strictly barred' 嚴禁化妝品與噴霧，選 B。"}, {"q_num": "Q14", "answer": "A", "clue_analysis": "【原聲定位】'sensors for hydrofluoric acid vapor... automated yellow strobe activates' 氫氟酸蒸氣外洩警報，選 A。"}, {"q_num": "Q15", "answer": "B", "clue_analysis": "【原聲定位】'do not waste seconds un-gowning... Evacuate immediately through emergency break-glass doors' 疏散無需脫服直接撤離，選 B。"}, {"q_num": "Q16", "answer": "B", "clue_analysis": "【原聲定位】'Bay 2... Atomic Layer Deposition (ALD)... deposit hafnium oxide films with atomic-level precision' 原子層沉積對應 2 號隔間（B）。"}, {"q_num": "Q17", "answer": "A", "clue_analysis": "【原聲定位】'Bay 1... Deep Ultraviolet Photolithography... 193-nanometer immersion optics sub-twenty-nm patterning' 193nm 浸潤光刻對應 1 號隔間（A）。"}, {"q_num": "Q18", "answer": "D", "clue_analysis": "【原聲定位】'Bay 4... High-Vacuum Metallization... deposit inert platinum top electrodes via sputtering' 鉑電極濺鍍對應 4 號隔間（D）。"}, {"q_num": "Q19", "answer": "F", "clue_analysis": "【原聲定位】'Bay 6... Metrology Suite... measure current-voltage analog hysteresis loops' 電流-電壓遲滯計量對應 6 號隔間（F）。"}, {"q_num": "Q20", "answer": "E", "clue_analysis": "【原聲定位】'Bay 5... Wafer Dicing... diamond saws isolate individual silicon chips' 鑽石鋸晶粒分離對應 5 號隔間（E）。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "異步脈衝神經網路與憶阻器交叉陣列電路設計研討 (Design Tutorial on Memristive Crossbars)", "src": "./audio/Unit03_Section3.mp3", "qr": "./qr/unit03-s3.png", "script": ["Dr. Chen: Welcome, Maya, Leo. Have a seat. I've examined your circuit schematic for the neuromorphic mixed-signal inference engine. Integrating an asynchronous event-driven controller with an analog memristive crossbar is brilliant, but you have a glaring physical obstacle.", "Maya: Are you referring to sneak-path leakage currents, Dr. Chen?", "Dr. Chen: Precisely. In your sixty-four-by-sixty-four crossbar, whenever you read a target cross-point, unwanted sneak currents bypass through adjacent low-resistance states in unselected cells. This parasitic parallel leakage completely destroys the mathematical accuracy of your vector-matrix multiplication.", "Leo: We anticipated that hurdle. Instead of adding bulky access transistors at every node, which would ruin our packing density, we've designed a One-Selector-One-Resistor—or 1S1R—nanoscale architecture. We incorporate a volatile threshold selector material in series with each memristor.", "Dr. Chen: Excellent. The sharp non-linear selectivity of a 1S1R stack will choke off sub-threshold sneak currents effectively. Now, Leo, what about your STDP learning experiments?", "Leo: That's where we ran into trouble. When simulating spike-timing-dependent plasticity across our oxide memristors, the conductive filament growth showed considerable cycle-to-cycle stochastic variability. The resistance change wasn't deterministic.", "Dr. Chen: That is intrinsic to oxygen vacancy migration in oxide devices. You cannot fight the physics; instead, your spiking neural network algorithms must be robust against synaptic noise.", "Maya: Understood. Regarding performance benchmarks, how should we prove our energy advantage over standard digital hardware like GPUs?", "Dr. Chen: Do not compete on raw teraflops; GPUs will always win on brute-force float arithmetic. Instead, benchmark energy-per-inference on an auditory keyword-spotting task. Demonstrate that your event-driven chip consumes microjoules by computing only when input spikes arrive.", "Leo: That plays directly to our asynchronous architecture's strength.", "Dr. Chen: And for the IEEE manuscript, reviewers will be skeptical of simulation-only results. You must include real oscilloscopic oscilloscope voltage transients alongside your SPICE simulations to prove physical feasibility.", "Maya: We will capture high-speed pulse oscilloscope measurements from our test wafer.", "Dr. Chen: Great. Now let's finalize the workload distribution for the prototype tape-out.", "Leo: I'll handle the Cadence Virtuoso simulations to extract interconnect wire resistance and wire parasitic capacitances across the crossbar.", "Maya: Thanks, Leo. And for the asynchronous address-event router?", "Leo: I'll design the AER event packet router in Verilog as well—it aligns with my VLSI background.", "Dr. Chen: Who is taking the spiking neural network training loop in Python?", "Leo: I can do that, or...", "Maya: Actually, Leo, since you have the router and Cadence modeling, I've already prepared the PyTorch spiking framework and quantified synaptic weights. Let me run the training loop.", "Leo: Perfect, I'll gladly pass that to you. What about the cleanroom fabrication?", "Maya: I will spend Tuesday in Bay 2 and Bay 4 depositing the physical 1S1R test stacks in the sputter coater.", "Leo: That leaves the manuscript write-up. We should write the results and comparative benchmark section together, combining my hardware data with your physical device profiles.", "Maya: Agreed, we'll co-author the results section on Thursday.", "Dr. Chen: Splendid collaboration. Let's aim to have the layout frozen by month's end."], "trans": ["陳博士：歡迎，瑪雅、里奧。請坐。我審閱了你們神經形態混合信號推理引擎的電路原理圖。將異步事件驅動控制器與類比憶阻器交叉陣列結合非常出色，但你們面臨一個顯著的物理障礙。", "瑪雅：陳博士，您是指潛洩路徑漏電流（sneak-path leakage currents）嗎？", "陳博士：一點沒錯。在你們的 64x64 交叉陣列中，每當你們讀取一個目標交叉節點時，多餘的潛洩電流會繞道穿過未被選中單元中相鄰的低阻態。這種寄生並聯漏電會徹底摧毀你們向量-矩陣乘法的數學精度（corrupt vector-matrix multiplication accuracy）。", "里奧：我們預料到了這一障礙。為了避免在每個節點添加笨重的存取電晶體而破壞封裝密度，我們設計了 One-Selector-One-Resistor（一選通器一電阻器，簡稱 1S1R）奈米架構。我們在每個憶阻器串聯了一個揮發性閾值選通器材料。", "陳博士：太好了。1S1R 堆疊的陡峭非線性選擇比將能有效遏制亞閾值潛洩電流。那麼里奧，你的 STDP 學習實驗進展如何？", "里奧：這就是我們遇到困難的地方。在模擬穿過氧化物憶阻器的脈衝時序依賴可塑性（STDP）時，導電細絲生長表現出顯著的循環間隨機變異性（cycle-to-cycle stochastic variability）。阻值變化並不是確定性的。", "陳博士：這是氧化物元件中氧空位遷移的內在物理特性。你們無法對抗物理規律；相反地，你們的脈衝神經網絡演算法必須對突觸噪聲具備強大的容忍韌性。", "瑪雅：明白了。關於性能基準測試，我們應該如何證明我們相對於 GPU 等標準數位硬體的能耗優勢？", "陳博士：不要去拼純粹的浮點運算速度（FLOPS）；GPU 在蠻力浮點運算上總是會贏。相反地，應該在連續語音關鍵字辨識任務上對比每次推理能耗（energy-per-inference metrics on keyword-spotting）。證明你們的事件驅動晶片僅在輸入脈衝到達時才進行運算，從而只消耗微焦耳級的能量。", "里奧：這正好發揮了我們異步架構的優勢。", "陳博士：關於 IEEE 論文投稿，審稿人會對純模擬的結果持懷疑態度。你們必須在 SPICE 模擬模型旁附上真實的示波器電壓瞬態波形（real oscilloscopic voltage traces），以證明物理可行性。", "瑪雅：我們將從測試晶圓上捕捉高速脈衝示波器測量數據。", "陳博士：太好了。現在讓我們敲定原型晶片流片前的工作分配。", "里奧：我負責 Cadence Virtuoso 模擬，以提取交叉陣列中的互連導線電阻與寄生電容。", "瑪雅：謝謝里奧。那異步位址-事件表示（AER）路由器呢？", "里奧：我也用 Verilog 來設計 AER 事件封包路由器——這與我的超大型積體電路（VLSI）背景相符。", "陳博士：那 Python 中的脈衝神經網絡訓練迴圈誰來做？", "里奧：我可以做，或者……", "瑪雅：里奧，既然你已經包攬了路由器和 Cadence 建模，我已經準備好了 PyTorch 脈衝框架並量化了突觸權重。就讓我來跑訓練迴圈吧。", "里奧：太完美了，我很樂意交給你。那無塵室晶圓製程呢？", "瑪雅：我週二會在 2 號和 4 號隔間度過，在濺鍍沉積機中沉積物理 1S1R 測試樣品。", "里奧：那剩下論文撰寫。我們應該共同撰寫實驗結果與對比基準測試章節，結合我的硬體數據與你的物理元件特徵。", "瑪雅：同意，我們週四共同完成結果章節撰寫。", "陳博士：極其出色的合作。我們的目標是本月底完成電路版圖凍結。"], "answers": [{"q_num": "Q21", "answer": "A", "clue_analysis": "【原聲定位】'sneak currents bypass through unselected cells... destroys mathematical accuracy of vector-matrix multiplication' 考查潛洩電流破壞矩陣乘法精度，選 A。"}, {"q_num": "Q22", "answer": "A", "clue_analysis": "【原聲定位】'One-Selector-One-Resistor—or 1S1R... volatile threshold selector material in series' 1S1R 選通器架構，選 A。"}, {"q_num": "Q23", "answer": "A", "clue_analysis": "【原聲定位】'conductive filament growth showed considerable cycle-to-cycle stochastic variability' 憶阻細絲隨機循環變異性，選 A。"}, {"q_num": "Q24", "answer": "A", "clue_analysis": "【原聲定位】'benchmark energy-per-inference on an auditory keyword-spotting task' 對比語音辨識之每次推理能耗，選 A。"}, {"q_num": "Q25", "answer": "A", "clue_analysis": "【原聲定位】'must include real oscilloscopic voltage transients alongside your SPICE simulations' 包含實測示波器波形，選 A。"}, {"q_num": "Q26", "answer": "B", "clue_analysis": "【原聲定位】Leo: 'I'll handle the Cadence Virtuoso simulations to extract interconnect wire resistance' 里奧負責 Cadence 寄生電阻模擬，選 B。"}, {"q_num": "Q27", "answer": "B", "clue_analysis": "【原聲定位】Leo: 'I'll design the AER event packet router in Verilog' 里奧負責異步路由器設計，選 B。"}, {"q_num": "Q28", "answer": "A", "clue_analysis": "【原聲定位】Maya: 'Let me run the training loop... PyTorch spiking framework' 瑪雅主動承擔神經網絡訓練，選 A。"}, {"q_num": "Q29", "answer": "A", "clue_analysis": "【原聲定位】Maya: 'I will spend Tuesday in Bay 2 and Bay 4 depositing the physical 1S1R test stacks' 瑪雅負責無塵室樣品沉積，選 A。"}, {"q_num": "Q30", "answer": "C", "clue_analysis": "【原聲定位】Leo: 'We should write the results... together' / Maya: 'Agreed, we'll co-author' 兩人共同完成結果撰寫，選 C。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Silicon Synapse: Systems Engineering in Neuromorphic Architecture and Memristive Networks", "src": "./audio/Unit03_Section4.mp3", "qr": "./qr/unit03-s4.png", "script": ["▶ Section 1  ‧  The von Neumann Bottleneck and Architectural Limits", "Section 1  Good morning, engineers. In today's advanced hardware systems lecture, we are tackling one of the most formidable computational crises of our era: the impending collapse of classical silicon computing under modern artificial intelligence workloads. For over seven decades, digital computation has been dominated by the von Neumann architecture. In this paradigm, the central processing unit and memory storage are physically separated, communicating across narrow communication buses. However, modern deep neural networks require transferring petabytes of parameters between memory and arithmetic units. This creates a severe bandwidth constraint known as the von Neumann bottleneck. Over ninety percent of total energy dissipation in modern GPU clusters is expended simply on shuffling bits across physical interconnects, generating unsustainable thermal dissipation that threatens to halt technological progress.", "▶ Section 2  ‧  Neuromorphic Computing: Emulating Biological Efficiency", "Section 2  To circumvent this physical barrier, computer architects are turning to neuromorphic engineering—the design of silicon chips that directly replicate the biological morphology and electrical behavior of the human brain. Consider the human central nervous system: our biological brain performs approximately ten to the sixteenth operations per second while dissipating a mere twenty watts of energy. It achieves this astonishing energetic efficiency because biological neurons do not adhere to von Neumann separation. Instead, computation and memory storage are co-located at the synapse. Furthermore, biological neural circuits communicate using asynchronous, event-driven action potentials—or spikes—meaning neurons consume energy only when actively conveying new, non-redundant information.", "▶ Section 3  ‧  Memristor Physics and Analog In-Memory Computing", "Section 3  At the hardware front
