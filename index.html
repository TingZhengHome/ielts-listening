y own private-label goods above organic listings' 搜尋自營優待對應 1 號隔間（A）。"}, {"q_num": "Q17", "answer": "D", "clue_analysis": "【原聲定位】'Pod 4... Algorithmic Price Fixing... pricing algorithms settle on identical surge prices' 動態演算法共謀定價對應 4 號隔間（D）。"}, {"q_num": "Q18", "answer": "C", "clue_analysis": "【原聲定位】'Pod 3... Data Interoperability... open APIs enable users to port social graphs' 數據可攜性對應 3 號隔間（C）。"}, {"q_num": "Q19", "answer": "B", "clue_analysis": "【原聲定位】'Pod 2... Multi-Sided Platforms... zero-price consumer search subsidized by advertising' 雙邊市場廣告交叉補貼對應 2 號隔間（B）。"}, {"q_num": "Q20", "answer": "F", "clue_analysis": "【原聲定位】'Pod 6... Structural Breakups... courts order structural divestitures splitting social networks' 反壟斷結構性拆分對應 6 號隔間（F）。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "多邊平台鎖定效應、掠奪性定價與反壟斷補救研討 (Tutorial on Platform Lock-In & Antitrust Remedies)", "src": "./audio/Unit09_Section3.mp3", "qr": "./qr/unit09-s3.png", "script": ["Prof. Sterling: Good afternoon, Nathan, Sarah. Please take a seat. I've gone over your draft submission on platform competition and predatory pricing in food-delivery aggregators. You've assembled an ambitious empirical model.", "Sarah: Thank you, Professor Sterling! We analyzed market power across the top three app platforms in London.", "Prof. Sterling: Your econometrics is rigorous. However, your antitrust analysis suffers from a fundamental flaw in relevant market definition. In Section 1, you defined the antitrust market strictly as 'on-demand restaurant delivery apps'. In doing so, you ignored grocery delivery quick-commerce and virtual ghost kitchens. A competition court would immediately dismiss your excessive market concentration figures because you drew the market boundaries far too narrowly.", "Nathan: That makes complete sense. We will expand the relevant market boundary to incorporate retail grocery partnerships and dark stores.", "Prof. Sterling: Good. Now, what explains user stickiness in your empirical dataset? Despite fifteen percent service fee increases, churn remained under three percent.", "Sarah: We proved it's driven by multi-homing friction. While downloading another app is technically free, the cognitive friction of re-entering payment credentials, navigating unfamiliar user interfaces, and losing loyalty perks creates powerful psychological lock-in.", "Prof. Sterling: A classic behavioral switching barrier. And what about your predatory pricing test?", "Nathan: We applied the Brooke Group legal standard. We tracked whether venture-subsidized delivery discounts dropped prices below average variable cost, paired with an econometric probability that the platform could subsequently recoup those operating losses once competitors folded.", "Prof. Sterling: Excellent application of Supreme Court antitrust doctrine. Now, what remedies are you advocating?", "Sarah: Instead of a messy structural breakup, which would destroy network efficiencies, we propose behavioral remedies: enforcing open data interoperability and strictly banning algorithmic self-preferencing for platform-owned dark kitchens.", "Prof. Sterling: A very mature regulatory compromise. Finally, for your presentation at the McKinsey Case Cup: anchor your conclusions in quantifiable consumer welfare and innovation metrics rather than purely abstract legal statutes. Judges want to see practical business viability.", "Nathan: We will translate the legal doctrine into commercial EBITDA and market growth impacts.", "Prof. Sterling: Outstanding. Now let's distribute the remaining tasks before Wednesday's rehearsal.", "Nathan: For the market concentration calculations, I'll compute the Herfindahl-Hirschman Index across London boroughs in Excel.", "Sarah: Thanks, Nathan. And I'll run the econometric regression in Stata to quantify the elasticity of consumer multi-homing switching costs.", "Prof. Sterling: Who will construct the financial recoupment model?", "Nathan: I'll build the discounted cash flow model to project when predatory losses turn into monopoly rents.", "Sarah: Perfect. And since Nathan is crunching the DCF numbers, I'll draft the legal comparative section analyzing the enforcement mechanisms of the EU Digital Markets Act.", "Nathan: That leaves the presentation slides. Since the visual storytelling and executive summary must be airtight, let's design and structure the pitch deck collaboratively on Tuesday evening.", "Sarah: Agreed, we'll build the final slide deck together.", "Prof. Sterling: Outstanding teamwork. I look forward to your dry run on Wednesday afternoon."], "trans": ["斯特林教授：下午好，內森、莎拉。請坐。我審閱了你們關於外送聚合平台的平台競爭與掠奪性定價的論文初稿。你們建立了一個非常雄心勃勃的實證模型。", "莎拉：謝謝斯特林教授！我們分析了倫敦排名前三的應用程式平台的市場支配力。", "斯特林教授：你們的計量經濟學做得很嚴謹。然而，你們的反壟斷分析在相關市場界定（relevant market definition）上存在根本性缺陷。在第 1 節中，你們將反壟斷市場嚴格界定為「即時餐廳外送應用」。如此一來，你們忽略了生鮮超市即時外送以及虛擬幽靈廚房（excluded grocery delivery and supermarket ghost kitchens）。競爭法院會立即駁回你們過高的市場集中度數據，因為你們把相關市場範圍畫得太窄了！", "內森：這非常有道理。我們將擴大相關市場邊界，納入生鮮零售合作夥伴與暗廚暗倉。", "斯特林教授：很好。那麼在你們的實證數據集中，是什麼解釋了用戶黏性？儘管服務費上漲了 15%，用戶流失率卻始終低於 3%。", "莎拉：我們證明這是由多歸屬摩擦（multi-homing friction）驅動的。雖然下載另一個應用在技術上是免費的，但重新輸入支付憑證、適應陌生使用者介面以及失去會員忠誠獎勵的認知摩擦，形成了強大的心理鎖定效應（psychological lock-in / switching barriers）。", "斯特林教授：經典的行為轉換壁壘。那關於掠奪性定價檢驗呢？", "內森：我們應用了布魯克集團（Brooke Group）法律標準。我們追蹤了風投補貼的配送折扣是否將價格壓低到平均可變成本以下（below average variable cost），並結合計量經濟學評估平台在競爭對手倒閉後是否具有彌補這些經營虧損的危險概率（probability of recoupment）。", "斯特林教授：出色的最高法院反壟斷判例應用。那麼你們主張什麼補救措施？", "莎拉：與其進行會破壞網路效率的混亂結構性分拆，我們建議採取行為補救措施：強制執行開放數據互操作性標準，並嚴禁對平台自有暗廚進行演算法自我優待（prohibiting algorithmic self-preferencing）。", "斯特林教授：非常成熟的監管折衷方案。最後，關於你們在麥肯錫商業個案大賽的報告：將你們的結論錨定在可量化的消費者福利與創新指標上（quantifiable consumer welfare and innovation metrics），而非純粹抽象的法律條文。評審希望看到務實的商業可行性。", "內森：我們將把法律學說轉化為具體的 EBITDA 財務指標與市場成長影響。", "斯特林教授：太棒了。現在讓我們在週三排練前分配剩餘任務。", "內森：關於市場集中度計算，我負責在 Excel 中計算倫敦各行政區的赫芬達爾-赫希曼指數（HHI）。", "莎拉：謝謝內森。我來負責在 Stata 中運行計量經濟迴歸，量化消費者多歸屬轉換成本的彈性。", "斯特林教授：誰來構建財務虧損彌補模型？", "內森：我來構建折現現金流（DCF）模型，預測掠奪性虧損何時轉化為壟斷租金。", "莎拉：太好了。既然內森負責 DCF 財務運算，我來撰寫法律對比章節，分析歐盟《數位市場法》（DMA）的執法機制。", "內森：那剩下簡報投影片。既然視覺排版與高管摘要必須無懈可擊，我們週二晚上共同設計並架構路演投影片吧。", "莎拉：同意，我們一起完成最終簡報製作。", "斯特林教授：出色的團隊合作。我期待週三下午看你們的預演。"], "answers": [{"q_num": "Q21", "answer": "B", "clue_analysis": "【原聲定位】'defined antitrust market too narrowly... ignored grocery delivery and ghost kitchens' 相關市場界定過窄漏掉生鮮外送，選 B。"}, {"q_num": "Q22", "answer": "A", "clue_analysis": "【原聲定位】'multi-homing friction... cognitive friction and stored payment credentials creates lock-in' 多歸屬轉換成本與認知摩擦形成鎖定，選 A。"}, {"q_num": "Q23", "answer": "A", "clue_analysis": "【原聲定位】'Brooke Group test... prices fall below average variable cost with probability of recoupment' 布魯克集團標準低於平均可變成本與彌補概率，選 A。"}, {"q_num": "Q24", "answer": "A", "clue_analysis": "【原聲定位】'mandating interoperable data sharing standards and prohibiting algorithmic self-preferencing' 強制數據互操作與禁止自我優待，選 A。"}, {"q_num": "Q25", "answer": "A", "clue_analysis": "【原聲定位】'anchor recommendations in quantifiable consumer welfare and innovation metrics' 聚焦消費者福利與創新量化指標，選 A。"}, {"q_num": "Q26", "answer": "A", "clue_analysis": "【原聲定位】Nathan: 'I'll compute the Herfindahl-Hirschman Index across London boroughs' 內森計算 HHI 指數，選 A。"}, {"q_num": "Q27", "answer": "B", "clue_analysis": "【原聲定位】Sarah: 'I'll run the econometric regression in Stata to quantify multi-homing switching costs' 莎拉負責計量迴歸，選 B。"}, {"q_num": "Q28", "answer": "A", "clue_analysis": "【原聲定位】Nathan: 'I'll build the discounted cash flow model to project when losses turn into monopoly rents' 內森負責 DCF 財務模型，選 A。"}, {"q_num": "Q29", "answer": "B", "clue_analysis": "【原聲定位】Sarah: 'I'll draft the legal comparative section analyzing the EU Digital Markets Act' 莎拉負責歐盟 DMA 法律比較，選 B。"}, {"q_num": "Q30", "answer": "C", "clue_analysis": "【原聲定位】Nathan: 'let's design and structure the pitch deck collaboratively' / Sarah: 'Agreed, we'll build the final slide deck together' 兩人共同完成投影片，選 C。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Creative Destruction Paradox: Platform Dominance, Network Externalities, and Contestable Markets", "src": "./audio/Unit09_Section4.mp3", "qr": "./qr/unit09-s4.png", "script": ["▶ Section 1  ‧  Schumpeterian Evolutionary Economics and Innovation Gales", "Section 1  Good morning, everyone. In today's macroeconomic theory and corporate strategy lecture, we will dissect one of the most celebrated and fiercely debated doctrines in industrial organization: Joseph Schumpeter's concept of 'creative destruction'. Writing in his landmark 1942 treatise, Capitalism, Socialism and Democracy, Schumpeter challenged the sterile equilibrium models of classical economics. He argued that capitalism is an inherently dynamic, evolutionary process driven not by marginal price competition among identical producers, but by perennial 'gales of creative destruction'. In this paradigm, visionary entrepreneurial insurgents introduce radically disruptive technologies or business models, dismantling entrenched incumbents and liberating capital for higher-productivity frontiers. Crucially, Schumpeter asserted that monopoly profits were inherently transient—a temporary entrepreneurial rent that would inevitably be eroded by the next wave of innovators.", "▶ Section 2  ‧  Multi-Sided Platforms and Direct/Indirect Network Moats", "Section 2  However, when we transition from twentieth-century smokestack industrial manufacturing to the contemporary digital platform economy, the Schumpeterian turnover mechanism appears to have suffered a profound structural malfunction. Modern tech conglomerates—specifically multisided platforms like Amazon, Alphabet, Meta, and Apple—operate under economic laws fundamentally distinct from traditional factories. Digital ecosystems are propelled by self-reinforcing network externalities. Direct network effects dictate that the utility of a platform scales exponentially with each additional user, while indirect network effects attract complementary third-party software developers and advertisers. When coupled with near-zero marginal costs of software distribution and vast, non-replicable data asymmetries, platform behemoths construct virtually impregnable economic moats that insulate them from Schumpeterian disruption.", "▶ Section 3  ‧  The Empirical Paradox: Declining Business Dynamism", "Section 3  This structural entrenchment has precipitated what macroeconomists define as the 'creative destruction paradox'. Despite living in an era ostensibly characterized by dazzling technological breakthroughs in artificial intelligence and ubiquitous digital connectivity, aggregate productivity growth across advanced OECD economies has steadily decelerated over the past two decades. Economists attribute this secular stagnation to a pervasive decline in business dynamism. Across North America and Western Europe, the rate of new startup formation has fallen by more than forty percent, industry concentration ratios have reached historic zeniths, and the profit margins of dominant market leaders have expanded without attracting competitive entry. In essence, the creative gale has been replaced by a stagnant technological oligopoly.", "The Creative Destruction Paradox: Platform Dominance, Network Externalities, and Contestable Markets (Continued)", "▶ Section 4  ‧  Killer Acquisitions, Venture Capital, and Market Foreclosure", "Section 4  How do incumbent tech platforms maintain their impervious hegemony? Empirical anti-trust investigations reveal widespread deployment of defensive strategies, chief among them being 'killer acquisitions'. Dominant platforms continually scan the venture capital landscape using proprietary telemetry data to identify nascent startup competitors long before they achieve critical commercial scale. The incumbent then acquires the fledgling startup at an exorbitant valuation solely to terminate its disruptive product development and absorb its engineering talent—preemptively neutralizing any existential threat. Moreover, venture capitalists increasingly refuse to finance startups in what they explicitly term the 'kill zone'—the digital domains controlled by platform giants. This creates systemic market foreclosure, choking off genuine radical innovation at its embryonic inception.", "▶ Section 5  ‧  Antitrust Jurisprudence and the New Brandeisian Paradigm", "Section 5  These anticompetitive realities have ignited a profound ideological civil war within antitrust jurisprudence. For over four decades, Western competition policy has been governed by the Chicago School's 'consumer welfare standard', formulated by Robert Bork. Under this doctrine, mergers and market concentration were deemed legally permissible so long as they did not produce immediate, measurable price increases for retail consumers. However, modern legal scholars spearheading the 'New Brandeis movement' argue that the consumer welfare standard is catastrophically blind to platform power. Digital platforms routinely offer consumer-facing services free of charge, monetizing instead via surveillance data and algorithmic advertising. Progressive antitrust enforcement is thus abandoning narrow price metrics, pivoting toward preserving market contestability, safeguarding worker wages against monopsony power, and structurally prohibiting dominant gatekeepers from preferencing their own proprietary services."], "trans": ["Section 1  大家早安。在今天的總體經濟學理論與企業策略講座中，我們將深入剖析產業組織學中最具盛名、同時也最具激烈爭議的學說之一：約瑟夫·熊彼得（Joseph Schumpeter）的「創造性破壞（creative destruction）」概念。在 1942 年出版的代表作《資本主義、社會主義與民主》中，熊彼得挑戰了古典經濟學將市場視為靜態死寂均衡的模型。他提出，資本主義本質上是一個動態演化的有機進程，其核心動力絕非源自同質製造商之間微小的邊際價格競爭，而是來自永不停歇的「創造性破壞風暴（gales of creative destruction）」。在此範式下，富有遠見的新創顛覆者引進劃時代的技術或商業模式，徹底瓦解背負沉重包袱的既有巨頭，進而將資本釋放至生產力更高的前沿領域。關鍵在於，熊彼得斷言壟斷利潤本質上只是「短暫的（transient）」——它純粹是開創者所獲取的暫時性超額租金，最終必將被下一波新興創新者所侵蝕蠶食。", "Section 2  然而，當我們從二十世紀冒著濃煙的傳統工業製造業，過渡至當代的數位平台經濟時，熊彼得式的市場更迭機制似乎遭遇了深刻的結構性癱瘓。現代科技巨頭——特別是亞馬遜、Alphabet、Meta 與蘋果等「多邊平台（multisided platforms）」——所遵循的經濟規律，與傳統工廠有著本質上的大相徑庭。數位生態系統由自我強化的「網絡外部性（network externalities）」所驅動。直接網絡效應意味著平台的實用價值會隨著每一位新增用戶呈指數級飆升，而間接網絡效應則能磁吸無數互補的第三方軟體開發者與廣告商。加上軟體分發幾乎為零的邊際成本（marginal costs），以及龐大且不可複製的用戶專有數據不對稱性，平台巨頭築起了實質上堅不可摧的經濟護城河，將自身與任何潛在的熊彼得式顛覆徹底隔絕開來。", "Section 3  這種結構性市場固化催生了總體經濟學家所謂的「創造性破壞悖論（creative destruction paradox）」。儘管我們表面上身處一個被人工智慧炫目突破與無所不在的數位連結所環繞的時代，但過去二十年間，先進 OECD 經濟體的全要素生產力成長卻持續呈現疲軟放緩。經濟學家將這種「長期停滯（secular stagnation）」歸咎於企業活力的全域性衰退。在北美與西歐，新創企業成立的速度大幅暴跌超過百分之四十，產業集中度攀升至歷史顛峰，而市場主導者的利潤率持續擴張，卻完全無法吸引具有威脅性的競爭者入場。本質上，曾經席捲市場的創新狂風，已被一灘死水般的數位寡頭壟斷所取代。", "Section 4  既有的科技平台巨頭究竟是如何維持其無懈可擊的霸權地位？實證反壟斷調查揭示了它們廣泛採取的防禦性策略，其中最具殺傷力的莫過於「扼殺式併購（killer acquisitions）」。主導平台利用內部專有的遙測大數據，持續在地毯式掃描創投圈動態，早在潛在對手初露鋒芒、尚未形成商業氣候前就將其精準鎖定。隨後，巨頭便以令人難以拒絕的天價估值將這家萌芽期的新創公司強行收購，其唯一目的僅僅是終止該顛覆性產品的開發並吸收其工程技術人才——從而在萌芽期先發制人地撲滅生存威脅。更嚴重的是，創投資本家如今公開拒絕投資任何處於科技巨頭掌控領域（被創投圈明確稱為『扼殺區 kill zone』）的新創公司。這形成了系統性的市場封鎖，在受精卵階段就掐死了真正顛覆性的激進創新。", "Section 5  這些反競爭現實，在反托拉斯法學界內部引爆了一場深刻的意識形態內戰。在過去四十年間，西方競爭政策始終由勞勃·波克（Robert Bork）所樹立的芝加哥學派「消費者福利標準（consumer welfare standard）」牢牢支配。在此教條下，只要併購與市場集中不導致終端零售價格的立即上漲，就被視為合法且良性。然而，由「新布蘭迪斯運動（New Brandeis movement）」所引領的現代法律學者痛批，消費者福利標準在面對數位平台霸權時已徹底淪為盲人摸象。數位平台習慣以表面「免費（free of charge）」的服務迷惑消費者，實則透過全面性的監控數據與演算法廣告進行暴利變現。因此，進步派反托拉斯執法正毅然拋棄狹隘的價格指標，轉向全力維護市場的可競爭性（contestability）、保障勞動者免受買方壟斷力量剝削，並從法律結構上嚴厲禁止平台守門人優待自身的專有服務。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. destruction  【原聲定位】Section 1: 'driven not by marginal price competition... but by perennial gales of creative destruction.' 【解析】熊彼得經典理論核心名詞，填入 destruction。"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. transient  【原聲定位】Section 1: 'Schumpeter asserted that monopoly profits were inherently transient—a temporary entrepreneurial rent...' 【解析】考查利潤特質形容詞，填入 transient 或 temporary。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. marginal  【原聲定位】Section 2: 'When coupled with near-zero marginal costs of software distribution...' 【解析】題幹 'incurs near-zero (33) ____________ costs'，填入修飾詞 marginal。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. stagnation  【原聲定位】Section 3: 'Economists attribute this secular stagnation to a pervasive decline in business dynamism.' 【解析】長期經濟停滯術語，填入 stagnation。"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. killer  【原聲定位】Section 4: 'chief among them being killer acquisitions. Dominant platforms continually scan the venture capital landscape...' 【解析】題幹 'execute (35) ____________ acquisitions'，填入修飾詞 killer。"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. welfare  【原聲定位】Section 5: 'governed by the Chicago School's consumer welfare standard, formulated by Robert Bork.' 【解析】反托拉斯傳統標準名詞，填入 welfare。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 2: 'Direct network effects dictate that the utility of a platform scales exponentially with each additional user...' 【解析】用戶每增加一人，平台實用價值呈指數級增長，對應選項 B。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. B  【原聲定位】Section 4: 'venture capitalists increasingly refuse to finance startups in what they explicitly term the kill zone—the digital domains controlled by platform giants.' 【解析】創投拒絕注資的科技巨頭壟斷領域，對應選項 B。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. A  【原聲定位】Section 5: 'consumer welfare standard is catastrophically blind to platform power. Digital platforms routinely offer consumer-facing services free of charge, monetizing instead via surveillance data...' 【解析】過度聚焦短期價格而無視免費數據交換背後的結構性壟斷，對應選項 A。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. B  【原聲定位】Section 3 & 5: 'the creative gale has been replaced by a stagnant technological oligopoly... pivoting toward preserving market contestability...' 【解析】高進入壁壘與數據護城河有永久扼殺動態競爭之風險，對應選項 B。"}]}}}, {"num": 10, "tag": "unit10", "folder": "法律哲學與人工智慧倫理", "chapter": "第三篇章 ‧ 當代治理、商業與前沿倫理", "title": "The Algorithmic Tribunal: Autonomous Agency & AI Jurisprudence", "titleZh": "演算法審判席、自主能動性、道德對齊與人工智慧法理學", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (Sec 1–4)", "src": "./audio/Unit10_Full_Section1_to_4.mp3", "qr": "./qr/unit10.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "全國法學院人工智慧侵權責任模擬法庭報名 (Moot Court Team Registration)", "src": "./audio/Unit10_Section1.mp3", "qr": "./qr/unit10-s1.png", "script": ["Ms. Vance: AI Jurisprudence and Moot Court Competition Registry, Ms. Vance speaking.", "Zachary: Good morning, Ms. Vance! I'm calling to register our law faculty team for the National Autonomous Systems Moot.", "Ms. Vance: Excellent! We have top law schools competing this year. Let's complete your team docket. What is your surname, Zachary?", "Zachary: It's Ellington. Spelled E-L-L-I-N-G-T-O-N.", "Ms. Vance: Thank you, Zachary. And your primary contact telephone?", "Zachary: It's 07689... and then 341907.", "Ms. Vance: 341907. And which university do you represent?", "Zachary: Oxford Faculty of Law.", "Ms. Vance: Wonderful. Your team has been randomly drawn to represent the injured pedestrian family as Appellant counsel.", "Zachary: Appellant counsel, perfect. And the case dispute?", "Ms. Vance: The problem explores an autonomous delivery drone collision under dense fog, centering on algorithmic foreseeability and strict product liability under tort law.", "Zachary: Product liability, our team's specialty. When must our written memorials be lodged?", "Ms. Vance: Both Claimant and Respondent skeleton arguments must be uploaded by midnight on Friday the 20th of November.", "Zachary: November 20th, noted. Will the oral rounds be heard before a five-judge bench?", "Ms. Vance: The Grand Final uses five, but your preliminary rounds will be presided over strictly by a three-judge bench of High Court and appellate barristers.", "Zachary: Three judges, understood. What is the hearing venue?", "Ms. Vance: The hearings take place inside the Supreme Court Moot Chamber in London.", "Zachary: What is the mandatory courtroom attire?", "Ms. Vance: Advocates must wear a formal dark business suit, wing-collared white shirt, and standard legal bands. Gowns are provided.", "Zachary: Legal bands, noted. If our faculty advisors wish to attend as spectators?", "Ms. Vance: They can collect a Public Gallery Pass at the security desk.", "Zachary: And the team entry fee?", "Ms. Vance: While late registrations incur a 280-pound fee, early-bird university entries submitted before month-end pay the standard fee of 160 pounds.", "Zachary: That is excellent. Thank you so much, Ms. Vance!"], "trans": ["凡斯女士：人工智慧法理學與模擬法庭競賽登記處，我是凡斯女士。", "札克利：早安，凡斯女士！我打電話是想為我們法學院代表隊報名參加全國自主系統模擬法庭大賽。", "凡斯女士：太好了！今年有各頂尖法學院參賽。讓我們來完成您的隊伍檔案。請問您的姓氏是，札克利？", "札克利：艾靈頓（Ellington），拼寫是 E-L-L-I-N-G-T-O-N。", "凡斯女士：謝謝札克利。您的主要聯絡電話是？", "札克利：是 07689……後面是 341907。", "凡斯女士：341907。您代表哪一所大學？", "札克利：牛津大學法學院。", "凡斯女士：太棒了。貴隊在抽籤中被隨機分配代表受傷行人家庭擔任上訴方律師（Appellant counsel）。", "札克利：上訴方律師，太好了。案件爭議焦點是什麼？", "凡斯女士：賽題探討濃霧中自主外送無人機相撞事故，核心圍繞侵權法中的演算法可預見性與嚴格產品（product）責任。", "札克利：產品責任，我們團隊的專長。書面訴狀必須何時提交？", "凡斯女士：原告與被告的訴狀綱要必須在 11 月（November）20 日週五午夜前上傳完畢。", "札克利：11 月 20 日，記下了。口頭辯論會由五位法官組成合議庭嗎？", "凡斯女士：總決賽使用五位，但初賽階段嚴格由高等法院與上訴律師組成的三（three）法官合議庭主持審理。", "札克利：三位法官，明白。辯論地點在哪裡？", "凡斯女士：聽證辯論將在倫敦最高法院模擬辯論廳（Moot Chamber）舉行。", "札克利：法庭強制著裝規範是什麼？", "凡斯女士：辯護人必須穿著正式深色商務西裝、翼領白襯衫以及標準的法庭領巾（bands）。法袍由現場提供。", "札克利：法庭領巾，記下了。如果我們的指導教授想作為旁聽觀眾出席呢？", "凡斯女士：他們可以在安檢台領取公眾旁聽席通行證（Public Gallery Pass）。", "札克利：那隊伍報名費用是？", "凡斯女士：逾期晚鳥報名為 280 英鎊，但月底前提交的早鳥大學隊伍只需支付標準費用 160 英鎊。", "札克利：太好了。非常感謝您，凡斯女士！"], "answers": [{"q_num": "Q1", "answer": "Ellington", "clue_analysis": "【原聲定位】'Ellington. Spelled E-L-L-I-N-G-T-O-N.' 考查英文字母清晰逐字拼寫。"}, {"q_num": "Q2", "answer": "341907", "clue_analysis": "【原聲定位】'07689... and then 341907.' 連續電話數字聽記。"}, {"q_num": "Q3", "answer": "Appellant", "clue_analysis": "【原聲定位】'represent the injured pedestrian family as Appellant counsel' 題幹已有 counsel，填 Appellant。"}, {"q_num": "Q4", "answer": "product", "clue_analysis": "【原聲定位】'centering on strict product liability under tort law' 題幹已有 strict 與 liability，填 product。"}, {"q_num": "Q5", "answer": "November", "clue_analysis": "【原聲定位】'Friday the 20th of November' 題幹已有 20th，填 November。"}, {"q_num": "Q6", "answer": "3 / three", "clue_analysis": "【原聲定位】'preliminary rounds... strictly by a three-judge bench' 排除五位法官干擾，填 3 / three。"}, {"q_num": "Q7", "answer": "Chamber", "clue_analysis": "【原聲定位】'inside the Supreme Court Moot Chamber' 題幹已有 Moot，填寫單數名詞 Chamber。"}, {"q_num": "Q8", "answer": "bands", "clue_analysis": "【原聲定位】'wing-collared white shirt, and standard legal bands' 填寫法庭服飾專用名詞 bands。"}, {"q_num": "Q9", "answer": "Gallery", "clue_analysis": "【原聲定位】'Public Gallery Pass at security desk' 題幹已有 Public 與 Pass，填 Gallery。"}, {"q_num": "Q10", "answer": "160", "clue_analysis": "【原聲定位】'standard fee of 160 pounds' 排除逾期 280 鎊，填 160。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "高科技智慧法庭與演算法司法倫理展示中心導覽 (High-Tech Algorithmic Courtroom Tour)", "src": "./audio/Unit10_Section2.mp3", "qr": "./qr/unit10-s2.png", "script": ["Judge Marcus Vance: Welcome, legal practitioners, scholars, and jurisprudence students, to the National Center for Algorithmic Jurisprudence and High-Tech Justice. I am Judge Marcus Vance.", "Today you are stepping into the frontier of legal philosophy: a space where constitutional due process collides with artificial neural networks. Before we tour our interactive courtroom pods, let me outline our foundational judicial doctrine.", "In this center, we demonstrate predictive sentencing and bail assessment tools. But let me state our non-negotiable legal baseline: algorithmic recommendations must remain strictly advisory. To fully delegate a human liberty decision—the power to incarcerate an individual—to an unexplainable machine learning model constitutes a profound violation of constitutional due process. A human judge must always retain ultimate moral and legal discretion.", "In our Algorithmic Fairness exhibit, we examine the famous COMPAS recidivism risk tool. Investigative audits revealed systemic statistical bias: the algorithm generated significantly higher false-positive risk scores for minority defendants with identical criminal records, proving that algorithmic scoring can automate and disguise historical human prejudices under a veneer of mathematical objectivity.", "To solve this black-box dilemma, our engineers developed our Explainable AI suite. Instead of outputting uninterpretable raw neural weights, the interface generates human-readable feature attribution maps. Judges and defense counsel can see precisely which specific factual inputs—such as prior convictions or employment history—drove the algorithmic prediction.", "Security regarding digital evidence is paramount. Inside our Chain-of-Custody Vault, evidence cannot be altered. Access requires dual biometric iris authentication, while every file transaction generates an immutable cryptographic blockchain timestamp log.", "If you wish to observe our live simulated trials, we hold public mock trials on autonomous medical malpractice every Wednesday afternoon from 2:00 PM to 4:00 PM in Chamber 1.", "Now, let me guide you through our specialized demonstration pods.", "In Pod 2, enter the Autonomous Vehicle Crash Simulator. Here, engineers grapple with the modern trolley problem: when an unavoidable collision occurs, how should ethical vehicle algorithms balance the preservation of its own passengers against striking pedestrians on the road?", "Across the hall in Pod 4 is Automated Document Discovery. Natural language models screen over two million corporate emails in seconds, identifying privileged attorney-client correspondence with ninety-nine percent recall.", "Down the corridor in Pod 5, visit the Deepfake Video Forensic Suite. Forensic experts utilize microscopic frequency-domain spectral analysis to detect imperceptible synthetic face-swapping artifacts in surveillance evidence.", "In Pod 6, explore Smart Contract Arbitration. You'll witness self-executing blockchain escrow contracts that automatically freeze collateral and adjudicate maritime freight defaults without human court bailiffs.", "Finally, in Pod 7, participate in the Electronic Personhood Philosophical Tribunal. Legal philosophers debate whether advanced artificial cognitive agents should be granted independent legal standing, holding their own tort liability funds and rights akin to corporate legal entities.", "Let's enter Pod 1 to begin our courtroom simulation!"], "trans": ["馬庫斯・凡斯法官：各位法律從業者、學者與法理學學生，歡迎來到國家演算法法學與高科技司法展示中心。我是馬庫斯・凡斯法官。", "今天各位步入了法律哲學的最前沿：這是一個憲法正當法律程序與人工神經網絡激烈碰撞的領域。在我們參觀互動法庭隔間之前，請允許我闡明我們根本性的司法原則。", "在本中心，我們展示了預測性量刑與保釋評估工具。但請讓我聲明我們不可動搖的法律底線：演算法建議必須保持嚴格的諮詢建議性質（strictly advisory）。將一項關乎人類自由的剝奪決定——即監禁個人的司法權力——完全委託給一個無法解釋的機器學習模型，構成了對憲法正當法律程序的根本侵犯（violates fundamental constitutional due process）。人類法官必須始終保留最終的道德與法律裁量權。", "在我們的演算法公平性展覽中，我們審視了著名的 COMPAS 再犯風險評估工具。調查審計揭露了系統性的統計偏見：在犯罪紀錄完全相同的情況下，該演算法對少數族裔被告產生了顯著更高的假陽性再犯風險評分（higher false-positive re-offense risk scores to minority defendants），證明演算法打分會在數學客觀性的外衣下，將歷史上的人類偏見予以自動化與隱蔽化。", "為了解決這種黑箱困境，我們的工程師研發了「可解釋性人工智慧（XAI）」套件。該介面不再輸出難以理解的原始神經權重，而是生成人類可讀的特徵歸因圖（human-interpretable feature attribution maps）。法官與辯護律師能精確看到哪些特定事實特徵（如既往定罪紀錄或就業經歷）促成了演算法的預測結論。", "數位證據的安全至關重要。在我們的證據監管鏈庫中，證據絕不可能被篡改。存取需要雙重生物虹膜認證（dual biometric iris authentication），且每一次文件傳輸都會生成不可篡改的加密區塊鏈時間戳紀錄。", "如果您想觀摩實體模擬審判，我們每週三下午 2:00 至 4:00 在 1 號審判廳舉行關於自主醫療事故的公眾模擬法庭。", "現在，讓我為各位指引專業展示隔間。", "在 2 號隔間，走進自動駕駛汽車碰撞模擬器（Autonomous Vehicle Crash Simulator）。工程師在此面對現代版電車難題：當不可避免的碰撞發生時，車載道德演算法應如何在保護自身乘客與避免撞擊道路行人之間進行權衡抉擇？（striking pedestrian or sacrificing passenger）", "大廳對面的 4 號隔間是自動化電子文件證據開示（Automated Document Discovery）。自然語言模型在幾秒鐘內篩查超過 200 萬封企業電子郵件，以 99% 的召回率精確識別具有律師-委託人保密特權的通訊（attorney-client legal privilege）。", "沿走廊前進的 5 號隔間是深偽影像法醫鑑定室（Deepfake Forensic Suite）。司法專家利用微觀頻域光譜分析，檢測監控錄影證據中難以察覺的合成人臉替換痕跡（synthetic face-swapping in video evidence）。", "在 6 號隔間，探索智慧合約仲裁（Smart Contract Arbitration）。您將親眼見證自動執行的區塊鏈託管合約，在無需法警介入的情況下，自動凍結抵押品並裁決國際海運違約。", "最後在 7 號隔間，參與電子人格哲學審判席（Electronic Personhood Tribunal）。法哲學家辯論先進的人工認知智能體是否應被賦予獨立的法律主體資格（civil rights and legal standing），類似公司法人一樣擁有自身的侵權責任賠償基金與權利。", "讓我們進入 1 號隔間，開始法庭模擬！"], "answers": [{"q_num": "Q11", "answer": "B", "clue_analysis": "【原聲定位】'delegating incarceration... to a black-box model constitutes a profound violation of constitutional due process' 算法剝奪自由侵犯憲法正當程序，選 B。"}, {"q_num": "Q12", "answer": "A", "clue_analysis": "【原聲定位】'generated significantly higher false-positive risk scores for minority defendants with identical criminal records' 少數族裔假陽性偏見，選 A。"}, {"q_num": "Q13", "answer": "B", "clue_analysis": "【原聲定位】'generates human-readable feature attribution maps highlighting specific inputs' 特徵歸因圖揭示決策依據，選 B。"}, {"q_num": "Q14", "answer": "A", "clue_analysis": "【原聲定位】'dual biometric iris authentication, while every file generates immutable blockchain timestamp' 雙重虹膜與區塊鏈時間戳，選 A。"}, {"q_num": "Q15", "answer": "B", "clue_analysis": "【原聲定位】'every Wednesday afternoon from 2:00 PM to 4:00 PM in Chamber 1' 週三下午 2 至 4 點，選 B。"}, {"q_num": "Q16", "answer": "B", "clue_analysis": "【原聲定位】'Pod 2... Trolley Problem... choose between striking a pedestrian or sacrificing passengers' 電車難題對應 2 號隔間（B）。"}, {"q_num": "Q17", "answer": "D", "clue_analysis": "【原聲定位】'Pod 4... Document Discovery... screening two million emails for attorney-client privilege' 文件特權開示對應 4 號隔間（D）。"}, {"q_num": "Q18", "answer": "E", "clue_analysis": "【原聲定位】'Pod 5... Deepfake Video... detect synthetic face-swapping in surveillance evidence' 深度偽造法醫檢驗對應 5 號隔間（E）。"}, {"q_num": "Q19", "answer": "F", "clue_analysis": "【原聲定位】'Pod 6... Smart Contract Arbitration... self-executing blockchain escrow contracts' 智慧合約區塊鏈託管對應 6 號隔間（F）。"}, {"q_num": "Q20", "answer": "G", "clue_analysis": "【原聲定位】'Pod 7... Electronic Personhood... whether artificial cognitive agents should hold independent legal standing' 電子人格法理地位對應 7 號隔間（G）。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "人工智慧電子人格、自主代理侵權與替代責任法理研討 (Tutorial on Electronic Personhood & Strict Liability)", "src": "./audio/Unit10_Section3.mp3", "qr": "./qr/unit10-s3.png", "script": ["Dean Vance: Come in, Julian, Helena. Please sit down. I've finished annotating your joint dissertation draft on 'The Algorithmic Tribunal: Autonomous Agency, Legal Personality, and Tort Allocation'. You have chosen a truly monumental subject.", "Julian: Thank you, Dean Vance. We argue that as autonomous cognitive agents achieve genuine operational independence, our existing tort doctrine collapses unless we grant them limited electronic personhood.", "Dean Vance: It is a provocative stance, but I must push back hard. If you grant legal personhood to an algorithmic system, you create a moral hazard of catastrophic proportions. A corporation could spin off its riskiest AI models into under-capitalized autonomous legal shells. If an autonomous surgical robot commits fatal malpractice, the AI cannot be imprisoned, nor does it feel moral retribution. It becomes a liability shield for negligent developers.", "Helena: We recognized that moral hazard. That's why in Chapter 2, I drew an analogy to maritime law's ancient 'in rem' doctrine. Under admiralty law, a ship can be sued as a legal entity directly, but it must maintain mandatory maritime liability insurance and an emergency salvage reserve.", "Dean Vance: The maritime analogy is ingenious—it anchors financial accountability to an asset pool without conferring human-like rights. Now, Julian, what about employer vicarious liability under Respondeat Superior?", "Julian: Traditional master-servant law fails because an employer is only liable for acts within the foreseeable scope of employment. Deep reinforcement learning models continually adapt through emergent behavior; their actions are inherently unforeseeable to human overseers, breaking the causal chain of agency.", "Dean Vance: Exactly. And that is why the European Union AI Act chose an ex-ante regulatory pathway. In Chapter 3, you must thoroughly dissect its four-tier risk classification matrix, demonstrating how mandatory conformity assessments enforce safety before market deployment.", "Helena: We will integrate the EU conformity assessment framework.", "Dean Vance: Finally, for your oral defense at the National Moot Final: remember that appellate judges despise speculative science fiction. Ground your arguments in solid common-law precedents—Rylands v Fletcher for strict ultra-hazardous liability and Donoghue v Stevenson for the neighbor principle.", "Julian: We will root our entire oral argument in established tort precedent.", "Dean Vance: Splendid. Now, let's distribute the remaining chapter write-ups before next Monday's progress deadline.", "Julian: For Chapter 1, I'll take primary charge of the legal history, tracing the evolution of legal fiction from Roman slave peculium to modern corporate personhood.", "Helena: Thanks, Julian. And while you write the Roman history, I'll synthesize the statutory analysis of the EU AI Act High-Risk Annexes in Chapter 3.", "Dean Vance: Who will tackle the common-law strict liability analysis in Chapter 2?", "Julian: I'll write the tort analysis on strict non-fault liability and algorithmic defect definitions.", "Helena: And for Chapter 4, I'll formulate the compulsory compensation fund model, calculating statutory insurance levies on AI hardware developers.", "Julian: That leaves Chapter 5, the concluding policy manifesto. Since it unifies our theoretical frameworks on moral alignment and democratic oversight, let's co-author the final chapter together over the weekend.", "Helena: Agreed, we'll co-author the manifesto collaboratively.", "Dean Vance: Outstanding division of labor. I look forward to reading your revised chapters on Monday."], "trans": ["凡斯院長：請進，朱利安、海倫娜。請坐。我已經審閱並批註了你們關於「演算法審判席：自主能動性、法律人格與侵權分配」的共同論文初稿。你們選擇了一個極具重大意義的課題。", "朱利安：謝謝凡斯院長。我們主張，隨著自主認知智能體獲得真正的操作獨立性，除非我們賦予其有限的電子人格，否則我們現有的侵權法體系將會崩潰。", "凡斯院長：這是一個頗具啟發性的立場，但我必須提出強烈質疑。如果你們賦予演算法系統法律人格，你們將製造出災難性後果的道德風險（moral hazard）。大企業完全可以將其風險最高的 AI 模型剝離到資本不足的自主法人外殼中。如果一台自主手術機器人犯下致命醫療事故，AI 既無法被監禁，也沒有道德悔罪感（cannot experience retributive punishment, lacks personal assets）。它反而變成了掩護過失開發者的責任防護罩！", "海倫娜：我們意識到了這種道德風險。這就是為什麼在第 2 章中，我借鑒了海事法古老的「對物訴訟（in rem）」原則。在海事法下，一艘船可以作為訴訟標的直接被起訴，但它必須維持強制性的海事責任保險與緊急海損儲備基金（mandatory compulsory insurance）。", "凡斯院長：海事法類比非常精妙——它在不賦予類人權利的前提下，將財務責任錨定在資產池上。那麼朱利安，關於「僱主替代責任（Respondeat Superior）」呢？", "朱利安：傳統的主僕法在此失效，因為僱主僅對在「可合理預見的僱傭範圍」內的行為承擔責任。深度強化學習模型透過湧現行為不斷適應環境；其決策對於人類管理者而言在本質上是不可預見的（emergent decisions beyond scope of employment），這切斷了傳統的代理因果鏈條。", "凡斯院長：一點沒錯。這就是為什麼歐盟《人工智慧法案》選擇了事前監管路徑。在第 3 章中，你們必須徹底剖析其四級風險分類矩陣（four-tier risk classification matrix），展示強制性合規評估如何在產品投放市場前強化安全保障。", "海倫娜：我們將把歐盟合規評估框架整合進去。", "凡斯院長：最後，關於你們在全國模擬法庭決賽中的口頭辯論：請記住，上訴法院法官討厭空想科幻哲學。將你們的論點牢牢錨定在扎實的普通法先例上——比如適用於高度危險嚴格責任的 Rylands v Fletcher 案，以及確立注意義務鄰人原則的 Donoghue v Stevenson 案（ground in common-law judicial precedents）。", "朱利安：我們會將整場辯論紮根於既有的侵權法判例中。", "凡斯院長：太好了。現在讓我們在下週一進度截止前分配剩餘章節的撰寫工作。", "朱利安：關於第 1 章，我主要負責法律史，追溯從羅馬法特有財產（peculium）到現代法人格的法律擬制演進。", "海倫娜：謝謝朱利安。在你寫羅馬法時，我來負責整合第 3 章歐盟 AI 法案高風險附錄的法規條文分析。", "凡斯院長：第 2 章的普通法嚴格責任分析誰來寫？", "朱利安：我來撰寫關於嚴格無過錯責任與演算法產品缺陷界定的侵權分析。", "海倫娜：而第 4 章由我來構建強制性補償基金模型，計算向 AI 硬體開發者徵收的法定保險徵費。", "朱利安：那剩下第 5 章，即結論性的政策宣言。既然它統一了我們關於道德對齊與民主監督的理論框架，我們週末一起共同撰寫最終章吧。", "海倫娜：同意，我們協同完成宣言撰寫。", "凡斯院長：出色的分工。我期待週一閱讀你們修改後的章節。"], "answers": [{"q_num": "Q21", "answer": "A", "clue_analysis": "【原聲定位】'AI cannot be imprisoned, nor does it feel moral retribution... liability shield' AI 缺乏資產且無法承受報應性刑罰，選 A。"}, {"q_num": "Q22", "answer": "A", "clue_analysis": "【原聲定位】'ancient in rem doctrine... treating AI system as a ship with mandatory insurance' 海事法對物訴訟強制保險類比，選 A。"}, {"q_num": "Q23", "answer": "A", "clue_analysis": "【原聲定位】'emergent behavior... inherently unforeseeable, breaking causal chain of master-servant agency' 深度學習湧現決策超出主僕代理可預見範圍，選 A。"}, {"q_num": "Q24", "answer": "A", "clue_analysis": "【原聲定位】'four-tier risk classification matrix... mandatory conformity assessments before market' 歐盟四級風險分類與事前合規審計，選 A。"}, {"q_num": "Q25", "answer": "A", "clue_analysis": "【原聲定位】'judges despise speculative sci-fi... ground your arguments in solid common-law precedents' 紮根於普通法判例而非空想哲學，選 A。"}, {"q_num": "Q26", "answer": "A", "clue_analysis": "【原聲定位】Julian: 'I'll take primary charge of the legal history... Roman law to modern corporate personhood' 朱利安負責羅馬法與法人格歷史，選 A。"}, {"q_num": "Q27", "answer": "B", "clue_analysis": "【原聲定位】Helena: 'I'll synthesize the statutory analysis of the EU AI Act High-Risk Annexes' 海倫娜負責歐盟法規條文分析，選 B。"}, {"q_num": "Q28", "answer": "A", "clue_analysis": "【原聲定位】Julian: 'I'll write the tort analysis on strict non-fault liability' 朱利安負責嚴格無過錯侵權責任，選 A。"}, {"q_num": "Q29", "answer": "B", "clue_analysis": "【原聲定位】Helena: 'I'll formulate the compulsory compensation fund model' 海倫娜負責法定強制補償基金模型，選 B。"}, {"q_num": "Q30", "answer": "C", "clue_analysis": "【原聲定位】Julian: 'let's co-author the final chapter together' / Helena: 'Agreed, we'll co-author' 兩人共同完成終章政策宣言，選 C。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Algorithmic Tribunal: Autonomous Agency, Moral Alignment, and the Jurisprudence of Artificial Intelligence", "src": "./audio/Unit10_Section4.mp3", "qr": "./qr/unit10-s4.png", "script": ["▶ Section 1  ‧  The Rise of Algorithmic Adjudication in Modern Justice", "Section 1  Good morning, everyone. In today's jurisprudence and legal philosophy lecture, we will confront what is arguably the most radical transformation of legal systems since the codification of civil law: the integration of autonomous algorithms into judicial administration. Across contemporary Western jurisdictions, machine learning models are no longer peripheral administrative aids; they are actively deployed in bail determinations, recidivism risk assessments, and criminal sentencing guidelines. The ostensible justification for algorithmic adjudication is impartiality. Human judges are demonstrably vulnerable to cognitive fatigue, emotional bias, and extraneous physiological variables—a phenomenon famously demonstrated in studies showing that judicial leniency drops precipitously immediately prior to meal breaks. By deploying mathematical decision trees, legal technocrats promised to purge human subjectivity, establishing a perfectly objective, metric-driven tribunal.", "▶ Section 2  ‧  The Black-Box Dilemma and Procedural Due Process", "Section 2  However, this algorithmic promise collides head-on with the foundational constitutional bedrock of modern democracy: procedural due process. A cornerstone of natural justice is that any individual subject to state deprivation of liberty possesses the fundamental right to know the precise legal reasoning behind their adjudication. Yet modern deep neural networks operate as inscrutable 'black boxes'. Their internal logic is distributed across hundreds of billions of high-dimensional mathematical weight vectors, making it mathematically impossible for human judges—or even the computer scientists who authored the models—to extract a coherent causal explanation for a specific judicial prediction. When an algorithm recommends denying parole without providing an interpretable legal rationale, it violates the defendant's constitutional right to a transparent defense, reducing human judicial deliberation to opaque computational divination.", "▶ Section 3  ‧  Algorithmic Bias: The Statistical Mirror of Injustice", "Section 3  A second devastating critique centers on the myth of mathematical neutrality. Algorithms do not operate in an abstract mathematical vacuum; they are trained on historical institutional datasets. If decades of historical criminal justice data reflect systemic racial disparities, over-policing of marginalized neighborhoods, and socio-economic profiling, an algorithm does not eliminate that discrimination—it institutionalizes and codifies it. Consider proprietary risk assessment instruments like COMPAS, which evaluate a defendant's likelihood of reoffending. Independent audits demonstrated that these algorithmic systems produce asymmetric error rates: false positive flags—incorrectly categorizing a non-reoffending defendant as high-risk—occur at twice the rate for minority defendants compared to their counterparts. Under the guise of statistical objectivity, algorithms effectively launder historical human injustice through the sanitized veneer of predictive mathematics.", "The Algorithmic Tribunal: Autonomous Agency, Moral Alignment, and the Jurisprudence of Artificial Intelligence (Continued)", "▶ Section 4  ‧  Autonomous Agency and Legal Liability Allocation", "Section 4  Beyond judicial sentencing, the proliferation of fully autonomous systems—such as autonomous algorithmic trading bots and autonomous surgical robotics—forces a profound reappraisal of tort jurisprudence. In classical Anglo-American tort law, liability hinges on culpability: an identifiable human actor must have exhibited intentional malice, reckless disregard, or provable negligence. However, when an autonomous system trained via reinforcement learning acts unpredictably without explicit programmer instructions, who bears legal liability? Traditional product liability models, which treat software as a physical manufacturing defect, collapse when an AI system behaves adaptively in unforeseen environments. Legal theorists are intensely debating whether to apply the common law doctrine of 'respondeat superior'—treating AI as an autonomous agent under a principal-agent framework—or even whether to confer synthetic 'electronic legal personhood' upon autonomous entities, backed by mandatory compulsory insurance funds.", "▶ Section 5  ‧  Constitutional AI and the Alignment Imperative", "Section 5  Looking toward the horizon of artificial general intelligence, the ultimate jurisprudential dilemma is the 'value alignment problem'. How do we program complex, evolving machine intelligences to respect immutable constitutional values: human dignity, bodily inviolability, and procedural justice? Technologists and legal philosophers are pioneering the framework of 'Constitutional AI', embedding explicit deontological constraints directly into the reinforcement learning fine-tuning process. Ultimately, the integration of artificial intelligence into the law forces human civilization to answer an existential question: do we view justice merely as an optimization problem to be solved with predictive precision, or as an inherently human moral covenant that can never be delegated to non-sentient silicon?"], "trans": ["Section 1  大家早安。在今天的法理學與法律哲學講座中，我們將直面可以說是自民法法典化以來法律體系所面臨的最激進變革：自主演算法深度整合至司法行政之中。在當代西方司法管轄區中，機器學習模型已不再僅僅是邊緣性的行政輔助工具；它們已被積極部署於保釋金裁定、再犯風險評估以及刑事量刑指引之中。引入演算法審判表面上的正當化理由是「客觀公正性」。實證研究證實，人類法官極易受到認知疲勞、情緒偏見以及無關生理變數的干擾——最著名的案例是研究顯示，法官的假釋寬宥率在用餐休息前夕會出現斷崖式暴跌。透過部署數學決策樹，法律技術官僚承諾能夠徹底清除人類的主觀偏頗，建立一個完全客觀、數據驅動的公正審判席。", "Section 2  然而，這項演算法的美好承諾，卻與現代民主憲政的基石產生了正面劇烈衝擊：即「正當法律程序（procedural due process）」。自然正義的立憲基石在於，任何面臨國家剝奪其人身自由的個體，皆享有獲悉其判決背後具體法律理由的根本權利。然而，現代深度神經網絡本質上卻是一座座難以透視的「黑盒子（black boxes）」。其內部邏輯分散於數千億個高維度數學權重向量之中，使得人類法官——甚至當初撰寫模型的電腦科學家——在數學上都根本無法提取出特定司法預測背後的連貫因果解釋。當演算法在不提供任何可解釋法律理據的情況下建議拒絕假釋時，它實質剝奪了被告進行透明辯護的憲法權利，將嚴肅的人類司法審議退化成了晦澀難懂的計算占卜。", "Section 3  第二項毀滅性的批判直指「數學中立性」的虛妄神話。演算法絕非在純淨無暇的抽象數學真空中運算；它們完全是依託歷史司法數據集訓練而成。倘若數十年來的歷史刑事司法數據充滿了系統性的種族偏見、對邊緣族群社區的過度執法以及社會經濟層面的偏見標籤，演算法非但無法消除這些歧視，反而會將其「體制化與法典化」。以 COMPAS 這類專門評估被告再犯機率的專利風險評估工具為例：獨立審計證實，這些演算法系統產生了極度不對稱的錯誤率——其中「假陽性錯誤」（即錯誤將實際上未再犯的被告標記為高風險分子）在少數族裔被告身上的發生率，是其他族群的整整兩倍。在統計客觀性的偽裝下，演算法實質上透過預測數學的光鮮外衣，將歷史上的人類不公進行了制度性的「洗白」。", "Section 4  除了司法量刑，全自主系統的激增——如自主高頻演算法交易機器人與自主手術機器人——更迫使侵權行為法理進行全面性的深刻反思。在傳統英美侵權法中，責任歸屬始終繫於「可歸責性（culpability）」：必須存在一位可識別的人類行動者展現了故意惡意、重大過失或可證明的疏忽。然而，當一個透過強化學習訓練的自主系統在沒有明確程式設計師指令的情況下自主採取了不可預測的行動時，究竟該由誰承擔法律責任？將軟體視同實體產品製造瑕疵的傳統產品責任法，在 AI 系統面對未知環境展現動態適應行為時徹底失效。法學理論家目前正激烈爭辯是否應套用普通法中的「雇主責任（respondeat superior）」原則——將 AI 視為委任代理架構下的自主代理人——甚至是否應賦予自主實體以強制保險基金為後盾的「電子法人格（electronic legal personhood）」。", "Section 5  展望通用人工智慧的未來地平線，終極的法理學難題乃是「價值對齊問題（value alignment problem）」。我們究竟該如何為不斷演化的高階機器智慧注入不可動搖的憲法價值：人類尊嚴、身體不可侵犯性以及程序正義？電腦技術專家與法律哲學家正共同開拓「憲法級人工智慧（Constitutional AI）」的嶄新架構，將明確的義務論倫理約束直接嵌入強化學習的微調流程之中。歸根結底，將人工智慧引入法律體系，迫使人類文明必須直面一個存在主義的靈魂拷問：我們究竟是將正義僅僅視為一個可用預測精度來解決的數學優化問題，抑或是將其視為一項絕不可委託給無感知矽基晶片的、人類神聖且不可讓渡的道德契約？"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. subjectivity / bias  【原聲定位】Section 1: 'legal technocrats promised to purge human subjectivity, establishing a perfectly objective, metric-driven tribunal.' 【解析】考查法官裁量偏頗名詞，填入 subjectivity 或 bias。"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. due process  【原聲定位】Section 2: 'procedural due process. A cornerstone of natural justice is that any individual... possesses the fundamental right to know the precise legal reasoning...' 【解析】憲法正當程序原則，填入 due process。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. black  【原聲定位】Section 2: 'modern deep neural networks operate as inscrutable black boxes.' 【解析】題幹已有 boxes，填入修飾詞 black。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. error / false positive  【原聲定位】Section 3: 'these algorithmic systems produce asymmetric error rates: false positive flags... occur at twice the rate...' 【解析】考查統計指標名詞，填入 error 或 false positive。"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. culpability / negligence  【原聲定位】Section 4: 'In classical Anglo-American tort law, liability hinges on culpability: an identifiable human actor must have exhibited intentional malice...' 【解析】侵權歸責名詞，填入 culpability 或 negligence。"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. Constitutional  【原聲定位】Section 5: 'pioneering the framework of Constitutional AI, embedding explicit deontological constraints directly into the reinforcement learning...' 【解析】專有名詞學派名稱，首字母大寫填入 Constitutional。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 1: 'promised to purge human subjectivity, establishing a perfectly objective, metric-driven tribunal.' 【解析】承諾清除人類主觀偏見與生理疲勞變數，對應選項 B。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. B  【原聲定位】Section 3: 'false positive flags—incorrectly categorizing a non-reoffending defendant as high-risk—occur at twice the rate for minority defendants...' 【解析】少數族裔被錯誤標記為高風險的假陽性機率高出兩倍，對應選項 B。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. B  【原聲定位】Section 4: 'when an autonomous system trained via reinforcement learning acts unpredictably without explicit programmer instructions...' 【解析】自主適應且無明確人為程式指令導致因果責任斷裂，對應選項 B。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. B  【原聲定位】Section 5: 'justice merely as an optimization problem to be solved with predictive precision, or as an inherently human moral covenant that can never be delegated to non-sentient silicon?' 【解析】正義是人類的道德契約，絕不能簡化降格為矽基運算優化，對應選項 B。"}]}}}];
let currentUnitIndex = 0;
let currentSecKey = 'full';
const audio = document.getElementById('audioPlayer');
const playBtn = document.getElementById('playBtn');

function initApp() {
    const listContainer = document.getElementById('unitList');
    UNITS_DATA.forEach((u, idx) => {
        const card = document.createElement('div');
        card.className = 'unit-card';
        card.onclick = () => selectUnit(idx, 'full');
        card.innerHTML = `
            <div class="unit-tag">Unit ${String(u.num).padStart(2, '0')} ‧ ${u.folder}</div>
            <div class="unit-name">${u.titleZh}</div>
            <div class="unit-sub">${u.title.split(':')[0]}</div>
        `;
        listContainer.appendChild(card);
    });

    let initIdx = 0;
    let initSec = 'full';
    const hash = window.location.hash.toLowerCase();
    const m = hash.match(/unit(\d+)(?:-(s[1-4]))?/);
    if (m) {
        const uNum = parseInt(m[1], 10);
        const found = UNITS_DATA.findIndex(u => u.num === uNum);
        if (found !== -1) initIdx = found;
        if (m[2]) initSec = m[2];
    }
    selectUnit(initIdx, initSec);
}

function selectUnit(idx, secKey='full') {
    currentUnitIndex = idx;
    document.querySelectorAll('.unit-card').forEach((c, i) => c.classList.toggle('active', i === idx));
    selectSection(secKey, false);
}

function selectSection(secKey, updateHash=true) {
    currentSecKey = secKey;
    const u = UNITS_DATA[currentUnitIndex];
    const t = u.tracks[secKey] || u.tracks.full;

    document.querySelectorAll('.sec-pill').forEach(b => b.classList.toggle('active', b.dataset.sec === secKey));
    document.getElementById('dispTitle').innerText = `Unit ${String(u.num).padStart(2, '0')}: ${u.titleZh} — ${t.label}`;
    document.getElementById('dispSpeaker').innerText = secKey === 'full'
        ? `完整全真 40 題模擬（Section 1 ➔ Section 2 ➔ Section 3 ➔ Section 4）`
        : `情境主題：${t.desc}`;

    audio.src = t.src;
    audio.playbackRate = parseFloat(document.getElementById('speedSelect').value);
    audio.load();
    playBtn.innerText = '▶';
    document.getElementById('downloadLink').href = t.src;
    document.getElementById('qrDisplay').src = t.qr;
    document.getElementById('qrLabel').innerText = `📱 掃碼直達 Unit ${String(u.num).padStart(2, '0')} (${t.label})`;

    if (updateHash) {
        const targetHash = secKey === 'full' ? `#${u.tag}` : `#${u.tag}-${secKey}`;
        history.replaceState(null, '', targetHash);
    }

    renderTabs(u, secKey);
}

function renderTabs(u, secKey) {
    const secs = secKey === 'full' ? ['s1', 's2', 's3', 's4'] : [secKey];
    let scriptHtml = '';
    let transHtml = '';
    let ansHtml = '';

    secs.forEach(sk => {
        const sObj = u.tracks[sk];
        scriptHtml += `<h3 style="color:var(--accent-teal);margin:14px 0 8px;">${sObj.label} — ${sObj.desc}</h3>`;
        sObj.script.forEach(line => {
            scriptHtml += `<div class="line-item">${line.replace(/^([^:]{1,25}:)/, '<b>$1</b>')}</div>`;
        });

        transHtml += `<h3 style="color:var(--accent-teal);margin:14px 0 8px;">${sObj.label}</h3>`;
        sObj.trans.forEach(line => {
            transHtml += `<div class="line-item">${line}</div>`;
        });

        ansHtml += `<h3 style="color:var(--primary-navy);margin:14px 0 8px;">${sObj.label}</h3>`;
        sObj.answers.forEach(a => {
            ansHtml += `<div class="ans-card"><span class="ans-key">${a.q_num}${a.answer ? ': ' + a.answer : ''}</span>${a.clue_analysis}</div>`;
        });
    });

    document.getElementById('tabScript').innerHTML = scriptHtml;
    document.getElementById('tabTrans').innerHTML = transHtml;
    document.getElementById('tabAns').innerHTML = ansHtml;
}

function togglePlay() {
    if (audio.paused) { audio.play(); playBtn.innerText = '⏸'; }
    else { audio.pause(); playBtn.innerText = '▶'; }
}
function skipTime(sec) { if (audio.duration) audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + sec)); }
function changeSpeed(val) { audio.playbackRate = parseFloat(val); }
function updateProgress() {
    if (!audio.duration || isNaN(audio.duration)) {
        document.getElementById('currentTime').innerText = '0:00';
        document.getElementById('totalTime').innerText = '0:00';
        return;
    }
    document.getElementById('scrubber').value = (audio.currentTime / audio.duration) * 100;
    document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
    document.getElementById('totalTime').innerText = formatTime(audio.duration);
}
function seekAudio(val) { if (audio.duration) audio.currentTime = (val / 100) * audio.duration; }
function onAudioEnded() { playBtn.innerText = '▶'; }
function formatTime(sec) { const m = Math.floor(sec/60), s = Math.floor(sec%60); return `${m}:${s<10?'0':''}${s}`; }
function switchTab(id, btn) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
}

window.onload = initApp;
</script>
</body>
