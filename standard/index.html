定位】'Central Hall... air chimney copied from African termite mounds' 對應 A。"}, {"q_num": "Q17", "answer": "B", "clue_analysis": "【原聲定位】'East Wall... bumpy metal sheets collecting morning fog' 對應 B。"}, {"q_num": "Q18", "answer": "D", "clue_analysis": "【原聲定位】'Narrow Alley... two tower walls close together to spin wind turbines' 對應 D。"}, {"q_num": "Q19", "answer": "F", "clue_analysis": "【原聲定位】'Control Desk... live thermal heat maps show cooler shaded street corners' 對應 F。"}, {"q_num": "Q20", "answer": "G", "clue_analysis": "【原聲定位】'Kitchen Terrace... vegetable beds watered with recycled shower water' 對應 G。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "建築系學生城市降溫與遮蔭模型專題討論 (Architecture Studio Heat Study)", "src": "./audio/Unit08_Section3.mp3", "qr": "./qr/unit08-s3.png", "script": ["Prof. Lindqvist: Come in, Marcus and Elena. Let's check your urban street cooling project.", "Marcus: Thanks, Professor! Our wind numbers look neat on screen.", "Prof. Lindqvist: The street widths and summer winds are fine, yes—but check your wall heat numbers! You treated concrete buildings as staying cool all evening, forgetting that thick stone walls absorb daytime sun and stay warm late into the night.", "Elena: Good catch—we'll add night-time wall heat to the model! For daytime wind, instead of widening roads or painting roofs white, we propose carving open sky-gardens right through tall office towers every ten floors so fast upper breezes drop down to street level.", "Prof. Lindqvist: Smart idea. What did you find comparing street trees?", "Elena: Well, everyone assumed evergreen pines were tough enough, yet wide-leaf plane trees shaded pavements and cooled the street air far better than pine needles!", "Prof. Lindqvist: Interesting. Now, when you present to the city planners next month, don't bore them with physics formulas—highlight how cooler shaded streets directly lower summer heatstroke cases and hospital visits.", "Marcus: Right, focus on public health savings! Also, Elena and I both want to visit Town Hall Street this Tuesday afternoon—not to interview shops, just to take real street-level temperature readings with our pocket meters.", "Prof. Lindqvist: Practical fieldwork, great! Now divide your studio jobs before Friday.", "Elena: I'll run the updated airflow computer simulation on the lab PC tonight.", "Marcus: Thanks. Meanwhile, I'll look up the exact heat-reflection numbers for brick and glass walls.", "Elena: Since we're both walking down to Town Hall Street on Tuesday at two, let's take those street temperature readings together.", "Marcus: Deal! What about gluing the 3D cardboard building model?", "Elena: Marcus, your hands are much steadier with a craft knife—would you build the cardboard model?", "Marcus: Sure, I enjoy model-making! And for the two-page summary for city planners, let's write that short report together on Thursday morning.", "Elena: Perfect, see you Tuesday!"], "trans": ["林德奎斯特教授：請進，馬庫斯和埃蓮娜。來看看你們的城市街道降溫專題。", "馬庫斯：謝謝教授！螢幕上的風速數據看起來很整齊。", "林德奎斯特教授：街道寬度和夏季風速都對——但檢查牆面熱度數字！你們假設水泥建築整晚都保持涼爽，忘了厚石牆白天吸飽陽光，晚上會一直維持高溫（concrete walls stay warm at night）。", "埃蓮娜：抓得好——我們會把夜間牆體放熱加進模型！至於白天引風，我們不拓寬馬路也不刷白屋頂，而是建議在摩天辦公大樓每隔十層開出通風空中花園（open sky-gardens in tall towers），把高空涼風引到地面街道。", "林德奎斯特教授：聰明設計。比較行道樹時發現了什麼？", "埃蓮娜：大家都以為松樹耐操，但寬葉法桐樹遮蔭並替街道空氣降溫的效果遠勝松樹（wide-leaf trees cooled streets far better than pine trees）！", "林德奎斯特教授：很有趣。下個月向都市規劃師報告時，別用物理公式讓他們無聊——強調涼爽街道能直接減少夏季中暑與醫院急診人數（reduce summer hospital visits）。", "馬庫斯：對，聚焦公共醫療省下的成本！另外埃蓮娜跟我都想週二下午去市政廳街一趟——不是去訪談店家，而是用隨身溫度計實測真實氣溫（take real temperature readings）。", "林德奎斯特教授：實地測量很棒！週五前分一下工吧。", "埃蓮娜：今晚我在實驗室電腦跑更新後的氣流模擬。", "馬庫斯：謝啦。同時我來查磚牆與玻璃帷幕的熱反射係數。", "埃蓮娜：既然週二兩點我們都要去市政廳街，那實測街道氣溫就一起進行。", "馬庫斯：成交！那黏貼 3D 紙板建築模型呢？", "埃蓮娜：馬庫斯你用美工刀手比較穩——紙板模型給你做可以嗎？", "馬庫斯：沒問題，我喜歡做模型！至於給規劃師的兩頁報告，週四早上我們一起寫。", "埃蓮娜：完美，週二見！"], "answers": [{"q_num": "Q21", "answer": "A", "clue_analysis": "【原聲定位】'forgetting that thick stone walls absorb daytime sun and stay warm late into the night' 選 A。"}, {"q_num": "Q22", "answer": "B", "clue_analysis": "【原聲定位】'carving open sky-gardens right through tall office towers' 選 B。"}, {"q_num": "Q23", "answer": "A", "clue_analysis": "【原聲定位】'wide-leaf plane trees... cooled the street air far better than pine needles' 選 A。"}, {"q_num": "Q24", "answer": "A", "clue_analysis": "【原聲定位】'directly lower summer heatstroke cases and hospital visits' 選 A。"}, {"q_num": "Q25", "answer": "B", "clue_analysis": "【原聲定位】'take real street-level temperature readings with our pocket meters' 選 B。"}, {"q_num": "Q26", "answer": "B", "clue_analysis": "【原聲定位】Elena: 'I'll run the updated airflow computer simulation' 選 B。"}, {"q_num": "Q27", "answer": "C", "clue_analysis": "【原聲定位】Elena: 'let's take those street temperature readings together' 選 C。"}, {"q_num": "Q28", "answer": "A", "clue_analysis": "【原聲定位】Marcus: 'I'll look up the exact heat-reflection numbers' 選 A。"}, {"q_num": "Q29", "answer": "A", "clue_analysis": "【原聲定位】Marcus: 'Sure, I enjoy model-making!' 選 A。"}, {"q_num": "Q30", "answer": "C", "clue_analysis": "【原聲定位】Marcus: 'let's write that short report together' 選 C。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Biophilic Metropolis: Biomimetic Engineering, Urban Heat Island Mitigation, and Microclimatic Design", "src": "./audio/Unit08_Section4.mp3", "qr": "./qr/unit08-s4.png", "script": ["▶ Section 1  ‧  The Urban Heat Island Effect and Thermodynamic Disequilibrium", "Section 1  Good morning. In today's architectural engineering and urban climatology lecture, we are confronting one of the most perilous environmental consequences of rapid global urbanization: the Urban Heat Island, or UHI effect. Across megacities worldwide, urban microclimates routinely register temperatures five to ten degrees Celsius higher than surrounding rural baselines. This thermodynamic imbalance stems directly from the anthropocentric materials of modern urban construction: vast expanses of low-albedo asphalt and dense concrete possess high thermal mass, greedily absorbing solar irradiance during the day and re-radiating sensible heat into the nocturnal boundary layer. Coupled with the canyon effect—tall skyscrapers trapping radiative flux—and the anthropogenic heat waste expelled by air conditioning chillers, our cities have become thermal entrapment zones.", "▶ Section 2  ‧  Biomimetic Passive Ventilation: The Termite Mound Model", "Section 2  To dismantle this thermal prison without relying on energy-intensive mechanical refrigeration, visionary architects are looking to nature: a design methodology known as biomimicry. The seminal paradigm of biomimetic microclimatic engineering is Harare's Eastgate Centre in Zimbabwe, designed by architect Mick Pearce. Pearce turned to an unlikely architectural master: macrotermes termites. Termites build towering, cathedral-like mounds that maintain a constant internal temperature of thirty degrees Celsius and stable humidity, even as external savannah temperatures fluctuate between freezing nights and scorching forty-degree days. The mound accomplishes this entirely through passive ventilation. Pores along the mound's base draw in cool subterranean air, while diurnal thermal gradients drive warm stale air upward through central exhaust chimneys via the stack effect. By replicating this passive convective mechanism using high-mass concrete slabs and natural wind currents, the Eastgate Centre operates without conventional air conditioning, consuming ninety percent less energy than conventional buildings of comparable scale.", "▶ Section 3  ‧  Vertical Vegetative Envelopes and Evapotranspirative Cooling", "Section 3  A second frontier in biophilic urbanism is the biological transformation of the building envelope through living green facades and vertical forests. While synthetic insulation merely resists conductive heat transfer, biological vegetation functions as an active thermo-regulatory membrane. Through the physiological process of evapotranspiration, plants absorb solar radiation and utilize sensible heat to convert liquid water into vapor, dramatically depressing localized ambient air temperatures. Furthermore, building-scale botanical envelopes—exemplified by Milan's Bosco Verticale—act as living acoustic and particulate filters. The dense biological foliage captures atmospheric PM2.5 particulates, mitigates street-level traffic reverberation, and shades structural concrete, lowering surface facade temperatures by up to twenty-five degrees Celsius during summer heat extremes.", "The Biophilic Metropolis: Biomimetic Engineering, Urban Heat Island Mitigation, and Microclimatic Design (Continued)", "▶ Section 4  ‧  High-Albedo Envelopes and Sub-Ambient Radiative Cooling", "Section 4  Complementing biophilic greenery, materials scientists are revolutionizing optical thermodynamics through passive daytime radiative cooling, or PDRC. Traditional high-albedo white coatings merely reflect visible light; however, cutting-edge nanophotonic metamaterials are engineered to reflect over ninety-six percent of solar irradiance while simultaneously emitting thermal infrared radiation directly into outer space through the Earth's 'atmospheric transmission window'—a narrow optical band between eight and thirteen micrometers where greenhouse gases are transparent. This extraordinary optical property enables building rooftops to cool below ambient outdoor air temperatures even under direct, unclouded midday sunlight, providing entirely electricity-free thermal relief to urban centers.", "▶ Section 5  ‧  Circular Urban Hydrology and Climate Resilience", "Section 5  Ultimately, transforming concrete jungles into climate-resilient biophilic metropolises demands a systemic paradigm shift in urban hydrology. Traditional civil engineering treated stormwater as a hazardous liability to be swiftly channeled away through concrete storm drains, precipitating urban flash flooding and depleting groundwater reservoirs. Modern 'sponge city' designs integrate permeable pavements, bioswales, and urban retention wetlands that absorb, filter, and reuse stormwater on-site. By harmonizing biomimetic passive airflow, vegetative transpiration, advanced radiative optics, and circular hydrology, sustainable urban architecture ceases to be an alien imposition upon the biosphere; rather, it becomes a regenerative ecological organ embedded within nature."], "trans": ["Section 1  大家早安。在今天的建築工程與都市氣候學講座中，我們將直面快速全球都市化所帶來的最嚴峻環境後果之一：都市熱島效應（Urban Heat Island, UHI）。在世界各地的超大城市中，都市微氣候的氣溫通常比周邊鄉村基準線高出五到十度。這種熱力學失衡直接源於現代都市建築的人造材料：大面積的低反射率瀝青與高密度混凝土具有巨大的「熱質量（thermal mass）」，在白天瘋狂吸收太陽輻射，並在夜間將顯熱持續釋放回大氣邊界層。加上高聳摩天大樓阻礙自然風流通並將輻射熱反覆反射困住的「都市峽谷效應（canyon effect）」，以及空調冷卻系統排放的大量人為廢熱，我們的城市實質上已演變為熱量陷阱。", "Section 2  為了瓦解這座散熱囚籠且不依賴高耗能的機械壓縮機冷卻，前瞻建築師開始師法自然：這項設計方法論即為「仿生學（biomimicry）」。仿生微氣候工程的里程碑典範，是由建築師米克·皮爾斯（Mick Pearce）在辛巴威哈拉雷設計的「東門購物中心（Eastgate Centre）」。皮爾斯向一位令人意想不到的建築宗師請益：大白蟻（macrotermes termites）。白蟻所築造的高聳如大教堂般的蟻丘，即使在外部稀樹草原氣溫於夜間冰點與白天攝氏四十度酷熱之間劇烈震盪時，內部始終能維持恆定的三十度氣溫與穩定濕度。蟻丘完全依賴「被動通風」來達成此神蹟：位於蟻丘底部的孔隙吸入地下清涼空氣，而白天的熱梯度透過熱煙囪效應（stack effect）將溫熱污濁空氣由中央排氣煙囪推向高空。透過利用高熱容混凝土樓板與自然風壓複製這種被動對流機制，東門中心在完全沒有傳統空調設備的條件下運作，其能耗比同等規模的常規建築大幅降低了百分之九十。", "Section 3  親生命都市主義（biophilic urbanism）的第二個前沿，是利用綠色植生立面與垂直森林對建築外護結構進行生物化重塑。傳統的合成隔熱材料僅僅是被動抵抗熱傳導；然而，生物植被卻能發揮主動的體溫調節膜功能。透過植物生理上的「蒸散作用（evapotranspiration）」，植被吸收太陽輻射並利用環境顯熱將液態水轉化為水蒸氣，從而顯著降低周圍的環境空氣溫度。此外，以米蘭「垂直森林（Bosco Verticale）」為代表的建築級植物外包層，兼具天然聲學與懸浮微粒過濾器的功效。茂密的植物葉片能捕捉大氣中的 PM2.5 顆粒物、吸收街道交通噪音迴響，並為建築實體混凝土提供遮蔽，在夏季酷暑期間能將外牆表面溫度大幅降低多達攝氏二十五度。", "Section 4  與親生命植被相輔相成的，是材料科學家透過「被動式日間輻射冷卻（PDRC）」對光學熱力學帶來的劃時代革命。傳統的高反射率白色塗料僅能反射可見光；然而，前沿的奈米光子超材料被設計為能夠反射超過百分之九十六的太陽輻射，同時將熱紅外線透過地球的「大氣透射窗口（atmospheric window）」——即大氣中溫室氣體幾乎全透明的八至十三微米狹窄光學波段——直接發射進深邃的宇宙外太空。這種超凡的光學特性使建築屋頂即使在晴朗無雲的正午陽光直射下，也能冷卻至低於室外環境空氣溫度的水平，為都市核心提供了完全零耗電的被動降溫奇蹟。", "Section 5  歸根結底，將水泥叢林改造為具備氣候韌性的親生命大都市，需要都市水文學的系統性範式轉移。傳統土木工程將暴雨徑流視為有害的負擔，透過混凝土雨水管渠迅速將其排入河流，導致都市暴雨洪澇頻發並枯竭地下水庫。現代「海綿城市（sponge city）」設計整合了透水鋪面、生態植草溝與都市調節濕地，能在地直接吸收、過濾並再利用雨水資源。透過完美諧調仿生被動氣流、植被蒸散、前沿輻射光學與循環水文代謝，永續都市建築將不再是對生物圈的突兀強加；相反地，它將昇華為深植於自然生態網絡中的再生有機體。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. mass  【原聲定位】Section 1: 'dense concrete possess high thermal mass'"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. termite  【原聲定位】Section 2: 'Pearce turned to an unlikely architectural master: macrotermes termites. Termites build towering... mounds...' 【解析】仿生動物學來源，填入單數或複數 termite / termites。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. stack  【原聲定位】Section 2: 'drive warm stale air upward through central exhaust chimneys via the stack effect.' 【解析】流體力學煙囪效應名詞，填入修飾詞 stack。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. vapor  【原聲定位】Section 3: 'convert liquid water into vapor, dramatically depressing localized ambient air temperatures.'"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. window  【原聲定位】Section 4: 'Earth's atmospheric transmission window'"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. sponge city  【原聲定位】Section 5: 'Modern sponge city designs integrate permeable pavements, bioswales, and urban retention wetlands...' 【解析】現代生態治水城市概念，填入名詞片語 sponge city。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 1: 'Coupled with the canyon effect—tall skyscrapers trapping radiative flux—and the anthropogenic heat waste...' 【解析】高聳摩天大樓阻礙空氣流動並困住輻射熱，對應選項 B。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. B  【原聲定位】Section 2: 'consuming ninety percent less energy than conventional buildings of comparable scale.' 【解析】被動對流使建築能耗大幅減少 90%，對應選項 B。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. B  【原聲定位】Section 4: 'reflect over ninety-six percent of solar irradiance while simultaneously emitting thermal infrared radiation directly into outer space...' 【解析】反射 96% 陽光並將紅外熱輻射發射至外太空窗口，對應選項 B。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. B  【原聲定位】Section 5: 'sustainable urban architecture ceases to be an alien imposition upon the biosphere; rather, it becomes a regenerative ecological organ embedded within nature.' 【解析】未來建築將成為深植於自然的再生生態器官，對應選項 B。"}]}}}, {"num": 9, "tag": "unit09", "folder": "商業管理與宏觀經濟", "chapter": "第三篇章 ‧ 當代治理、商業與前沿倫理（標準難度版）", "title": "Digital Platforms & Market Competition (Standard Edition)", "titleZh": "大學創業共享辦公桌租借、商業創新博覽會導覽與外送平台個案討論", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (標準難度 Sec 1–4)", "src": "./audio/Unit09_Full_Section1_to_4.mp3", "qr": "./qr/unit09.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "大學創業共享辦公空間租借諮詢 (Student Co-Working Desk Rental Enquiry)", "src": "./audio/Unit09_Section1.mp3", "qr": "./qr/unit09-s1.png", "script": ["Karen: Good morning, Campus Enterprise Hub, Karen speaking.", "Jeremy: Hi! We're a small student startup looking to rent desks for the new term.", "Karen: Lovely! Let me take your name first.", "Jeremy: Jeremy Collins. C-O-L-L-I-N-S.", "Karen: Thanks, Jeremy. And your mobile number?", "Jeremy: 07328... 504192.", "Karen: What kind of business are you building?", "Jeremy: A local parcel delivery app for small high-street shops.", "Karen: Great idea! How many desks do you need?", "Jeremy: Four of us started the app, though one partner took a bank internship, so it's just three partners needing desks now.", "Karen: Three desks, fine. We have space on the third floor of Building B—would you like to move in on Tuesday the 14th of October?", "Jeremy: October 14th works well. Is it an open hall?", "Karen: We have noisy open halls, or a quiet shared office with only two other teams—I'll put you in the quiet shared office.", "Jeremy: Quiet office sounds ideal! Does rent cover Wi-Fi and printing?", "Karen: Free fast Wi-Fi, plus free monthly colour printing credit and up to four hours per week in our glass meeting rooms.", "Jeremy: Fantastic! How much is it per desk?", "Karen: Outside businesses pay 120 pounds, while student startups pay 65 pounds per desk per month.", "Jeremy: Sixty-five pounds is super affordable. Thanks!"], "trans": ["凱倫：早安，校園創業中心，我是凱倫。", "傑瑞米：嗨！我們是一家學生新創，想租新學期的辦公桌。", "凱倫：太好了！先記下您的姓名？", "傑瑞米：傑瑞米・柯林斯（Jeremy Collins），C-O-L-L-I-N-S。", "凱倫：謝謝傑瑞米。手機號碼？", "傑瑞米：07328……504192。", "凱倫：你們在做什麼生意？", "傑瑞米：幫街邊小店做本地包裹配送（delivery）應用程式。", "凱倫：好點子！需要幾個位置？", "傑瑞米：原本四個人起家，但一位合夥人去銀行實習了，現在只有三位合夥人（3 partners）需要座位。", "凱倫：三個座位，好。B 棟三樓（third floor）有空位——10 月（October）14 日週二進駐方便嗎？", "傑瑞米：10 月 14 日可以。那是開放式大廳嗎？", "凱倫：有吵鬧的大廳，也有只跟另外兩隊共用的安靜共享辦公室（quiet shared office）——幫您排進安靜辦公室。", "傑瑞米：太理想了！租金含 Wi-Fi 和列印嗎？", "凱倫：高速 Wi-Fi 免費，還送每月彩色列印（printing）額度，外加每週（week）最多四小時玻璃會議室。", "傑瑞米：太讚了！一張桌子多少錢？", "凱倫：校外企業 120 英鎊，學生新創每張桌子每月只要 65 英鎊。", "傑瑞米：65 英鎊超划算，謝謝！"], "answers": [{"q_num": "Q1", "answer": "Collins", "clue_analysis": "【原聲定位】'Jeremy Collins. C-O-L-L-I-N-S.'"}, {"q_num": "Q2", "answer": "504192", "clue_analysis": "【原聲定位】'07328... 504192.'"}, {"q_num": "Q3", "answer": "delivery", "clue_analysis": "【原聲定位】'local parcel delivery app'"}, {"q_num": "Q4", "answer": "3 / three", "clue_analysis": "【原聲定位】'just three partners needing desks now'"}, {"q_num": "Q5", "answer": "third / 3rd", "clue_analysis": "【原聲定位】'on the third floor of Building B'"}, {"q_num": "Q6", "answer": "October", "clue_analysis": "【原聲定位】'Tuesday the 14th of October'"}, {"q_num": "Q7", "answer": "office", "clue_analysis": "【原聲定位】'quiet shared office'"}, {"q_num": "Q8", "answer": "printing", "clue_analysis": "【原聲定位】'free monthly colour printing credit'"}, {"q_num": "Q9", "answer": "week", "clue_analysis": "【原聲定位】'four hours per week'"}, {"q_num": "Q10", "answer": "65", "clue_analysis": "【原聲定位】'65 pounds per desk per month' 排除校外價 120。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "現代科技商業展覽會場導覽 (Modern Tech Business Fair Orientation)", "src": "./audio/Unit09_Section2.mp3", "qr": "./qr/unit09-s2.png", "script": ["Philip: Welcome everyone to the Tech Business and Fair Competition Expo! I'm Philip, the organiser.", "First, you'll see why a single social or shopping app often dominates an entire market. It isn't free offices or website costs—it's because each new buyer or seller makes the app far more useful for everyone else, locking competitors out!", "At 2:00 p.m., join our Startup Talk—not on icon design or hiring, but on why giant tech firms often buy out tiny rising startups simply to shut down future rivals.", "At our Search Engine booth, test how one search company quietly puts its own shopping links right at the top of the screen above smaller shops.", "A quick security rule for the Law Forum Hall: leave brochures in your bag, just keep a photo ID or student card ready to show at the door.", "And finally, our 5:00 p.m. closing speech has moved from the basement—please gather in the bright Main Glass Hall overlooking the river.", "Check out these five stands:", "Stand 1, Ad Zone, explains how free search apps make billions selling adverts to businesses.", "Stand 2, Taxi Desk, shows how computer pricing software on rival taxi apps can accidentally match the exact same high surge fares.", "Stand 3, Data Hub, demonstrates new tools letting users move their photos and friend lists smoothly to brand-new social apps.", "Stand 4, Pitch Stage, hosts young founders pitching five-minute business ideas to investors.", "And Stand 5, Shop Corner, shares real stories of small family cafés boosting sales online.", "Enjoy the expo!"], "trans": ["菲利普：歡迎大家來到科技商業與公平競爭博覽會！我是主辦人菲利普。", "首先您會看見為何單一購物或社群應用常常獨佔整個市場。不是因為免費辦公室——而是每多一位買家或賣家，軟體對其他人就變得更有用（each extra user makes the app more useful），把對手鎖在門外！", "下午兩點歡迎參加新創講座——主題不是設計圖示也不是招人，而是剖析巨頭為何常收購小型新創只為了提前消滅未來競爭對手（why giant firms buy small competing startups）。", "在搜尋引擎攤位，測試看看搜尋巨頭如何默默把自家商品連結擺在螢幕最上方（putting own products at the top），排在小型店家前面。", "法律論壇廳的入場規定：手冊放包裡沒關係，門口只需出示附照片證件或學生證（photo ID or student card）。", "最後，下午五點閉幕演講已從地下室移至俯瞰河景的明亮主玻璃大廳（Main Glass Hall）。", "推薦參觀五個攤位：", "1 號攤位廣告區（Ad Zone）解析免費搜尋服務如何靠賣企業廣告賺進數十億。", "2 號攤位計程車台（Taxi Desk）示範競爭對手的定價軟體如何意外同步開出同樣的高額動態加價。", "3 號攤位數據中心（Data Hub）演示讓用戶把照片和好友名單輕鬆搬去新社群軟體的工具。", "4 號攤位路演舞台（Pitch Stage）邀請年輕創辦人向投資人做五分鐘簡報。", "5 號攤位商店角（Shop Corner）分享家庭小咖啡廳成功轉型線上銷售的故事。", "祝逛展愉快！"], "answers": [{"q_num": "Q11", "answer": "A", "clue_analysis": "【原聲定位】'each new buyer or seller makes the app far more useful' 選 A。"}, {"q_num": "Q12", "answer": "B", "clue_analysis": "【原聲定位】'why giant tech firms often buy out tiny rising startups' 選 B。"}, {"q_num": "Q13", "answer": "A", "clue_analysis": "【原聲定位】'puts its own shopping links right at the top' 選 A。"}, {"q_num": "Q14", "answer": "B", "clue_analysis": "【原聲定位】'keep a photo ID or student card ready to show' 選 B。"}, {"q_num": "Q15", "answer": "A", "clue_analysis": "【原聲定位】'gather in the bright Main Glass Hall' 選 A。"}, {"q_num": "Q16", "answer": "A", "clue_analysis": "【原聲定位】'Stand 1, Ad Zone... free search apps make billions selling adverts' 對應 A。"}, {"q_num": "Q17", "answer": "B", "clue_analysis": "【原聲定位】'Stand 2, Taxi Desk... rival taxi apps match same high surge fares' 對應 B。"}, {"q_num": "Q18", "answer": "C", "clue_analysis": "【原聲定位】'Stand 3, Data Hub... move photos and friend lists to new social apps' 對應 C。"}, {"q_num": "Q19", "answer": "D", "clue_analysis": "【原聲定位】'Stand 4, Pitch Stage... founders pitching five-minute ideas' 對應 D。"}, {"q_num": "Q20", "answer": "E", "clue_analysis": "【原聲定位】'Stand 5, Shop Corner... small family cafés boosting sales online' 對應 E。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "商學院外送與叫車平台個案研究討論 (Business Case Study Discussion)", "src": "./audio/Unit09_Section3.mp3", "qr": "./qr/unit09-s3.png", "script": ["Prof. Sterling: Come in, Nathan and Sarah. Let's look at your business case on London food-delivery apps.", "Nathan: Thanks, Professor! We found one app holds 70% of the restaurant delivery market.", "Prof. Sterling: Your London figures are up to date, yes—but check your market definition! You only counted hot restaurant meals and completely forgot supermarket grocery delivery apps, which sell fast food and snacks too!", "Sarah: Oh, good point! We'll add grocery apps into our charts. Still, why do users stick with one taxi or delivery app even after prices go up? Not for birthday gifts or cash rules—switching to a new app, typing bank cards again, and learning new screens just feels annoying and slow!", "Nathan: Totally. And instead of splitting big tech companies up or raising taxes, Sarah and I suggest letting customers transfer their address lists and ratings freely to competing apps.", "Prof. Sterling: A sensible solution. For the business competition judges next week, avoid heavy European legal jargon—focus clearly on real benefits for everyday shoppers and lower costs.", "Sarah: Great advice! By the way, Professor, Nathan and I were both shocked when interviewing café owners to learn how much small restaurants actually pay in app commission fees—sometimes thirty percent of every meal!", "Nathan: Yeah, thirty percent blew both of us away!", "Prof. Sterling: Eye-opening numbers. Now split up your final jobs for Wednesday.", "Nathan: I'll collect the latest London delivery fee prices from five apps tonight.", "Sarah: Thanks, and I'll draw the colourful market share pie chart once you email those fees.", "Nathan: What about summarising the new European digital rules?", "Sarah: I read that booklet last week, so I'll write the European rules summary.", "Nathan: Awesome! Then I'll write the crisp one-page summary for the judges.", "Sarah: And on Tuesday afternoon, let's meet in Room 3 to practise our five-minute pitch together.", "Nathan: Deal!"], "trans": ["斯特林教授：請進，內森和莎拉。來看看你們的倫敦外送平台商業個案。", "內森：謝謝教授！我們發現單一平台佔了餐廳外送市場七成。", "斯特林教授：倫敦數據是最新的沒錯——但檢查市場範圍！你們只算了熟食餐廳，完全忘了生鮮超市外送軟體（forgot supermarket grocery apps），它們也賣熟食跟點心！", "莎拉：喔有道理！我們會把生鮮軟體加進圖表。另外為什麼漲價了用戶還不換叫車或外送軟體？不是因為生日優惠——而是換新軟體要重打銀行卡、學新介面感覺又煩又慢（feels annoying and slow）！", "內森：沒錯。與其把大公司拆掉或加稅，莎拉跟我建議讓顧客自由把地址和評價搬去競爭對手平台（transfer data freely）。", "斯特林教授：很合理的方案。下週向商賽評審簡報時，避開生硬歐洲法條術語——清楚聚焦對日常消費者的實際好處（real benefits for everyday shoppers）。", "莎拉：好建議！對了教授，內森跟我訪談咖啡店老闆時都很震驚，小餐廳付給平台的抽成竟然這麼高（how much small restaurants pay in app fees）——有時高達每餐三成！", "內森：對啊，30% 真的嚇到我們兩個！", "斯特林教授：很震撼的數據。週三前把最後工作分一分吧。", "內森：今晚我來蒐集五家倫敦外送軟體的最新外送費。", "莎拉：謝謝，你寄來後我來畫市場佔有率圓餅圖。", "內森：那歐洲新數位規範摘要呢？", "莎拉：上週我看過那本小冊子，歐洲規範摘要交給我。", "內森：太棒了！那我寫給評審看的精簡一頁摘要。", "莎拉：週二下午我們在 3 號房一起練習五分鐘簡報。", "內森：一言為定！"], "answers": [{"q_num": "Q21", "answer": "A", "clue_analysis": "【原聲定位】'completely forgot supermarket grocery delivery apps' 選 A。"}, {"q_num": "Q22", "answer": "B", "clue_analysis": "【原聲定位】'switching to a new app... just feels annoying and slow' 選 B。"}, {"q_num": "Q23", "answer": "B", "clue_analysis": "【原聲定位】'letting customers transfer their address lists and ratings freely' 選 B。"}, {"q_num": "Q24", "answer": "A", "clue_analysis": "【原聲定位】'focus clearly on real benefits for everyday shoppers' 選 A。"}, {"q_num": "Q25", "answer": "B", "clue_analysis": "【原聲定位】'shocked... how much small restaurants actually pay in app commission fees' 選 B。"}, {"q_num": "Q26", "answer": "A", "clue_analysis": "【原聲定位】Nathan: 'I'll collect the latest London delivery fee prices' 選 A。"}, {"q_num": "Q27", "answer": "B", "clue_analysis": "【原聲定位】Sarah: 'I'll draw the colourful market share pie chart' 選 B。"}, {"q_num": "Q28", "answer": "B", "clue_analysis": "【原聲定位】Sarah: 'I'll write the European rules summary' 選 B。"}, {"q_num": "Q29", "answer": "A", "clue_analysis": "【原聲定位】Nathan: 'I'll write the crisp one-page summary' 選 A。"}, {"q_num": "Q30", "answer": "C", "clue_analysis": "【原聲定位】Sarah: 'practise our five-minute pitch together' 選 C。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Creative Destruction Paradox: Platform Dominance, Network Externalities, and Contestable Markets", "src": "./audio/Unit09_Section4.mp3", "qr": "./qr/unit09-s4.png", "script": ["▶ Section 1  ‧  Schumpeterian Evolutionary Economics and Innovation Gales", "Section 1  Good morning, everyone. In today's macroeconomic theory and corporate strategy lecture, we will dissect one of the most celebrated and fiercely debated doctrines in industrial organization: Joseph Schumpeter's concept of 'creative destruction'. Writing in his landmark 1942 treatise, Capitalism, Socialism and Democracy, Schumpeter challenged the sterile equilibrium models of classical economics. He argued that capitalism is an inherently dynamic, evolutionary process driven not by marginal price competition among identical producers, but by perennial 'gales of creative destruction'. In this paradigm, visionary entrepreneurial insurgents introduce radically disruptive technologies or business models, dismantling entrenched incumbents and liberating capital for higher-productivity frontiers. Crucially, Schumpeter asserted that monopoly profits were inherently transient—a temporary entrepreneurial rent that would inevitably be eroded by the next wave of innovators.", "▶ Section 2  ‧  Multi-Sided Platforms and Direct/Indirect Network Moats", "Section 2  However, when we transition from twentieth-century smokestack industrial manufacturing to the contemporary digital platform economy, the Schumpeterian turnover mechanism appears to have suffered a profound structural malfunction. Modern tech conglomerates—specifically multisided platforms like Amazon, Alphabet, Meta, and Apple—operate under economic laws fundamentally distinct from traditional factories. Digital ecosystems are propelled by self-reinforcing network externalities. Direct network effects dictate that the utility of a platform scales exponentially with each additional user, while indirect network effects attract complementary third-party software developers and advertisers. When coupled with near-zero marginal costs of software distribution and vast, non-replicable data asymmetries, platform behemoths construct virtually impregnable economic moats that insulate them from Schumpeterian disruption.", "▶ Section 3  ‧  The Empirical Paradox: Declining Business Dynamism", "Section 3  This structural entrenchment has precipitated what macroeconomists define as the 'creative destruction paradox'. Despite living in an era ostensibly characterized by dazzling technological breakthroughs in artificial intelligence and ubiquitous digital connectivity, aggregate productivity growth across advanced OECD economies has steadily decelerated over the past two decades. Economists attribute this secular stagnation to a pervasive decline in business dynamism. Across North America and Western Europe, the rate of new startup formation has fallen by more than forty percent, industry concentration ratios have reached historic zeniths, and the profit margins of dominant market leaders have expanded without attracting competitive entry. In essence, the creative gale has been replaced by a stagnant technological oligopoly.", "The Creative Destruction Paradox: Platform Dominance, Network Externalities, and Contestable Markets (Continued)", "▶ Section 4  ‧  Killer Acquisitions, Venture Capital, and Market Foreclosure", "Section 4  How do incumbent tech platforms maintain their impervious hegemony? Empirical anti-trust investigations reveal widespread deployment of defensive strategies, chief among them being 'killer acquisitions'. Dominant platforms continually scan the venture capital landscape using proprietary telemetry data to identify nascent startup competitors long before they achieve critical commercial scale. The incumbent then acquires the fledgling startup at an exorbitant valuation solely to terminate its disruptive product development and absorb its engineering talent—preemptively neutralizing any existential threat. Moreover, venture capitalists increasingly refuse to finance startups in what they explicitly term the 'kill zone'—the digital domains controlled by platform giants. This creates systemic market foreclosure, choking off genuine radical innovation at its embryonic inception.", "▶ Section 5  ‧  Antitrust Jurisprudence and the New Brandeisian Paradigm", "Section 5  These anticompetitive realities have ignited a profound ideological civil war within antitrust jurisprudence. For over four decades, Western competition policy has been governed by the Chicago School's 'consumer welfare standard', formulated by Robert Bork. Under this doctrine, mergers and market concentration were deemed legally permissible so long as they did not produce immediate, measurable price increases for retail consumers. However, modern legal scholars spearheading the 'New Brandeis movement' argue that the consumer welfare standard is catastrophically blind to platform power. Digital platforms routinely offer consumer-facing services free of charge, monetizing instead via surveillance data and algorithmic advertising. Progressive antitrust enforcement is thus abandoning narrow price metrics, pivoting toward preserving market contestability, safeguarding worker wages against monopsony power, and structurally prohibiting dominant gatekeepers from preferencing their own proprietary services."], "trans": ["Section 1  大家早安。在今天的總體經濟學理論與企業策略講座中，我們將深入剖析產業組織學中最具盛名、同時也最具激烈爭議的學說之一：約瑟夫·熊彼得（Joseph Schumpeter）的「創造性破壞（creative destruction）」概念。在 1942 年出版的代表作《資本主義、社會主義與民主》中，熊彼得挑戰了古典經濟學將市場視為靜態死寂均衡的模型。他提出，資本主義本質上是一個動態演化的有機進程，其核心動力絕非源自同質製造商之間微小的邊際價格競爭，而是來自永不停歇的「創造性破壞風暴（gales of creative destruction）」。在此範式下，富有遠見的新創顛覆者引進劃時代的技術或商業模式，徹底瓦解背負沉重包袱的既有巨頭，進而將資本釋放至生產力更高的前沿領域。關鍵在於，熊彼得斷言壟斷利潤本質上只是「短暫的（transient）」——它純粹是開創者所獲取的暫時性超額租金，最終必將被下一波新興創新者所侵蝕蠶食。", "Section 2  然而，當我們從二十世紀冒著濃煙的傳統工業製造業，過渡至當代的數位平台經濟時，熊彼得式的市場更迭機制似乎遭遇了深刻的結構性癱瘓。現代科技巨頭——特別是亞馬遜、Alphabet、Meta 與蘋果等「多邊平台（multisided platforms）」——所遵循的經濟規律，與傳統工廠有著本質上的大相徑庭。數位生態系統由自我強化的「網絡外部性（network externalities）」所驅動。直接網絡效應意味著平台的實用價值會隨著每一位新增用戶呈指數級飆升，而間接網絡效應則能磁吸無數互補的第三方軟體開發者與廣告商。加上軟體分發幾乎為零的邊際成本（marginal costs），以及龐大且不可複製的用戶專有數據不對稱性，平台巨頭築起了實質上堅不可摧的經濟護城河，將自身與任何潛在的熊彼得式顛覆徹底隔絕開來。", "Section 3  這種結構性市場固化催生了總體經濟學家所謂的「創造性破壞悖論（creative destruction paradox）」。儘管我們表面上身處一個被人工智慧炫目突破與無所不在的數位連結所環繞的時代，但過去二十年間，先進 OECD 經濟體的全要素生產力成長卻持續呈現疲軟放緩。經濟學家將這種「長期停滯（secular stagnation）」歸咎於企業活力的全域性衰退。在北美與西歐，新創企業成立的速度大幅暴跌超過百分之四十，產業集中度攀升至歷史顛峰，而市場主導者的利潤率持續擴張，卻完全無法吸引具有威脅性的競爭者入場。本質上，曾經席捲市場的創新狂風，已被一灘死水般的數位寡頭壟斷所取代。", "Section 4  既有的科技平台巨頭究竟是如何維持其無懈可擊的霸權地位？實證反壟斷調查揭示了它們廣泛採取的防禦性策略，其中最具殺傷力的莫過於「扼殺式併購（killer acquisitions）」。主導平台利用內部專有的遙測大數據，持續在地毯式掃描創投圈動態，早在潛在對手初露鋒芒、尚未形成商業氣候前就將其精準鎖定。隨後，巨頭便以令人難以拒絕的天價估值將這家萌芽期的新創公司強行收購，其唯一目的僅僅是終止該顛覆性產品的開發並吸收其工程技術人才——從而在萌芽期先發制人地撲滅生存威脅。更嚴重的是，創投資本家如今公開拒絕投資任何處於科技巨頭掌控領域（被創投圈明確稱為『扼殺區 kill zone』）的新創公司。這形成了系統性的市場封鎖，在受精卵階段就掐死了真正顛覆性的激進創新。", "Section 5  這些反競爭現實，在反托拉斯法學界內部引爆了一場深刻的意識形態內戰。在過去四十年間，西方競爭政策始終由勞勃·波克（Robert Bork）所樹立的芝加哥學派「消費者福利標準（consumer welfare standard）」牢牢支配。在此教條下，只要併購與市場集中不導致終端零售價格的立即上漲，就被視為合法且良性。然而，由「新布蘭迪斯運動（New Brandeis movement）」所引領的現代法律學者痛批，消費者福利標準在面對數位平台霸權時已徹底淪為盲人摸象。數位平台習慣以表面「免費（free of charge）」的服務迷惑消費者，實則透過全面性的監控數據與演算法廣告進行暴利變現。因此，進步派反托拉斯執法正毅然拋棄狹隘的價格指標，轉向全力維護市場的可競爭性（contestability）、保障勞動者免受買方壟斷力量剝削，並從法律結構上嚴厲禁止平台守門人優待自身的專有服務。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. destruction  【原聲定位】Section 1: 'driven not by marginal price competition... but by perennial gales of creative destruction.' 【解析】熊彼得經典理論核心名詞，填入 destruction。"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. temporary  【原聲定位】Section 1: 'monopoly profits were inherently transient—a temporary entrepreneurial reward'"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. marginal  【原聲定位】Section 2: 'When coupled with near-zero marginal costs of software distribution...' 【解析】題幹 'incurs near-zero (33) ____________ costs'，填入修飾詞 marginal。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. dynamism  【原聲定位】Section 3: 'pervasive decline in business dynamism.'"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. killer  【原聲定位】Section 4: 'chief among them being killer acquisitions. Dominant platforms continually scan the venture capital landscape...' 【解析】題幹 'execute (35) ____________ acquisitions'，填入修飾詞 killer。"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. welfare  【原聲定位】Section 5: 'governed by the Chicago School's consumer welfare standard, formulated by Robert Bork.' 【解析】反托拉斯傳統標準名詞，填入 welfare。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 2: 'Direct network effects dictate that the utility of a platform scales exponentially with each additional user...' 【解析】用戶每增加一人，平台實用價值呈指數級增長，對應選項 B。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. B  【原聲定位】Section 4: 'venture capitalists increasingly refuse to finance startups in what they explicitly term the kill zone—the digital domains controlled by platform giants.' 【解析】創投拒絕注資的科技巨頭壟斷領域，對應選項 B。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. A  【原聲定位】Section 5: 'consumer welfare standard is catastrophically blind to platform power. Digital platforms routinely offer consumer-facing services free of charge, monetizing instead via surveillance data...' 【解析】過度聚焦短期價格而無視免費數據交換背後的結構性壟斷，對應選項 A。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. B  【原聲定位】Section 3 & 5: 'the creative gale has been replaced by a stagnant technological oligopoly... pivoting toward preserving market contestability...' 【解析】高進入壁壘與數據護城河有永久扼殺動態競爭之風險，對應選項 B。"}]}}}, {"num": 10, "tag": "unit10", "folder": "法律哲學與人工智慧倫理", "chapter": "第三篇章 ‧ 當代治理、商業與前沿倫理（標準難度版）", "title": "AI Ethics, Fairness & Autonomous Law (Standard Edition)", "titleZh": "大學科技與法律公開辯論登記、智慧法院導覽與自駕車責任專題討論", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (標準難度 Sec 1–4)", "src": "./audio/Unit10_Full_Section1_to_4.mp3", "qr": "./qr/unit10.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "大學人工智慧與法律公開辯論會報名 (Public AI & Law Debate Registration)", "src": "./audio/Unit10_Section1.mp3", "qr": "./qr/unit10-s1.png", "script": ["Ms. Vance: University Law Society, Ms. Vance speaking.", "Zachary: Hi! I'd like to book a seat for the evening public debate on AI and law.", "Ms. Vance: Sure! What is your full name?", "Zachary: Zachary Parker. P-A-R-K-E-R.", "Ms. Vance: Thanks, Zachary. And your phone number?", "Zachary: 07689... 341907.", "Ms. Vance: Which subject are you studying?", "Zachary: I'm a second-year law student.", "Ms. Vance: Wonderful, you'll love this topic—our speakers are debating who pays when a self-driving car crashes in heavy rain.", "Zachary: Sounds really interesting! Is it on Friday the 20th of November?", "Ms. Vance: Yes, November 20th, inside the Old Law Hall—not the library.", "Zachary: Old Law Hall, got it. When does it start?", "Ms. Vance: The debate begins at 6:45 p.m., though doors open at 6:15 p.m. so grab a seat early.", "Zachary: 6:15 p.m., noted. Where are student seats?", "Ms. Vance: Downstairs is reserved for professors, so student tickets are in the upper gallery section with a great view.", "Zachary: Great! Any food?", "Ms. Vance: Yes, free sandwiches and orange juice in the foyer beforehand.", "Zachary: Nice! How much is a ticket?", "Ms. Vance: Public visitors pay 12 pounds, and university students pay just 5 pounds.", "Zachary: Five pounds, perfect. Thank you!"], "trans": ["凡斯女士：大學法學會，我是凡斯女士。", "札克利：嗨！我想預訂晚間人工智慧與法律公開辯論會的座位。", "凡斯女士：好的！請問全名？", "札克利：札克利・帕克（Zachary Parker），P-A-R-K-E-R。", "凡斯女士：謝謝札克利。聯絡電話？", "札克利：07689……341907。", "凡斯女士：請問您主修什麼？", "札克利：我是法律（law）系二年級學生。", "凡斯女士：太好了，您一定會喜歡這主題——講者將辯論自駕車（car）在大雨中發生車禍時誰該負責。", "札克利：聽起來很有趣！是 11 月（November）20 日週五嗎？", "凡斯女士：是的，11 月 20 日，在舊法律大廳（Old Law Hall）——不是在圖書館。", "札克利：舊法律大廳，記下了。幾點開始？", "凡斯女士：辯論 6:45 開始，不過下午 6:15（6:15 p.m.）就會開放入場搶座位。", "札克利：6:15 開門，記下了。學生座位在哪區？", "凡斯女士：樓下保留給教授，學生票在視野很好的樓上旁聽席區（upper gallery section）。", "札克利：太好了！有食物嗎？", "凡斯女士：有，會前大廳免費提供三明治與柳橙汁（orange juice）。", "札克利：真棒！票價是多少？", "凡斯女士：一般民眾 12 英鎊，大學生只要 5 英鎊。", "札克利：5 英鎊，完美，謝謝您！"], "answers": [{"q_num": "Q1", "answer": "Parker", "clue_analysis": "【原聲定位】'Zachary Parker. P-A-R-K-E-R.'"}, {"q_num": "Q2", "answer": "341907", "clue_analysis": "【原聲定位】'07689... 341907.'"}, {"q_num": "Q3", "answer": "law", "clue_analysis": "【原聲定位】'second-year law student'"}, {"q_num": "Q4", "answer": "car", "clue_analysis": "【原聲定位】'self-driving car crashes'"}, {"q_num": "Q5", "answer": "November", "clue_analysis": "【原聲定位】'Friday the 20th of November'"}, {"q_num": "Q6", "answer": "Hall", "clue_analysis": "【原聲定位】'Old Law Hall—not the library'"}, {"q_num": "Q7", "answer": "6:15 / 6.15", "clue_analysis": "【原聲定位】'doors open at 6:15 p.m.' 排除 6:45 開始時間。"}, {"q_num": "Q8", "answer": "gallery", "clue_analysis": "【原聲定位】'upper gallery section'"}, {"q_num": "Q9", "answer": "juice", "clue_analysis": "【原聲定位】'sandwiches and orange juice'"}, {"q_num": "Q10", "answer": "5", "clue_analysis": "【原聲定位】'university students pay just 5 pounds' 排除一般民眾 12 鎊。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "智慧司法與科技法庭展示中心導覽 (Future Courtroom & Legal Tech Centre Tour)", "src": "./audio/Unit10_Section2.mp3", "qr": "./qr/unit10-s2.png", "script": ["Marcus: Welcome everyone to our Future Courtroom and Legal Tech Centre! I'm Judge Marcus Vance.", "First, you'll see software that predicts whether an accused person might miss bail. It isn't Wi-Fi drops or software prices that worry us—our strict rule is that computer scores can only advise a human judge, because machines cannot understand human fairness or explain moral decisions.", "In our Fairness Zone, learn about a famous US risk-scoring app tested by journalists. Rather than losing files, the app unfairly gave high risk scores twice as often to minority citizens who had the exact same past records!", "To fix secret 'black box' software, our 'Clear AI' screen helps lawyers by simply highlighting which specific facts—like past dates or addresses—pushed a score up or down.", "Inside our Evidence Room, digital security videos aren't burned onto DVDs—instead, every file gets a locked digital time stamp the second it's saved, proving nobody edited a single frame.", "If you want to watch our law students run live practice trials, come back to Chamber 1 every Wednesday afternoon at 2:00 p.m.", "Look around these five rooms:", "Room 1 is the Car Crash Simulator, testing how a self-driving car chooses between swerving or braking during a sudden crash.", "Room 2 is the Email Checker, where fast software scans two million company emails in ten seconds to find private lawyer letters.", "Room 3 is the Fake Video Lab, teaching police how to spot edited fake faces in security camera clips.", "Room 4 covers Smart Contracts—automatic online shipping agreements that release payment the instant cargo arrives at port.", "Finally, Room 5 is the Robot Rights Hall, where visitors vote on whether super-smart robots should ever hold legal rights like companies do.", "Let's step into Room 1!"], "trans": ["馬庫斯：歡迎來到未來法庭與法律科技中心！我是馬庫斯・凡斯法官。", "首先您會看到預測被告保釋風險的軟體。我們擔心的不是 Wi-Fi 斷線或價格——嚴格規定電腦分數只能給人類法官作參考，因為機器無法理解人類公平或解釋道德判決（machines cannot explain moral decisions）。", "在公平性展區，了解記者實測過的一款著名美國風險軟體。它不是檔案遺失，而是面對同樣紀錄時，給少數族裔打高風險分數的機率高達兩倍（unfair high scores to minority groups）！", "為了解決「黑箱」問題，我們的「透明 AI」螢幕會標出究竟是哪些具體事實推高或拉低分數（highlights which facts shaped the score）。", "在證據室裡，監視器畫面不再燒成光碟——每份檔案在儲存瞬間都會加上不可篡改的鎖定時間戳記（locked time stamp）。", "想看法律系學生進行模擬庭審，每週三下午兩點（Wednesday afternoons at two）歡迎來 1 號廳旁聽。", "推薦參觀五個展室：", "1 號房撞車模擬器（Car Crash Simulator）測試自駕車在突發狀況下如何閃避或煞車。", "2 號房電郵檢查器（Email Checker）示範軟體十秒掃描兩百萬封信件挑出機密律師函。", "3 號房假影片實驗室（Fake Video Lab）教警方辨認監視器裡的合成假臉。", "4 號房智慧合約（Smart Contracts）展示貨物一到港就自動撥款的線上合約。", "最後 5 號房機器人權利廳（Robot Rights Hall）讓訪客投票討論未來聰明機器人是否應享有法律權利。", "我們進 1 號房吧！"], "answers": [{"q_num": "Q11", "answer": "A", "clue_analysis": "【原聲定位】'machines cannot understand human fairness or explain moral decisions' 選 A。"}, {"q_num": "Q12", "answer": "B", "clue_analysis": "【原聲定位】'unfairly gave high risk scores twice as often to minority citizens' 選 B。"}, {"q_num": "Q13", "answer": "A", "clue_analysis": "【原聲定位】'highlighting which specific facts... pushed a score up or down' 選 A。"}, {"q_num": "Q14", "answer": "B", "clue_analysis": "【原聲定位】'every file gets a locked digital time stamp' 選 B。"}, {"q_num": "Q15", "answer": "B", "clue_analysis": "【原聲定位】'every Wednesday afternoon at 2:00 p.m.' 選 B。"}, {"q_num": "Q16", "answer": "A", "clue_analysis": "【原聲定位】'Room 1... Car Crash Simulator, self-driving car chooses' 對應 A。"}, {"q_num": "Q17", "answer": "B", "clue_analysis": "【原聲定位】'Room 2... Email Checker, scans two million emails' 對應 B。"}, {"q_num": "Q18", "answer": "C", "clue_analysis": "【原聲定位】'Room 3... Fake Video Lab, spot edited fake faces' 對應 C。"}, {"q_num": "Q19", "answer": "D", "clue_analysis": "【原聲定位】'Room 4... Smart Contracts, online shipping agreements' 對應 D。"}, {"q_num": "Q20", "answer": "E", "clue_analysis": "【原聲定位】'Room 5... Robot Rights Hall, whether robots should hold legal rights' 對應 E。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "法律系學生自駕車責任與AI法規專題討論 (Law Student Moot Essay Discussion)", "src": "./audio/Unit10_Section3.mp3", "qr": "./qr/unit10-s3.png", "script": ["Dean Vance: Come in, Julian and Helena. Let's review your moot court essay on self-driving car accidents.", "Julian: Thanks, Dean Vance! In Chapter 1, we asked whether advanced AI should hold its own legal identity.", "Dean Vance: Careful there! Robots can't go to prison or pay out of personal pockets. If you treat software like an independent person, greedy tech companies could hide behind empty robot shells to dodge big compensation fines!", "Helena: That makes total sense! That's why I added a comparison to old sea law—treating a ship like an insured fund, where owners must keep compulsory ship accident insurance ready to pay victims.", "Dean Vance: Much better! Julian, why did you say normal 'employer responsibility' rules struggle with smart software?", "Julian: Normally a boss pays only for foreseeable worker mistakes. Yet self-learning software adapts on the road and makes unexpected choices no programmer could foresee!", "Dean Vance: Precisely. That's why the new European AI law is clever—it doesn't ban self-driving vans or force free code, it simply insists on strict safety checks for high-risk tools before they hit the market.", "Helena: We'll highlight those pre-market checks. Any tips for our final oral speech?", "Dean Vance: Judges dislike sci-fi guesses—just quote real past court cases from the law library!", "Julian: Real past cases, got it! Thanks, Dean Vance. Helena, let's divide our writing jobs.", "Julian: I'll write the short history of how companies first got legal rights in old courts.", "Helena: Great, and I'll summarise those European safety check rules we just talked about.", "Julian: I already printed the court reports, so I'll collect five famous car accident cases too.", "Helena: Nice! Then I'll sketch out our shared safety insurance fund model.", "Julian: And on Friday morning, let's practise our three-minute opening speech together.", "Helena: Agreed!"], "trans": ["凡斯院長：請進，朱利安和海倫娜。我們來看看你們關於自駕車事故的模擬法庭論文。", "朱利安：謝謝院長！第 1 章我們討論先進 AI 是否該擁有獨立法律身分。", "凡斯院長：這點要小心！機器人不能坐牢也沒有個人存款。如果把軟體當獨立法人，科技公司可能會躲在空殼機器人背後逃避鉅額賠償罰款（hide behind robots to avoid fines）！", "海倫娜：很有道理！所以我加了古老海事法的類比——把船隻當成強制投保船舶意外險（ship accident insurance）的賠償基金。", "凡斯院長：好多了！朱利安，為什麼你說傳統「僱主責任」很難套用在智慧軟體上？", "朱利安：通常老闆只替可預見的員工失誤負責，但自我學習軟體在路上會不斷適應並做出連工程師都預料不到的決定（makes unexpected choices）！", "凡斯院長：正是如此。所以歐盟新 AI 法很聰明——不禁止自駕貨車也不強迫公開程式碼，而是規定高風險工具上市前必須通過嚴格安全檢查（checks high-risk tools before sale）。", "海倫娜：我們會強調上市前安檢。對口頭演講還有什麼建議嗎？", "凡斯院長：法官不喜歡科幻猜想——引述圖書館裡的真實法院判例（quote real past court cases）就對了！", "朱利安：真實判例，收到！謝謝院長。海倫娜，我們分配一下寫作工作。", "朱利安：我來寫企業法人過去在舊法院取得法律權利的簡史。", "海倫娜：好，那我來摘要剛剛提到的歐盟安全檢查規定。", "朱利安：我已經印好判決書了，順便蒐集五個著名車禍判例。", "海倫娜：太好了！那我來草擬共同安全保險基金架構。", "朱利安：週五早上我們一起練習三分鐘開場演講。", "海倫娜：同意！"], "answers": [{"q_num": "Q21", "answer": "A", "clue_analysis": "【原聲定位】'companies could hide behind empty robot shells to dodge big compensation fines' 選 A。"}, {"q_num": "Q22", "answer": "B", "clue_analysis": "【原聲定位】'comparison to old sea law... compulsory ship accident insurance' 選 B。"}, {"q_num": "Q23", "answer": "A", "clue_analysis": "【原聲定位】'self-learning software... makes unexpected choices no programmer could foresee' 選 A。"}, {"q_num": "Q24", "answer": "A", "clue_analysis": "【原聲定位】'insists on strict safety checks for high-risk tools before they hit the market' 選 A。"}, {"q_num": "Q25", "answer": "B", "clue_analysis": "【原聲定位】'Judges dislike sci-fi guesses—just quote real past court cases' 選 B。"}, {"q_num": "Q26", "answer": "A", "clue_analysis": "【原聲定位】Julian: 'I'll write the short history of how companies first got legal rights' 選 A。"}, {"q_num": "Q27", "answer": "B", "clue_analysis": "【原聲定位】Helena: 'I'll summarise those European safety check rules' 選 B。"}, {"q_num": "Q28", "answer": "A", "clue_analysis": "【原聲定位】Julian: 'I'll collect five famous car accident cases' 選 A。"}, {"q_num": "Q29", "answer": "B", "clue_analysis": "【原聲定位】Helena: 'I'll sketch out our shared safety insurance fund model' 選 B。"}, {"q_num": "Q30", "answer": "C", "clue_analysis": "【原聲定位】Julian: 'practise our three-minute opening speech together' 選 C。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Algorithmic Tribunal: Autonomous Agency, Moral Alignment, and the Jurisprudence of Artificial Intelligence", "src": "./audio/Unit10_Section4.mp3", "qr": "./qr/unit10-s4.png", "script": ["▶ Section 1  ‧  The Rise of Algorithmic Adjudication in Modern Justice", "Section 1  Good morning, everyone. In today's jurisprudence and legal philosophy lecture, we will confront what is arguably the most radical transformation of legal systems since the codification of civil law: the integration of autonomous algorithms into judicial administration. Across contemporary Western jurisdictions, machine learning models are no longer peripheral administrative aids; they are actively deployed in bail determinations, recidivism risk assessments, and criminal sentencing guidelines. The ostensible justification for algorithmic adjudication is impartiality. Human judges are demonstrably vulnerable to cognitive fatigue, emotional bias, and extraneous physiological variables—a phenomenon famously demonstrated in studies showing that judicial leniency drops precipitously immediately prior to meal breaks. By deploying mathematical decision trees, legal technocrats promised to purge human subjectivity, establishing a perfectly objective, metric-driven tribunal.", "▶ Section 2  ‧  The Black-Box Dilemma and Procedural Due Process", "Section 2  However, this algorithmic promise collides head-on with the foundational constitutional bedrock of modern democracy: procedural due process. A cornerstone of natural justice is that any individual subject to state deprivation of liberty possesses the fundamental right to know the precise legal reasoning behind their adjudication. Yet modern deep neural networks operate as inscrutable 'black boxes'. Their internal logic is distributed across hundreds of billions of high-dimensional mathematical weight vectors, making it mathematically impossible for human judges—or even the computer scientists who authored the models—to extract a coherent causal explanation for a specific judicial prediction. When an algorithm recommends denying parole without providing an interpretable legal rationale, it violates the defendant's constitutional right to a transparent defense, reducing human judicial deliberation to opaque computational divination.", "▶ Section 3  ‧  Algorithmic Bias: The Statistical Mirror of Injustice", "Section 3  A second devastating critique centers on the myth of mathematical neutrality. Algorithms do not operate in an abstract mathematical vacuum; they are trained on historical institutional datasets. If decades of historical criminal justice data reflect systemic racial disparities, over-policing of marginalized neighborhoods, and socio-economic profiling, an algorithm does not eliminate that discrimination—it institutionalizes and codifies it. Consider proprietary risk assessment instruments like COMPAS, which evaluate a defendant's likelihood of reoffending. Independent audits demonstrated that these algorithmic systems produce asymmetric error rates: false positive flags—incorrectly categorizing a non-reoffending defendant as high-risk—occur at twice the rate for minority defendants compared to their counterparts. Under the guise of statistical objectivity, algorithms effectively launder historical human injustice through the sanitized veneer of predictive mathematics.", "The Algorithmic Tribunal: Autonomous Agency, Moral Alignment, and the Jurisprudence of Artificial Intelligence (Continued)", "▶ Section 4  ‧  Autonomous Agency and Legal Liability Allocation", "Section 4  Beyond judicial sentencing, the proliferation of fully autonomous systems—such as autonomous algorithmic trading bots and autonomous surgical robotics—forces a profound reappraisal of tort jurisprudence. In classical Anglo-American tort law, liability hinges on culpability: an identifiable human actor must have exhibited intentional malice, reckless disregard, or provable negligence. However, when an autonomous system trained via reinforcement learning acts unpredictably without explicit programmer instructions, who bears legal liability? Traditional product liability models, which treat software as a physical manufacturing defect, collapse when an AI system behaves adaptively in unforeseen environments. Legal theorists are intensely debating whether to apply the common law doctrine of 'respondeat superior'—treating AI as an autonomous agent under a principal-agent framework—or even whether to confer synthetic 'electronic legal personhood' upon autonomous entities, backed by mandatory compulsory insurance funds.", "▶ Section 5  ‧  Constitutional AI and the Alignment Imperative", "Section 5  Looking toward the horizon of artificial general intelligence, the ultimate jurisprudential dilemma is the 'value alignment problem'. How do we program complex, evolving machine intelligences to respect immutable constitutional values: human dignity, bodily inviolability, and procedural justice? Technologists and legal philosophers are pioneering the framework of 'Constitutional AI', embedding explicit deontological constraints directly into the reinforcement learning fine-tuning process. Ultimately, the integration of artificial intelligence into the law forces human civilization to answer an existential question: do we view justice merely as an optimization problem to be solved with predictive precision, or as an inherently human moral covenant that can never be delegated to non-sentient silicon?"], "trans": ["Section 1  大家早安。在今天的法理學與法律哲學講座中，我們將直面可以說是自民法法典化以來法律體系所面臨的最激進變革：自主演算法深度整合至司法行政之中。在當代西方司法管轄區中，機器學習模型已不再僅僅是邊緣性的行政輔助工具；它們已被積極部署於保釋金裁定、再犯風險評估以及刑事量刑指引之中。引入演算法審判表面上的正當化理由是「客觀公正性」。實證研究證實，人類法官極易受到認知疲勞、情緒偏見以及無關生理變數的干擾——最著名的案例是研究顯示，法官的假釋寬宥率在用餐休息前夕會出現斷崖式暴跌。透過部署數學決策樹，法律技術官僚承諾能夠徹底清除人類的主觀偏頗，建立一個完全客觀、數據驅動的公正審判席。", "Section 2  然而，這項演算法的美好承諾，卻與現代民主憲政的基石產生了正面劇烈衝擊：即「正當法律程序（procedural due process）」。自然正義的立憲基石在於，任何面臨國家剝奪其人身自由的個體，皆享有獲悉其判決背後具體法律理由的根本權利。然而，現代深度神經網絡本質上卻是一座座難以透視的「黑盒子（black boxes）」。其內部邏輯分散於數千億個高維度數學權重向量之中，使得人類法官——甚至當初撰寫模型的電腦科學家——在數學上都根本無法提取出特定司法預測背後的連貫因果解釋。當演算法在不提供任何可解釋法律理據的情況下建議拒絕假釋時，它實質剝奪了被告進行透明辯護的憲法權利，將嚴肅的人類司法審議退化成了晦澀難懂的計算占卜。", "Section 3  第二項毀滅性的批判直指「數學中立性」的虛妄神話。演算法絕非在純淨無暇的抽象數學真空中運算；它們完全是依託歷史司法數據集訓練而成。倘若數十年來的歷史刑事司法數據充滿了系統性的種族偏見、對邊緣族群社區的過度執法以及社會經濟層面的偏見標籤，演算法非但無法消除這些歧視，反而會將其「體制化與法典化」。以 COMPAS 這類專門評估被告再犯機率的專利風險評估工具為例：獨立審計證實，這些演算法系統產生了極度不對稱的錯誤率——其中「假陽性錯誤」（即錯誤將實際上未再犯的被告標記為高風險分子）在少數族裔被告身上的發生率，是其他族群的整整兩倍。在統計客觀性的偽裝下，演算法實質上透過預測數學的光鮮外衣，將歷史上的人類不公進行了制度性的「洗白」。", "Section 4  除了司法量刑，全自主系統的激增——如自主高頻演算法交易機器人與自主手術機器人——更迫使侵權行為法理進行全面性的深刻反思。在傳統英美侵權法中，責任歸屬始終繫於「可歸責性（culpability）」：必須存在一位可識別的人類行動者展現了故意惡意、重大過失或可證明的疏忽。然而，當一個透過強化學習訓練的自主系統在沒有明確程式設計師指令的情況下自主採取了不可預測的行動時，究竟該由誰承擔法律責任？將軟體視同實體產品製造瑕疵的傳統產品責任法，在 AI 系統面對未知環境展現動態適應行為時徹底失效。法學理論家目前正激烈爭辯是否應套用普通法中的「雇主責任（respondeat superior）」原則——將 AI 視為委任代理架構下的自主代理人——甚至是否應賦予自主實體以強制保險基金為後盾的「電子法人格（electronic legal personhood）」。", "Section 5  展望通用人工智慧的未來地平線，終極的法理學難題乃是「價值對齊問題（value alignment problem）」。我們究竟該如何為不斷演化的高階機器智慧注入不可動搖的憲法價值：人類尊嚴、身體不可侵犯性以及程序正義？電腦技術專家與法律哲學家正共同開拓「憲法級人工智慧（Constitutional AI）」的嶄新架構，將明確的義務論倫理約束直接嵌入強化學習的微調流程之中。歸根結底，將人工智慧引入法律體系，迫使人類文明必須直面一個存在主義的靈魂拷問：我們究竟是將正義僅僅視為一個可用預測精度來解決的數學優化問題，抑或是將其視為一項絕不可委託給無感知矽基晶片的、人類神聖且不可讓渡的道德契約？"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. bias  【原聲定位】Section 1: 'vulnerable to cognitive fatigue, emotional bias'"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. due process  【原聲定位】Section 2: 'procedural due process. A cornerstone of natural justice is that any individual... possesses the fundamental right to know the precise legal reasoning...' 【解析】憲法正當程序原則，填入 due process。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. black  【原聲定位】Section 2: 'modern deep neural networks operate as inscrutable black boxes.' 【解析】題幹已有 boxes，填入修飾詞 black。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. error / false positive  【原聲定位】Section 3: 'these algorithmic systems produce asymmetric error rates: false positive flags... occur at twice the rate...' 【解析】考查統計指標名詞，填入 error 或 false positive。"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. negligence  【原聲定位】Section 4: 'intentional malice, reckless disregard, or provable negligence.'"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. Constitutional  【原聲定位】Section 5: 'pioneering the framework of Constitutional AI, embedding explicit deontological constraints directly into the reinforcement learning...' 【解析】專有名詞學派名稱，首字母大寫填入 Constitutional。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 1: 'promised to purge human subjectivity, establishing a perfectly objective, metric-driven tribunal.' 【解析】承諾清除人類主觀偏見與生理疲勞變數，對應選項 B。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. B  【原聲定位】Section 3: 'false positive flags—incorrectly categorizing a non-reoffending defendant as high-risk—occur at twice the rate for minority defendants...' 【解析】少數族裔被錯誤標記為高風險的假陽性機率高出兩倍，對應選項 B。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. B  【原聲定位】Section 4: 'when an autonomous system trained via reinforcement learning acts unpredictably without explicit programmer instructions...' 【解析】自主適應且無明確人為程式指令導致因果責任斷裂，對應選項 B。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. B  【原聲定位】Section 5: 'justice merely as an optimization problem to be solved with predictive precision, or as an inherently human moral covenant that can never be delegated to non-sentient silicon?' 【解析】正義是人類的道德契約，絕不能簡化降格為矽基運算優化，對應選項 B。"}]}}}];
let currentUnitIndex = 0;
let currentSecKey = 'full';
const audio = document.getElementById('audioPlayer');
const playBtn = document.getElementById('playBtn');

function initApp() {
    const listContainer = document.getElementById('unitList');
    UNITS_DATA.forEach((u, idx) => {
        const card = document.createElement('div');
        card.className = 'unit-card';
        card.onclick = () => selectUnit(idx, 'full');
        card.innerHTML = `
            <div class="unit-tag">Unit ${String(u.num).padStart(2, '0')} ‧ ${u.folder}</div>
            <div class="unit-name">${u.titleZh}</div>
            <div class="unit-sub">${u.title.split(':')[0]}</div>
        `;
        listContainer.appendChild(card);
    });

    let initIdx = 0;
    let initSec = 'full';
    const hash = window.location.hash.toLowerCase();
    const m = hash.match(/unit(\d+)(?:-(s[1-4]))?/);
    if (m) {
        const uNum = parseInt(m[1], 10);
        const found = UNITS_DATA.findIndex(u => u.num === uNum);
        if (found !== -1) initIdx = found;
        if (m[2]) initSec = m[2];
    }
    selectUnit(initIdx, initSec);
}

function selectUnit(idx, secKey='full') {
    currentUnitIndex = idx;
    document.querySelectorAll('.unit-card').forEach((c, i) => c.classList.toggle('active', i === idx));
    selectSection(secKey, false);
}

function selectSection(secKey, updateHash=true) {
    currentSecKey = secKey;
    const u = UNITS_DATA[currentUnitIndex];
    const t = u.tracks[secKey] || u.tracks.full;

    document.querySelectorAll('.sec-pill').forEach(b => b.classList.toggle('active', b.dataset.sec === secKey));
    document.getElementById('dispTitle').innerText = `Unit ${String(u.num).padStart(2, '0')}: ${u.titleZh} — ${t.label}`;
    document.getElementById('dispSpeaker').innerText = secKey === 'full'
        ? `完整全真 40 題模擬（Section 1 ➔ Section 2 ➔ Section 3 ➔ Section 4）`
        : `情境主題：${t.desc}`;

    audio.src = t.src;
    audio.playbackRate = parseFloat(document.getElementById('speedSelect').value);
    audio.load();
    playBtn.innerText = '▶';
    document.getElementById('downloadLink').href = t.src;
    document.getElementById('qrDisplay').src = t.qr;
    document.getElementById('qrLabel').innerText = `📱 掃碼直達 Unit ${String(u.num).padStart(2, '0')} (${t.label})`;

    if (updateHash) {
        const targetHash = secKey === 'full' ? `#${u.tag}` : `#${u.tag}-${secKey}`;
        history.replaceState(null, '', targetHash);
    }

    renderTabs(u, secKey);
}

function renderTabs(u, secKey) {
    const secs = secKey === 'full' ? ['s1', 's2', 's3', 's4'] : [secKey];
    let scriptHtml = '';
    let transHtml = '';
    let ansHtml = '';

    secs.forEach(sk => {
        const sObj = u.tracks[sk];
        scriptHtml += `<h3 style="color:var(--accent-teal);margin:14px 0 8px;">${sObj.label} — ${sObj.desc}</h3>`;
        sObj.script.forEach(line => {
            scriptHtml += `<div class="line-item">${line.replace(/^([^:]{1,25}:)/, '<b>$1</b>')}</div>`;
        });

        transHtml += `<h3 style="color:var(--accent-teal);margin:14px 0 8px;">${sObj.label}</h3>`;
        sObj.trans.forEach(line => {
            transHtml += `<div class="line-item">${line}</div>`;
        });

        ansHtml += `<h3 style="color:var(--primary-navy);margin:14px 0 8px;">${sObj.label}</h3>`;
        sObj.answers.forEach(a => {
            ansHtml += `<div class="ans-card"><span class="ans-key">${a.q_num}${a.answer ? ': ' + a.answer : ''}</span>${a.clue_analysis}</div>`;
        });
    });

    document.getElementById('tabScript').innerHTML = scriptHtml;
    document.getElementById('tabTrans').innerHTML = transHtml;
    document.getElementById('tabAns').innerHTML = ansHtml;
}

function togglePlay() {
    if (audio.paused) { audio.play(); playBtn.innerText = '⏸'; }
    else { audio.pause(); playBtn.innerText = '▶'; }
}
function skipTime(sec) { if (audio.duration) audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + sec)); }
function changeSpeed(val) { audio.playbackRate = parseFloat(val); }
function updateProgress() {
    if (!audio.duration || isNaN(audio.duration)) {
        document.getElementById('currentTime').innerText = '0:00';
        document.getElementById('totalTime').innerText = '0:00';
        return;
    }
    document.getElementById('scrubber').value = (audio.currentTime / audio.duration) * 100;
    document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
    document.getElementById('totalTime').innerText = formatTime(audio.duration);
}
function seekAudio(val) { if (audio.duration) audio.currentTime = (val / 100) * audio.duration; }
function onAudioEnded() { playBtn.innerText = '▶'; }
function formatTime(sec) { const m = Math.floor(sec/60), s = Math.floor(sec%60); return `${m}:${s<10?'0':''}${s}`; }
function switchTab(id, btn) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
}

window.onload = initApp;
</script>
</body>
</html>
