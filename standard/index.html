<script>
const UNITS_DATA = [{"num": 1, "tag": "unit01", "folder": "環境科學與地球物理", "chapter": "第一篇章 ‧ 自然科學與尖端科技（標準難度版）", "title": "The Atlantic Conveyor: Ocean Circulation & Climate (Standard Edition)", "titleZh": "海洋環境保護、極地氣候中心導覽與洋流專題報告", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (標準難度 Sec 1–4)", "src": "./audio/Unit01_Full_Section1_to_4.mp3", "qr": "./qr/unit01.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "海岸環境清潔與水質志願日報名 (Coastal Eco-Volunteer Day Registration)", "src": "./audio/Unit01_Section1.mp3", "qr": "./qr/unit01-s1.png", "script": ["Coordinator: Good morning, North Coast Marine Volunteers. Brenda speaking. How can I help?", "Mark: Hi! I'd like to sign up for the weekend coastal volunteer day.", "Coordinator: Lovely! Let me take down a few details first. What is your full name?", "Mark: It's Mark Bennett. That's B-E-N-N-E-T-T.", "Coordinator: Thanks, Mark. And a contact phone number?", "Mark: 07892... 541890.", "Coordinator: Great. And what is your postcode so we can send your pass?", "Mark: It's LS4 9TG.", "Coordinator: LS4 9TG, got it. We have two teams running on the day: the wildlife count team and the beach clean-up team. Which would you prefer?", "Mark: Let's go with the beach clean-up team, please.", "Coordinator: Wonderful. Now, the date is Saturday the 14th of July.", "Mark: July 14th, fine. Where do we meet?", "Coordinator: Our coach picks everyone up right outside the town museum—not the railway station this time, because of roadworks.", "Mark: Outside the town museum, okay. And what time does the coach leave? Nine o'clock?", "Coordinator: Well, we aim to reach the beach by nine, so the bus actually leaves at 8:30 a.m.", "Mark: 8:30, good thing I checked! What should I bring with me?", "Coordinator: The sea breeze can be chilly, so please bring a warm waterproof jacket.", "Mark: Sure. Do I need to bring food or work gloves?", "Coordinator: No need! We provide thick work gloves and a packed lunch for everyone.", "Mark: Oh, that's great. Is there any fee at all?", "Coordinator: Participation is free, though we take a refundable deposit if you borrow our waterproof boots. It used to be 25 pounds, but we reduced it to 15 pounds this year.", "Mark: Fifteen pounds, no problem. Thanks very much!"], "trans": ["協調員：早安，北海岸海洋志願者協會，我是布蘭達。請問有什麼可以幫您的？", "馬克：嗨！我想報名參加週末的海岸志願日。", "協調員：太好了！我先登記您的基本資料。請問您的全名是？", "馬克：我是馬克・班奈特（Mark Bennett），拼寫是 B-E-N-N-E-T-T。", "協調員：謝謝馬克。聯絡電話是？", "馬克：07892……541890。", "協調員：好的。請問您的郵遞區號是多少，方便我們寄送通行證？", "馬克：是 LS4 9TG。", "協調員：LS4 9TG，記下了。當天有兩個分組：野生動物統計組與淨灘清潔（clean-up）組。您比較想參加哪一組？", "馬克：請幫我選淨灘清潔組。", "協調員：太棒了。日期是 7 月（July）14 日週六。", "馬克：7 月 14 日，沒問題。我們在哪裡集合？", "協調員：我們的接駁巴士會在鎮立博物館（museum）門口接大家——這次不在火車站，因為那邊正在修路。", "馬克：在鎮立博物館外面，好的。巴士幾點發車？九點嗎？", "協調員：嗯，我們目標九點抵達海灘，所以巴士實際上在上午 8:30（8:30 a.m.）發車。", "馬克：8:30，還好我有確認！我需要自己帶什麼東西嗎？", "協調員：海風會比較冷，請務必帶一件保暖防水外套（jacket）。", "馬克：好的。我需要自備食物或工作手套嗎？", "協調員：不用！我們會為每個人提供厚工作手套與一份盒裝午餐（packed lunch）。", "馬克：太好了。需要任何費用嗎？", "協調員：參加是免費的，但如果您要借用防水雨靴需要付一筆可退還押金。以前是 25 英鎊，但今年我們調降為 15 英鎊。", "馬克：15 英鎊，沒問題。非常感謝！"], "answers": [{"q_num": "Q1", "answer": "Bennett", "clue_analysis": "【原聲定位】'Mark Bennett. That's B-E-N-N-E-T-T.' 考核雙寫 N 與雙寫 T 之日常姓氏拼寫。"}, {"q_num": "Q2", "answer": "541890", "clue_analysis": "【原聲定位】'07892... 541890.' 六位電話數字聽寫。"}, {"q_num": "Q3", "answer": "9TG", "clue_analysis": "【原聲定位】'It's LS4 9TG.' 題幹已有 LS4，填入 9TG。"}, {"q_num": "Q4", "answer": "clean-up / cleanup", "clue_analysis": "【原聲定位】'the beach clean-up team' 排除 wildlife count 干擾項，填 clean-up。"}, {"q_num": "Q5", "answer": "July", "clue_analysis": "【原聲定位】'Saturday the 14th of July' 填入月份 July。"}, {"q_num": "Q6", "answer": "museum", "clue_analysis": "【原聲定位】'outside the town museum—not the railway station' 排除火車站干擾，填 museum。"}, {"q_num": "Q7", "answer": "8:30 / 8.30", "clue_analysis": "【原聲定位】'bus actually leaves at 8:30 a.m.' 排除抵達時間 9:00 干擾。"}, {"q_num": "Q8", "answer": "jacket", "clue_analysis": "【原聲定位】'bring a warm waterproof jacket' 填入 jacket。"}, {"q_num": "Q9", "answer": "lunch", "clue_analysis": "【原聲定位】'thick work gloves and a packed lunch' 填入 lunch。"}, {"q_num": "Q10", "answer": "15", "clue_analysis": "【原聲定位】'reduced it to 15 pounds this year' 排除去年 25 鎊干擾，填 15。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "北海岸海洋氣象訪客中心導覽 (Coastal Ocean & Weather Centre Orientation)", "src": "./audio/Unit01_Section2.mp3", "qr": "./qr/unit01-s2.png", "script": ["Guide: Hello everyone, and welcome to the North Coast Ocean and Weather Centre! My name is Tom, and I'll be showing you around today.", "You might notice the building looks brand new. Some visitors assume we rebuilt it after the big winter storm damaged our old roof, or to switch to solar power. Actually, those were minor updates—the main reason for last year's rebuild was to give us a much larger exhibition hall for visiting school groups.", "Out in the bay, you'll see our bright yellow ocean buoys. Years ago, buoys only had lights to guide boats in fog. Today's models carry smart sensors that measure sea temperature and send live wave and wind warnings straight to local fishermen's phones.", "A favourite stop for families is our Arctic Room. Don't worry, there's no real ice to slip on, and our live satellite link to Greenland is under repair this week. Instead, you can step inside for two minutes to feel freezing polar temperatures—about minus fifteen degrees!", "Next door is the Ocean Tank area. You're very welcome to take photos—even with flash—and children can gently touch the glass walls. We only ask that you do not bring any food or hot drinks inside that room.", "Also, don't miss our 20-minute film about ocean currents. Normally it plays at 11:00 a.m., followed by a talk at 12:15, but today the projector needed fixing, so the film will start at 11:30 a.m.", "Now let's look at your map to see where everything is.", "If you like history, head first to the Old Boathouse next to the car park, which holds historical diving suits and old shipping maps.", "Inside the Blue Room, just past reception, there is a ten-metre wave tank where staff demonstrate how ocean tides and currents work.", "Upstairs on the Roof Deck, we've set up free telescopes so you can spot seals resting on the rocks offshore.", "Down in the Basement Lab, school children can try a fun water-testing station to measure how salty different sea samples are.", "Finally, when you're ready for a break, step outside into the Courtyard, where you'll find wooden picnic tables and our small coffee cart.", "Enjoy your visit!"], "trans": ["導覽員：大家好，歡迎來到北海岸海洋與氣象中心！我叫湯姆，今天由我為大家導覽。", "大家可能會發現這棟建築看起來很新。有些訪客以為我們去年重建是因為冬季大風暴損壞了舊屋頂，或是為了安裝太陽能。其實那些只是小翻修——去年重建最主要的原因是為了給來訪的學生團體提供一個更大的展覽大廳（larger exhibition hall）。", "在海灣裡，您會看到我們亮黃色的海洋浮標。多年前浮標只有警示燈在霧中指引船隻；今天的浮標裝有智慧感測器，能測量海溫並將即時的浪高與風力警報（live wave and wind warnings）直接傳送到當地漁民的手機上。", "家庭遊客最愛的一站是北極體驗室。別擔心，裡面沒有真的冰塊會讓人滑倒，而我們連往格陵蘭的即時衛星視訊本週正在維修。不過，您可以走進去兩分鐘，親身感受攝氏零下 15 度的極地冰寒氣溫（freezing polar temperatures）。", "隔壁是海洋水箱區。非常歡迎大家拍照（開閃光燈也沒問題），小朋友也可以輕觸玻璃牆面。我們唯一的規定是請勿攜帶任何食物或熱飲（food or hot drinks）進入該展間。", "另外別錯過我們 20 分鐘的洋流短片。平時是上午 11:00 播放，接著 12:15 有講座，但今天投影機需要檢修，所以影片將於上午 11:30 開始（start at 11:30 a.m.）。", "現在請看手中地圖了解各區位置。", "喜歡歷史的訪客可先去停車場旁的舊船屋（Old Boathouse），那裡陳列著歷史潛水服與古航海地圖。", "剛過接待處的藍廳（Blue Room）裡有一個十公尺造浪水槽，工作人員會示範潮汐與洋流如何運作。", "樓上的屋頂觀景台（Roof Deck）架設了免費望遠鏡，讓您可以觀察在離岸礁石上休息的海豹。", "樓下的地下室實驗室（Basement Lab）設有適合學童體驗的水質檢測站，可以測量不同海水的鹹度。", "最後想休息時，請走出戶外來到中庭（Courtyard），那裡有木製野餐桌與一台小咖啡餐車。", "祝各位參觀愉快！"], "answers": [{"q_num": "Q11", "answer": "B", "clue_analysis": "【原聲定位】'the main reason for last year's rebuild was to give us a much larger exhibition hall' 排除屋頂損壞(A)與太陽能(C)干擾，選 B。"}, {"q_num": "Q12", "answer": "C", "clue_analysis": "【原聲定位】'send live wave and wind warnings straight to local fishermen's phones' 選 C。"}, {"q_num": "Q13", "answer": "B", "clue_analysis": "【原聲定位】'step inside for two minutes to feel freezing polar temperatures' 排除真冰(A)與維修中的視訊(C)，選 B。"}, {"q_num": "Q14", "answer": "B", "clue_analysis": "【原聲定位】'only ask that you do not bring any food or hot drinks inside' 拍照與摸玻璃皆允許，選 B。"}, {"q_num": "Q15", "answer": "B", "clue_analysis": "【原聲定位】'Normally it plays at 11:00... so the film will start at 11:30 a.m.' 時間修正選 B。"}, {"q_num": "Q16", "answer": "E", "clue_analysis": "【原聲定位】'Old Boathouse... historical diving suits and old shipping maps' 對應 E。"}, {"q_num": "Q17", "answer": "D", "clue_analysis": "【原聲定位】'Blue Room... ten-metre wave tank demonstrate how ocean tides work' 對應 D。"}, {"q_num": "Q18", "answer": "C", "clue_analysis": "【原聲定位】'Roof Deck... free telescopes so you can spot seals on the rocks' 對應 C。"}, {"q_num": "Q19", "answer": "G", "clue_analysis": "【原聲定位】'Basement Lab, school children try a fun water-testing station' 對應 G。"}, {"q_num": "Q20", "answer": "F", "clue_analysis": "【原聲定位】'Courtyard... wooden picnic tables and our small coffee cart' 對應 F。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "大學生洋流與氣候報告課堂討論 (Geography Student Presentation Discussion)", "src": "./audio/Unit01_Section3.mp3", "qr": "./qr/unit01-s3.png", "script": ["Dr. Vance: Come in, Emma and Jack. Let's look at your slides for Friday's geography presentation on ocean currents.", "Emma: Thanks, Dr. Vance. We finished reading the main background article yesterday.", "Jack: Yeah, what really amazed both of us was how fast the cold, salty water actually sinks in the far north—within days rather than months!", "Emma: I expected it to be much slower too. Oh, and Dr. Vance, we wrote four slides about early nineteenth-century ocean explorers.", "Dr. Vance: Hmm, the 1850 logbooks are accurate enough, and nobody else is covering them. The real issue is that you only have ten minutes to speak, so you simply don't have time for that historical background.", "Emma: Right, we'll cut that history part out. Jack, how did you get on with the sea temperature chart?", "Jack: It took ages! Not because of the software—my laptop worked fine—but I found two different ocean websites that gave completely conflicting figures for the 1990s.", "Dr. Vance: Stick to the official Met Office dataset; it's the clearest.", "Emma: Good idea. Also, Jack, looking at our draft, I feel it's quite heavy on theory. Should we add more everyday examples, like how weather in Britain is affected?", "Jack: Definitely! Everyday examples will keep the class awake. Our maps look fine as they are, though.", "Dr. Vance: I agree. Now, before Friday, you don't need to email me your script or hunt for extra papers. Just sit down with a stopwatch and practise timing your talk together so you finish smoothly.", "Emma: Will do, thanks! Now Jack, let's check our slide list quickly.", "Jack: First, the large colour map of the Atlantic Ocean currents. Dr. Vance liked it—should we trim any labels?", "Emma: No, it's crystal clear. Let's keep it as it is.", "Jack: Great. Next is the graph of Greenland ice melt. It currently covers three full slides.", "Emma: That's way too long. Let's cut it down to just one simple slide.", "Jack: Fine, we'll shorten it. What about those four photos of the research ship?", "Emma: Honestly, they don't add much to the science. Let's leave them out completely.", "Jack: Fair enough. And the list of recent government climate reports?", "Emma: Wait—everyone will get bored reading twelve titles on screen, though mentioning two key ones is helpful. Let's shorten that list to just the top two.", "Jack: Good call. Finally, our closing summary of future weather risks?", "Emma: That's our strongest part! Let's definitely keep it as it is.", "Jack: Agreed. Let's go grab a coffee and rehearse the timing!"], "trans": ["凡斯博士：請進，艾瑪和傑克。我們來看看你們週五地理課洋流報告的投影片。", "艾瑪：謝謝凡斯博士。我們昨天看完了主要的背景文章。", "傑克：對啊，最讓我們兩個驚訝的是極北海域的冷鹹水下沉速度竟然那麼快（how quickly cold water sinks）——幾天內就完成了，而不是好幾個月！", "艾瑪：我也以為會慢很多。對了凡斯博士，我們寫了四頁關於十九世紀早期航海探險家的內容。", "凡斯博士：嗯，1850 年的航海日誌數據滿準的，也沒有其他組報這個。真正的問題是你們只有十分鐘報告時間，根本沒時間講那些歷史背景（too little speaking time）。", "艾瑪：好，那我們把歷史那段刪掉。傑克，海溫圖表做得怎麼樣？", "傑克：花了好久！不是軟體問題——我電腦很順——而是我查到兩個不同的海洋網站，對 1990 年代的數據給了完全矛盾的數字（two websites gave different figures）。", "凡斯博士：統一用氣象局的官方數據集就好，最清楚。", "艾瑪：好主意。還有傑克，看我們的初稿，我覺得理論太重了。我們要不要多加一些日常生活例子，像是英國天氣如何受影響？", "傑克：絕對要！日常例子（more simple everyday examples）能讓全班保持專注。至於螢幕上的地圖這樣就很好了。", "凡斯博士：我同意。那麼週五之前，你們不需要把逐字稿寄給我，也不用再找新論文。只要拿碼錶一起練習計時講完（practise timing their talk together），確保收尾順暢就好。", "艾瑪：沒問題，謝謝教授！傑克，我們快速核對一下投影片清單吧。", "傑克：第一是北大西洋洋流的彩色大地圖。凡斯博士很喜歡——要刪減一些標籤嗎？", "艾瑪：不用，已經一清二楚了。照原樣保留（Keep it as it is）。", "傑克：好。接下來是格陵蘭融冰圖表，目前占了整整三頁。", "艾瑪：太長了，濃縮成一頁簡單的就好。", "傑克：好，我們縮短它（Shorten it）。那四張科考船照片呢？", "艾瑪：老實說對科學說明沒什麼幫助，整組拿掉（Leave it out）吧。", "傑克：有道理。那近期政府氣候報告清單呢？", "艾瑪：螢幕上列十二個標題大家會看到無聊，不過提兩個重點報告還是有幫助。我們縮短成只留前兩個。", "傑克：好決定。最後是未來天氣風險總結？", "艾瑪：那是我們最強的部分！一定要原樣保留。", "傑克：同意。我們去買杯咖啡開始練習計時吧！"], "answers": [{"q_num": "Q21", "answer": "A", "clue_analysis": "【原聲定位】'what really amazed both of us was how fast the cold, salty water actually sinks in the far north' 選 A。"}, {"q_num": "Q22", "answer": "B", "clue_analysis": "【原聲定位】'you only have ten minutes to speak, so you simply don't have time' 選 B。"}, {"q_num": "Q23", "answer": "B", "clue_analysis": "【原聲定位】'two different ocean websites that gave completely conflicting figures' 選 B。"}, {"q_num": "Q24", "answer": "A", "clue_analysis": "【原聲定位】Emma: 'add more everyday examples' / Jack: 'Definitely!' 兩人一致同意選 A。"}, {"q_num": "Q25", "answer": "B", "clue_analysis": "【原聲定位】'sit down with a stopwatch and practise timing your talk together' 選 B。"}, {"q_num": "Q26", "answer": "A", "clue_analysis": "【原聲定位】'Map... Let's keep it as it is.' 對應 A。"}, {"q_num": "Q27", "answer": "B", "clue_analysis": "【原聲定位】'Greenland ice melt... cut it down to one simple slide... we'll shorten it.' 對應 B。"}, {"q_num": "Q28", "answer": "C", "clue_analysis": "【原聲定位】'photos of the research ship... Let's leave them out completely.' 對應 C。"}, {"q_num": "Q29", "answer": "B", "clue_analysis": "【原聲定位】'government climate reports... shorten that list to just the top two.' 對應 B。"}, {"q_num": "Q30", "answer": "A", "clue_analysis": "【原聲定位】'summary of future weather risks... keep it as it is.' 對應 A。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Atlantic Conveyor: Ocean Circulation, Marine Geophysical Dynamics, and Climate Tipping Points", "src": "./audio/Unit01_Section4.mp3", "qr": "./qr/unit01-s4.png", "script": ["▶ Section 1  ‧  Introduction to the Global Thermohaline Circulation", "Section 1  Good morning, everyone. In today's lecture on physical oceanography and climate dynamics, we are going to examine one of the most fundamental planetary regulatory mechanisms on Earth: the global thermohaline circulation, widely known in popular science as the great ocean conveyor belt. Now, when most people think of oceanic currents, they envision surface phenomena driven primarily by atmospheric wind patterns, such as the trade winds, combined with the Coriolis force. However, what truly governs deep-sea transport is not the surface breeze, but profound differences in water density. As the etymology suggests, 'thermo' refers to temperature, while 'haline' denotes salinity. Together, these two geophysical variables determine seawater buoyancy. The engine of this planetary conveyor in the Northern Hemisphere is the Atlantic Meridional Overturning Circulation, or AMOC. Without the constant northward heat flux delivered by this system, the climatic equilibrium of Western Europe would resemble the sub-Arctic conditions of Labrador.", "▶ Section 2  ‧  Physical Mechanics of Deep-Water Formation", "Section 2  Let us trace the physical trajectory of this water mass. Warm, highly saline surface water originates in equatorial regions and travels northward via the Gulf Stream. As it reaches subpolar latitudes in the Nordic and Labrador Seas, two critical transformations occur simultaneously. First, the water loses vast quantities of sensible heat to the freezing atmosphere—an exchange equivalent to roughly one petawatt of power. Second, sea-ice formation expels salt back into the surrounding liquid through a process known as brine rejection, significantly elevating localized salinity. The resulting frigid, salt-dense water becomes exceptionally heavy and plunges downward through chimney-like vertical columns to the ocean floor. This localized phenomenon is termed 'deep-water formation'. Once at the abyssal depths, this newly formed North Atlantic Deep Water flows southward, creating a powerful hydrodynamic suction that draws more tropical surface water northward. It is, in essence, a giant thermal siphon.", "▶ Section 3  ‧  Freshwater Forcing and the Dilution Threat", "Section 3  Now, what happens when this delicate density balance is disturbed? Contemporary climate observations reveal an alarming influx of freshwater into the subpolar North Atlantic. Due to anthropogenic warming, the Greenland ice sheet is losing mass at an accelerating rate—shedding over two hundred and eighty billion tons of ice annually. Crucially, glacial meltwater contains virtually zero salt. When this massive volume of buoyant freshwater discharges into the convective zones, it acts as a low-density lid, floating atop the denser marine layers and diluting overall salinity. Consequently, the surface water cannot achieve the critical density threshold required to sink. As oceanographers have documented, this freshwater forcing functions as an invisible brake on deep-water formation, weakening the circulation velocity of the AMOC by approximately fifteen percent since the mid-twentieth century.", "The Atlantic Conveyor: Ocean Circulation, Marine Geophysical Dynamics, and Climate Tipping Points (Continued)", "▶ Section 4  ‧  Paleoclimatic Precedents and Non-Linear Tipping Points", "Section 4  To understand the existential stakes of this deceleration, paleoclimatologists examine geological ice core archives from the Pleistocene and Holocene epochs. These historical proxy records reveal that the AMOC is inherently non-linear; it possesses a bistable regime. In other words, ocean circulation does not slow down smoothly in direct proportion to warming; rather, it can abruptly cross a critical tipping point and collapse entirely. Roughly twelve thousand eight hundred years ago, during the Younger Dryas event, the catastrophic release of catastrophic volumes of glacial meltwater from prehistoric Lake Agassiz shut down the conveyor in a matter of decades. The consequences were staggering: average temperatures across the North Atlantic basin plunged by up to ten degrees Celsius within a single generation, triggering severe megadroughts across the Sahel and destabilizing equatorial monsoon systems worldwide.", "▶ Section 5  ‧  Cascading Feedbacks and Future Projections", "Section 5  Looking toward future projections, a total or partial cessation of the AMOC would set off cascading feedback loops throughout the Earth system. Firstly, the cessation of northward thermal redistribution would cause dramatic regional cooling across the United Kingdom and Scandinavia, severely depressing agricultural growing seasons. Paradoxically, the thermal energy trapped in the southern hemisphere would accelerate the warming of the Southern Ocean, triggering runaway melting of the Antarctic ice shelves. Furthermore, ocean stagnation would drastically reduce the marine uptake of atmospheric carbon dioxide. Currently, cold sinking waters sequester gigatons of anthropogenic carbon into deep benthic reservoirs. If deep-water formation ceases, this biological and chemical carbon pump will fail, leaving excess carbon in the atmosphere and intensifying global planetary warming. Ultimately, monitoring the AMOC is not merely an academic exercise; it is an urgent geophysical imperative for human civilizational resilience."], "trans": ["Section 1  大家早安。在今天的物理海洋學與氣候動力學演講中，我們將深入探討地球上最核心的行星調控機制之一：全球溫鹽環流（thermohaline circulation），在科普領域中常被稱為「大洋輸送帶」。大多數人想到洋流時，往往只聯想到由大氣風場（如信風）與科氏力驅動的表層現象。然而，真正主宰深海物質輸送的並非表層微風，而是深層海水的密度差異。正如詞源所示，「thermo」代表溫度，「haline」代表鹽度；這兩個地球物理變數共同決定了海水的浮力。北半球這個行星傳送帶的核心引擎是大西洋經向翻轉環流（AMOC）。如果沒有這個系統持續向北輸送龐大熱量，西歐的氣候平衡將會劇降至類似拉布拉多地區的亞北極酷寒。", "Section 2  讓我們追蹤這股水團的物理運動軌跡。溫暖且高鹽度的表層海水發源於赤道海域，透過墨西哥灣暖流向北奔流。當它抵達北歐海與拉布拉多海等次極地緯度時，會同時發生兩大關鍵轉變。首先，海水向冰冷的極地大氣釋放大量顯熱，其能量交換相當於約一拍瓦（petawatt）的功率。其次，海冰凍結過程中透過「鹽析排鹽（brine rejection）」機制將鹽分排回周圍水體中，大幅提升局部的海水鹽度。劇烈冷卻與高鹽度的結合，使表層水團變得極度緻密沉重，並透過如煙囪般的垂直對流通道沉降至數千公尺的大洋底部。這一局部物理過程被稱為「深水形成（deep-water formation）」。沉入深淵的北大西洋深層水開始向南流動，形成強大的流體力學抽吸作用，進一步牽引熱帶暖水北上，本質上宛如一個行星級的巨大熱虹吸管。", "Section 3  然而，當這種微妙的密度平衡遭受破壞時會發生什麼？當代氣候觀測揭示了次極地北大西洋令人擔憂的淡水大量湧入現象。由於人為暖化，格陵蘭冰蓋正以加速度消融——每年流失超過兩千八百億噸的冰體。關鍵在於，冰川融水幾乎不含任何鹽分。當這股龐大體積的高浮力淡水注入對流海域時，它宛如一層低密度封蓋漂浮在濃稠的海水上方，急遽稀釋了周圍鹽度。這導致表層海水無法達到下沉所需的臨界密度門檻。正如海洋學家所證實，這種淡水強迫機制對深水形成起到了無形的制動減速作用，自二十世紀中葉以來，已使 AMOC 的環流流速減緩了約百分之十五。", "Section 4  為了理解這場環流減速背後的生存危機，古氣候學家深入分析了更新世與全新世的地質冰芯檔案。這些歷史代用指標紀錄揭示：AMOC 本質上具有非線性特徵，具備「雙穩態機制（bistable regime）」。換句話說，海洋環流並非隨著全球暖化而平滑且等比例地減速；相反地，它可能在達到臨界點後突發性地跨越臨界值並全面崩潰。約在一萬兩千八百年前的「新仙女木事件（Younger Dryas）」期間，史前阿加西茲湖（Lake Agassiz）冰川融水的毀滅性潰決，在短短數十年間就迫使大西洋輸送帶徹底停擺。其後果令人震驚：北大西洋盆地平均氣溫在短短一個世代內驟降高達攝氏十度，引發撒哈拉南緣薩赫爾地區的世紀大旱，並嚴重擾亂了全球赤道季風系統。", "Section 5  展望未來的氣候預測模型，AMOC 的局部或全面停擺將在整個地球系統中引發連鎖級聯的反饋效應。首先，北方熱量再分配的中斷將使英國與斯堪地那維亞半島遭遇極端嚴寒，嚴重摧毀農業生長季。矛盾的是，滯留在南半球的大量熱能將加速南大洋暖化，引發南極冰架失控融化。此外，海洋深層循環停滯將急遽削弱海洋吸收大氣二氧化碳的能力。目前，冰冷下沉的深層海水將數十億噸的人為碳排放封存至深海底層沉積中；若深水形成中斷，這個生物與化學碳泵將面臨停擺，使過量溫室氣體滯留於大氣中，進一步加劇全球劇烈暖化。因此，監測 AMOC 絕非單純的學術探索，而是攸關人類文明永續生存的緊急地球物理防線。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. density  【原聲定位】Section 1: 'what truly governs deep-sea transport is not the surface breeze, but profound differences in water density.' 【解析】題幹 'governed by differences in water...' 準確同義替換原聲句型，空格需填不可數名詞 density。"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. salt  【原聲定位】Section 2: 'sea-ice formation expels salt back into the surrounding liquid through a process known as brine rejection...' 【解析】題幹 'expelling (32) ____________ into the surrounding ocean'，原聲以 expels salt 直接呼應，答案為 salt。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. deep-water formation  【原聲定位】Section 2: 'This localized phenomenon is termed deep-water formation.' 【解析】題目引號提示為專有名詞術語，原聲講者使用 'is termed' 作為定義路標詞，精準定位 deep-water formation。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. lid  【原聲定位】Section 3: 'it acts as a low-density lid, floating atop the denser marine layers...' 【解析】演講者以明喻修辭 'acts as a low-density lid' 形容浮在海面的淡水層，符合題幹 'acting like a low-density (34) ____________'。"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. 15 / fifteen  【原聲定位】Section 3: 'weakening the circulation velocity of the AMOC by approximately fifteen percent since the mid-twentieth century.' 【解析】考查數字聽取，注意 'by approximately 15 percent' 對應題幹 'diminished by approximately (35) ____________ percent'。"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. tipping point  【原聲定位】Section 4: 'rather, it can abruptly cross a critical tipping point and collapse entirely.' 【解析】微調自原詞 bistable，選取同句高頻實詞 tipping point。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 4: 'the catastrophic release of catastrophic volumes of glacial meltwater from prehistoric Lake Agassiz shut down the conveyor...' 【解析】演講明確指出新仙女木事件的直接誘因是阿加西茲湖的大量融水潰決，對應選項 B。A 與 C 原文未提及或屬於干擾項。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. C  【原聲定位】Section 5: 'Paradoxically, the thermal energy trapped in the southern hemisphere would accelerate the warming of the Southern Ocean...' 【解析】原聲以路標詞 'Paradoxically' 引導熱能蓄積在南半球引發異常暖化，精準對應選項 C。A 的巴塔哥尼亞沙漠化及 B 的冰架穩定均與原文事實相反。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. A  【原聲定位】Section 5: 'cold sinking waters sequester gigatons of anthropogenic carbon into deep benthic reservoirs.' 【解析】下沉洋流將數十億噸人為碳封存至深海沉積物中，對應選項 A 中的 'sequester gigatons of anthropogenic carbon dioxide'。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. B  【原聲定位】Section 5: 'Ultimately, monitoring the AMOC is not merely an academic exercise; it is an urgent geophysical imperative for human civilizational resilience.' 【解析】總結句以 'not merely... but an urgent imperative' 表明監測大洋環流是維繫人類文明穩定的緊急科學任務，對應選項 B。"}]}}}, {"num": 2, "tag": "unit02", "folder": "生命科學與神經科學領域", "chapter": "第一篇章 ‧ 自然科學與尖端科技（標準難度版）", "title": "Neuroplasticity, Sleep & Cognitive Health (Standard Edition)", "titleZh": "大學睡眠健康研究報名、運動大腦實驗室導覽與記憶專題討論", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (標準難度 Sec 1–4)", "src": "./audio/Unit02_Full_Section1_to_4.mp3", "qr": "./qr/unit02.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "大學睡眠與記憶力志願研究報名 (University Sleep & Memory Study Sign-Up)", "src": "./audio/Unit02_Section1.mp3", "qr": "./qr/unit02-s1.png", "script": ["Nurse: Hello, University Sleep and Health Clinic, Jane speaking.", "Liam: Hi! I saw your poster on campus about the sleep and memory volunteer study.", "Nurse: Lovely! Let me add your name to our list. What's your full name?", "Liam: Liam Fletcher. That's F-L-E-T-C-H-E-R.", "Nurse: Thanks, Liam. And how old are you?", "Liam: I'm twenty-four.", "Nurse: Twenty-four, great. And an email address for reminders?", "Liam: It's liam dot hall at fastmail dot co dot uk. Fastmail is F-A-S-T-M-A-I-L.", "Nurse: Got it. Now, can you come in for your first visit in October, or is September better?", "Liam: September is much easier for me before term starts.", "Nurse: Let's book you for Friday the 18th of September, then.", "Liam: Great. What will I do at the first visit?", "Nurse: Nothing scary! Just a short 30-minute memory game on an iPad tablet.", "Liam: Sounds fun. Do I need to skip breakfast beforehand?", "Nurse: No, eat breakfast as normal and drink water—just avoid drinking coffee on the morning of the test, as caffeine alters reaction speed.", "Liam: No coffee, got it. Do I wear a monitor?", "Nurse: Yes, we lend you a light plastic wrist band that tracks your sleep hours.", "Liam: Easy enough. Any homework?", "Nurse: Just fill in a brief paper diary before bed each night—takes two minutes. We also ask volunteers to walk for twenty minutes every afternoon, not run or cycle.", "Liam: Twenty minutes walking, fine. Is there a thank-you reward?", "Nurse: Yes! Previously we gave a 20-pound coffee card, but this term everyone gets a 40-pound bookshop voucher.", "Liam: Fantastic! See you on the 18th."], "trans": ["護理師：您好，大學睡眠與健康診所，我是珍。", "連恩：嗨！我在校園海報上看到睡眠與記憶志願者研究的招募。", "護理師：太好了！我先登記您的名字。請問全名是？", "連恩：連恩・弗萊徹（Liam Fletcher），拼寫是 F-L-E-T-C-H-E-R。", "護理師：謝謝連恩。請問您幾歲？", "連恩：我二十四歲（24）。", "護理師：24 歲，很好。請問接收提醒的電子信箱是？", "連恩：是 liam.hall@fastmail.co.uk，fastmail 拼寫是 F-A-S-T-M-A-I-L。", "護理師：記下了。第一次回診排在十月方便嗎，還是九月比較好？", "連恩：開學前九月對我來說方便得多。", "護理師：那幫您約在 9 月（September）18 日週五。", "連恩：太好了。第一次來要做什麼呢？", "護理師：沒什麼可怕的！只要在平板電腦上玩一個 30 分鐘的記憶（memory）小遊戲就好。", "連恩：聽起來很有趣。來之前需要先空腹不吃早餐嗎？", "護理師：不用，照常吃早餐、喝水就好——只要測驗當天早上別喝咖啡（coffee），因為咖啡因會影響反應速度。", "連恩：不喝咖啡，明白。我需要佩戴監測儀器嗎？", "護理師：是的，我們會借您一條輕便塑膠手腕帶（wrist band）來記錄睡眠時數。", "連恩：很簡單。有回家作業嗎？", "護理師：每晚睡前花兩分鐘填一下紙本日記（diary）就好。我們也請受試者每天下午散步二十分鐘（20 minutes），不用跑步或騎車。", "連恩：每天散步二十分鐘，沒問題。請問有參與謝禮嗎？", "護理師：有的！以前我們送 20 英鎊咖啡卡，但這學期每個人都能拿到 40 英鎊的書店禮券。", "連恩：太棒了！18 號見。"], "answers": [{"q_num": "Q1", "answer": "Fletcher", "clue_analysis": "【原聲定位】'Liam Fletcher. That's F-L-E-T-C-H-E-R.'"}, {"q_num": "Q2", "answer": "24 / twenty-four", "clue_analysis": "【原聲定位】'I'm twenty-four.'"}, {"q_num": "Q3", "answer": "fastmail", "clue_analysis": "【原聲定位】'fastmail dot co dot uk. Fastmail is F-A-S-T-M-A-I-L.'"}, {"q_num": "Q4", "answer": "September", "clue_analysis": "【原聲定位】'Friday the 18th of September' 排除十月干擾。"}, {"q_num": "Q5", "answer": "memory", "clue_analysis": "【原聲定位】'30-minute memory game on an iPad'"}, {"q_num": "Q6", "answer": "coffee", "clue_analysis": "【原聲定位】'avoid drinking coffee on the morning of the test'"}, {"q_num": "Q7", "answer": "wrist", "clue_analysis": "【原聲定位】'light plastic wrist band'"}, {"q_num": "Q8", "answer": "diary", "clue_analysis": "【原聲定位】'brief paper diary before bed'"}, {"q_num": "Q9", "answer": "20 / twenty", "clue_analysis": "【原聲定位】'walk for twenty minutes every afternoon'"}, {"q_num": "Q10", "answer": "40", "clue_analysis": "【原聲定位】'40-pound bookshop voucher' 排除以前 20 鎊干擾。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "運動與腦科學研究中心開放日導覽 (Brain & Exercise Centre Open Day Tour)", "src": "./audio/Unit02_Section2.mp3", "qr": "./qr/unit02-s2.png", "script": ["Clara: Welcome everyone to the Brain and Exercise Research Centre Open Day! I'm Clara, the centre manager.", "While we used to study diet and stress in the past, our latest flagship project focuses purely on how regular physical exercise improves human memory across all age groups.", "Soon we'll walk past Room 4, where our brain scanner is kept. Before going near the door, please lock your keys, watches, and phones in the lockers outside—not because of hallway space, but because the scanner contains an extremely strong magnet that stays on all day.", "Last month our team tested walking routines, and one result really surprised us: it didn't matter whether people walked fast or slow, or morning versus evening. What really stood out was that walking outdoors in green parks boosted focus far more than walking on an indoor treadmill.", "Later, feel free to visit our Brain Fitness Zone. We no longer offer blood pressure checks there, and the meditation pods are being painted, so today guests are invited to try our fun virtual cycling balance game.", "As for lunch at 12:30, the Ground Floor Café is closed for repairs and the upstairs Seminar Room is booked by staff, so food will be served out on the sunny Garden Terrace.", "Let's look at the map for today's activity rooms.", "In Room 101, students are demonstrating a soft cloth cap covered in sensors that measures gentle brain waves while you solve puzzles.", "Next to the stairs, the Video Corner is playing short interviews with healthy older marathon runners in their seventies.", "Across the hall in the Sleep Suite, you can see a smart bedroom setup testing how bright blue lighting affects afternoon alertness and night rest.", "Right by the Book Table near the exit, please pick up free printed pamphlets with practical tips on healthy sleep habits.", "Finally, our Gym Hall at the back is open for anyone wanting to test how heart rate changes during gentle indoor cycling.", "Follow me through the main doors!"], "trans": ["克拉拉：歡迎各位來到大腦與運動研究中心開放日！我是中心經理克拉拉。", "雖然我們過去研究過飲食與壓力，但我們最新的旗艦計畫純粹聚焦於規律體能運動如何改善各年齡層的人類記憶力（how physical exercise improves memory）。", "待會我們會經過 4 號房的大腦掃描儀。靠近門前請先將鑰匙、手錶與手機鎖在外面的置物櫃——不是因為走廊空間小，而是因為掃描儀內有全天候開啟的超強磁鐵（strong magnet）。", "上個月我們測試了步行習慣，有一個結果令全隊驚訝：走快走慢或早晚差別不大，真正突出的是在戶外綠地公園散步比在室內跑步機上走更能大幅提升專注力（walking outdoors beats indoor treadmill walking）。", "稍後歡迎參觀大腦體適能區。那裡已不再提供血壓測量，冥想艙也正在油漆，所以今天特別邀請來賓體驗虛擬單車平衡遊戲（virtual cycling balance game）。", "至於 12:30 的午餐，一樓咖啡廳正在整修，樓上研討室被職員預訂了，因此餐點將在陽光充足的花園露台（Garden Terrace）供應。", "來看看今天活動室的地圖。", "在 101 室，學生將示範戴著布滿感測器的軟布帽，在解謎時測量腦波。", "樓梯旁的影片角落（Video Corner）播放著七十多歲健康高齡馬拉松跑者的簡短訪談。", "走廊對面的睡眠套間（Sleep Suite）展示了智慧臥室佈置，測試藍光照明如何影響午後警覺性與夜間休息。", "出口旁的書桌區（Book Table）放有免費印製的健康睡眠習慣小冊子歡迎領取。", "最後方的健身大廳（Gym Hall）開放體驗溫和室內踩單車時的心率變化。", "請隨我穿過大門！"], "answers": [{"q_num": "Q11", "answer": "A", "clue_analysis": "【原聲定位】'focuses purely on how regular physical exercise improves human memory' 選 A。"}, {"q_num": "Q12", "answer": "B", "clue_analysis": "【原聲定位】'because the scanner contains an extremely strong magnet' 選 B。"}, {"q_num": "Q13", "answer": "C", "clue_analysis": "【原聲定位】'walking outdoors in green parks boosted focus far more than walking on an indoor treadmill' 選 C。"}, {"q_num": "Q14", "answer": "A", "clue_analysis": "【原聲定位】'invited to try our fun virtual cycling balance game' 選 A。"}, {"q_num": "Q15", "answer": "C", "clue_analysis": "【原聲定位】'food will be served out on the sunny Garden Terrace' 選 C。"}, {"q_num": "Q16", "answer": "B", "clue_analysis": "【原聲定位】'Room 101... soft cloth cap... measures gentle brain waves' 對應 B。"}, {"q_num": "Q17", "answer": "F", "clue_analysis": "【原聲定位】'Video Corner... interviews with healthy older marathon runners' 對應 F。"}, {"q_num": "Q18", "answer": "E", "clue_analysis": "【原聲定位】'Sleep Suite... bright blue lighting affects afternoon alertness' 對應 E。"}, {"q_num": "Q19", "answer": "G", "clue_analysis": "【原聲定位】'Book Table... pick up free printed pamphlets on healthy sleep' 對應 G。"}, {"q_num": "Q20", "answer": "D", "clue_analysis": "【原聲定位】'Gym Hall... test how heart rate changes during gentle indoor cycling' 對應 D。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "大學生記憶與運動實驗計畫討論 (Biology Student Project Tutorial)", "src": "./audio/Unit02_Section3.mp3", "qr": "./qr/unit02-s3.png", "script": ["Prof. Harrison: Hi Sophie, hi Daniel. Let's review your student project on exercise and memory.", "Sophie: Thanks, Professor. Originally I wanted to test retired adults, and plenty of them volunteered, and our gym gear was fine—but getting extra hospital medical approval took months, so we switched to testing university students instead.", "Prof. Harrison: Sensible choice for a one-term project. Daniel, how did the word-list memory trial go?", "Daniel: Well, the font size was clear and the words weren't too hard, but I realised half the students had already seen the exact same word list in last month's psychology lecture!", "Prof. Harrison: Ah, good catch—familiarity skews the scores. Still, looking at your fresh pilot data, I was amazed that even ten minutes of gentle jogging noticeably improved word recall.", "Sophie: Yes! We're going to keep the quiet room we used and keep the sample size at thirty, though Daniel and I both agree we should repeat the test using simple picture cards instead of written words.", "Daniel: Definitely, picture cards will avoid any prior reading advantage.", "Prof. Harrison: Smart adjustment. Before you begin next week, you've already drafted the consent sheet and tables, so please write a short two-page summary of past studies on running and memory.", "Sophie: Will do, Professor. Now Daniel, let's quickly split up the practical jobs.", "Daniel: I'll email the sports office to book the university running track for Tuesday afternoon.", "Sophie: Thanks. And I'm pretty good at graphic design, so I'll make the online signup poster.", "Daniel: What about checking the battery and settings on all ten heart-rate watches?", "Sophie: That takes two people if we want it done before five—let's check the watches together after lunch.", "Daniel: Deal. Then after the tests, I'll enter all the raw scores into the Excel spreadsheet.", "Sophie: Great! And for the final poster presentation in class, should we present it jointly?", "Daniel: Actually, since I hate public speaking and you love it, would you mind presenting the poster on your own while I handle the Q&A?", "Sophie: Wait—Dr. Harrison requires both partners to speak! Let's present it together, half each.", "Daniel: Oh right, both of us then! Good thing we checked."], "trans": ["哈里森教授：嗨蘇菲、嗨丹尼爾。我們來看看你們關於運動與記憶的大學專題研究。", "蘇菲：謝謝教授。我原本想測試退休長輩，報名的志願者也很多，健身器材也都沒問題——但申請額外的醫院醫療審查許可耗時好幾個月（medical approval took too long），所以我們改測大學生了。", "哈里森教授：這對一學期的專題來說是明智的決定。丹尼爾，字詞表記憶測試進行得如何？", "丹尼爾：字體大小清楚、單字也不會太難，但我發現有一半的學生在上個月心理學課上早就看過同一份單字表了（had seen the list before）！", "哈里森教授：啊，抓得好——熟悉度會拉偏分數。不過看你們的預試數據，我很驚訝哪怕只是慢跑十分鐘就明顯提升了回憶表現（even ten minutes of jogging helped recall）。", "蘇菲：對啊！我們會繼續用原本的安靜教室、人數維持三十人，但丹尼爾跟我也一致同意改用圖片卡代替文字重測（picture cards instead of words）。", "丹尼爾：沒錯，圖片卡能避免先前的閱讀記憶優勢。", "哈里森教授：很聰明的調整。在下週開始前，你們已經寫好同意書與數據表了，接下來請寫一份兩頁的過去文獻精簡摘要（two-page summary of past studies）。", "蘇菲：好的，教授。丹尼爾，我們快點分工一下實務工作吧。", "丹尼爾：我來寫信給體育處預訂週二下午的大學田徑跑道。", "蘇菲：謝啦。我滿擅長平面設計的，線上報名海報交給我來做。", "丹尼爾：那檢查十支心率手錶的電量與設定呢？", "蘇菲：如果五點前要弄完需要兩個人才夠快——我們午飯後一起檢查手錶吧。", "丹尼爾：一言為定。那測試結束後，我來把所有原始分數輸入 Excel 表格。", "蘇菲：太好了！至於最後課堂上的海報發表，我們一起上台報告嗎？", "丹尼爾：其實我超討厭上台演講而妳很擅長，妳介意自己主講、我負責回答提問嗎？", "蘇菲：等等——哈里森教授規定兩位組員都要發言！我們一起報告，各講一半。", "丹尼爾：喔對，那我們兩個一起！還好有確認。"], "answers": [{"q_num": "Q21", "answer": "B", "clue_analysis": "【原聲定位】'getting extra hospital medical approval took months' 選 B。"}, {"q_num": "Q22", "answer": "B", "clue_analysis": "【原聲定位】'half the students had already seen the exact same word list' 選 B。"}, {"q_num": "Q23", "answer": "A", "clue_analysis": "【原聲定位】'I was amazed that even ten minutes of gentle jogging noticeably improved word recall' 選 A。"}, {"q_num": "Q24", "answer": "A", "clue_analysis": "【原聲定位】'agree we should repeat the test using simple picture cards instead of written words' 選 A。"}, {"q_num": "Q25", "answer": "C", "clue_analysis": "【原聲定位】'please write a short two-page summary of past studies' 選 C。"}, {"q_num": "Q26", "answer": "B", "clue_analysis": "【原聲定位】Daniel: 'I'll email the sports office to book the university running track' 選 B。"}, {"q_num": "Q27", "answer": "A", "clue_analysis": "【原聲定位】Sophie: 'I'll make the online signup poster' 選 A。"}, {"q_num": "Q28", "answer": "C", "clue_analysis": "【原聲定位】Sophie: 'let's check the watches together' / Daniel: 'Deal.' 選 C。"}, {"q_num": "Q29", "answer": "B", "clue_analysis": "【原聲定位】Daniel: 'I'll enter all the raw scores into the Excel spreadsheet' 選 B。"}, {"q_num": "Q30", "answer": "C", "clue_analysis": "【原聲定位】'present it together, half each.' / 'both of us then!' 排除單獨報告念頭，選 C。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Metabolic Engine of Neuroplasticity: Cellular Respiration, Sirtuin Activation, and Cognitive Longevity", "src": "./audio/Unit02_Section4.mp3", "qr": "./qr/unit02-s4.png", "script": ["▶ Section 1  ‧  Dismantling Neurological Determinism", "Section 1  Good morning. In today's seminar on molecular neuroscience and cellular bioenergetics, we will explore one of the most transformative paradigms in modern brain physiology: the metabolic foundation of neuroplasticity. Throughout much of the twentieth century, clinical neurology operated under a rigid dogma known as neurological determinism. This model held that the adult mammalian brain was a fixed, post-mitotic structure, incapable of structural remodeling or generating new neurons after early development. Over the past three decades, however, neuroimaging and electrophysiological breakthroughs have definitively dismantled this assumption. The adult brain possesses enduring structural and functional plasticity—the capacity to forge new synaptic connections, prune inefficient pathways, and even generate nascent neurons in the dentate gyrus. Yet, what recent research reveals is that neuroplasticity is not an autonomous electrical phenomenon; rather, it is strictly bounded by the metabolic capacity of neural cells.", "▶ Section 2  ‧  Mitochondrial Energetics and the NAD+ Coenzyme", "Section 2  The central processing unit of cellular bioenergetics is the mitochondrion. Within our neurons, which consume roughly twenty percent of systemic resting metabolic energy, mitochondria continuously generate adenosine triphosphate, or ATP, through oxidative phosphorylation. Crucial to this electron transport chain is a vital coenzyme: Nicotinamide Adenine Dinucleotide, universally abbreviated as NAD+. In its oxidized form, NAD+ acts as an indispensable electron acceptor, facilitating the enzymatic breakdown of glucose into usable biological energy. However, NAD+ is far more than a passive metabolic fuel carrier; it also functions as an acute biosensor of cellular stress. When energetic supplies plummet or cellular damage accumulates, intracellular NAD+ ratios fluctuate dramatically, sending rapid biochemical signals to the nucleus.", "▶ Section 3  ‧  The Sirtuin-BDNF Axis and Epigenetic Repair", "Section 3  The primary enzymatic sensors of NAD+ availability are a family of evolutionary conserved proteins known as sirtuins, particularly SIRT1 and SIRT3. Sirtuins function as NAD+-dependent deacetylases. When cellular NAD+ concentrations are robust, sirtuins activate to remove acetyl groups from target histones, effectively orchestrating epigenetic gene expression. Among their vital downstream targets is Brain-Derived Neurotrophic Factor, or BDNF. BDNF is often described as molecular fertilizer for the brain; it promotes synaptogenesis, reinforces dendritic branching, and bolsters axonal myelination. Without sufficient intracellular NAD+, sirtuins remain biochemically dormant, halting BDNF transcription and causing synaptic connectivity to atrophy.", "The Metabolic Engine of Neuroplasticity: Cellular Respiration, Sirtuin Activation, and Cognitive Longevity (Continued)", "▶ Section 4  ‧  Hormetic Stressors and Endogenous Upregulation", "Section 4  This brings us to a compelling clinical question: can we endogenously upregulate this metabolic repair pathway? The answer lies in the biological principle of hormesis. Hormesis describes a physiological response where brief, sub-lethal environmental stressors provoke an adaptive overcompensation that strengthens cellular resilience. For instance, protocol-driven intermittent fasting temporarily depletes glycogen stores and stresses cellular energy balances, which paradoxically triggers a sharp compensatory surge in NAD+ biosynthesis and autophagy. Similarly, intense aerobic exercise and deliberate cold thermogenesis activate metabolic pathways like AMPK and PGC-1alpha, stimulating mitochondrial biogenesis. These intermittent biological challenges train neural networks to withstand future ischemic and oxidative insults.", "▶ Section 5  ‧  Clinical Implications and Cognitive Longevity", "Section 5  The translational ramifications of this metabolic paradigm for human healthspan are profound. Age-related neurodegenerative pathologies, such as Alzheimer's and Parkinson's disease, are increasingly understood not merely as protein misfolding anomalies, but as profound mitochondrial energy crises. When neural bioenergetics falter, neurons can no longer sustain synaptic repair or clear toxic aggregates, leading to progressive cognitive decline. By contrast, maintaining cellular metabolic reserve through targeted nutritional, behavioral, and pharmacological interventions reinforces cognitive reserve. In summary, neuroplasticity is fundamentally an energetic enterprise. If we support the underlying mitochondrial engine, the brain retains an astonishing capacity for structural rejuvenation across the human lifespan."], "trans": ["Section 1  大家早安。在今天的分子神經科學與細胞生物能量學研討會中，我們將探討現代大腦生理學中最具變革性的範式之一：神經可塑性的代謝基礎。在整個二十世紀的大部分時間裡，臨床神經學都受到一種名為「神經決定論」的僵化教條支配。該模型認為，成年哺乳動物的大腦是一個固定不變、有絲分裂後停止分裂的結構，在早期發育完成後便無法重塑結構或生成新的神經元。然而在過去三十年間，神經影像學與電生理學的突破徹底瓦解了這項假設。成年大腦具有持久的結構與功能可塑性——具備建立新突觸連結、修剪無效路徑，甚至在海馬迴齒狀回中生成新生神經元的能力。然而最新研究揭示，神經可塑性並非純粹自主的電訊號現象；相反地，它嚴格受到神經細胞代謝能力的約束。", "Section 2  細胞生物能量學的核心處理單元是線粒體（粒線體）。在大腦神經元中——它消耗了人體大約百分之二十的全身靜息代謝能量——線粒體透過氧化磷酸化持續產生三磷酸腺苷（ATP）。在這一電子傳遞鏈中，關鍵在於一種不可或缺的輔酶：菸鹼醯胺腺嘌呤二核苷酸（NAD+）。在其氧化型態下，NAD+ 作為不可替代的電子受體，促進葡萄糖分解為可用的生物能量。然而，NAD+ 遠非僅僅是被動的代謝燃料載體；它還兼具細胞壓力的敏銳生物傳感器功能。當能量供應驟降或細胞損傷累積時，細胞內 NAD+ 比率會劇烈波動，向細胞核發出快速的生化信號。", "Section 3  NAD+ 可用性的主要酵素感測器是一組在演化上高度保守的蛋白質家族，稱為去乙醯化酶（sirtuins），特別是 SIRT1 和 SIRT3。Sirtuins 作為 NAD+ 依賴型的去乙醯化酶運作。當細胞內 NAD+ 濃度充沛時，去乙醯化酶被活化，從目標組織蛋白中移除乙醯基，從而精準協調表觀遺傳基因表現。在它們的重要下游目標中，包括了腦源性神經營養因子（BDNF）。BDNF 常被形容為大腦的分子肥料；它能促進突觸生成、增強樹突分支，並強化神經軸突髓鞘的完整性。若缺乏足夠的細胞內 NAD+，去乙醯化酶將維持生化休眠狀態，導致 BDNF 轉錄停滯，最終造成突觸連結萎縮。", "Section 4  這引出了一個引人深思的臨床問題：我們能否經由人體內源性途徑上調這條代謝修復網絡？答案在於「毒物興奮效應（hormesis）」這一生物學原理。Hormesis 描述了一種生理適應反應：短暫、亞致死劑量的環境壓力源會激發超額補償機制，進而強化細胞韌性。例如，規律執行的間歇性斷食會暫時耗盡肝醣儲備並挑戰細胞能量平衡，這反而出人意料地引發 NAD+ 生物合成與細胞自噬作用的代償性暴增。同樣地，高強度有氧運動與刻意的冷水暴露會活化 AMPK 和 PGC-1alpha 等代謝通路，促進線粒體新生。這些間歇性的生物挑戰訓練了神經網絡，使其能抵禦未來的缺血與氧化損傷。", "Section 5  這種代謝範式對於延長人類健康壽命具有深遠的轉化醫學意義。阿茲海默症與帕金森氏症等年齡相關的神經退化性疾病，越來越常被理解為不僅僅是蛋白質錯誤摺疊的異常，而是深刻的線粒體能量危機。當神經生物能量崩潰時，神經元便無法維持突觸修復或清除毒性蛋白聚集體，導致漸進式的認知衰退。相反地，透過精準的營養、行為與藥理介入來維持細胞代謝儲備，能直接強化認知儲備。總結而言，神經可塑性本質上是一項高耗能的生物工程。如果我們全力支撐其底層的線粒體引擎，大腦在整個人類生命週期中都將保留驚人的結構重塑與復原潛力。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. plasticity  【原聲定位】Section 1: 'enduring structural and functional plasticity'"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. ATP / adenosine triphosphate  【原聲定位】Section 2: 'mitochondria continuously generate adenosine triphosphate, or ATP, through oxidative phosphorylation.' 【解析】聽取能量分子名詞，填寫 ATP 或全稱均可。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. proteins  【原聲定位】Section 3: 'a family of evolutionary conserved proteins known as sirtuins'"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. fertilizer  【原聲定位】Section 3: 'BDNF is often described as molecular fertilizer for the brain'"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. fasting  【原聲定位】Section 4: 'protocol-driven intermittent fasting temporarily depletes glycogen'"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. reserve  【原聲定位】Section 5: 'reinforces cognitive reserve.'"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 2: 'it also functions as an acute biosensor of cellular stress. When energetic supplies plummet... sending rapid biochemical signals...' 【解析】原聲明確提及 NAD+ 作為 biosensor 反應壓力，對應選項 B。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. A  【原聲定位】Section 4: 'Hormesis describes a physiological response where brief, sub-lethal environmental stressors provoke an adaptive overcompensation that strengthens cellular resilience.' 【解析】良性微壓力刺激適應性防禦，精準對應選項 A。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. A  【原聲定位】Section 3: 'Without sufficient intracellular NAD+, sirtuins remain biochemically dormant, halting BDNF transcription...' 【解析】NAD+ 不足導致去乙醯化酶休眠與 BDNF 轉錄停擺，對應選項 A。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. B  【原聲定位】Section 5: 'Age-related neurodegenerative pathologies... are increasingly understood not merely as protein misfolding anomalies, but as profound mitochondrial energy crises.' 【解析】總結指出神經退化疾病根源於生物能量與線粒體缺失，對應選項 B。"}]}}}, {"num": 3, "tag": "unit03", "folder": "硬核科技與系統工程領域", "chapter": "第一篇章 ‧ 自然科學與尖端科技（標準難度版）", "title": "Brain-Inspired Chips & Low-Power Robotics (Standard Edition)", "titleZh": "週末機器人社團報名、科技博物館導覽與節能晶片課堂報告", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (標準難度 Sec 1–4)", "src": "./audio/Unit03_Full_Section1_to_4.mp3", "qr": "./qr/unit03.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "城市圖書館週末機器人程式設計社團報名 (Weekend Robotics Club Registration)", "src": "./audio/Unit03_Section1.mp3", "qr": "./qr/unit03-s1.png", "script": ["Sandra: Hello, City Library Tech Hub, Sandra speaking.", "Ethan: Hi! I'd like to join the weekend robotics club.", "Sandra: Welcome! Let's fill out your club card. What is your full name?", "Ethan: Ethan Turner. T-U-R-N-E-R.", "Sandra: Great. And a mobile phone number?", "Ethan: 07944... 328105.", "Sandra: Thanks. Which level fits you best? Complete beginner, or have you coded before?", "Ethan: I thought maybe beginner, though I've written some basic Python scripts at school.", "Sandra: Oh, if you already know some Python, you belong in our intermediate group.", "Ethan: Intermediate, sounds good. Which room do we meet in?", "Sandra: We used to meet in Room 108, but this term we've moved upstairs to Room 204.", "Ethan: Room 204, got it. When does it start?", "Sandra: Our first session is Saturday the 15th of October.", "Ethan: Great. What will we make first?", "Sandra: Everyone will build and program a small light-following car using cheap micro-chips.", "Ethan: Fun! What should I bring along?", "Sandra: Bring your own laptop and a spare USB cable. Don't worry about mice or batteries—we supply those.", "Ethan: Spare cable, noted. Are there any extra club perks?", "Sandra: Yes, club members get free access to our 3D printer every Friday afternoon.", "Ethan: Awesome! Is there a break for snacks?", "Sandra: Yes, around 3:00 p.m. we serve free tea, coffee, and biscuits.", "Ethan: Lovely. How much is the monthly fee?", "Sandra: Standard adult membership is 25 pounds, while full-time students pay just 12 pounds per month.", "Ethan: Twelve pounds is brilliant. Thanks, Sandra!"], "trans": ["珊卓：您好，城市圖書館科技中心，我是珊卓。", "伊森：嗨！我想報名參加週末機器人社團。", "珊卓：歡迎！我幫您填寫會員卡。請問您的全名是？", "伊森：伊森・透納（Ethan Turner），T-U-R-N-E-R。", "珊卓：好的。手機號碼是？", "伊森：07944……328105。", "珊卓：謝謝。哪一個程度最適合您？完全新手，還是以前寫過程式？", "伊森：我本來想報初學組，不過在學校寫過一點基礎 Python 腳本。", "珊卓：喔，如果您已經懂一點 Python，那您適合我們的中級組（intermediate）。", "伊森：中級組，聽起來不錯。我們在哪間教室聚會？", "珊卓：以前在 108 室，但這學期搬到樓上的 204 室（Room 204）。", "伊森：204 室，記下了。什麼時候開始？", "珊卓：第一次上課是 10 月（October）15 日週六。", "伊森：太好了。我們第一個專題做什麼？", "珊卓：每個人都會用平價微晶片組裝並編寫一輛追蹤光線的小車（light-following car）。", "伊森：真有趣！我需要自備什麼物品？", "珊卓：請自備筆記型電腦與一條備用 USB 傳輸線（cable）。滑鼠和電池不用擔心，我們會提供。", "伊森：備用傳輸線，記下了。社團還有額外福利嗎？", "珊卓：有的，社員每週五下午可以免費使用我們的 3D 列印機（3D printer）。", "伊森：太棒了！中間有茶點休息時間嗎？", "珊卓：有的，下午三點左右我們免費提供茶、咖啡與餅乾（biscuits）。", "伊森：真好。請問月費是多少？", "珊卓：一般成人會員是每月 25 英鎊，全日制學生只需每月 12 英鎊。", "伊森：12 英鎊太划算了。謝謝妳，珊卓！"], "answers": [{"q_num": "Q1", "answer": "Turner", "clue_analysis": "【原聲定位】'Ethan Turner. T-U-R-N-E-R.'"}, {"q_num": "Q2", "answer": "328105", "clue_analysis": "【原聲定位】'07944... 328105.'"}, {"q_num": "Q3", "answer": "intermediate", "clue_analysis": "【原聲定位】'belong in our intermediate group' 排除 beginner 干擾。"}, {"q_num": "Q4", "answer": "204", "clue_analysis": "【原聲定位】'moved upstairs to Room 204' 排除舊教室 108。"}, {"q_num": "Q5", "answer": "October", "clue_analysis": "【原聲定位】'Saturday the 15th of October'"}, {"q_num": "Q6", "answer": "car", "clue_analysis": "【原聲定位】'small light-following car'"}, {"q_num": "Q7", "answer": "cable", "clue_analysis": "【原聲定位】'laptop and a spare USB cable'"}, {"q_num": "Q8", "answer": "printer", "clue_analysis": "【原聲定位】'free access to our 3D printer'"}, {"q_num": "Q9", "answer": "biscuits", "clue_analysis": "【原聲定位】'free tea, coffee, and biscuits'"}, {"q_num": "Q10", "answer": "12", "clue_analysis": "【原聲定位】'students pay just 12 pounds per month' 排除成人價 25。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "未來電腦與AI節能硬體特展導覽 (Future Computing Exhibition Audio Tour)", "src": "./audio/Unit03_Section2.mp3", "qr": "./qr/unit03-s2.png", "script": ["Robert: Hello visitors, and welcome to the Future Computing Exhibition! I'm Robert, your tour guide.", "Start by imagining how much electricity modern AI takes. Big data centres need millions of litres of cooling water every day. That isn't because they sit in deserts; it's because traditional computer chips waste huge amounts of energy just moving data back and forth between memory and processing units.", "In our central showcase, you'll see brain-inspired chips. They aren't made of plastic and they still use electricity, of course—but unlike normal chips, they store and process data in the very same spot, just like human brain cells.", "Walk past the Robot Dog Arena, and you'll notice how quietly they move. People expect high jumps or night vision, yet what amazes visitors most is how long the dogs run on tiny batteries thanks to these energy-saving chips.", "A quick note on our Cleanroom Glass Walkway: it isn't being mopped and no school group has booked it, but it will remain closed until 2:00 p.m. while engineers test delicate light sensors inside.", "Before leaving, check out the Gift Shop kiosk, where a small machine lets you design your very own printed circuit keychain—much cooler than a phone case!", "Let's check the seven gallery zones on your leaflet.", "Zone 1 is our History Corner, featuring a huge 1970s room-sized computer with spinning magnetic tapes.", "In Zone 3, step through the Sensor Tunnel, fitted with special eye-like cameras that stay asleep and react only when objects actually move.", "Zone 6 is our Green Tech Hall, showing solar batteries powering a working miniature town.", "For younger guests, Zone 5 is the Kids' Workshop, where children can snap together simple colourful circuit boards safely.", "Finally, Zone 4 is the Smart Home, demonstrating voice-controlled kitchen lights and window blinds.", "Let's begin in Zone 1!"], "trans": ["羅伯特：各位訪客好，歡迎來到未來電腦特展！我是導覽員羅伯特。", "先想像一下現代 AI 消耗多少電力。大型數據中心每天需要數百萬公升的冷卻水。這不是因為它們蓋在沙漠裡，而是因為傳統晶片把大量能量浪費在把資料於記憶體與運算單元之間來回搬運（waste energy moving data）。", "在中央展區您會看到仿腦晶片。它們不是塑膠做的、當然也還是要用電——但不同於普通晶片，它們在同一個位置儲存並處理資料（store and process data together），就像人類大腦細胞一樣。", "走過機器狗競技場，您會注意到它們動作多安靜。大家本來期待高難度跳躍或夜視功能，但最令訪客驚嘆的是靠著省電晶片，小電池竟然能撐這麼久（how long their small batteries last）。", "提醒大家關於無塵室玻璃走廊：不是在拖地也不是被學生包場，因為工程師正在內部測試精密光學感測器（testing sensitive equipment），將暫時關閉至下午兩點。", "離開前不妨去禮品店機台看看，那裡可以設計專屬的印刷電路板鑰匙圈（printed circuit keychain）——比手機殼酷多了！", "一起來核對摺頁上的七個展區。", "1 號區是歷史角落（History Corner），展出一台 1970 年代佔滿整個房間、帶著旋轉磁帶的巨型電腦。", "3 號區是感測器隧道（Sensor Tunnel），裝有像眼睛一樣的攝影機，平時保持休眠，只在物體移動時才反應。", "6 號區是綠色科技廳（Green Tech Hall），展示太陽能電池如何為一座運作中的微型小鎮供電。", "專為小朋友設計的 5 號區是兒童工作坊（Kids' Workshop），孩子可以安全地拼裝彩色卡扣電路板。", "最後 4 號區是智慧家庭（Smart Home），示範聲控廚房燈光與窗簾。", "我們從 1 號區開始吧！"], "answers": [{"q_num": "Q11", "answer": "A", "clue_analysis": "【原聲定位】'traditional computer chips waste huge amounts of energy just moving data' 選 A。"}, {"q_num": "Q12", "answer": "B", "clue_analysis": "【原聲定位】'store and process data in the very same spot' 選 B。"}, {"q_num": "Q13", "answer": "C", "clue_analysis": "【原聲定位】'what amazes visitors most is how long the dogs run on tiny batteries' 選 C。"}, {"q_num": "Q14", "answer": "A", "clue_analysis": "【原聲定位】'while engineers test delicate light sensors inside' 選 A。"}, {"q_num": "Q15", "answer": "C", "clue_analysis": "【原聲定位】'design your very own printed circuit keychain' 選 C。"}, {"q_num": "Q16", "answer": "A", "clue_analysis": "【原聲定位】'Zone 1... History Corner, 1970s room-sized computer' 對應 A。"}, {"q_num": "Q17", "answer": "C", "clue_analysis": "【原聲定位】'Zone 3... Sensor Tunnel... react only when objects move' 對應 C。"}, {"q_num": "Q18", "answer": "F", "clue_analysis": "【原聲定位】'Zone 6... Green Tech Hall, solar batteries powering miniature town' 對應 F。"}, {"q_num": "Q19", "answer": "E", "clue_analysis": "【原聲定位】'Zone 5... Kids' Workshop, snap together circuit boards' 對應 E。"}, {"q_num": "Q20", "answer": "D", "clue_analysis": "【原聲定位】'Zone 4... Smart Home, voice-controlled kitchen lights' 對應 D。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "工程系機器人感測器專題與測試討論 (Engineering Student Sensor Project)", "src": "./audio/Unit03_Section3.mp3", "qr": "./qr/unit03-s3.png", "script": ["Dr. Chen: Come in, Maya and Leo. How is your small robot project going?", "Maya: Pretty good, Dr. Chen! We picked the new brain-inspired light sensor. It wasn't the cheapest one and there's no free code online, but it reacts ten times faster than a standard webcam.", "Dr. Chen: Great engineering reasoning. Did you run your hallway trial yesterday?", "Leo: Yes, and the wheels and battery held up fine, but bright sunlight glaring off the hallway windows completely confused the sensor!", "Dr. Chen: Classic optical noise. Instead of slowing the robot down or hiding in a dark room, just design a small black plastic shade hood over the lens.", "Maya: Oh, a lens hood! Easy fix. Actually, Dr. Chen, neither of us minds soldering wires or tuning the turning motors—the hardest part for both of us is writing the 3,000-word final technical report.", "Leo: Yeah, writing reports is definitely tougher than building hardware!", "Dr. Chen: Start your draft early. Now, remember our class demo was originally planned for next Tuesday morning, then moved to Friday. Since Friday clashes with a faculty meeting, you'll present next Thursday afternoon.", "Maya: Thursday afternoon, noted. Thanks, Dr. Chen! Leo, let's divide our remaining tasks.", "Leo: I can use the library 3D printer tomorrow to print that black sensor hood.", "Maya: Great! Meanwhile I'll measure the robot's battery power usage with the lab meter.", "Leo: Who should draw the circuit diagram for the report?", "Maya: I'll draw the diagram—I already have the layout app open.", "Leo: Thanks. What about filming the 30-second demo video? One person needs to drive while the other holds the phone.", "Maya: Good point, let's film the demo video together in the hall at four.", "Leo: Deal! And before we hand in the report, I'll proofread the spelling and check all our references—no need for both of us to do that twice.", "Maya: Perfect, thanks Leo!"], "trans": ["陳博士：請進，瑪雅和里奧。你們的小機器人專題進行得怎麼樣？", "瑪雅：滿順利的，陳博士！我們選了那款新型仿腦光線感測器。它不是最便宜的，網上也沒有免費範例代碼，但它的反應速度比普通攝影機快十倍（reacts faster than normal cameras）。", "陳博士：很棒的工程考量。昨天走廊測試跑得怎樣？", "里奧：輪子和電池都很穩，但走廊窗戶反射的強烈陽光把感測器徹底搞糊塗了（bright window glare confused the sensor）！", "陳博士：典型的光學雜訊。不用減慢車速也不用躲進暗房，只要在鏡頭上方加一個小黑色塑膠遮光罩（small plastic shade hood）就好。", "瑪雅：喔，遮光罩！很簡單。不過陳博士，焊接電線跟調校轉彎馬達我們都不怕——對我們倆來說最難的是寫三千字的最終技術報告（writing the final technical report）。", "里奧：對呀，寫報告絕對比組裝硬體難多了！", "陳博士：早點動筆寫初稿。對了，班級展示原本排在下週二上午，後來改週五，但週五跟系務會議撞期，所以改在下週四下午（Thursday afternoon）。", "瑪雅：週四下午，記下了。謝謝陳博士！里奧，我們分工一下剩下的工作吧。", "里奧：我明天去圖書館用 3D 列印機把那個黑色遮光罩印出來。", "瑪雅：太好了！同時我用實驗室電錶量測機器人的電池耗電量。", "里奧：報告裡的電路圖誰來畫？", "瑪雅：我來畫電路圖——我電腦上已經開著繪圖軟體了。", "里奧：謝啦。那拍 30 秒展示影片呢？需要一個人遙控、另一個人拿手機拍。", "瑪雅：說得對，我們四點一起在走廊合拍影片吧。", "里奧：成交！交報告前我來檢查拼字跟所有參考文獻，不用兩個人重複檢查。", "瑪雅：太棒了，謝謝里奧！"], "answers": [{"q_num": "Q21", "answer": "B", "clue_analysis": "【原聲定位】'reacts ten times faster than a standard webcam' 選 B。"}, {"q_num": "Q22", "answer": "B", "clue_analysis": "【原聲定位】'bright sunlight glaring off the hallway windows completely confused the sensor' 選 B。"}, {"q_num": "Q23", "answer": "A", "clue_analysis": "【原聲定位】'design a small black plastic shade hood over the lens' 選 A。"}, {"q_num": "Q24", "answer": "B", "clue_analysis": "【原聲定位】'hardest part for both of us is writing the 3,000-word final technical report' 選 B。"}, {"q_num": "Q25", "answer": "B", "clue_analysis": "【原聲定位】'present next Thursday afternoon' 排除週二與週五。"}, {"q_num": "Q26", "answer": "B", "clue_analysis": "【原聲定位】Leo: 'I can use the 3D printer to print that black sensor hood' 選 B。"}, {"q_num": "Q27", "answer": "A", "clue_analysis": "【原聲定位】Maya: 'I'll measure the robot's battery power usage' 選 A。"}, {"q_num": "Q28", "answer": "A", "clue_analysis": "【原聲定位】Maya: 'I'll draw the diagram' 選 A。"}, {"q_num": "Q29", "answer": "C", "clue_analysis": "【原聲定位】Maya: 'let's film the demo video together' 選 C。"}, {"q_num": "Q30", "answer": "B", "clue_analysis": "【原聲定位】Leo: 'I'll proofread the spelling and check all our references' 選 B。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Silicon Synapse: Systems Engineering in Neuromorphic Architecture and Memristive Networks", "src": "./audio/Unit03_Section4.mp3", "qr": "./qr/unit03-s4.png", "script": ["▶ Section 1  ‧  The von Neumann Bottleneck and Architectural Limits", "Section 1  Good morning, engineers. In today's advanced hardware systems lecture, we are tackling one of the most formidable computational crises of our era: the impending collapse of classical silicon computing under modern artificial intelligence workloads. For over seven decades, digital computation has been dominated by the von Neumann architecture. In this paradigm, the central processing unit and memory storage are physically separated, communicating across narrow communication buses. However, modern deep neural networks require transferring petabytes of parameters between memory and arithmetic units. This creates a severe bandwidth constraint known as the von Neumann bottleneck. Over ninety percent of total energy dissipation in modern GPU clusters is expended simply on shuffling bits across physical interconnects, generating unsustainable thermal dissipation that threatens to halt technological progress.", "▶ Section 2  ‧  Neuromorphic Computing: Emulating Biological Efficiency", "Section 2  To circumvent this physical barrier, computer architects are turning to neuromorphic engineering—the design of silicon chips that directly replicate the biological morphology and electrical behavior of the human brain. Consider the human central nervous system: our biological brain performs approximately ten to the sixteenth operations per second while dissipating a mere twenty watts of energy. It achieves this astonishing energetic efficiency because biological neurons do not adhere to von Neumann separation. Instead, computation and memory storage are co-located at the synapse. Furthermore, biological neural circuits communicate using asynchronous, event-driven action potentials—or spikes—meaning neurons consume energy only when actively conveying new, non-redundant information.", "▶ Section 3  ‧  Memristor Physics and Analog In-Memory Computing", "Section 3  At the hardware frontier of neuromorphic architecture is a non-linear two-terminal circuit element called the memristor. First conceptualized theoretically by Leon Chua in 1971 and physically demonstrated by Hewlett-Packard in 2008, the memristor exhibits electrical resistance that depends directly on the history of electric charge that has passed through it. In other words, it remembers its past electrical state. When organized into dense two-dimensional crossbar arrays, memristors perform matrix-vector multiplication directly in the analog domain according to Ohm's and Kirchhoff's laws. Rather than transferring digital data to an external processor, the computation occurs directly within the memory matrix itself. This analog in-memory computing approach slashes latency and yields energy efficiency gains exceeding three orders of magnitude.", "The Silicon Synapse: Systems Engineering in Neuromorphic Architecture and Memristive Networks (Continued)", "▶ Section 4  ‧  Spike-Timing-Dependent Plasticity (STDP) in Hardware", "Section 4  Beyond static inference, neuromorphic engineering seeks to replicate real-time online learning. In biological synapses, synaptic strength is modulated by Spike-Timing-Dependent Plasticity, or STDP. If a pre-synaptic neuron fires milliseconds before a post-synaptic neuron, the connecting synapse strengthens—a phenomenon known as long-term potentiation. Conversely, if the sequence is reversed, the synapse weakens through long-term depression. By tailoring the dielectric oxide switching dynamics of memristive devices, systems engineers have successfully emulated STDP at the nanoscale. This capability empowers neuromorphic chips to learn continuously from unstructured sensory data streams without requiring resource-heavy offline backpropagation algorithms.", "▶ Section 5  ‧  Edge AI Applications and Future Scalability Challenges", "Section 5  Looking toward deployment trajectories, neuromorphic processors are transforming edge computing. In autonomous vehicular navigation, robotic prosthetics, and distributed aerospace sensors, devices must process millisecond sensory inputs under strict battery constraints. Neuromorphic vision sensors, which mimic the human retina by transmitting data only when pixels detect changes in light intensity, operate with microsecond latency while consuming milliwatts of power. However, substantial systems engineering bottlenecks remain, particularly regarding device yield variability, analog-to-digital conversion overhead, and the absence of standardized programming toolchains. Bridging these engineering hurdles is the central mission for the next generation of computer systems architects."], "trans": ["Section 1  各位工程師早安。在今天的高階硬體系統課程中，我們將探討當代最嚴峻的運算危機之一：在現代人工智慧龐大工作負載下，經典矽基計算架構面臨的崩潰臨界點。七十多年來，數位計算始終由馮·諾伊曼架構（von Neumann architecture）所主導。在此範式中，中央處理器與記憶體在物理空間上嚴格分離，必須透過狹窄的通訊匯流排進行資料傳輸。然而，現代深度神經網絡需要在記憶體與運算單元之間頻繁轉移數以 PB 計的模型參數。這造成了嚴重的頻寬瓶頸，即著名的「馮·諾伊曼瓶頸（von Neumann bottleneck）」。現代 GPU 叢集中超過百分之九十的總能耗，僅僅是浪費在實體互連通道上來回搬運位元資料（shuffling bits），進而產生無法承受的熱耗散，嚴重威脅了技術進步的持續推進。", "Section 2  為了解決這項物理極限，電腦架構師正轉向「神經形態工程（neuromorphic engineering）」——即設計能夠直接複製人類大腦生物形態與電生理特性的矽基晶片。試想人類的生物大腦：它以僅僅約二十瓦特（20W）的極低能耗，執行每秒高達十的十六次方次（10^16）的運算。大腦之所以能達到如此驚人的能源效率，是因為生物神經元絕不存在馮·諾伊曼式的分離架構；相反地，運算與記憶儲存共同座落於突觸（synapse）結構之中。此外，生物神經迴路採用非同步、事件驅動的動作電位（即脈衝 spikes）進行通訊，這意味著神經元唯有在主動傳遞全新的非冗餘資訊時才會消耗能量。", "Section 3  在神經形態架構的硬體最前沿，是一種名為「憶阻器（memristor）」的非線性雙端電路元件。憶阻器最早於 1971 年由蔡少棠（Leon Chua）教授在理論上提出，並於 2008 年由惠普實驗室成功物理實現。它的電阻狀態直接取決於歷史上流經該元件的電荷量總和；換言之，它能「記住」過去的電氣狀態。當憶阻器被組織成高密度的二維交叉開關陣列（crossbar arrays）時，能夠依據歐姆定律與克希荷夫定律直接在類比域中完成矩陣-向量乘法。運算不再需要將數位資料搬移到外部處理器，而是在記憶體矩陣內部原地直接發生。這種「類比存內計算（analog in-memory computing）」大幅消除了傳輸延遲，並帶來超過三個數量級（1000倍以上）的能源效率飛躍。", "Section 4  除了靜態模型推理，神經形態工程更致力於重現即時的在線學習能力。在生物突觸中，突觸強度的調節由「脈衝時間依賴可塑性（STDP）」所控制。若突觸前神經元比突觸後神經元提前數毫秒激發脈衝，兩者之間的突觸連結便會強化——這被稱為長時程增強（LTP）；反之，若先後順序顛倒，突觸則會透過長時程抑制（LTD）而減弱。透過微調憶阻元件中介電氧化層的電氣開關動態特性，系統工程師已成功在奈米尺度重現了 STDP 機制。這項能力賦予神經形態晶片直接從非結構化感測數據流中進行連續學習的潛力，而不再需要依賴極度耗能的離線反向傳播演算法。", "Section 5  展望實際應用部署，神經形態處理器正引領邊緣運算（edge computing）的革命。在自動駕駛車輛導航、機器人仿生義肢以及分散式航太感測系統中，設備必須在極為嚴苛的電池能耗限制下處理毫秒級的感測輸入。神經形態仿生視覺感測器透過模仿人類視網膜，唯有在感光像素檢測到光強變化時才傳輸數據，能夠以微秒級的極低延遲運作，且功耗僅為毫瓦級別。然而，實體系統工程仍面臨諸多巨大瓶頸，特別是奈米元件製造的良率波動（device yield variability）、類比-數位轉換的巨大開銷，以及缺乏標準化的程式設計工具鏈。跨越這些工程阻礙，是下一代電腦系統架構師的核心使命。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. bottleneck  【原聲定位】Section 1: 'severe bandwidth constraint known as the von Neumann bottleneck.'"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. shuffling  【原聲定位】Section 1: 'expended simply on shuffling bits across physical interconnects'"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. synapse  【原聲定位】Section 2: 'computation and memory storage are co-located at the synapse.' 【解析】考查神經生物學與存算一體名詞，填入單數 synapse。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. crossbar  【原聲定位】Section 3: 'When organized into dense two-dimensional crossbar arrays, memristors perform matrix-vector multiplication...' 【解析】題幹提示 '2D (34) ____________ arrays'，填入形容詞修飾詞 crossbar。"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. Plasticity  【原聲定位】Section 4: 'modulated by Spike-Timing-Dependent Plasticity'"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. light intensity  【原聲定位】Section 5: 'mimic the human retina by transmitting data only when pixels detect changes in light intensity...' 【解析】考查物理光學變數，填入名詞片語 light intensity。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. A  【原聲定位】Section 2: 'neurons consume energy only when actively conveying new, non-redundant information.' 【解析】非同步脈衝通訊唯有在傳遞新資訊時耗能，精準對應選項 A。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. B  【原聲定位】Section 3: 'the memristor exhibits electrical resistance that depends directly on the history of electric charge that has passed through it.' 【解析】電阻取決於歷史電荷流通總量，對應選項 B。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. B  【原聲定位】Section 4: 'without requiring resource-heavy offline backpropagation algorithms.' 【解析】離線反向傳播演算法耗費巨大算力且難以支援即時邊緣在線學習，對應選項 B。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. B  【原聲定位】Section 5: 'bottlenecks remain, particularly regarding device yield variability, analog-to-digital conversion overhead, and the absence of standardized programming toolchains.' 【解析】良率變異與軟體工具鏈缺乏是當前商用化瓶頸，對應選項 B。"}]}}}, {"num": 4, "tag": "unit04", "folder": "天文物理與深空探索", "chapter": "第一篇章 ‧ 自然科學與尖端科技（標準難度版）", "title": "Exoplanets & Space Telescopes (Standard Edition)", "titleZh": "天文館觀星夜預約、太空望遠鏡特展導覽與系外行星課堂報告", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (標準難度 Sec 1–4)", "src": "./audio/Unit04_Full_Section1_to_4.mp3", "qr": "./qr/unit04.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "天文館夜間觀星活動預約登記 (Observatory Stargazing Night Booking)", "src": "./audio/Unit04_Section1.mp3", "qr": "./qr/unit04-s1.png", "script": ["Fiona: Starlight Hill Observatory, Fiona speaking. How can I help?", "Lucas: Hi, I'd like to book a ticket for your Saturday night stargazing event.", "Fiona: Certainly! Let me take your name first.", "Lucas: Lucas Foster. Spelled F-O-S-T-E-R.", "Fiona: Thanks, Lucas. And a phone number?", "Lucas: 07411... 932604.", "Fiona: Great. Are you booking a standard adult ticket, or are you at university?", "Lucas: I'm a postgraduate at the university, so a student pass, please.", "Fiona: Lovely, we have a university student pass. Which Saturday would you like?", "Lucas: Saturday the 28th of November, please.", "Fiona: November 28th has clear sky forecasts! That evening's guest talk is on searching for distant planets around other stars.", "Lucas: Sounds exciting. How do I get up the hill?", "Fiona: Our minibus picks guests up outside the Central Library in town—right across from the cinema.", "Lucas: Outside the Central Library. What time?", "Fiona: It leaves town at 6:00 p.m. and gets up to the hilltop observatory at 6:30 p.m.", "Lucas: Okay, 6:30 p.m. arrival. Is it cold up there?", "Fiona: Very chilly at night! Wear a thick jumper and bring warm gloves.", "Lucas: Sure. Is there a café open?", "Fiona: The café closes at five, but everyone gets a free cup of hot chocolate during the break.", "Lucas: Oh, nice! How much is the ticket?", "Lucas: And I'd also like to hire one of your small telescopes.", "Fiona: Right—the student ticket alone is 15 pounds, and small telescope hire is 3 pounds extra, so your total is 18 pounds.", "Lucas: Eighteen pounds, great. Thank you!"], "trans": ["菲奧娜：星光山天文台，我是菲奧娜。請問需要什麼協助？", "盧卡斯：嗨，我想預訂週六晚間觀星活動的門票。", "菲奧娜：沒問題！我先記下您的姓名。", "盧卡斯：盧卡斯・福斯特（Lucas Foster），拼寫是 F-O-S-T-E-R。", "菲奧娜：謝謝盧卡斯。聯絡電話是？", "盧卡斯：07411……932604。", "菲奧娜：好的。您要訂一般成人票，還是您是在學大學生？", "盧卡斯：我是大學研究生，所以請給我學生（student）票。", "菲奧娜：好的，我們有大學生票。您想預訂哪一個週六？", "盧卡斯：11 月（November）28 日週六。", "菲奧娜：11 月 28 日氣象預報晴朗！當晚的專題演講是尋找其他恆星周圍的遙遠行星（planets）。", "盧卡斯：聽起來很棒。請問要怎麼上山？", "菲奧娜：我們的小巴會在市區的中央圖書館（Central Library）門口接人——就在電影院對面。", "盧卡斯：中央圖書館外面。幾點呢？", "菲奧娜：六點整從市區出發，傍晚 6:30（6:30 p.m.）抵達山頂天文台。", "菲奧娜：晚上會非常冷！請穿厚毛衣並帶雙保暖手套（gloves）。", "盧卡斯：好的。那邊咖啡廳有開嗎？", "菲奧娜：咖啡廳五點就關了，不過休息時間每個人都可以免費領一杯熱巧克力（hot chocolate）。", "盧卡斯：真好！門票多少錢？對了，我也想租借一台小型望遠鏡。", "菲奧娜：好的——單買學生票是 15 英鎊，加租小型望遠鏡多 3 英鎊，所以總共是 18 英鎊。", "盧卡斯：18 英鎊，太好了，謝謝！"], "answers": [{"q_num": "Q1", "answer": "Foster", "clue_analysis": "【原聲定位】'Lucas Foster. Spelled F-O-S-T-E-R.'"}, {"q_num": "Q2", "answer": "932604", "clue_analysis": "【原聲定位】'07411... 932604.'"}, {"q_num": "Q3", "answer": "student", "clue_analysis": "【原聲定位】'university student pass'"}, {"q_num": "Q4", "answer": "November", "clue_analysis": "【原聲定位】'Saturday the 28th of November'"}, {"q_num": "Q5", "answer": "planets", "clue_analysis": "【原聲定位】'searching for distant planets'"}, {"q_num": "Q6", "answer": "Library", "clue_analysis": "【原聲定位】'outside the Central Library'"}, {"q_num": "Q7", "answer": "6:30 / 6.30", "clue_analysis": "【原聲定位】'gets up to the hilltop observatory at 6:30 p.m.' 排除出發 6:00。"}, {"q_num": "Q8", "answer": "gloves", "clue_analysis": "【原聲定位】'bring warm gloves'"}, {"q_num": "Q9", "answer": "chocolate", "clue_analysis": "【原聲定位】'free cup of hot chocolate'"}, {"q_num": "Q10", "answer": "18", "clue_analysis": "【原聲定位】'15 pounds + 3 pounds extra, so your total is 18 pounds'"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "深空探測與太空望遠鏡展覽館導覽 (Deep Space & Telescope Pavilion Tour)", "src": "./audio/Unit04_Section2.mp3", "qr": "./qr/unit04-s2.png", "script": ["Neil: Good evening, everyone, and welcome to the Deep Space and Telescope Pavilion! I'm Neil.", "Many guests ask how astronomers know what gases exist on distant planets trillions of kilometres away. We can't send landing probes that far, and radio signals rarely work. Instead, when a planet passes in front of its star, we study the starlight passing through the planet's thin layer of air—each gas leaves a unique colour signature!", "Look up in the main hall at our full-size model of the James Webb Space Telescope. You can't climb inside it, and it's a replica rather than a spare flight unit, yet every hour its eighteen gold mirrors slowly fold open just like they did in space.", "In our Red Star room, we look at why small planets orbiting cool red stars struggle to hold onto their air. Even though they don't spin too fast, their host star frequently blasts them with violent solar flares that strip gases away.", "Before entering the Laser Gallery ahead, please note our safety rule: backpacks are allowed and kids of all ages are welcome, but every guest must wear the green protective glasses handed out at the door.", "Finally, our Space Gift Shop moved last week—it's no longer by the ticket desk or rooftop café, you'll now find it right beside the planetarium exit.", "Here is a quick guide to the rooms.", "In the Light Lab down the left corridor, try our rainbow prism experiment splitting white light into colour bands—the exact trick telescopes use.", "Inside Dome 3, touchscreens let you search through a database of over 5,000 confirmed alien planets.", "Dome 1 is our classic cinema with comfortable reclining seats under a 360-degree night sky show.", "In Dome 2, a bright lamp and giant round card show how a starshade blocks blinding starlight so faint planets appear.", "And right by the stairs, our Kids' Space Corner has small astronaut suits and rocket toys for children to play with.", "Enjoy the tour!"], "trans": ["尼爾：大家晚安，歡迎來到深空與太空望遠鏡展覽館！我是尼爾。", "許多訪客好奇天文學家怎麼知道數萬億公里外行星上有什麼氣體。我們無法派探測器登陸那麼遠，無線電信號也沒什麼用。相反地，當行星從恆星前方經過時，我們研究穿過行星大氣層的星光（studying starlight passing through it）——每種氣體都會留下獨特的顏色指紋！", "抬頭看主廳裡 1:1 的韋伯太空望遠鏡模型。雖然不能爬進去、也不是備用飛行實機，但每小時它的十八面鍍金鏡片都會緩緩摺疊展開（gold mirrors slowly fold open），跟在太空中一模一樣。", "在紅矮星展室，我們探討為何繞著小型紅星轉的行星很難保住空氣。並不是因為自轉太快，而是宿主恆星常噴發猛烈閃焰（strong flares）把大氣吹散。", "進入前方的雷射展廳前請遵守安全守則：背包可以帶進去、各年齡兒童都歡迎，但每位來賓都必須戴上門口發放的綠色防護眼鏡（protective glasses）。", "最後，太空禮品店上週搬家了——不再位於售票台或屋頂咖啡廳旁，現在就在星象廳出口旁邊（beside the planetarium exit）。", "快速介紹各展區：", "左側走廊盡頭的光學實驗室（Light Lab）有稜鏡實驗把白光分成彩虹光譜。", "3 號穹頂（Dome 3）的觸控螢幕可搜尋超過 5,000 顆已確認的系外行星資料庫。", "1 號穹頂（Dome 1）是經典天象劇場，有仰躺座椅可欣賞 360 度星空秀。", "2 號穹頂（Dome 2）用強光燈與巨大圓形遮罩示範星遮罩如何擋住刺眼星光讓暗淡行星現形。", "樓梯旁的兒童太空角（Kids' Space Corner）備有小太空衣與火箭玩具供孩子遊玩。", "祝參觀愉快！"], "answers": [{"q_num": "Q11", "answer": "A", "clue_analysis": "【原聲定位】'study the starlight passing through the planet's thin layer of air' 選 A。"}, {"q_num": "Q12", "answer": "B", "clue_analysis": "【原聲定位】'eighteen gold mirrors slowly fold open' 選 B。"}, {"q_num": "Q13", "answer": "B", "clue_analysis": "【原聲定位】'blasts them with violent solar flares that strip gases away' 選 B。"}, {"q_num": "Q14", "answer": "A", "clue_analysis": "【原聲定位】'every guest must wear the green protective glasses' 選 A。"}, {"q_num": "Q15", "answer": "B", "clue_analysis": "【原聲定位】'right beside the planetarium exit' 選 B。"}, {"q_num": "Q16", "answer": "F", "clue_analysis": "【原聲定位】'Light Lab... rainbow prism experiment' 對應 F。"}, {"q_num": "Q17", "answer": "C", "clue_analysis": "【原聲定位】'Dome 3... database of 5,000 confirmed alien planets' 對應 C。"}, {"q_num": "Q18", "answer": "A", "clue_analysis": "【原聲定位】'Dome 1... reclining seats under a 360-degree night sky' 對應 A。"}, {"q_num": "Q19", "answer": "B", "clue_analysis": "【原聲定位】'Dome 2... bright lamp and giant round card blocking starlight' 對應 B。"}, {"q_num": "Q20", "answer": "G", "clue_analysis": "【原聲定位】'Kids' Space Corner... astronaut suits and rocket toys' 對應 G。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "天文物理課系外行星作業討論 (Astronomy Coursework Discussion)", "src": "./audio/Unit04_Section3.mp3", "qr": "./qr/unit04-s3.png", "script": ["Prof. Thorne: Hi Oliver, hi Rachel. I read your draft report on finding water vapour on planet TRAPPIST-1e.", "Oliver: Great! Do you think our water signal is real?", "Prof. Thorne: Be careful! It's not a dusty lens or Earth's clouds—this is space telescope data. The catch is that cool dark spots on the host star itself can contain water molecules that look almost identical to a planet's atmosphere.", "Rachel: Oh, starspots! That explains why the raw data looked so messy. Honestly, the file format opened fine and timestamps were complete, but the random background noise almost buried the faint signal.", "Prof. Thorne: Right. So how can you test whether it's the star or the planet?", "Oliver: Instead of waiting six months, Rachel and I can compare the transit data across several different light colours—starspots show a steep blue slope, whereas real air shows sharp gaps.", "Prof. Thorne: Spot on. What else stood out to you about the TRAPPIST-1 system?", "Rachel: Actually, the tiny star is very dim, and its speed isn't unusual, yet seeing seven Earth-sized planets packed closer together than Mercury is to our Sun still blows my mind!", "Prof. Thorne: It is extraordinary. For your final marks, don't worry about budget costs or Mars tables—just draw a much clearer diagram of the planet's orbit so readers follow your geometry.", "Oliver: Clearer orbit diagram, got it! Thanks, Professor. Rachel, let's sort out who does what.", "Rachel: Since I downloaded the raw light-curve spreadsheets, I'll finish cleaning those numbers tonight.", "Oliver: Thanks! Then send them to me and I'll plot the colour comparison graph in Python.", "Rachel: What about the clearer orbit diagram Professor Thorne asked for?", "Oliver: I can sketch it out in Illustrator if you're busy?", "Rachel: Yes please, go ahead and draw the orbit diagram—you're much neater than me!", "Oliver: Sure thing. And what about writing the final conclusion on whether life could exist there?", "Rachel: That's the most important paragraph, so let's sit down and write the conclusion together tomorrow.", "Oliver: Agreed! Then once it's done, I have the fast campus upload link, so I'll submit the final PDF before Friday afternoon.", "Rachel: Awesome, team!"], "trans": ["索恩教授：嗨奧利佛、瑞秋。我看了你們在行星 TRAPPIST-1e 上尋找水蒸氣的報告初稿。", "奧利佛：太好了！您覺得我們找到的水訊號是真的嗎？", "索恩教授：要小心！這不是鏡頭有灰塵也不是地球雲層遮擋——這是太空望遠鏡數據。問題在於宿主恆星表面較冷的暗斑本身就可能含有水分子，看起來跟行星大氣極為相似（cold spots on the star look similar）。", "瑞秋：喔，恆星黑子！這就解釋了為什麼原始數據看起來這麼雜亂。其實檔案格式打得開、時間戳也完整，但隨機背景雜訊差點把微弱訊號蓋掉（background noise hid the faint signal）。", "索恩教授：沒錯。那你們要怎麼檢驗究竟是恆星還是行星？", "奧利佛：不用等六個月，瑞秋和我可以比對幾種不同光色的凌日數據（compare data across several light colours）——星黑子在藍光段有陡斜率，真正的大氣則呈尖銳凹槽。", "索恩教授：講得非常準。關於 TRAPPIST-1 星系還有什麼讓你們印象深刻的？", "瑞秋：那顆小恆星其實很暗、移動速度也不特別，但看到七顆地球大小的行星緊密擠在一起（closer than Mercury to our Sun）實在太震撼我了！", "索恩教授：確實非比尋常。為了拿高分，不用管觀測經費或火星對比表——只要把行星軌道圖畫得更清楚（clearer diagram of the orbit），讓讀者看懂幾何位置就好。", "奧利佛：更清楚的軌道圖，收到！謝謝教授。瑞秋，我們來分一下工作。", "瑞秋：原始光變表格是我下載的，今晚我把數字清理完。", "奧利佛：謝啦！整理完傳給我，我用 Python 畫出光色對比圖。", "瑞秋：那教授要的更清楚軌道圖呢？", "奧利佛：如果妳在忙，我用 Illustrator 畫？", "瑞秋：好啊麻煩你畫軌道圖，你畫圖比我整齊多了！", "奧利佛：沒問題。那寫「那裡是否可能有生命」的總結呢？", "瑞秋：那是最關鍵的一段，我們明天坐下來一起寫總結吧。", "奧利佛：同意！寫完後我有學校高速上傳連結，我週五下午前負責上傳最終 PDF。", "瑞秋：太棒了，合作愉快！"], "answers": [{"q_num": "Q21", "answer": "A", "clue_analysis": "【原聲定位】'cool dark spots on the host star... look almost identical to a planet's atmosphere' 選 A。"}, {"q_num": "Q22", "answer": "B", "clue_analysis": "【原聲定位】'random background noise almost buried the faint signal' 選 B。"}, {"q_num": "Q23", "answer": "B", "clue_analysis": "【原聲定位】'compare the transit data across several different light colours' 選 B。"}, {"q_num": "Q24", "answer": "A", "clue_analysis": "【原聲定位】'seven Earth-sized planets packed closer together... blows my mind' 選 A。"}, {"q_num": "Q25", "answer": "C", "clue_analysis": "【原聲定位】'draw a much clearer diagram of the planet's orbit' 選 C。"}, {"q_num": "Q26", "answer": "B", "clue_analysis": "【原聲定位】Rachel: 'I'll finish cleaning those numbers tonight' 選 B。"}, {"q_num": "Q27", "answer": "A", "clue_analysis": "【原聲定位】Oliver: 'I'll plot the colour comparison graph' 選 A。"}, {"q_num": "Q28", "answer": "A", "cl
