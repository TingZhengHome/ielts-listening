ue_analysis": "【原聲定位】Rachel: 'go ahead and draw the orbit diagram' 選 A。"}, {"q_num": "Q29", "answer": "C", "clue_analysis": "【原聲定位】Rachel: 'write the conclusion together tomorrow' 選 C。"}, {"q_num": "Q30", "answer": "A", "clue_analysis": "【原聲定位】Oliver: 'I'll submit the final PDF before Friday' 選 A。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Atmospheric Fingerprint: Exoplanet Spectroscopy, Atmospheric Transmission, and Biosignature Detection", "src": "./audio/Unit04_Section4.mp3", "qr": "./qr/unit04-s4.png", "script": ["▶ Section 1  ‧  Beyond Geometric Detection: The Spectroscopy Revolution", "Section 1  Good morning, class. In today's astrophysics lecture, we are moving beyond the mere detection of extrasolar planets to what constitutes the ultimate holy grail of modern observational astronomy: characterizing their atmospheric compositions. Over the past three decades, astronomers have discovered over five thousand exoplanets, primarily through transit photometry—measuring the tiny dip in stellar brightness as a planet crosses in front of its host star—and the radial velocity method, which detects the subtle gravitational wobble of the star. However, merely establishing a planet's orbital radius and physical bulk density tells us very little about its actual surface conditions. To ascertain whether a distant rocky world harbors liquid water or atmospheric chemistry hospitable to biology, we must analyze the faint spectral fingerprints imprinted onto starlight.", "▶ Section 2  ‧  Mechanics of Transmission and Emission Spectroscopy", "Section 2  The preeminent analytical technique utilized today is transmission spectroscopy. During a primary transit, as an exoplanet passes directly along our line of sight across the stellar disk, a minuscule fraction of starlight filters through the gaseous annulus of the planet's upper atmosphere. Gas molecules within that atmosphere absorb specific wavelengths of light corresponding to their quantized quantum transitions. Shorter blue wavelengths may undergo Rayleigh scattering by tiny atmospheric particles, while longer infrared wavelengths are selectively filtered by molecular vibrational bonds. By subtracting the star's baseline emission spectrum from the filtered transit spectrum, astrophysicists construct a transmission spectrum. This reveals distinct absorption dips that serve as a direct chemical inventory of the exoplanet's atmosphere.", "▶ Section 3  ‧  Atmospheric Greenhouse Gases and Disequilibrium Markers", "Section 3  What specific chemical species are astrophysicists searching for? The foundational atmospheric components include water vapor, carbon dioxide, and methane. In an abiotic, inert planetary atmosphere, chemical compounds tend toward thermodynamic equilibrium. However, the presence of biological life forcefully drives an atmosphere into profound chemical disequilibrium. The quintessential biosignature on Earth is the simultaneous coexistence of abundant methane alongside high concentrations of molecular oxygen or ozone. Under normal chemical kinetics, methane reacts vigorously with oxygen to form water and carbon dioxide; therefore, for both gases to persist indefinitely in significant quantities, there must be a continuous, high-flux biogenic replenishing source.", "The Atmospheric Fingerprint: Exoplanet Spectroscopy, Atmospheric Transmission, and Biosignature Detection (Continued)", "▶ Section 4  ‧  The Perils of False Positives and Abiotic Mimics", "Section 4  Nevertheless, astrobiologists must navigate formidable interpretative minefields: namely, the risk of false positives. It was long assumed that substantial atmospheric oxygen was a definitive indicator of biological photosynthesis. However, photochemical modeling has revealed multiple abiotic pathways capable of generating oxygen without biological intervention. For example, intense ultraviolet radiation from active red dwarf M-stars can cause runaway photolysis of atmospheric water molecules. The light hydrogen atoms rapidly escape into space through hydrodynamic outflow, leaving dense, abiotic molecular oxygen behind. Similarly, abiotic methane can be synthesized through serpentinization reactions occurring in deep hydrothermal vents. Distinguishing a genuine metabolic biosignature from an abiotic geological mimic requires comprehensive context across the entire planetary system.", "▶ Section 5  ‧  Next-Generation Observatories and the Search for Biospheres", "Section 5  The frontier of this observational discipline has been dramatically accelerated by space-based infrared observatories, particularly the James Webb Space Telescope. JWST's high-resolution spectrometers are currently scrutinizing the atmospheres of the TRAPPIST-1 system—a compact family of seven Earth-sized worlds orbiting an ultracool red dwarf forty light-years away. Looking further ahead, mission concepts like the Habitable Worlds Observatory plan to deploy advanced optical coronagraphs capable of directly suppressing stellar glare by a factor of ten billion. This will enable direct spectroscopy of Earth analogs in the habitable zones of Sun-like stars. We stand on the technological threshold of answering humanity's most profound existential inquiry: whether our living biosphere is a cosmic singularity or a common planetary outcome."], "trans": ["Section 1  大家早安。在今天的天體物理學講座中，我們將跨越單純搜尋太陽系外行星的初級階段，邁向現代觀測天文學的終極聖杯：解析系外行星的大氣化學成分。在過去三十年間，天文學家已經發現了超過五千顆系外行星，這主要是透過「凌日測光法」（測量行星掠過母恆星表面時引起的微小亮度下降）以及「徑向速度法」（檢測行星引力導致恆星產生的微弱週期性擺動）。然而，單純確定一顆行星的軌道半徑與整體體積密度（bulk density），幾乎無法告訴我們其表面真實環境的任何資訊。要確證遙遠的岩石世界是否擁有液態水或適宜生物孕育的大氣化學條件，我們必須深入分析烙印在恆星光芒中的微弱光譜指紋。", "Section 2  目前最頂尖的分析工具是「透射光譜學（transmission spectroscopy）」。當系外行星沿著我們的視線方向直接穿越母恆星盤面時，一小部分星光會穿透行星高層大氣的氣體環（annulus）。大氣中的氣體分子會吸收特定波長的光子，對應於其量子化的能量躍遷。較短的藍色波長容易受到大氣微粒引發的瑞利散射（Rayleigh scattering），而較長的紅外波長則會被分子的化學振動鍵所選擇性吸收。天體物理學家透過從過濾後的凌日志光譜中扣除恆星的基準發射光譜，建構出精準的透射光譜圖。這揭示了一系列獨特的吸收峰谷，成為評估系外行星大氣成分的直接化學清單。", "Section 3  天體物理學家究竟在尋找哪些特定的化學分子？基礎的大氣組成包括水蒸氣、二氧化碳與甲烷。在一個沒有生命存在的惰性行星大氣中，化學化合物往往趨向於熱力學平衡狀態。然而，生物圈的存在會強力迫使大氣脫離平衡，進入深刻的「化學非平衡態（chemical disequilibrium）」。地球上最經典的生命印記，是大量甲烷與高濃度分子氧（或臭氧）的同時共存。在常規的化學動力學下，甲烷會迅速與氧氣反應轉化為水與二氧化碳；因此，若兩種氣體能以可觀的濃度長期共存，背後必然存在源源不絕、高通量的生物成因補充來源。", "Section 4  儘管如此，天體生物學家必須在險象環生的科學雷區中謹慎求證：即「假陽性（false positives）」的致命風險。長期以來，人們普遍認為大氣中存在豐沛氧氣即為生物光合作用的決定性證據。然而，大氣光化學建模揭示了多條無需生物介入即可生成氧氣的「非生物途徑」。例如，活躍的 M 型紅矮星所釋放的強烈紫外線輻射，會引發大氣水分子失控的光解作用（photolysis）。較輕的氫原子透過流體動力學逃逸（hydrodynamic escape）迅速逸散至太空深處，留下了高濃度的非生物成因分子氧。同樣地，深海熱泉中的蛇紋石化反應亦能在無生命環境下合成甲烷。要將真實的代謝生命印記與非生物的地質偽裝區分開來，需要縱觀整個行星系統的全域環境脈絡。", "Section 5  以太空為基地的紅外天文台——特別是詹姆斯·韋伯太空望遠鏡（JWST）——極大地推進了這門觀測學科的前沿。JWST 的高解析度光譜儀目前正密切審視 TRAPPIST-1 行星系統——這是一個距離地球四十光年、由七顆地球大小的岩石行星環繞一顆超低溫紅矮星運行的緊湊家族。展望更長遠的未來，諸如「宜居世界天文台（Habitable Worlds Observatory）」等任務概念，計劃部署先進的光學日冕儀（coronagraphs），能夠將刺眼的恆星眩光直接壓制一百億倍。這將使天文學家能夠對類太陽恆星宜居帶中的類地行星進行直接光譜成像。我們正站在歷史性的技術門檻上，即將回答人類最深刻的存在提問：我們所在的繁茂生物圈究竟是宇宙中的孤例，抑或是行星演化的普遍必然。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. density  【原聲定位】Section 1: 'orbital radius and physical bulk density tells us very little'"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. atmosphere  【原聲定位】Section 2: 'gaseous annulus of the planet's upper atmosphere.' 【解析】改考高頻核心詞 atmosphere。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. Rayleigh  【原聲定位】Section 2: 'Shorter blue wavelengths may undergo Rayleigh scattering by tiny atmospheric particles...' 【解析】專有名詞光學散射術語，首字母需大寫 Rayleigh。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. methane  【原聲定位】Section 3: 'simultaneous coexistence of abundant methane alongside high concentrations of molecular oxygen'"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. oxygen  【原聲定位】Section 4: 'leaving dense, abiotic molecular oxygen behind.'"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. coronagraphs  【原聲定位】Section 5: 'deploy advanced optical coronagraphs'"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 2: 'By subtracting the star's baseline emission spectrum from the filtered transit spectrum... reveals distinct absorption dips that serve as a direct chemical inventory...' 【解析】扣除恆星基準光以突顯行星大氣專屬的吸收峰谷，對應選項 B。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. A  【原聲定位】Section 3: 'In an abiotic, inert planetary atmosphere, chemical compounds tend toward thermodynamic equilibrium.' 【解析】無生命惰性行星始終趨向熱力學靜態平衡，對應選項 A。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. B  【原聲定位】Section 4: 'The light hydrogen atoms rapidly escape into space through hydrodynamic outflow, leaving dense, abiotic molecular oxygen behind.' 【解析】光解後輕質氫原子流體逃逸導致殘存非生物氧氣，對應選項 B。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. A  【原聲定位】Section 5: 'the TRAPPIST-1 system—a compact family of seven Earth-sized worlds orbiting an ultracool red dwarf forty light-years away.' 【解析】由七顆緊湊圍繞紅矮星運行的地球尺寸行星組成，對應選項 A。"}]}}}, {"num": 5, "tag": "unit05", "folder": "語言學與教育", "chapter": "第二篇章 ‧ 人文、心智與社會科學（標準難度版）", "title": "Linguistic Relativity & Bilingual Education (Standard Edition)", "titleZh": "雙語兒童暑期故事班報名、語言中心導覽與雙語專題討論", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (標準難度 Sec 1–4)", "src": "./audio/Unit05_Full_Section1_to_4.mp3", "qr": "./qr/unit05.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "兒童雙語故事與遊戲暑期班報名 (Bilingual Summer Story Club Enrollment)", "src": "./audio/Unit05_Section1.mp3", "qr": "./qr/unit05-s1.png", "script": ["Mr. Davies: Bright Minds Bilingual Club, Mr. Davies speaking.", "Mrs. Jenkins: Hello! I'd like to register my son Toby for your summer morning club.", "Mr. Davies: Wonderful! May I take Toby's full name?", "Mrs. Jenkins: Toby Jenkins. Spelled J-E-N-K-I-N-S.", "Mr. Davies: And how old is Toby?", "Mrs. Jenkins: He turns five next month, so he's currently four years old.", "Mr. Davies: Four, perfect. And your contact phone number?", "Mrs. Jenkins: 07733... 819402.", "Mr. Davies: Thanks. We offer French and Spanish groups—which would you like?", "Mrs. Jenkins: English and Spanish, please—we speak a little at home.", "Mr. Davies: Great. Our next session starts on Tuesday the 9th of August.", "Mrs. Jenkins: August 9th is fine. Can he come all five mornings?", "Mr. Davies: For four-year-olds, five days is a bit tiring, so we limit that group to three mornings a week.", "Mrs. Jenkins: Three mornings sounds sensible. What do they do?", "Mr. Davies: Mostly fun games, songs, and reading colourful picture books together.", "Mrs. Jenkins: Lovely. Does he need to bring snacks? By the way, he cannot eat peanuts—he's allergic.", "Mr. Davies: Peanuts, I'll mark that in red! No need to pack snacks; we supply fruit. Who will pick him up?", "Mrs. Jenkins: Usually his grandmother, Mrs. Sinclair.", "Mr. Davies: Got it. And fees: full-day sessions are 60 pounds a week, while the three-morning club including snacks is 45 pounds.", "Mrs. Jenkins: Forty-five pounds, wonderful. Thank you!"], "trans": ["戴維斯先生：聰明頭雙語社團，我是戴維斯先生。", "詹金斯太太：您好！我想幫兒子托比報名你們的暑期上午班。", "戴維斯先生：太好了！請問托比的全名是？", "詹金斯太太：托比・詹金斯（Toby Jenkins），J-E-N-K-I-N-S。", "戴維斯先生：托比幾歲了？", "詹金斯太太：他下個月滿五歲，所以目前是四歲（4 years old）。", "戴維斯先生：四歲，正好。您的聯絡電話？", "詹金斯太太：07733……819402。", "戴維斯先生：謝謝。我們有法語和西班牙語組——您想選哪一種？", "詹金斯太太：英語和西班牙語（Spanish），我們在家也會講一點。", "戴維斯先生：太好了。下一期從 8 月（August）9 日週二開始。", "詹金斯太太：8 月 9 日沒問題。他可以五個早上都來嗎？", "戴維斯先生：對四歲小朋友來說五天太累了，所以該班限定每週三個早上（three mornings）。", "詹金斯太太：三個早上很合理。他們上課都做些什麼？", "戴維斯先生：主要是好玩遊戲、唱歌，還有一起看彩色圖畫書（picture books）。", "詹金斯太太：真棒。需要帶點心嗎？對了，他不能吃花生（peanuts）——他會過敏。", "戴維斯先生：花生，我用紅筆標記！不用帶點心，我們提供水果。誰會來接他？", "詹金斯太太：通常是他的外祖母（grandmother），辛克萊太太。", "戴維斯先生：好的。費用方面：全日班一週 60 英鎊，三個早上含點心是 45 英鎊。", "詹金斯太太：45 英鎊，太棒了。謝謝您！"], "answers": [{"q_num": "Q1", "answer": "Jenkins", "clue_analysis": "【原聲定位】'Toby Jenkins. Spelled J-E-N-K-I-N-S.'"}, {"q_num": "Q2", "answer": "4 / four", "clue_analysis": "【原聲定位】'currently four years old' 排除下月五歲干擾。"}, {"q_num": "Q3", "answer": "819402", "clue_analysis": "【原聲定位】'07733... 819402.'"}, {"q_num": "Q4", "answer": "Spanish", "clue_analysis": "【原聲定位】'English and Spanish, please'"}, {"q_num": "Q5", "answer": "August", "clue_analysis": "【原聲定位】'Tuesday the 9th of August'"}, {"q_num": "Q6", "answer": "3 / three", "clue_analysis": "【原聲定位】'limit that group to three mornings a week' 排除五天干擾。"}, {"q_num": "Q7", "answer": "picture", "clue_analysis": "【原聲定位】'reading colourful picture books'"}, {"q_num": "Q8", "answer": "peanuts", "clue_analysis": "【原聲定位】'he cannot eat peanuts'"}, {"q_num": "Q9", "answer": "grandmother", "clue_analysis": "【原聲定位】'Usually his grandmother, Mrs. Sinclair'"}, {"q_num": "Q10", "answer": "45", "clue_analysis": "【原聲定位】'three-morning club including snacks is 45 pounds' 排除全日班 60 鎊。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "語言與兒童發展研究中心導覽 (Child Language Research Centre Tour)", "src": "./audio/Unit05_Section2.mp3", "qr": "./qr/unit05-s2.png", "script": ["Dr. Cole: Good afternoon, new student helpers, and welcome to the Child Language Research Centre. I'm Dr. Miriam Cole.", "Let me explain a couple of our main projects. First, in our eye-camera study, we aren't testing reading speed or screen glare—we track which picture on a screen listeners look at first the instant they hear a spoken clue.", "In our famous colour test, we compared English and Russian speakers. They had the same eyesight and no extra practice, yet Russian speakers spotted differences between light and dark blue faster—simply because Russian uses two completely separate everyday words for them.", "Next, you'll help inside our Quiet Room. We don't require lab coats, and carpet keeps shoes quiet enough—just remember to switch off all mobile phones outside so they don't buzz during recordings.", "Parents often ask about privacy for children's voice files. We keep recordings for future science rather than deleting them, and lock nothing in banks—instead, we strictly hide all real names and personal details before saving any file.", "If you ever need spare headphones or cables, they aren't at reception anymore—look inside the green cupboard in Room B.", "Now let's review our seven rooms.", "Room 2 is our Sound Booth, fitted with studio microphones to record crystal-clear speech.", "Right next door is Room 4, the Parent Lounge, where mothers and fathers can relax with tea and magazines while watching through the window.", "Down the hall, Room 3 is the Play Area, where toddlers sort wooden toys by shape and colour.", "Room 5 is our Word Game Room, with desktop computers checking how fast bilingual teenagers react to mixed-language words.", "Finally, Room 7 is the Archive Office, where assistants type up written notes from our recorded interviews.", "Let's grab a visitor badge and begin!"], "trans": ["科爾博士：各位新學生助理午安，歡迎來到兒童語言研究中心。我是米莉安・科爾博士。", "我來介紹幾個主要研究。首先在眼動攝影機研究中，我們不測閱讀速度也不測螢幕反光——我們追蹤受試者在聽到語音線索的瞬間，最先看螢幕上的哪一張圖片（which pictures listeners look at first）。", "在著名的顏色測驗中，我們比較了英語和俄語母語者。他們視力相同也沒提前練習，但俄語母語者辨識淺藍與深藍的速度更快——純粹因為俄語用兩個完全獨立的日常詞彙來區分它們（separates light and dark blue）。", "接著你們會在安靜室幫忙。不用穿實驗袍，地毯也很吸音——只要記得在門外關掉手機（switch off mobile phones），以免錄音時震動干擾。", "家長常關心兒童錄音隱私。我們會保留錄音供科學研究而不刪除，也不必鎖進銀行——我們是在存檔前嚴格隱藏所有真實姓名與個人資料（hiding all names and details）。", "如果需要備用耳機和傳輸線，現在不在接待處了，請去 B 室的綠色櫥櫃（green cupboard in Room B）裡拿。", "現在來看看七個房間：", "2 號房是錄音室（Sound Booth），配有用於清晰收音的專業麥克風。", "隔壁 4 號房是家長休息室（Parent Lounge），爸媽可以喝茶看雜誌透過玻璃觀察。", "走廊下去的 3 號房是遊戲區（Play Area），觀察幼兒如何依形狀和顏色分類木頭玩具。", "5 號房是字詞遊戲室（Word Game Room），用桌上型電腦測試雙語青少年的詞彙反應速度。", "最後 7 號房是檔案辦公室（Archive Office），助理在這裡把錄音訪談打成文字紀錄。", "我們拿了訪客證就開始吧！"], "answers": [{"q_num": "Q11", "answer": "B", "clue_analysis": "【原聲定位】'track which picture on a screen listeners look at first' 選 B。"}, {"q_num": "Q12", "answer": "B", "clue_analysis": "【原聲定位】'Russian uses two completely separate everyday words for them' 選 B。"}, {"q_num": "Q13", "answer": "B", "clue_analysis": "【原聲定位】'remember to switch off all mobile phones outside' 選 B。"}, {"q_num": "Q14", "answer": "B", "clue_analysis": "【原聲定位】'strictly hide all real names and personal details' 選 B。"}, {"q_num": "Q15", "answer": "B", "clue_analysis": "【原聲定位】'inside the green cupboard in Room B' 選 B。"}, {"q_num": "Q16", "answer": "B", "clue_analysis": "【原聲定位】'Room 2... Sound Booth, studio microphones to record clear speech' 對應 B。"}, {"q_num": "Q17", "answer": "D", "clue_analysis": "【原聲定位】'Room 4... Parent Lounge, relax with tea and magazines' 對應 D。"}, {"q_num": "Q18", "answer": "C", "clue_analysis": "【原聲定位】'Room 3... Play Area, toddlers sort wooden toys' 對應 C。"}, {"q_num": "Q19", "answer": "E", "clue_analysis": "【原聲定位】'Room 5... Word Game Room, desktop computers checking reaction' 對應 E。"}, {"q_num": "Q20", "answer": "G", "clue_analysis": "【原聲定位】'Room 7... Archive Office, type up written notes' 對應 G。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "語言學課堂方向詞彙研究專題討論 (Linguistics Student Survey Discussion)", "src": "./audio/Unit05_Section3.mp3", "qr": "./qr/unit05-s3.png", "script": ["Dr. Bennett: Come in, Chloe and David. Let's talk about your spatial language experiment.", "Chloe: Thanks, Dr. Bennett! We ran our pilot test turning volunteers around inside that windowless room with toy animals.", "Dr. Bennett: Right, well, the toy sizes were fine and thirty people was plenty—but without windows so volunteers can see the sun or outside landmarks, nobody can keep track of real north and south! Take the test outdoors next time.", "David: Good point! Chloe, remember that Australian indigenous language article? I loved how easily they say 'there's an ant on your south-east leg'.", "Chloe: Yeah, what really amazed me is how they never lose track of where north is, even indoors in the dark!", "David: True. And for our own test, remember why we asked volunteers to count numbers out loud while rotating the cards?", "Chloe: Let's see—was it to time them?", "David: No, it stopped their brains from silently whispering 'left' or 'right' to themselves while solving the puzzle!", "Dr. Bennett: Clever trick. So what is your main takeaway from all these results?", "Chloe: Well, language definitely doesn't trap people in one rigid mindset, nor is it useless—it simply nudges what details our eyes pay attention to.", "David: Yes, I completely agree with that!", "Dr. Bennett: Spot on. Your intro length and sample size are great; just add a simple diagram showing how the outdoor chairs were arranged before handing in your final essay.", "Chloe: Easy! Thanks, Dr. Bennett. David, let's check our draft sections quickly.", "David: First, the summary of the 1940s Sapir-Whorf theory—it reads smoothly.", "Chloe: Yeah, let's keep it just as it is.", "David: Next, our table comparing German and English video clips—Dr. Bennett found the labels confusing.", "Chloe: Fair point, let's rewrite that table clearly.", "David: What about our personal opinion page on primary school language tests?", "Chloe: Honestly, it feels off-topic for this research report. Let's remove it altogether.", "David: Agreed. And the bar chart of reaction times?", "Chloe: All the numbers are correct, though the colours and axis titles look messy—we'd better rewrite the chart labels.", "David: Good idea. Finally, the reading book list at the back?", "Chloe: Dr. Bennett already ticked every reference, so let's keep it!"], "trans": ["班奈特博士：請進，克洛伊和大衛。我們來談談你們的空間語言實驗。", "克洛伊：謝謝班奈特博士！我們在那個沒有窗戶的房間裡擺了小動物玩具讓受試者轉圈做預試。", "班奈特博士：玩具大小很剛好，三十人也足夠——但沒有窗戶讓受試者看到太陽或戶外地標（could not see the sun outside），沒人分得出真正的南北！下次移到戶外測吧。", "大衛：有道理！克洛伊，還記得那篇澳洲原住民語言文章嗎？他們能輕鬆說出「你的東南腳上有一隻螞蟻」太帥了。", "克洛伊：對呀，最讓我驚嘆的是他們就算在室內黑暗中也永遠不會忘記北方在哪裡（never forget where north is）！", "大衛：真的。那在我們自己的測試裡，還記得為什麼要請受試者在轉卡片時大聲數數字嗎？", "克洛伊：我想想——是為了計時嗎？", "大衛：不是，那是為了阻止他們的大腦在解題時偷偷在心裡默念「左」或「右」（stop them repeating directions silently）！", "班奈特博士：很聰明的設計。那從這些結果來看，你們的核心結論是什麼？", "克洛伊：語言絕對不會把人鎖死在一種固定思維裡，但也不是毫無作用——它只是溫和地引導我們眼睛注意哪些細節（gently guides what people pay attention to）。", "大衛：對，我完全同意這點！", "班奈特博士：非常精準。你們的引言長度和樣本數都很好；交終稿前只要補一張戶外椅子擺放的簡單示意圖（clear diagram）就好。", "克洛伊：小事！謝謝博士。大衛，我們快速核對一下報告草稿各節。", "大衛：第一是 1940 年代薩丕爾-沃夫理論摘要——讀起來很順。", "克洛伊：對，原樣保留（Keep it）。", "大衛：再來是德語和英語影片對比表——博士覺得標籤有點混亂。", "克洛伊：有道理，我們重寫（Rewrite it）那張表清楚一點。", "大衛：那關於小學語言測驗的個人感想那一頁呢？", "克洛伊：老實說跟這份研究報告離題了，整頁移除（Remove it）吧。", "大衛：同意。那反應時間長條圖呢？", "克洛伊：數字都對，但顏色和座標軸標題很亂——我們還是重寫重畫一下。", "大衛：好主意。最後是書末的推薦書單？", "克洛伊：博士都打勾確認過書目了，直接保留吧！"], "answers": [{"q_num": "Q21", "answer": "B", "clue_analysis": "【原聲定位】'without windows so volunteers can see the sun or outside landmarks' 選 B。"}, {"q_num": "Q22", "answer": "A", "clue_analysis": "【原聲定位】'never lose track of where north is, even indoors in the dark' 選 A。"}, {"q_num": "Q23", "answer": "A", "clue_analysis": "【原聲定位】'stopped their brains from silently whispering left or right' 選 A。"}, {"q_num": "Q24", "answer": "B", "clue_analysis": "【原聲定位】'gently nudges what details our eyes pay attention to' 選 B。"}, {"q_num": "Q25", "answer": "A", "clue_analysis": "【原聲定位】'add a simple diagram showing how the outdoor chairs were arranged' 選 A。"}, {"q_num": "Q26", "answer": "A", "clue_analysis": "【原聲定位】'Sapir-Whorf theory... keep it just as it is.' 對應 A。"}, {"q_num": "Q27", "answer": "B", "clue_analysis": "【原聲定位】'table comparing German and English... rewrite that table clearly.' 對應 B。"}, {"q_num": "Q28", "answer": "C", "clue_analysis": "【原聲定位】'personal opinion page... remove it altogether.' 對應 C。"}, {"q_num": "Q29", "answer": "B", "clue_analysis": "【原聲定位】'bar chart... better rewrite the chart labels.' 對應 B。"}, {"q_num": "Q30", "answer": "A", "clue_analysis": "【原聲定位】'book list... let's keep it!' 對應 A。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Linguistic Relativity Paradigm: Cognitive Architecture, Cross-Linguistic Perception, and Pedagogical Evolution", "src": "./audio/Unit05_Section4.mp3", "qr": "./qr/unit05-s4.png", "script": ["▶ Section 1  ‧  The Sapir-Whorf Hypothesis: From Determinism to Relativity", "Section 1  Good morning, everyone. In today's sociolinguistics and cognitive science lecture, we are re-examining one of the most vigorously debated intellectual questions of the modern era: does the language we speak actively shape the way we perceive reality? This inquiry crystallized in the early twentieth century through the pioneering work of Edward Sapir and his student Benjamin Lee Whorf, giving rise to what is formally known as the Sapir-Whorf hypothesis. In its original, radical formulation—linguistic determinism—language was theorized to be an inescapable mental prison: if a language lacked a word for a concept, its speakers were physically incapable of conceptualizing it. By the late twentieth century, universalist linguists led by Noam Chomsky largely discredited this strict deterministic view, demonstrating that underlying cognitive structures are universally shared across human biology. However, contemporary cognitive linguistics has resurrected a refined, empirically supported version: linguistic relativity.", "▶ Section 2  ‧  Spatial Reckoning and Directional Cognition", "Section 2  The most striking empirical demonstrations of linguistic relativity emerge from cross-linguistic studies of spatial reckoning. Consider the Australian indigenous language Guugu Yimithirr, spoken in northern Queensland. Unlike Indo-European languages, which rely on egocentric spatial coordinates—such as 'to my left', 'behind you', or 'in front of the table'—Guugu Yimithirr utilizes an absolute cardinal direction system. Speakers define spatial relationships exclusively using absolute geocentric vectors: north, south, east, and west. A speaker would not say 'move to your left'; they would say 'shift slightly to the southwest'. Field experiments conducted by cognitive psychologists demonstrated that speakers of Guugu Yimithirr possess an extraordinary, continuous internal compass. Even when blindfolded and spun in dark, windowless rooms, their ability to orient themselves with geographic precision surpasses that of compass-equipped Western navigators. Their linguistic grammar literally enforces constant cognitive tracking of planetary space.", "▶ Section 3  ‧  Chromatic Categorization and Temporal Metaphors", "Section 3  A second fascinating frontier involves the linguistic categorization of color boundaries and temporal progression. In English, we use the single basic color term 'blue' to encompass everything from baby blue to deep navy. In contrast, the Russian language morphologically enforces two distinct, non-overlapping basic color categories: 'goluboy' for light blue and 'siniy' for dark blue. Neuro-linguistic event-related potential (ERP) experiments show that Russian speakers' brains register an automatic pre-attentive brainwave spike—the mismatch negativity signal—when an optical shade shifts across the goluboy-siniy linguistic boundary, a neural reaction completely absent in native English speakers. Similarly, while Western cultures metaphorically conceptualize time horizontally, with the future lying ahead and the past behind, Mandarin speakers frequently employ vertical temporal metaphors, conceptualizing the past as up ('shàng') and the future as down ('xià'). These habitual metaphors subtly orient temporal reasoning tasks.", "The Linguistic Relativity Paradigm: Cognitive Architecture, Cross-Linguistic Perception, and Pedagogical Evolution (Continued)", "▶ Section 4  ‧  Bilingualism and Executive Cognitive Control", "Section 4  When an individual acquires and actively switches between multiple linguistic systems, how does this affect core cognitive architecture? Research in developmental psychology demonstrates that bilingualism confers profound structural enhancements to executive function. The brain's executive control network—centered in the prefrontal cortex—is responsible for inhibitory control, task switching, and working memory allocation. Because both language systems remain simultaneously active in a bilingual speaker's brain, the executive network must constantly suppress interference from the non-target language. This lifelong neural gymnastics acts as cognitive weightlifting, significantly expanding cognitive reserve. Longitudinal epidemiological studies reveal that lifelong bilinguals exhibit clinical manifestations of neurodegenerative dementia on average four to five years later than monolinguals of comparable socioeconomic status.", "▶ Section 5  ‧  Pedagogical Evolution in Second Language Acquisition", "Section 5  These cognitive revelations have catalyzed a sweeping paradigm shift within applied linguistics and language pedagogy. Historically, language education was dominated by the grammar-translation method and rote behavioral drilling, treating language as an abstract set of computational algebraic rules. Modern communicative and task-based pedagogical frameworks, however, view language as an embodied, culture-bearing cognitive ecosystem. Effective second language acquisition is no longer measured solely by syntactic accuracy or lexical memorization, but by the learner's capacity to internalize new cognitive frames, navigate subtle sociolinguistic nuances, and develop intercultural empathy. Ultimately, learning a new language does not merely furnish a novel set of vocal sounds for familiar thoughts; it endows the human mind with an alternative conceptual architecture through which to experience the world."], "trans": ["Section 1  大家早安。在今天的社會語言學與認知科學講座中，我們將重新審視現代最具激烈爭論的學術提問之一：我們所使用的語言，是否會主動塑造我們感知現實的方式？這項探索在二十世紀初因愛德華·薩丕爾（Edward Sapir）與其學生班傑明·李·沃夫（Benjamin Lee Whorf）的開創性研究而具象化，並正式發展為「薩丕爾-沃夫假說（Sapir-Whorf hypothesis）」。在其最初激進的表述——即「語言決定論（linguistic determinism）」——中，語言被理論化為一座無法逃脫的心智牢籠：若一種語言缺乏某個概念的詞彙，其使用者在生理上就無法構想該概念。到了二十世紀末，以諾姆·杭士基（Noam Chomsky）為首的普遍主義語言學家在很大程度上反駁了這種嚴格決定論觀點，證明底層認知架構在全人類生物層面上是共通的。然而，當代認知語言學復興了一個精緻化且具備實證支持的版本：語言相對論（linguistic relativity）。", "Section 2  語言相對論最震撼的實證展示，來自於跨語言的空間定位研究。以澳洲昆士蘭北部原住民語言顧古伊米西爾語（Guugu Yimithirr）為例。不同於印歐語系普遍依賴「自我中心空間座標」——例如「在我左邊」、「在你身後」或「在桌子前方」——顧古伊米西爾語採用了一套絕對基點方位系統（absolute cardinal direction system）。講者完全使用絕對地心座標向量來定義空間關係：東、南、西、北。講者絕不會說「請往你的左邊挪一點」；他們會說「請往西南方微移」。認知心理學家的現場實驗證實，顧古伊米西爾語的使用者具備非凡且持續運作的「內部指南針（internal compass）」。即使被蒙上雙眼並在黑暗無窗的密閉房間中旋轉，他們精準辨別地理方位的能力仍超越配備指南針的西方航海家。他們的語言語法，從根本上強制大腦必須持續追蹤行星級的地理空間。", "Section 3  第二個引人入勝的前沿領域，涉及色彩邊界的語言範疇化與時間隱喻。在英語中，我們使用單一的基本顏色詞「blue」來概括從嬰兒藍到深海藍的所有色調。相反地，俄語在詞法上強制區分兩種互不重疊的基本顏色範疇：淺藍「goluboy」與深藍「siniy」。神經語言學的事件相關電位（ERP）腦波實驗顯示，當光學色調跨越 goluboy 與 siniy 的語言分界線時，俄語使用者的腦波會自動爆發出無意識的失配負向波（MMN）峰值信號，而這項神經反應在英語母語者的大腦中完全不存在。同樣地，西方文化習慣以水平座標隱喻時間（未來在前方，過去在後方），而中文使用者則頻繁使用垂直時間隱喻（將過去視為「上」，未來視為「下」）。這些習慣性隱喻在潛移默化中形塑了時間推理任務的思維走向。", "Section 4  當一個人習得並在多種語言體系之間頻繁切換時，這會如何重塑大腦的核心認知架構？發展心理學研究證實，雙語經驗能對「執行功能（executive function）」帶來深刻的結構性強化。大腦的執行控制網絡——以大腦前額葉皮質為核心——負責抑制控制、任務切換以及工作記憶分配。由於雙語者大腦中兩種語言系統始終保持同時活化狀態，執行網絡必須持續抑制非目標語言的干擾。這種終生不輟的神經體操宛如心智重訓，大幅擴充了「認知儲備（cognitive reserve）」。長期流行病學追蹤顯示，終生使用雙語的長者，其神經退化性失智症的臨床症狀發作時間，比社會經濟背景相當的單語者平均延遲了四到五年。", "Section 5  這些認知科學的重大發現，在應用語言學與外語教學法領域引發了廣泛的範式轉移。歷史上，語言教育長年受到文法翻譯法與機械式行為主義句型操練的支配，將語言視為一套抽象的代數運算規則。然而，現代溝通式與任務型教學架構（communicative and task-based frameworks），已將語言視為一個具身化、乘載深厚文化的認知生態系統。高成效的第二語言習得不再單純由句法正確性或字彙死記硬背來衡量，而是看學習者能否內化全新的認知架構、駕馭微妙的社會語言學語境，並培養跨文化的同理心。歸根結底，學習一門新語言絕非僅僅替熟悉的舊思想換上一套新發音；它賦予了人類心智一套全新的概念體系，讓我們能以另一種視角深邃體驗世界。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. determinism  【原聲定位】Section 1: 'In its original, radical formulation—linguistic determinism—language was theorized to be an inescapable mental prison...' 【解析】考查語言學極端理論名稱，填入不可數名詞 determinism。"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. cardinal  【原聲定位】Section 2: 'Guugu Yimithirr utilizes an absolute cardinal direction system.' 【解析】題幹 'an absolute (32) ____________ direction framework'，填入修飾詞 cardinal。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. compass  【原聲定位】Section 2: 'speakers of Guugu Yimithirr possess an extraordinary, continuous internal compass.' 【解析】比喻性名詞，原聲以 internal compass 呼應，填入單數 compass。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. basic color categories / color categories  【原聲定位】Section 3: 'the Russian language morphologically enforces two distinct, non-overlapping basic color categories...' 【解析】考查色彩範疇術語，填入 color categories 或 categories。"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. interference  【原聲定位】Section 4: 'the executive network must constantly suppress interference from the non-target language.' 【解析】題幹 'suppressing (35) ____________ from the inactive language'，原聲以 interference 精準對應。"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. communicative  【原聲定位】Section 5: 'Modern communicative and task-based pedagogical frameworks, however, view language as an embodied... ecosystem.' 【解析】教學法修飾詞，填入 communicative。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 1: 'universalist linguists led by Noam Chomsky largely discredited this strict deterministic view, demonstrating that underlying cognitive structures are universally shared...' 【解析】杭士基證明底層認知與語法架構具有人類普遍共通性，對應選項 B。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. B  【原聲定位】Section 3: 'Russian speakers' brains register an automatic pre-attentive brainwave spike... when an optical shade shifts across the goluboy-siniy linguistic boundary...' 【解析】色調跨越語言界線觸發自動腦波負向峰值反應，對應選項 B。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. B  【原聲定位】Section 4: 'lifelong bilinguals exhibit clinical manifestations of neurodegenerative dementia on average four to five years later...' 【解析】雙語者失智症臨床發病時間平均延遲四至五年，對應選項 B。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. B  【原聲定位】Section 5: 'learning a new language does not merely furnish a novel set of vocal sounds... it endows the human mind with an alternative conceptual architecture...' 【解析】總結句表明習得語言賦予大腦全新概念架構與認知擴充，對應選項 B。"}]}}}, {"num": 6, "tag": "unit06", "folder": "社會科學與心理學領域", "chapter": "第二篇章 ‧ 人文、心智與社會科學（標準難度版）", "title": "Choice Architecture & Everyday Nudges (Standard Edition)", "titleZh": "超市購物習慣調查報名、健康生活特展導覽與食堂減廢實驗討論", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (標準難度 Sec 1–4)", "src": "./audio/Unit06_Full_Section1_to_4.mp3", "qr": "./qr/unit06.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "社區超市購物與環保習慣調查登記 (Local Shopping Habits Survey Sign-Up)", "src": "./audio/Unit06_Section1.mp3", "qr": "./qr/unit06-s1.png", "script": ["Hannah: Hello, City Consumer Survey Office, Hannah speaking.", "Zoe: Hi! I saw your flyer about the local grocery and recycling study.", "Hannah: Great! Let me take your name first.", "Zoe: Zoe Campbell. C-A-M-P-B-E-L-L.", "Hannah: Thanks, Zoe. And a mobile number?", "Zoe: 07554... 628319.", "Hannah: How many adults live in your flat?", "Zoe: My brother used to stay with us, making three, but he moved away last month—so just two adults now.", "Hannah: Two adults, got it. Here's how it works: after shopping, just scan your paper supermarket receipts with our phone app.", "Zoe: Easy. What about kitchen waste?", "Hannah: We deliver a small digital food scale for free so you can weigh scraps.", "Zoe: Great! When does it start?", "Hannah: Thursday the 17th of October. Each night, just snap a quick photo of any leftover dinner.", "Zoe: Photo of leftover dinner, fine. Any forms to sign?", "Hannah: Just tick the online consent box on our website.", "Zoe: And how do rewards work?", "Hannah: We pay via monthly bank transfer—20 pounds a week, so a total of 80 pounds after four weeks!", "Zoe: Wonderful, thank you!"], "trans": ["漢娜：您好，城市消費調查辦公室，我是漢娜。", "柔伊：嗨！我看到你們當地購物與回收研究的傳單。", "漢娜：太好了！我先登記您的姓名。", "柔伊：柔伊・坎貝爾（Zoe Campbell），C-A-M-P-B-E-L-L。", "漢娜：謝謝柔伊。手機號碼是？", "柔伊：07554……628319。", "漢娜：請問您家裡住幾位大人？", "柔伊：我弟弟之前跟我們住所以是三位，但他上個月搬走了——現在只有兩位大人（two adults）。", "漢娜：兩位大人，記下了。做法很簡單：買完菜用手機程式掃描紙本超市收據（receipts）。", "柔伊：很簡單。那廚餘呢？", "漢娜：我們免費寄送一台小型電子食物磅秤（scale）給您秤重。", "漢娜：太好了！何時開始？", "漢娜：10 月（October）17 日週四。每晚拍一張剩餘晚餐（dinner）的照片就好。", "柔伊：剩餘晚餐照片，沒問題。要簽表格嗎？", "漢娜：在網站勾選線上同意（consent）方塊即可。", "柔伊：報酬怎麼發放？", "漢娜：透過每月銀行轉帳（transfer）——每週 20 英鎊，四週總計 80 英鎊！", "柔伊：太棒了，謝謝！"], "answers": [{"q_num": "Q1", "answer": "Campbell", "clue_analysis": "【原聲定位】'Zoe Campbell. C-A-M-P-B-E-L-L.'"}, {"q_num": "Q2", "answer": "628319", "clue_analysis": "【原聲定位】'07554... 628319.'"}, {"q_num": "Q3", "answer": "2 / two", "clue_analysis": "【原聲定位】'just two adults now' 排除以前三人干擾。"}, {"q_num": "Q4", "answer": "receipts", "clue_analysis": "【原聲定位】'scan your paper supermarket receipts'"}, {"q_num": "Q5", "answer": "scale", "clue_analysis": "【原聲定位】'small digital food scale'"}, {"q_num": "Q6", "answer": "October", "clue_analysis": "【原聲定位】'Thursday the 17th of October'"}, {"q_num": "Q7", "answer": "dinner", "clue_analysis": "【原聲定位】'photo of any leftover dinner'"}, {"q_num": "Q8", "answer": "consent", "clue_analysis": "【原聲定位】'online consent box'"}, {"q_num": "Q9", "answer": "transfer", "clue_analysis": "【原聲定位】'monthly bank transfer'"}, {"q_num": "Q10", "answer": "80", "clue_analysis": "【原聲定位】'total of 80 pounds after four weeks' 排除單週 20 鎊。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "「聰明設計好生活」展覽導覽 (Smart Choices Everyday Design Exhibition Tour)", "src": "./audio/Unit06_Section2.mp3", "qr": "./qr/unit06-s2.png", "script": ["Simon: Welcome, everyone, to 'Smart Choices: How Small Designs Shape Our Day'! I'm Simon.", "Instead of banning snacks or paying people cash, 'nudges' work by simply arranging our surroundings so good choices are the easiest ones to pick.", "Look at our Organ Donor chart. In Germany, people must actively sign a form to join, so only 12% register. In Austria, citizens are signed up automatically unless they opt out—pushing donor rates above 99%!", "Next is a famous school canteen test. They didn't lower fruit prices or print leaflets; they simply placed fresh apples right at eye level beside the payment till while moving cakes to the back shelf.", "Still, not all nudges are helpful. Watch out on shopping websites for pre-ticked boxes that quietly add extra fees or monthly subscriptions if you click too fast!", "If you'd like a guided walk, tours leave the lobby fountain daily at 11:30 a.m. and 2:30 p.m.", "Here is what's inside each room:", "Room 1 is Energy Corner, showing power bills that tell families how much less electricity their neighbours used—cutting home energy waste right away.", "Room 3 is the Airport Display, featuring the famous Amsterdam toilet sticker of a tiny fly that cut bathroom cleaning costs by 80%.", "Room 4 is the Future Mirror, where a camera shows what you might look like at age seventy to encourage saving for retirement.", "Outside, Room 5 is the Green Walkway, using bright green footprints painted on the floor leading people straight to recycling bins.", "Finally, Room 2 is the Money Booth, testing why losing 50 pounds feels twice as painful as winning 50 pounds feels good.", "Have fun exploring!"], "trans": ["賽蒙：歡迎大家來到「聰明選擇：小設計如何塑造每一天」特展！我是賽蒙。", "「助推」不靠禁止零食或發獎金，而是調整環境讓好選擇變得最輕鬆容易選到（making good choices easier to pick）。", "看這張器官捐贈圖表。德國要主動填表加入，只有 12% 登記；奧地利則由系統自動登記，除非主動退出（signed up automatically），登記率超過 99%！", "接著是學校食堂實驗。他們沒有降價也沒有發傳單，只是把新鮮蘋果擺在收銀台旁邊的視線高度（apples near the till），蛋糕移到後排。", "不過並非所有助推都是善意的。網購時要小心預先勾選的加購方塊（pre-ticked boxes for extra fees），點太快就會被默默扣款訂閱！", "想參加專人導覽的話，每天上午 11:30 與下午 2:30（11:30 a.m. and 2:30 p.m.）在大廳噴泉集合出發。", "各展間亮點如下：", "1 號房能源角（Energy Corner）展示把自家用電跟鄰居比較的電費單，馬上減少浪費。", "3 號房機場展區（Airport Display）展示阿姆斯特丹機場小便斗貼小蒼蠅貼紙省下 80% 清潔費的案例。", "4 號房未來之鏡（Future Mirror）用相機模擬你七十歲的樣子，鼓勵大家為退休存錢。", "戶外的 5 號房綠色步道（Green Walkway）在地上畫亮綠色腳印引導行人走向回收桶。", "最後 2 號房金錢亭（Money Booth）測試為何失去 50 英鎊的痛感是贏得 50 英鎊快樂的兩倍。", "祝參觀愉快！"], "answers": [{"q_num": "Q11", "answer": "B", "clue_analysis": "【原聲定位】'arranging our surroundings so good choices are the easiest ones to pick' 選 B。"}, {"q_num": "Q12", "answer": "B", "clue_analysis": "【原聲定位】'citizens are signed up automatically unless they opt out' 選 B。"}, {"q_num": "Q13", "answer": "A", "clue_analysis": "【原聲定位】'placed fresh apples right at eye level beside the payment till' 選 A。"}, {"q_num": "Q14", "answer": "B", "clue_analysis": "【原聲定位】'pre-ticked boxes that quietly add extra fees' 選 B。"}, {"q_num": "Q15", "answer": "B", "clue_analysis": "【原聲定位】'daily at 11:30 a.m. and 2:30 p.m.' 選 B。"}, {"q_num": "Q16", "answer": "A", "clue_analysis": "【原聲定位】'Room 1... Energy Corner, electricity their neighbours used' 對應 A。"}, {"q_num": "Q17", "answer": "C", "clue_analysis": "【原聲定位】'Room 3... Airport Display, toilet sticker of a tiny fly' 對應 C。"}, {"q_num": "Q18", "answer": "D", "clue_analysis": "【原聲定位】'Room 4... Future Mirror, look like at age seventy' 對應 D。"}, {"q_num": "Q19", "answer": "E", "clue_analysis": "【原聲定位】'Room 5... Green Walkway, green footprints leading to recycling bins' 對應 E。"}, {"q_num": "Q20", "answer": "B", "clue_analysis": "【原聲定位】'Room 2... Money Booth, losing 50 pounds feels twice as painful' 對應 B。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "學生食堂餐盤大小與浪費實驗檢討 (Psychology Student Cafeteria Project)", "src": "./audio/Unit06_Section3.mp3", "qr": "./qr/unit06-s3.png", "script": ["Prof. Kowalski: Come in, Sam and Jessica. Let's look at your campus dining hall report. You found food waste dropped by 35%!", "Sam: Yes! Putting out smaller plates worked wonders.", "Prof. Kowalski: Hold on—the kitchen scales were fine and portions were normal, but check your dates! Your test week was exam revision week, when almost half the students ate at home instead of coming to the dining hall!", "Jessica: Oh no! We'll re-run it during two normal teaching weeks next month. Still, when we swapped 28-centimetre plates for 22-centimetre ones, students took less food because smaller plates make a normal portion look completely full.", "Prof. Kowalski: Yes, a classic visual trick. Did anything surprising happen when you hid the fried chips behind a counter?", "Jessica: Actually, nobody complained, and packed lunches didn't rise—instead, students walked straight outside and bought 20% more sweet fizzy drinks from the vending machines!", "Prof. Kowalski: Fascinating—appetite always finds another outlet. In your final chapter, make sure you discuss one ethical point: whether changing choices quietly without telling people interferes with their free personal choice.", "Sam: We'll include that debate. Also, how can we tell if diners even noticed the smaller plates?", "Prof. Kowalski: Simply ask a quick two-second survey question on an iPad at the exit.", "Sam: Easy! Jessica, let's split next week's tasks.", "Sam: I don't mind the messy kitchen job, so I'll weigh the food waste bins every evening at six.", "Jessica: Thanks, Sam! I'll type up the three-question exit survey for the iPad.", "Sam: I'm free Tuesday morning, so I'll meet the catering manager to arrange the plate swap.", "Jessica: Great, and since I love Excel, I'll draw all the final bar graphs once the numbers are in.", "Sam: That just leaves the ethics paragraph—shall we write that together over lunch?", "Jessica: Yes, let's write the ethics section together!"], "trans": ["科瓦斯基教授：請進，山姆和潔西卡。我們來看看你們的校園餐廳報告。你們發現廚餘減少了 35%！", "山姆：對呀！換用小餐盤效果奇佳。", "科瓦斯基教授：等等——廚房磅秤沒壞、菜色分量也正常，但核對一下日期！你們測試那週剛好是期末複習週，將近一半的學生在家吃飯沒來食堂（fewer students visited during exam week）！", "潔西卡：天啊！我們下個月在兩個正常上課週重測。不過我們把 28 公分盤換成 22 公分盤時，學生拿的量確實減少，因為小盤子讓正常份量看起來滿滿的（make normal portions look full）。", "科瓦斯基教授：沒錯，經典視覺錯覺。那把炸薯條藏到櫃檯後面時，發生了什麼意外嗎？", "潔西卡：沒人抱怨，帶便當的人也沒變多——反而是學生走出餐廳後，在販賣機多買了 20% 的含糖汽水（bought more sweet fizzy drinks）！", "科瓦斯基教授：太有趣了——食慾總會找到別的出口。最後一章請務必討論一個倫理問題：不告知當事人就悄悄改變選項設計，是否限制了個人的自由選擇權（limit free personal choice）。", "山姆：我們會加入這個討論。另外，我們怎麼知道學生有沒有注意到盤子變小？", "科瓦斯基教授：在出口處用平板電腦問一個兩秒鐘的快速問卷題就好（quick survey question at the exit）。", "山姆：簡單！潔西卡，我們來分配下週的工作。", "山姆：我不介意進廚房處理廚餘，每晚六點我去秤廚餘桶重量。", "潔西卡：謝謝山姆！我來打好平板上的三題離場問卷。", "山姆：我週二早上有空，我去見餐廳經理安排換盤子的事。", "潔西卡：太好了，我很喜歡用 Excel，數據進來後我來畫所有最終長條圖。", "山姆：剩下倫理那一段——我們午餐時間一起寫吧？", "潔西卡：好啊，倫理部分一起寫！"], "answers": [{"q_num": "Q21", "answer": "B", "clue_analysis": "【原聲定位】'exam revision week, when almost half the students ate at home' 選 B。"}, {"q_num": "Q22", "answer": "A", "clue_analysis": "【原聲定位】'smaller plates make a normal portion look completely full' 選 A。"}, {"q_num": "Q23", "answer": "A", "clue_analysis": "【原聲定位】'bought 20% more sweet fizzy drinks from the vending machines' 選 A。"}, {"q_num": "Q24", "answer": "A", "clue_analysis": "【原聲定位】'whether changing choices quietly... interferes with their free personal choice' 選 A。"}, {"q_num": "Q25", "answer": "B", "clue_analysis": "【原聲定位】'ask a quick two-second survey question on an iPad at the exit' 選 B。"}, {"q_num": "Q26", "answer": "A", "clue_analysis": "【原聲定位】Sam: 'I'll weigh the food waste bins' 選 A。"}, {"q_num": "Q27", "answer": "B", "clue_analysis": "【原聲定位】Jessica: 'I'll type up the three-question exit survey' 選 B。"}, {"q_num": "Q28", "answer": "A", "clue_analysis": "【原聲定位】Sam: 'I'll meet the catering manager' 選 A。"}, {"q_num": "Q29", "answer": "B", "clue_analysis": "【原聲定位】Jessica: 'I'll draw all the final bar graphs' 選 B。"}, {"q_num": "Q30", "answer": "C", "clue_analysis": "【原聲定位】'write the ethics section together' 選 C。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Architecture of Choice: Behavioral Nudge Theory, Default Architectures, and Cognitive Heuristics", "src": "./audio/Unit06_Section4.mp3", "qr": "./qr/unit06-s4.png", "script": ["▶ Section 1  ‧  Beyond Homo Economicus: The Dawn of Bounded Rationality", "Section 1  Good morning. In today's behavioral economics and public policy lecture, we will examine the intellectual paradigm shift that has revolutionized contemporary governance: choice architecture and nudge theory. For more than a century, classical neoclassical economics relied upon the convenient theoretical fiction of 'Homo economicus'—the perfectly rational economic actor who seamlessly evaluates probabilities, maximizes expected utility, and possesses flawless self-control. However, empirical work by Daniel Kahneman and Amos Tversky established that human cognition is governed by 'bounded rationality'. Our cognitive processing bandwidth is finite. Consequently, rather than executing complex algorithmic calculations for every decision, human beings rely on subconscious mental shortcuts known as heuristics. While these cognitive shortcuts are evolutionarily efficient, they systematically induce predictable biases.", "▶ Section 2  ‧  The Dual-Process Model: System 1 and System 2", "Section 2  To understand how heuristics operate, behavioral psychologists utilize the dual-process cognitive model. System 1 operates automatically, effortlessly, and rapidly, driven by instinct and emotional associations. It is the reflexive system that immediately slams on the car brakes when a pedestrian steps into the street. In contrast, System 2 is deliberative, analytical, and computationally intensive; it is engaged when solving complex calculus or balancing an intricate household budget. Crucially, because human biology naturally conserves cognitive metabolic energy, System 1 serves as our default operational state. Most human choices—from daily dietary selections to retirement fund allocations—are not calculated by deliberative System 2 logic, but are profoundly swayed by the contextual environment in which choices are presented.", "▶ Section 3  ‧  Default Architecture and Asymmetric Paternalism", "Section 3  This psychological reality forms the foundation of 'nudge theory', popularized by Richard Thaler and Cass Sunstein under the philosophy of 'libertarian paternalism'. A nudge is any aspect of the choice architecture that alters people's behavior in a predictable way without forbidding any options or significantly changing their economic incentives. The single most powerful nudge is default architecture. Consider organ donation rates across Europe. In explicit opt-in countries like Germany or the United Kingdom, where citizens must check an active consent box to become a donor, participation rates languish around fifteen percent. Conversely, in presumed-consent opt-out nations like Austria or Spain, where individuals are registered by default unless they actively sign an objection, donor registration exceeds ninety-nine percent. The legal choices are identical, yet shifting the default option dramatically transforms societal outcomes.", "The Architecture of Choice: Behavioral Nudge Theory, Default Architectures, and Cognitive Heuristics (Continued)", "▶ Section 4  ‧  Hyperbolic Discounting and Present Bias", "Section 4  Another pervasive cognitive vulnerability addressed by choice architects is 'present bias', formally modeled as hyperbolic discounting. Neoclassical models assume that humans discount future utility along a consistent exponential curve. In reality, human beings heavily overvalue immediate gratification while severely discounting delayed benefits. This temporal myopia explains widespread failures in retirement savings and preventative healthcare. To overcome this, behavioral economists created the 'Save More Tomorrow' protocol. Under this architecture, employees commit today to allocating a percentage of their future pay raises toward their pension. By pre-committing future gains rather than immediate income, the intervention bypasses loss aversion and harnesses inertia to systematically elevate national savings rates.", "▶ Section 5  ‧  Algorithmic Dark Patterns and Ethical Dilemmas", "Section 5  However, as choice architecture migrates into the digital sphere, it raises urgent ethical and regulatory dilemmas. When behavioral nudges are weaponized by digital platforms to exploit cognitive vulnerabilities for corporate extraction, they mutate into 'dark patterns'. Algorithms deliberately introduce cognitive friction—such as labyrinthine cancellation procedures for recurring subscriptions—or deploy artificial scarcity timers to provoke impulsive System 1 purchasing. Critics argue that unchecked behavioral nudging borders on coercive psychological manipulation, surreptitiously undermining individual autonomy. Looking forward, the central governance challenge lies in establishing transparent regulatory standards that preserve the benevolent potential of public policy nudges while strictly criminalizing predatory algorithmic exploitation."], "trans": ["Section 1  大家早安。在今天的行為經濟學與公共政策講座中，我們將探討徹底變革了當代公共治理的核心理論範式：選擇架構學（choice architecture）與推力理論（nudge theory）。一百多年來，新古典經濟學始終依賴於「經濟人（Homo economicus）」這一便利的理論虛構——即假定人類是完全理性的經濟行動者，能精準評估機率、最大化期望效用，並擁有完美無瑕的自制力。然而，丹尼爾·康納曼（Daniel Kahneman）與阿摩司·特沃斯基（Amos Tversky）的實證研究確立了人類認知受制於「有限理性（bounded rationality）」。人類的認知處理頻寬是極其有限的。因此，人類並非在每次做決策時都執行複雜的演算法運算，而是仰賴潛意識中的心智捷徑，即「捷思法（heuristics）」。雖然這些捷思在演化上有助於節省精力，但它們同時會系統性地誘發可預測的認知偏誤。", "Section 2  為了解釋捷思法如何運作，行為心理學家採用了「雙系統認知模型」。系統一（System 1）依託直覺與情緒聯想，運作自動、迅捷且不費吹灰之力。它是那種當行人突然衝到車前時，能促使你本能踩下煞車的反射系統。相反地，系統二（System 2）則是審慎、分析性且高度耗費運算資源的系統；當我們解微積分或精算複雜的家庭預算時，才會調用系統二。關鍵在於，由於人類生理機制天然傾向於節省認知代謝能量，系統一成為了我們的「預設運作狀態」。人類絕大多數的選擇——從小到每日飲食挑選，大到退休金提撥比例——都不是由審慎理性的系統二精算得出，而是深刻地受到「選項呈現情境」的左右。", "Section 3  這一心理學現實構成了「推力理論」的基石，該理論由理查·塞勒（Richard Thaler）與凱斯·桑思汀（Cass Sunstein）在「自由意志家長制（libertarian paternalism）」哲學框架下推廣。所謂推力，是指選擇架構中任何能在不禁止任何選項、亦不顯著改變經濟誘因的前提下，以可預測方式改變人們行為的微小設計。最無堅不摧的推力莫過於「預設選項架構（default architecture）」。以歐洲各國的器官捐贈率為例：在德國或英國等採取明確「主動加入制（opt-in）」的國家，公民必須主動勾選同意方能成為捐贈者，參與率長期在百分之十五左右低迷徘徊。相反地，在奧地利或西班牙等採取推定同意的「主動退出制（opt-out）」國家，居民預設為捐贈者除非主動簽署反對書，其登記率則高達百分之九十九以上。兩者的法定選擇完全相同，然而僅僅翻轉預設選項，就徹底扭轉了全社會的行為結果。", "Section 4  選擇架構師所應對的另一個普遍認知弱點是「當下偏誤（present bias）」，在學術模型中被稱為「雙曲貼現（hyperbolic discounting）」。新古典模型假設人類沿著一條穩定的指數曲線來折現未來的效用。然而在現實中，人類極度過度看重眼前的即時滿足，而嚴重低估未來的長遠利益。這種「時間維度的近視」解釋了為何人們普遍在退休儲蓄與預防性醫療上屢屢失敗。為了克服這一盲點，行為經濟學家設計了「明天再存錢（Save More Tomorrow）」機制。在此架構下，員工今天只需承諾將「未來的加薪幅度」按比例自動撥入退休金帳戶。透過提前鎖定未來增益而非扣減當前可支配所得，這項介入繞過了「損失厭惡（loss aversion）」，並借力使力利用人性的慣性怠惰，系統性地拉升了國家整體的儲蓄率。", "Section 5  然而，當選擇架構延伸至數位世界時，引發了迫切的倫理審判與監管困境。當數位平台將行為推力武器化，蓄意剝削人類認知弱點以榨取商業利潤時，推力便異化成了「暗黑模式（dark patterns）」。演算法刻意製造認知摩擦——例如為訂閱退訂設置如迷宮般繁瑣的程序——或製造虛假的限時倒數計時器，誘發衝動性的系統一消費。批評者指出，缺乏監管的行為推力已淪為隱密的心理操縱，神不知鬼不覺地侵蝕了個人的自主意志。展望未來，數位治理的核心挑戰在於確立透明的監管標準，既能完整保留公共政策中善意推力的福祉潛能，又能嚴格將掠奪性的演算法暗黑模式予以定罪懲處。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. bounded rationality  【原聲定位】Section 1: 'empirical work by Daniel Kahneman and Amos Tversky established that human cognition is governed by bounded rationality.' 【解析】認知決策限制術語，填入 bounded rationality。"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. heuristics  【原聲定位】Section 1: 'human beings rely on subconscious mental shortcuts known as heuristics.' 【解析】題幹 'subconscious mental shortcuts... are termed (32) ____________'，填入複數名詞 heuristics。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. System 1  【原聲定位】Section 2: 'System 1 operates automatically, effortlessly, and rapidly, driven by instinct and emotional associations.' 【解析】雙系統模型專有名詞，填入 System 1。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. opt-out  【原聲定位】Section 3: 'Conversely, in presumed-consent opt-out nations like Austria or Spain... registration exceeds ninety-nine percent.' 【解析】器官捐贈制度對比，填入形容詞修飾詞 opt-out。"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. present bias / hyperbolic discounting  【原聲定位】Section 4: 'Another pervasive cognitive vulnerability... is present bias, formally modeled as hyperbolic discounting.' 【解析】過度偏好眼前利益之現象，填入 present bias 或 hyperbolic discounting 均可。"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. dark patterns  【原聲定位】Section 5: 'When behavioral nudges are weaponized by digital platforms... they mutate into dark patterns.' 【解析】數位惡意操縱模式專有名詞，填入複數 dark patterns。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 2: 'because human biology naturally conserves cognitive metabolic energy, System 1 serves as our default operational state.' 【解析】生理省能機制使大腦以直覺為預設狀態，對應選項 B。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. B  【原聲定位】Section 3: 'A nudge is any aspect of the choice architecture that alters people's behavior in a predictable way without forbidding any options or significantly changing their economic incentives.' 【解析】不禁止選項且不改變經濟誘因的前提下改變行為，對應選項 B。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. B  【原聲定位】Section 4: 'employees commit today to allocating a percentage of their future pay raises... bypasses loss aversion and harnesses inertia...' 【解析】承諾提撥未來加薪而非當前所得，成功繞過損失厭惡，對應選項 B。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. A  【原聲定位】Section 5: 'Critics argue that unchecked behavioral nudging borders on coercive psychological manipulation, surreptitiously undermining individual autonomy.' 【解析】隱密利用認知弱點侵蝕消費者自主決定權，對應選項 A。"}]}}}, {"num": 7, "tag": "unit07", "folder": "歷史考古與人類學", "chapter": "第二篇章 ‧ 人文、心智與社會科學（標準難度版）", "title": "Ancient Trade, Seals & Undeciphered Scripts (Standard Edition)", "titleZh": "古物博物館陶藝導覽預約、古代印章特展與文字破譯專題討論", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (標準難度 Sec 1–4)", "src": "./audio/Unit07_Full_Section1_to_4.mp3", "qr": "./qr/unit07.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "歷史博物館週末考古工作坊報名 (Museum Pottery & Dig Workshop Booking)", "src": "./audio/Unit07_Section1.mp3", "qr": "./qr/unit07-s1.png", "script": ["Receptionist: Good morning, City History Museum, David speaking.", "Clara: Hi! I'd like to book a place on your Sunday archaeology workshop.", "Receptionist: Certainly! What is your full name?", "Clara: Clara Gibson. Spelled G-I-B-S-O-N.", "Receptionist: Thanks, Clara. And a phone number?", "Clara: 07914... 730581.", "Receptionist: Are you a museum member?", "Clara: Yes! My card says HM-4920.", "Receptionist: Lovely. In the morning you can join either coin sorting or cleaning ancient clay pots—which sounds better?", "Clara: Cleaning ancient clay pots, please!", "Receptionist: Done. We'll book you for Sunday the 12th of November.", "Clara: November 12th is great. Where do we meet?", "Receptionist: Meet your guide inside the West Garden, just behind the café. Doors open at 9:30, and your workshop starts promptly at 10:15 a.m.", "Clara: 10:15 a.m. at the West Garden. What should I wear?", "Receptionist: Clothes you don't mind getting dusty, plus old trainers or sturdy boots.", "Clara: Got it. Do we get to take anything home?", "Receptionist: Yes! Everyone receives a free small clay seal replica made from an ancient stone stamp.", "Clara: Cool! How much do I pay today?", "Receptionist: Normally it's 30 pounds, but with your member discount it comes down to 22 pounds.", "Clara: Twenty-two pounds, thank you!"], "trans": ["接待員：早安，城市歷史博物館，我是大衛。", "克拉拉：嗨！我想報名週日的考古工作坊。", "接待員：好的！請問您的全名？", "克拉拉：克拉拉・吉布森（Clara Gibson），G-I-B-S-O-N。", "接待員：謝謝克拉拉。聯絡電話？", "克拉拉：07914……730581。", "接待員：您是博物館會員嗎？", "克拉拉：是的！卡片寫著 HM-4920。", "接待員：太好了。早上可以選古幣分類或清理古代陶土（clay）罐——您想選哪個？", "克拉拉：請幫我選清理古陶罐！", "接待員：沒問題。預訂 11 月（November）12 日週日。", "克拉拉：11 月 12 日很好。在哪裡集合？", "接待員：在咖啡廳後面的西花園（West Garden）與導覽員會合。9:30 開門，工作坊上午 10:15（10:15 a.m.）準時開始。", "克拉拉：上午 10:15 西花園。我該穿什麼？", "接待員：不怕弄髒的衣服，加上舊運動鞋或耐穿靴子（boots）。", "克拉拉：明白。我們有紀念品可以帶回家嗎？", "接待員：有的！每個人都可以免費帶走一個仿古石印的陶土印章（seal）複製品。", "克拉拉：好酷！今天要付多少錢？", "接待員：原價 30 英鎊，用會員折扣只要 22 英鎊。", "克拉拉：22 英鎊，謝謝您！"], "answers": [{"q_num": "Q1", "answer": "Gibson", "clue_analysis": "【原聲定位】'Clara Gibson. G-I-B-S-O-N.'"}, {"q_num": "Q2", "answer": "730581", "clue_analysis": "【原聲定位】'07914... 730581.'"}, {"q_num": "Q3", "answer": "4920", "clue_analysis": "【原聲定位】'HM-4920.'"}, {"q_num": "Q4", "answer": "clay", "clue_analysis": "【原聲定位】'cleaning ancient clay pots'"}, {"q_num": "Q5", "answer": "November", "clue_analysis": "【原聲定位】'Sunday the 12th of November'"}, {"q_num": "Q6", "answer": "Garden", "clue_analysis": "【原聲定位】'inside the West Garden'"}, {"q_num": "Q7", "answer": "10:15 / 10.15", "clue_analysis": "【原聲定位】'workshop starts promptly at 10:15 a.m.' 排除 9:30 開門時間。"}, {"q_num": "Q8", "answer": "boots", "clue_analysis": "【原聲定位】'old trainers or sturdy boots'"}, {"q_num": "Q9", "answer": "seal", "clue_analysis": "【原聲定位】'small clay seal replica'"}, {"q_num": "Q10", "answer": "22", "clue_analysis": "【原聲定位】'member discount it comes down to 22 pounds' 排除原價 30 鎊。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "古代印度河文明與失落文字特展導覽 (Indus Valley Ancient City Gallery Tour)", "src": "./audio/Unit07_Section2.mp3", "qr": "./qr/unit07-s2.png", "script": ["Anita: Welcome, everyone, to our special exhibition on the Ancient Indus Valley! I'm Anita, the museum curator.", "Four thousand years ago, clean brick cities flourished along the Indus River. Yet their writing remains completely undeciphered. Why? Not because stones burned—we have over 4,000 objects—but because almost every inscription is tiny, averaging only five signs on a stamp!", "Even without reading the words, experts proved the script reads from right to left. When carvers began on the right, letters were wide and neat; reaching the left edge, they ran out of space and squeezed the final symbols tightly together.", "Over sixty percent of our square stone stamps show the exact same picture: a mysterious one-horned unicorn-like animal standing in front of an incense stand.", "In our market display, check the polished stone cube weights. No gold or blue paint here—what amazes engineers is that towns 1,500 kilometres apart used the exact same weight sizes down to a fraction of a gram!", "Before we walk into the Seal Gallery, notebooks and bottled water are fine, but please leave camera tripods outside so nobody knocks a glass case.", "Here is what to look out for in our rooms:", "Right in Room A, the Entrance Hall, hangs a three-metre copy of a ten-symbol white wooden town signboard.", "Room C, the Trade Wing, displays red stone beads and round Indus stamps dug up in royal tombs in Iraq—proof of ancient sea trade!", "In Room B, our City Model shows neat brick houses and covered underground street drains far ahead of their time.", "At Room E, our Computer Desk, try a touchscreen game counting which symbols appear together most often.", "Finally, Room D, the Seal Vault, has a digital microscope zooming in on tiny bronze tool cuts to show how each stamp was carved.", "Let's begin!"], "trans": ["阿妮塔：歡迎來到古代印度河文明特展！我是策展人阿妮塔。", "四千年前印度河流域繁榮發展出乾淨的磚造城市，但他們的文字至今未能破譯。為什麼？不是因為石版被火燒毀——我們有四千多件文物——而是幾乎每段文字都非常短（almost all examples are very short），印章上平均只有五個符號！", "即使還讀不懂字義，專家已證明文字是從右向左寫的。刻工從右邊起筆時字距寬敞，刻到左邊緣空間不夠，就把最後幾個符號緊緊擠在一起（squeezed together on the left）。", "超過六成的方形石印章都刻著同一種圖案：站在香爐前的神祕獨角動物（one-horned animal）。", "在市集展櫃請看這些拋光石砝碼。不是黃金也不是藍漆——令人驚嘆的是相距 1,500 公里的城鎮竟然使用完全一致的重量標準（match exact sizes across huge distances）！", "走進印章廳前，筆記本和水瓶都可以帶，但請勿攜帶相機三腳架（camera tripods），以免碰撞玻璃櫃。", "各展間重點如下：", "A 室入口大廳掛著三公尺長、帶有十個白色大符號的木製城市招牌複製品。", "C 室貿易翼展出在伊拉克王室古墓挖到的紅玉髓珠與圓形印章，證實古代海上貿易！", "B 室城市模型展示了整齊的磚屋以及領先時代的有蓋地下街道排水溝。", "E 室電腦桌提供觸控小遊戲，統計哪些符號最常一起出現。", "最後 D 室印章庫設有數位顯微鏡，放大青銅刀痕展示古代印章如何雕刻。", "我們開始參觀吧！"], "answers": [{"q_num": "Q11", "answer": "A", "clue_analysis": "【原聲定位】'almost every inscription is tiny, averaging only five signs' 選 A。"}, {"q_num": "Q12", "answer": "B", "clue_analysis": "【原聲定位】'squeezed the final symbols tightly together' (on the left edge) 選 B。"}, {"q_num": "Q13", "answer": "C", "clue_analysis": "【原聲定位】'mysterious one-horned unicorn-like animal' 選 C。"}, {"q_num": "Q14", "answer": "A", "clue_analysis": "【原聲定位】'towns 1,500 kilometres apart used the exact same weight sizes' 選 A。"}, {"q_num": "Q15", "answer": "B", "clue_analysis": "【原聲定位】'leave camera tripods outside' 選 B。"}, {"q_num": "Q16", "answer": "A", "clue_analysis": "【原聲定位】'Room A, the Entrance Hall... ten-symbol white wooden town signboard' 對應 A。"}, {"q_num": "Q17", "answer": "C", "clue_analysis": "【原聲定位】'Room C, the Trade Wing... red stone beads dug up in Iraq' 對應 C。"}, {"q_num": "Q18", "answer": "B", "clue_analysis": "【原聲定位】'Room B, City Model... covered underground street drains' 對應 B。"}, {"q_num": "Q19", "answer": "E", "clue_analysis": "【原聲定位】'Room E, Computer Desk... touchscreen game counting symbols' 對應 E。"}, {"q_num": "Q20", "answer": "D", "clue_analysis": "【原聲定位】'Room D, Seal Vault... digital microscope zooming in on how each stamp was carved' 對應 D。"}]}, "s3": {"label": "Section 3 (Q21–30)", "desc": "大學生古代文字電腦破譯研究討論 (Archaeology Student Essay Discussion)", "src": "./audio/Unit07_Section3.mp3", "qr": "./qr/unit07-s3.png", "script": ["Dr. Gallagher: Come in, Arthur and Priya. How is your project on the Indus script coming along?", "Arthur: Great, Dr. Gallagher! Though we found a famous 2004 paper claiming those Indus signs aren't even real written words—just family badges or shop logos!", "Dr. Gallagher: Yes, that's a lively debate. Why do those critics argue that?", "Priya: Not because of where stamps were dug up—they argue the lines are far too short and signs never repeat in long grammatical sentences.", "Dr. Gallagher: Exactly. Yet your own project challenges them. Priya, what pattern did you spot with the 'fish' sign?", "Priya: It didn't change shape much, and isn't linked to fishing boats—instead, it almost always sits in the middle or right near the end of an inscription, just like a grammar ending!", "Dr. Gallagher: Strong clue! And Arthur, how does your computer script test it?", "Arthur: My program measures how flexible the symbol order is and compares it directly against real spoken languages like English and ancient Sumerian—we aren't trying to translate words yet.", "Priya: True, and Arthur and I both agree our biggest headache is simply not having any bilingual stone dictionary—nothing like Egypt's Rosetta Stone!", "Dr. Gallagher: Right, without a bilingual key, stay cautious. In your conclusion, make sure you do not claim you have actually translated any words—just show the mathematical patterns.", "Arthur: We'll stick strictly to pattern statistics. Thanks, Dr. Gallagher! Priya, let's divide our last tasks.", "Arthur: I'll type the 1977 symbol catalogue into a clean Python file tonight.", "Priya: Thanks, and once it's ready, I'll run tests comparing English and Sumerian word orders.", "Arthur: What about tracing clear drawings of the fish symbol variants for page three?", "Priya: You can do that—or wait, I have a tablet stylus and drew seals last term, why don't I trace the fish drawings?", "Arthur: Oh yes please, you're way better at drawing! And I'll write the two-page summary of that 2004 debate paper.", "Priya: Great! Then on Friday morning, let's sit together and check all bibliography links before hitting submit.", "Arthur: Sounds like a plan!"], "trans": ["加拉格爾博士：請進，阿瑟和普莉雅。你們的印度河文字專題進行得如何？", "阿瑟：很好，博士！不過我們讀到一篇 2004 年的著名論文，主張那些符號根本不是真正的書寫文字——只是家族徽章或商店標誌！", "加拉格爾博士：沒錯，這是個熱烈的爭論。批評者為什麼這麼主張？", "普莉雅：不是因為挖掘地點——他們認為銘文太短，且符號從未在長句子裡重複出現（never repeat in long sentences）。", "加拉格爾博士：一點沒錯。但你們的研究反駁了這點。普莉雅，你在「魚」形符號上發現了什麼規律？", "普莉雅：它形狀沒怎麼變，也跟漁船無關——相反地，它幾乎總出現在銘文中段或接近結尾處（almost always comes near the end），就像語法詞尾！", "加拉格爾博士：很強的線索！阿瑟，你的電腦程式怎麼測試？", "阿瑟：我的程式測量符號排列順序的彈性度，直接跟英語和古蘇美語等真實語言比對（compares sign order with real languages）——目前還沒有要翻譯字義。", "普莉雅：對，阿瑟和我都認為最大難題就是完全沒有雙語對照石碑（not having any bilingual stone dictionary）——沒有像埃及羅塞塔石碑那樣的線索！", "加拉格爾博士：沒錯，沒有雙語鑰匙就務必謹慎。結論切忌宣稱你們已經翻譯出字詞（do not claim they have translated the words）——只要呈現數學規律就好。", "阿瑟：我們會嚴格只談統計規律。謝謝博士！普莉雅，來分一下最後工作吧。", "阿瑟：今晚我把 1977 年的符號目錄打進乾淨的 Python 檔案。", "普莉雅：謝謝，整理好後我來跑英語與蘇美語字序對比測試。", "阿瑟：那第三頁要用的魚形符號清晰線描圖呢？", "普莉雅：你可以畫——等等，我有觸控筆上學期也畫過印章，不如魚形圖交給我描？", "阿瑟：太好了麻煩妳，妳畫得比我好太多了！那我負責寫 2004 年爭論文獻的兩頁摘要。", "普莉雅：好！週五早上我們一起坐下來核對所有參考文獻連結再送出。", "阿瑟：一言為定！"], "answers": [{"q_num": "Q21", "answer": "A", "clue_analysis": "【原聲定位】'lines are far too short and signs never repeat in long grammatical sentences' 選 A。"}, {"q_num": "Q22", "answer": "B", "clue_analysis": "【原聲定位】'almost always sits in the middle or right near the end' 選 B。"}, {"q_num": "Q23", "answer": "A", "clue_analysis": "【原聲定位】'compares it directly against real spoken languages' 選 A。"}, {"q_num": "Q24", "answer": "B", "clue_analysis": "【原聲定位】'not having any bilingual stone dictionary—nothing like Egypt's Rosetta Stone' 選 B。"}, {"q_num": "Q25", "answer": "A", "clue_analysis": "【原聲定位】'do not claim you have actually translated any words' 選 A。"}, {"q_num": "Q26", "answer": "A", "clue_analysis": "【原聲定位】Arthur: 'I'll type the 1977 symbol catalogue' 選 A。"}, {"q_num": "Q27", "answer": "B", "clue_analysis": "【原聲定位】Priya: 'I'll run tests comparing English and Sumerian word orders' 選 B。"}, {"q_num": "Q28", "answer": "B", "clue_analysis": "【原聲定位】Priya: 'why don't I trace the fish drawings?' / Arthur: 'yes please' 選 B。"}, {"q_num": "Q29", "answer": "A", "clue_analysis": "【原聲定位】Arthur: 'I'll write the two-page summary of that 2004 debate paper' 選 A。"}, {"q_num": "Q30", "answer": "C", "clue_analysis": "【原聲定位】Priya: 'let's sit together and check all bibliography links' 選 C。"}]}, "s4": {"label": "Section 4 (Q31–40)", "desc": "The Epigraphic Enigma: Computational Epigraphy, Urbanism, and the Indus Valley Script", "src": "./audio/Unit07_Section4.mp3", "qr": "./qr/unit07-s4.png", "script": ["▶ Section 1  ‧  Bronze Age Urbanism: Harappa and Mohenjo-Daro", "Section 1  Good morning. In today's archaeology and computational epigraphy lecture, we enter the enigmatic realm of Bronze Age South Asia: the Indus Valley Civilization, also known as the Harappan Civilization. Flourishing between 2600 and 1900 BCE across modern-day Pakistan and northwestern India, the Indus civilization occupied an expanse far larger than contemporaneous Old Kingdom Egypt or Early Dynastic Mesopotamia. What astonishes modern urban planners is the extraordinary sophistication of Harappan civic architecture. Sites like Mohenjo-daro and Harappa feature sophisticated orthogonal street grids, standardized baked-brick construction adhering to strict mathematical ratios, and unparalleled subterranean sanitation networks featuring household latrines connected to covered street drains. This Bronze Age society engineered hydraulic municipal systems that were not surpassed in Europe until the Roman Empire.", "▶ Section 2  ‧  The Political Paradox: Urbanism Without Monuments", "Section 2  Yet, as archaeologists began excavating these massive urban centres in the 1920s, they confronted a baffling anthropological anomaly. In Mesopotamian Ur or Egyptian Thebes, urban hierarchies were proclaimed through monumental royal palaces, militaristic triumphal stele, and opulent pharaonic burial complexes. In striking contrast, Harappan settlements reveal no evidence of ostentatious royal palaces, no monumental warrior iconography, and no lavish funerary tombs. Instead, the most prominent civic structure in Mohenjo-daro is the 'Great Bath'—a finely sealed bitumen-lined public aquatic complex, suggesting communal ritual bathing rather than imperial aggrandizement. The uniformity of standardized weights—binary fractions transitioning to decimal progressions—found across thousands of kilometers suggests sophisticated bureaucratic coordination without visible centralized monarchical tyranny.", "▶ Section 3  ‧  The Epigraphic Corpus: Seals, Tablets, and Brevity", "Section 3  This brings us to the greatest unresolved linguistic riddle in world archaeology: the Indus script. Unlike the Rosetta Stone, which unlocked Egyptian hieroglyphics via parallel Greek text, or the Behistun Inscription, which decrypted cuneiform through trilingual Persian, no bilingual inscription has ever been discovered for the Indus script. The entire surviving corpus consists of approximately four thousand inscribed artifacts, predominantly miniature steatite stamp seals, copper tablets, and ceramic pottery shards. Furthermore, the inscriptions are bafflingly brief: the average inscription contains a mere four to five signs, and the longest single text comprises only twenty-six characters on a damaged signboard excavated at Dholavira. This brevity severely restricts contextual syntactic analysis.", "The Epigraphic Enigma: Computational Epigraphy, Urbanism, and the Indus Valley Script (Continued)", "▶ Section 4  ‧  Computational Entropy and the Linguistic Controversy", "Section 4  In recent decades, computational epigraphers have deployed statistical machine learning to interrogate the fundamental nature of these symbols. In 2004, a controversial thesis by Steve Farmer, Richard Sproat, and Michael Witzel argued that the Indus signs were not a true linguistic writing system capable of transcribing spoken prose, but rather non-linguistic religious and political emblems, analogous to medieval European heraldry or modern traffic icons. However, in 2009, a landmark computational study led by Rajesh Rao analyzed the conditional entropy of the Indus corpus. Rao calculated the measure of flexibility and constraint in sign sequencing. Strikingly, the entropy values of Indus inscriptions aligned closely with established linguistic systems—such as Sumerian cuneiform, Old Tamil, and Rigvedic Sanskrit—while falling well outside non-linguistic control datasets such as genetic DNA sequences or Fortran computer code.", "▶ Section 5  ‧  Multidisciplinary Horizons and Future Decipherment Pathways", "Section 5  The ongoing stalemate highlights the limitations of purely statistical epigraphy. Decisive decipherment will likely require integrating computational pattern recognition with physical archaeological discoveries. Genetic archaeogenetics is currently analyzing ancient DNA extracted from Harappan burials at Rakhigarhi to resolve demographic affiliations and linguistic phylogenetics. Meanwhile, deep-learning models trained on archaeological spatial contexts are mapping seal motifs to specific mercantile trading guild quarters. Whether the Indus script was a Dravidian-affiliated logosyllabic script, an ancestral Indo-Aryan dialect, or a lost language isolate, unlocking its silent symbols remains the ultimate frontier in restoring voice to one of the most brilliant urban egalitarian experiments in human history."], "trans": ["Section 1  大家早安。在今天的考古學與計算銘文學講座中，我們將踏入青銅時代南亞最神祕的領域：印度河流域文明，或稱哈拉帕文明（Harappan Civilization）。哈拉帕文明在西元前 2600 年至 1900 年間繁盛於現今巴基斯坦與印度西北部，其覆蓋疆域遠大於同時代的埃及古王國或美索不達米亞早期王朝。令現代都市規劃師無比震撼的，是哈拉帕城市建築展現出的非凡精密度。在摩亨佐-達羅（Mohenjo-daro）與哈拉帕等遺址中，隨處可見精密的正交棋盤式街道網格、遵循嚴格數學比例標準化燒製的泥磚建築，以及舉世無雙的地下排污衛生網絡（sanitation networks）——每戶家庭的私人廁所皆連接至路面覆蓋的公共排水溝。這座青銅時代社會所開拓的市政水利工程，在歐洲直到羅馬帝國興起前都未曾被超越。", "Section 2  然而，當考古學家在 1920 年代開始發掘這些龐大都市時，遭遇了一個令人百思不解的人類學異象。在美索不達米亞的烏爾或埃及底比斯，城市階級統治通常透過宏偉奢華的皇家宮殿、宣揚戰功的凱旋石碑以及法老陵墓群昭告天下。然而形成強烈對比的是，哈拉帕遺址中完全找不到任何炫耀性王宮的痕跡，沒有讚頌武功的戰士圖像，更沒有任何奢華的皇家墓葬。相反地，摩亨佐-達羅最顯著的公共建築是「大浴池（Great Bath）」——一座以天然瀝青精細防水密封的公共水上複合設施，顯示其功能偏向集體淨化儀式而非帝王個人崇拜。此外，在數千公里廣袤疆域內所出土的標準化度量衡砝碼（採用二進位與十進位混合進位制），揭示了其背後高度精密的官僚協調體系，卻完全看不到中央集權君主暴政的蹤跡。", "Section 3  這引出了世界考古學界至今未解的最大語言謎題：印度河文字。不同於羅賽塔石碑（Rosetta Stone）藉由平行的古希臘文破譯了埃及象形文字，亦不同於貝希斯敦銘文（Behistun Inscription）透過三語對照解鎖了波斯楔形文字，考古界迄今未曾發現任何帶有雙語對照的印度河銘文。現存的全部銘文資料僅包含約四千件銘刻器物，絕大多數是小巧精緻的滑石印章（steatite stamp seals）、銅牌以及陶器碎片。更棘手的是，這些銘文極其短小精悍：平均每件銘文僅包含四到五個字符，而最長的一段完整文字是出土於多拉維拉（Dholavira）一塊受損告示牌上的二十六個字符。這種極度的篇幅短小，嚴重扼殺了依靠上下文句法語境進行結構分析的可能性。", "Section 4  近幾十年來，計算銘文學家開始運用統計機器學習演算法來審視這些符號的本質屬性。2004 年，史蒂夫·法默（Steve Farmer）、理查·斯普羅特（Richard Sproat）與麥可·維澤爾（Michael Witzel）發表了一篇引發劇烈爭議的論文，主張印度河符號根本不是一套能夠精確轉錄口頭語言的真實文字系統，而純粹是無語言內涵的宗教與政治徽章，類似中世紀歐洲的家族紋章或現代的交通號誌。然而在 2009 年，拉傑什·拉奧（Rajesh Rao）主持的一項具有里程碑意義的計算研究，深入計算了印度河符號語料庫的「條件熵（conditional entropy）」。拉奧量化了符號序列中的靈活性與約束度。令人驚訝的是，印度河銘文的熵值與已確立的真實語言系統——如蘇美楔形文字、古坦米爾語以及梨俱吠陀梵語——高度契合，而遠遠脫離了非語言對照組（如人類 DNA 遺傳序列或 Fortran 電腦程式碼）。", "Section 5  當前的破譯僵局突顯了純統計銘文學的局限性。決定性的突破必然仰賴計算模式識別與實體考古重大新發現的深度整合。古基因組學（archaeogenetics）目前正深入分析從拉吉加希（Rakhigarhi）哈拉帕墓地提取的古古代 DNA，以確認其人口族群譜系與可能的語言親緣關係。與此同時，根據考古空間坐標訓練的深度學習模型，正著手將印章圖騰樣式精準映射至特定商貿行會的居住街區。無論印度河文字最終被證實為達羅毗荼語系衍生的字詞音節文字、一種古老的印歐語方言，抑或是某種失落的孤立語言，解鎖這些沉睡數千年的符號，依然是恢復人類歷史上最輝煌都市平等社會實驗原始發聲的終極前沿。"], "answers": [{"q_num": "Q31", "answer": "", "clue_analysis": "31. sanitation  【原聲定位】Section 1: 'unparalleled subterranean sanitation networks featuring household latrines connected to covered street drains.' 【解析】聽取古代市政衛生名詞，填入 sanitation。"}, {"q_num": "Q32", "answer": "", "clue_analysis": "32. lavish / funerary  【原聲定位】Section 2: 'no monumental warrior iconography, and no lavish funerary tombs.' 【解析】題幹 'no grandiose royal palaces or militaristic (32) ____________ tombs'，填入修飾詞 lavish 或 funerary。"}, {"q_num": "Q33", "answer": "", "clue_analysis": "33. stamp seals / seals  【原聲定位】Section 3: 'predominantly miniature steatite stamp seals, copper tablets, and ceramic pottery shards.' 【解析】考查印度河印章文物，填入 stamp seals 或 seals。"}, {"q_num": "Q34", "answer": "", "clue_analysis": "34. 4 to 5 / four to five  【原聲定位】Section 3: 'the average inscription contains a mere four to five signs...' 【解析】考查銘文平均長度，填入 four to five 或 4 to 5。"}, {"q_num": "Q35", "answer": "", "clue_analysis": "35. entropy  【原聲定位】Section 4: 'analyzed the conditional entropy of the Indus corpus... aligned closely with established linguistic systems...' 【解析】資訊理論量化指標，填入不可數名詞 entropy。"}, {"q_num": "Q36", "answer": "", "clue_analysis": "36. DNA / ancient DNA  【原聲定位】Section 5: 'Genetic archaeogenetics is currently analyzing ancient DNA extracted from Harappan burials...' 【解析】古基因考古材料，填入 DNA 或 ancient DNA。"}, {"q_num": "Q37", "answer": "", "clue_analysis": "37. B  【原聲定位】Section 2: 'a finely sealed bitumen-lined public aquatic complex, suggesting communal ritual bathing rather than imperial aggrandizement.' 【解析】用瀝青防水的公共集體淨化水上設施，對應選項 B。"}, {"q_num": "Q38", "answer": "", "clue_analysis": "38. A  【原聲定位】Section 3: 'Unlike the Rosetta Stone... no bilingual inscription has ever been discovered for the Indus script.' 【解析】缺乏雙語平行對照文本使學者無法藉由已知語言直接比對破譯，對應選項 A。"}, {"q_num": "Q39", "answer": "", "clue_analysis": "39. B  【原聲定位】Section 4: 'argued that the Indus signs were not a true linguistic writing system... but rather non-linguistic religious and political emblems...' 【解析】主張符號是非語言的宗教與政治徽章而非轉錄口語，對應選項 B。"}, {"q_num": "Q40", "answer": "", "clue_analysis": "40. A  【原聲定位】Section 5: 'deep-learning models trained on archaeological spatial contexts are mapping seal motifs to specific mercantile trading guild quarters.' 【解析】深度學習結合空間出土脈絡映射商貿行會街區，對應選項 A。"}]}}}, {"num": 8, "tag": "unit08", "folder": "建築設計與都市生態學", "chapter": "第三篇章 ‧ 當代治理、商業與前沿倫理（標準難度版）", "title": "Biophilic Cities & Green Architecture (Standard Edition)", "titleZh": "城市綠建築開放日預約、生態環保屋導覽與校園屋頂花園設計討論", "tracks": {"full": {"label": "🎧 完整 40 題連貫模考 (標準難度 Sec 1–4)", "src": "./audio/Unit08_Full_Section1_to_4.mp3", "qr": "./qr/unit08.png"}, "s1": {"label": "Section 1 (Q1–10)", "desc": "綠色屋頂社區生態日參觀預約 (Green Roof Eco-District Open Day Booking)", "src": "./audio/Unit08_Section1.mp3", "qr": "./qr/unit08-s1.png", "script": ["Rebecca: Good morning, Willow Park Eco-District Office, Rebecca speaking.", "Alan: Hi! I'd like to book a group tour of your green apartment buildings.", "Rebecca: Wonderful! May I take your name first?", "Alan: Alan Brooks. B-R-O-O-K-S.", "Rebecca: Thanks, Alan. And a contact phone number?", "Alan: 07823... 419082.", "Rebecca: How many people will be coming?", "Alan: Originally ten of us planned to come, though two colleagues are away in Leeds, so it will be eight people.", "Rebecca: Eight is a great group size. Is there a topic you're most interested in?", "Alan: Yes, we want to learn about your natural air cooling system without air conditioners.", "Rebecca: Lovely, our guides love showing that! Which date suits you?", "Alan: Wednesday the 16th of September, please.", "Rebecca: Booked! Meet your guide at the Eco-District Visitor Centre beside the pond.", "Alan: Visitor Centre, got it. Need any safety gear?", "Rebecca: Since you'll step onto the roof gardens, we provide a yellow jacket and a hard hat for everyone.", "Alan: Great. How do we get between the far gardens?", "Rebecca: No cars are allowed inside, so you'll ride our quiet electric bus.", "Alan: Nice! Also, for lunch, could all our meals be vegetarian?", "Rebecca: Easy—our kitchen makes great vegetarian lunches. And tickets: single tickets cost 18 pounds, while groups of six or more pay just 14 pounds per person.", "Alan: Fourteen pounds each, brilliant. Thanks!"], "trans": ["蕾貝卡：早安，柳樹園生態區辦公室，我是蕾貝卡。", "艾倫：嗨！我想預約綠色公寓大樓的團體導覽。", "蕾貝卡：太好了！請問您的姓名？", "艾倫：艾倫・布魯克斯（Alan Brooks），B-R-O-O-K-S。", "蕾貝卡：謝謝艾倫。聯絡電話？", "艾倫：07823……419082。", "蕾貝卡：請問一共幾位參加？", "艾倫：原本十個人打算來，但兩位同事去里茲出差了，所以是八位（8 people）。", "蕾貝卡：八位很剛好。您最想了解哪個主題？", "艾倫：想了解你們不用冷氣機的自然空氣降溫（cooling）系統。", "蕾貝卡：沒問題！哪一天方便？", "艾倫：9 月（September）16 日週三。", "蕾貝卡：訂好了！請在池塘旁的生態區訪客中心（Visitor Centre）會合。", "蕾貝卡：需要什麼安全裝備嗎？", "蕾貝卡：因為會上屋頂花園，現場會發反光黃背心與安全帽（hard hat）。", "艾倫：太好了。各區花園之間怎麼移動？", "蕾貝卡：園區禁止汽車，大家會搭安靜的電動巴士（electric bus）。", "艾倫：真棒！還有午餐請全部幫我們準備素食（vegetarian）。", "蕾貝卡：沒問題！票價方面：單人票 18 英鎊，六人以上團體票每人只要 14 英鎊。", "艾倫：每人 14 英鎊，太棒了，謝謝！"], "answers": [{"q_num": "Q1", "answer": "Brooks", "clue_analysis": "【原聲定位】'Alan Brooks. B-R-O-O-K-S.'"}, {"q_num": "Q2", "answer": "419082", "clue_analysis": "【原聲定位】'07823... 419082.'"}, {"q_num": "Q3", "answer": "8 / eight", "clue_analysis": "【原聲定位】'so it will be eight people' 排除十人干擾。"}, {"q_num": "Q4", "answer": "cooling", "clue_analysis": "【原聲定位】'natural air cooling system'"}, {"q_num": "Q5", "answer": "September", "clue_analysis": "【原聲定位】'Wednesday the 16th of September'"}, {"q_num": "Q6", "answer": "Centre", "clue_analysis": "【原聲定位】'Eco-District Visitor Centre'"}, {"q_num": "Q7", "answer": "hat", "clue_analysis": "【原聲定位】'yellow jacket and a hard hat'"}, {"q_num": "Q8", "answer": "bus", "clue_analysis": "【原聲定位】'quiet electric bus'"}, {"q_num": "Q9", "answer": "vegetarian", "clue_analysis": "【原聲定位】'all our meals be vegetarian'"}, {"q_num": "Q10", "answer": "14", "clue_analysis": "【原聲定位】'14 pounds per person' 排除單人價 18。"}]}, "s2": {"label": "Section 2 (Q11–20)", "desc": "自然啟發綠建築示範屋導覽 (Nature-Inspired Eco-House Guided Tour)", "src": "./audio/Unit08_Section2.mp3", "qr": "./qr/unit08-s2.png", "script": ["Henrik: Welcome to our Nature-Inspired Eco-House! I'm Henrik, the lead architect.", "First, look up at the 20,000 plants covering our outer walls. Why do they drop indoor heat by six degrees in July? It isn't fans behind pots—water constantly evaporating from thousands of green leaves cools the air right around the building!", "Look closely at the bumpy wall panels on the east side. We copied them from a tiny desert beetle that catches morning moisture on its back—our metal bumps collect clean drinking water straight out of coastal mist!", "What about used sink and laundry water? We don't boil it or drop in chlorine—instead, dirty water flows gently outdoors through gravel beds planted with tall reeds, where natural root bacteria clean it completely.", "Upstairs on the Windy Roof Deck, please follow one rule: there are no alarms or bells, so simply stay behind the bright yellow painted line near the railings.", "Finally, zero kitchen scraps from our café leave the site—they go into an underground tank that turns leftover food into methane gas for cooking stoves and rich liquid plant food for the garden!", "Let's look at the key areas:", "Inside the Central Hall stands a tall glass air chimney copied from African termite mounds—warm air rises naturally out the roof.", "Outside, the East Wall holds our rough bumpy metal sheets collecting over 1,000 litres of morning fog every day.", "Walk between the Narrow Alley where two tower walls sit close together, pinching breezes to spin silent wind turbines.", "At the Control Desk by reception, live thermal heat maps show how much cooler our shaded street corners stay compared to normal tarmac roads.", "And out on the Kitchen Terrace, chefs pick fresh herbs from vegetable beds watered with clean recycled shower water.", "Let's step inside!"], "trans": ["亨利克：歡迎來到自然啟發綠建築示範屋！我是主建築師亨利克。", "首先請看覆蓋外牆的兩萬株植物。為什麼它們在七月能讓室內降溫六度？不是靠花盆後的風扇——而是葉片不斷蒸發水分把建築周圍的空氣降溫（water evaporating from leaves cools the air）！", "仔細看東牆的凹凸金屬板。我們向在背上接晨露的沙漠甲蟲學習——凹凸面板能直接從海霧中收集乾淨飲水（collect water from mist）！", "用過的水槽和洗衣水怎麼處理？不煮沸也不加氯——廢水緩緩流過種滿蘆葦的礫石床（gravel and reed plants），由根部天然細菌淨化。", "樓上有風的屋頂平台請遵守一項規定：沒有警鈴，請大家務必待在欄杆旁的黃線後方（behind the yellow painted line）。", "最後，咖啡廳廚餘完全不外運——全部送進地下槽變成煮飯用的瓦斯，以及澆花的營養液肥（cooking gas and plant food）！", "各區亮點如下：", "中央大廳（Central Hall）矗立著模仿非洲白蟻丘的高挑氣流煙囪，熱空氣會自然從屋頂排出。", "戶外東牆（East Wall）裝有粗糙金屬板，每天從晨霧收集超過一千公升清水。", "穿過狹窄巷道（Narrow Alley），兩棟塔樓靠近擠壓海風加速轉動靜音風力機。", "接待處旁的控制台（Control Desk）螢幕顯示熱像圖，對比樹蔭街角比柏油路涼爽多少。", "廚房露台（Kitchen Terrace）上的菜圃則用淨化後的回收洗澡水灌溉新鮮香草。", "我們走進去看看吧！"], "answers": [{"q_num": "Q11", "answer": "B", "clue_analysis": "【原聲定位】'water constantly evaporating from thousands of green leaves cools the air' 選 B。"}, {"q_num": "Q12", "answer": "A", "clue_analysis": "【原聲定位】'bumpy wall panels... collect clean drinking water straight out of coastal mist' 選 A。"}, {"q_num": "Q13", "answer": "B", "clue_analysis": "【原聲定位】'flows gently outdoors through gravel beds planted with tall reeds' 選 B。"}, {"q_num": "Q14", "answer": "A", "clue_analysis": "【原聲定位】'stay behind the bright yellow painted line' 選 A。"}, {"q_num": "Q15", "answer": "A", "clue_analysis": "【原聲定位】'turns leftover food into methane gas for cooking... and liquid plant food' 選 A。"}, {"q_num": "Q16", "answer": "A", "clue_analysis": "【原聲
